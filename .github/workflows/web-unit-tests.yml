name: Web Unit Tests

# CF-WEB-LOCK-GATE (2026-09-05). The web had exactly one PR check —
# the SWA "Build + Deploy" preview — and that job fails on an exhausted
# preview quota, so it is excluded from merge gating. A PR whose
# package.json gained four RTL/jsdom devDependencies without a
# regenerated package-lock.json therefore merged clean (#1817, e5a21d1)
# and only broke at the PRODUCTION push deploy, leaving the live site on
# the previous build. This job is the missing gate: plain `npm ci`
# (which is what fails on lock drift), the vitest suite, and a real
# `next build`. No secrets, no deploy, no Azure — so it can be marked
# required without coupling merge to the preview quota.

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/web/**"
      - "backend/src/services/compiq/**"
      - ".github/workflows/web-unit-tests.yml"
      - ".github/workflows/web-unit-tests-skip.yml"
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "backend/src/services/compiq/**"
      - ".github/workflows/web-unit-tests.yml"
      - ".github/workflows/web-unit-tests-skip.yml"
  workflow_dispatch:

concurrency:
  group: web-unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web_unit_tests:
    runs-on: ubuntu-latest
    name: Web Unit Tests
    steps:
      # Full checkout, not a sparse one: src/lib/rung.test.ts asserts the
      # web's rung vocabulary equals the backend's closed list by READING
      # backend/src/services/compiq/*.ts off disk. A web-only checkout
      # makes that test ENOENT.
      - uses: actions/checkout@v4
        with:
          submodules: false
          lfs: false

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      # `npm ci` and not `npm install`: ci REFUSES a lock that does not
      # satisfy package.json, which is precisely the drift that shipped
      # the broken main. `npm install` would paper over it by rewriting
      # the lock in the runner and the gate would prove nothing.
      - name: Install dependencies (npm ci — fails on lockfile drift)
        working-directory: apps/web
        run: npm ci

      - name: Unit tests (vitest)
        working-directory: apps/web
        run: npm test

      - name: Build
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_BASE: https://hobbyiq3-e5a4dgfsdnb5fbha.centralus-01.azurewebsites.net
        run: npm run build
