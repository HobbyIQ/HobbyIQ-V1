name: Sub-Raw Inversion Scan (nightly)

# CF-SUB-RAW-INVERSION-SCAN (Drew, 2026-07-19). Nightly batch scan at
# 5:00AM ET across sold_comps that emits sub_raw_inversion_observed
# telemetry per SKU where a Raw sale exceeds the graded median (>5%
# margin, at least 2 raw sales + 3 graded in the window). Feeds the S1
# KQL that powers DailyIQ hot-prospects.
#
# CF-LONG-CRONS-DIE-AT-THE-IDLE-CUT (2026-09-11 cron canary triage). The
# baseball leg failed its last two scheduled runs (09-10, 09-11) with
# HTTP 499 at exactly 240s — the App Service front end's idle cut, not
# curl's own --max-time 900. Football and basketball settle in ~90-95s on
# the same matrix; baseball is sold_comps's largest sport partition and
# simply runs longer than the platform allows a client to hold a single
# response open. Same defect #2020 fixed for three other lanes (see
# backend/src/services/ops/longJobTracker.ts) — the scan step now
# dispatches (202 + jobId) and polls via backend/scripts/poll-admin-job.cjs
# instead of waiting on one HTTP response.

on:
  schedule:
    - cron: "0 9 * * *"   # 5:00AM ET = 09:00 UTC
  workflow_dispatch:
    inputs:
      sport:
        description: 'Sport scope (default baseball)'
        required: false
        type: string
        default: 'baseball'
      window_days:
        description: 'Lookback window in days (default 30)'
        required: false
        type: string
        default: '30'
      min_margin_pct:
        description: 'Min inversion margin % (default 5)'
        required: false
        type: string
        default: '5'
      dry_run:
        description: 'Dry-run (compute only, no telemetry emitted)'
        required: false
        type: choice
        default: 'false'
        options: ['true', 'false']

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    timeout-minutes: 15
    # CF-SPORT-MATRIX (Drew, 2026-07-20). Fan out across sports so the
    # nightly cron populates prospects for all pool-covered sports
    # without duplicating the workflow YAML. Manual dispatch's `sport`
    # input overrides the matrix (single-sport ad-hoc run).
    strategy:
      fail-fast: false
      matrix:
        sport: ${{ github.event_name == 'workflow_dispatch' && fromJson(format('["{0}"]', inputs.sport)) || fromJson('["baseball", "football", "basketball"]') }}

    steps:
      # poll-admin-job.cjs runs from the checkout. First step so it cannot
      # clobber anything a later step puts in the workspace.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_1259D9D213E34AE29B2DD54B3E755C4D }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_5AB8B3DC612348FD9D37DBE28FF40802 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_A45CF8552AE94AF68A046FB846E21206 }}

      - name: Guard — ADMIN_API_TOKEN present
        env:
          ADMIN_API_TOKEN: ${{ secrets.ADMIN_API_TOKEN }}
        run: |
          if [ -z "$ADMIN_API_TOKEN" ]; then
            echo "::error::ADMIN_API_TOKEN secret missing"
            exit 1
          fi
          echo "::add-mask::$ADMIN_API_TOKEN"

      - name: Sub-raw-inversion scan (dispatch + poll)
        env:
          ADMIN_API_TOKEN: ${{ secrets.ADMIN_API_TOKEN }}
          SPORT: ${{ matrix.sport }}
          WINDOW: ${{ inputs.window_days || '30' }}
          MARGIN: ${{ inputs.min_margin_pct || '5' }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          echo "Running sub-raw-inversion scan for $SPORT (dispatch + poll)..."
          BODY=$(jq -nc \
            --arg sport "$SPORT" \
            --argjson window "$WINDOW" \
            --argjson margin "$MARGIN" \
            --argjson dryRun "$DRY_RUN" \
            '{ sport: $sport, windowDays: $window, minMarginPct: $margin, dryRun: $dryRun }')
          # CF-THE-LOG-IS-BOTH-STREAMS (#1963/#1975). `2>&1` because the
          # poller writes its refusals — including the UNKNOWN verdict — with
          # console.error, and a stdout-only tee would drop precisely the
          # lines that explain a failure. `pipefail` because a pipeline's
          # status is tee's, always 0, which would report SUCCESS for a lane
          # that never settled.
          set -o pipefail
          set +e
          node backend/scripts/poll-admin-job.cjs \
            --label "sub-raw-inversion-scan-$SPORT" \
            --method POST \
            --body "$BODY" \
            --dispatch-url "https://hobbyiq3-e5a4dgfsdnb5fbha.centralus-01.azurewebsites.net/api/portfolio/admin/sub-raw-inversion/scan" \
            --status-url "https://hobbyiq3-e5a4dgfsdnb5fbha.centralus-01.azurewebsites.net/api/portfolio/admin/sub-raw-inversion/scan/status" \
            --status-query "sport=$SPORT" \
            --auth-header "Authorization: Bearer $ADMIN_API_TOKEN" \
            2>&1 | tee /tmp/sub-raw-poll.log
          POLL_RC=$?
          set -e
          if [ "$POLL_RC" -eq 2 ]; then
            echo "::error::sub-raw-inversion scan ($SPORT) never reported settled — UNKNOWN, not a failure; the scan may have finished on the other instance"
            exit 1
          fi
          if [ "$POLL_RC" -ne 0 ]; then
            echo "::error::sub-raw-inversion scan ($SPORT) failed — no summary landed"
            exit 1
          fi
          RESULT=$(sed -n 's/^RESULT_JSON //p' /tmp/sub-raw-poll.log | tail -n1)
          if [ -z "$RESULT" ]; then
            echo "::error::sub-raw-inversion scan ($SPORT) settled without a summary body"
            exit 1
          fi
          echo "$RESULT" > response.json
          echo "Summary:"
          jq '.summary' response.json

      - name: Upload response as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sub-raw-inversion-scan-response-${{ github.run_id }}-${{ matrix.sport }}
          path: response.json
          retention-days: 14
          if-no-files-found: warn
