name: CompIQ Pricing Regression Harness

# IMPORTANT — path-filter maintenance contract:
# Any PR that introduces a new top-level compiq directory (e.g. backend/src/config/compiq/,
# backend/src/models/compiq/, backend/src/stages/, backend/src/pipeline/) MUST add that path
# to the list below in the SAME PR. The failure mode is silent: a contract change ships,
# the harness doesn't run because no included path matched, and a regression slips through
# a green-by-default merge. Treat this list as part of the compiq module surface area.
on:
  pull_request:
    paths:
      - "backend/src/services/compiq/**"
      - "backend/src/modules/compiq/**"
      - "backend/src/routes/compiq.routes.ts"
      - "backend/harness/**"
      - "backend/vitest.config.ts"
      - "backend/package.json"
      - "backend/package-lock.json"
      - ".github/workflows/regression.yml"
  push:
    branches: [main]
  workflow_dispatch:

# CF-CI-NEVER-CANCELS-A-MAIN-PUSH (2026-09-07).
#
# THE BUG. The group was `regression-${{ github.ref }}` with
# `cancel-in-progress: true`. On a push to main `github.ref` is
# `refs/heads/main` for EVERY commit, so all main pushes shared ONE group and
# each merge cancelled the run still verifying the commit before it. Three
# merged trees went unverified inside four minutes on 2026-09-06 --
# c374b030, 84f71477, 916e7c7f -- each run killed seconds after the next
# merge landed. Nothing goes red when this happens: the tree is simply never
# tested, and a later push happens to cover it.
#
# THE FIX. Cancellation is a PULL REQUEST optimisation only. A PR's superseded
# runs are worth killing -- only the head commit is being merged. A main push
# run is the ONLY record that a merged tree passed, so it must always finish.
# Keying push runs by `github.sha` gives every main commit its own group, and
# the `cancel-in-progress` expression is false for anything that is not a
# pull_request. Pinned by ciNeverCancelsMainPushRuns.test.ts.
concurrency:
  group: regression-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  harness:
    name: Pricing Regression Harness
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 20
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        # CF-HARNESS (2026-06-20): --legacy-peer-deps reconciles the
        # openai@4.104.0 peer pin on zod@^3.23.8 with the root project's
        # zod@^4.4.3. Local `npm install` uses the same default so this
        # makes CI match local behavior. Deeper zod 3↔4 alignment is a
        # separate dependency CF.
        run: npm ci --legacy-peer-deps

      - name: Type-check production sources
        run: npx tsc --noEmit

      - name: Run pricing regression harness (Tier 1 + Tier 2)
        env:
          # Tier 3 is sampled from production via Cosmos; opt-in via secret.
          # Default: Tier 1 + Tier 2 only. Tier 3 ships in a follow-up PR.
          HARNESS_TIERS: "1,2"
          NODE_ENV: "test"
        run: npm run test:harness

      - name: Upload snapshot diffs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: harness-snapshots-${{ github.run_id }}
          path: |
            backend/harness/__snapshots__/
            backend/harness/diff-report.txt
          retention-days: 14
          if-no-files-found: ignore

  tier1-harness:
    name: Tier 1 Production Harness
    runs-on: ubuntu-latest
    needs: harness
    # CF-TIER1-CAP-GUARANTEED-RED (2026-08-20). Was 5, and the harness needs
    # more: run 32395820565 reported "Failed: 0" throughout and was then
    # CANCELLED at 5m15s with `npm run test:harness:tier1` still executing.
    #
    # A job that always times out is worse than no job. It cannot pass, so its
    # red carries no information, and it trains everyone to merge past it —
    # which is exactly what happened on #1149, where the only honest read was
    # "this check cannot tell us anything." Any real failure it later detects
    # would land in a check people have already learned to ignore.
    #
    # 15 matches the sibling Pricing Regression Harness in this same file. This
    # buys the harness room to finish and produce a verdict; if it then still
    # exceeds 15 minutes, that is a genuine finding about the production
    # endpoints rather than a cap set too low.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 20
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        # CF-HARNESS (2026-06-20): --legacy-peer-deps reconciles the
        # openai@4.104.0 peer pin on zod@^3.23.8 with the root project's
        # zod@^4.4.3. Local `npm install` uses the same default so this
        # makes CI match local behavior. Deeper zod 3↔4 alignment is a
        # separate dependency CF.
        run: npm ci --legacy-peer-deps

      - name: Run Tier 1 production harness
        env:
          NODE_ENV: "test"
          # CF-TIER1-HARNESS-SESSION (2026-06-30): the harness hits prod
          # /api/compiq/* routes which require x-session-id (CF-PAYMENTS-A).
          # The secret holds a long-lived test session-id Drew provisions
          # against a dedicated harness user. When unset, the harness fails
          # with a clear "secret missing" error instead of the opaque 401.
          # See backend/docs/runbooks/tier1-harness-session.md.
          TIER1_HARNESS_SESSION_ID: ${{ secrets.TIER1_HARNESS_SESSION_ID }}
        run: npm run test:harness:tier1
