# Paired "skip job" for backend-tests (.github/workflows/test.yml).
#
# `Backend Unit Tests` is a REQUIRED status check on main. A required check
# that never reports is not neutral — the PR sits at BLOCKED forever, because
# branch protection waits on a context no workflow will ever produce. test.yml
# carries path filters, so a web-only or docs-only PR produced no
# `Backend Unit Tests` context at all and could not merge (observed live on
# #1838, which showed that one context and nothing else).
#
# The fix is the standard skip-job pair: this workflow triggers on exactly the
# complement of test.yml's paths and declares a job with the IDENTICAL name,
# `Backend Unit Tests`. The required context is the JOB name, not the workflow
# name — verified from `gh pr checks 1838`, where the workflow named
# `backend-tests` reports the context `Backend Unit Tests`. So this job
# satisfies the same required context in seconds instead of running the
# ~5-minute suite against a PR that changed no backend code.
#
# The two path lists must stay EXACT complements or the gap just moves;
# backendWebCheckContexts.test.ts asserts that, and asserts the job name here
# is byte-identical to the one in test.yml.
name: backend-tests-skip

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "backend/**"
      - ".github/workflows/test.yml"
      - ".github/workflows/test-skip.yml"
  push:
    branches: [main]
    paths-ignore:
      - "backend/**"
      - ".github/workflows/test.yml"
      - ".github/workflows/test-skip.yml"

concurrency:
  group: backend-tests-skip-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests-skip:
    # MUST stay byte-identical to the job name in test.yml — this is the
    # required-context string in branch protection.
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: No backend changes — nothing to test
        run: echo "No files under backend/ changed; the backend suite does not apply to this PR."
