name: Weekly Calibration Multipliers Refresh

# CF-WEEKLY-CALIBRATION (Drew, 2026-07-30). Sunday 2 AM ET refit of
# per-axis premium multipliers (color ladder per product, edition
# premium, finish premium, autoStyle premium, gradeTier multiplier)
# from a 90d rolling window. Writes to market_signals container with
# 14-day TTL. Consumed by hobbyIqFmv for per-axis FMV adjustment.

on:
  schedule:
    # Sunday 02:00 ET = 06:00 UTC (EST) / 07:00 UTC (EDT). Use 06:00
    # UTC which is Sunday 01:00 EST / 02:00 EDT — early enough to
    # complete before Monday user traffic.
    - cron: "0 6 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
      - name: Setup Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Install backend deps
        working-directory: backend
        run: npm ci
      - name: Build backend dist
        working-directory: backend
        run: npm run build
      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_1259D9D213E34AE29B2DD54B3E755C4D }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_5AB8B3DC612348FD9D37DBE28FF40802 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_A45CF8552AE94AF68A046FB846E21206 }}
      - name: Fetch COSMOS_CONNECTION_STRING
        shell: bash
        run: |
          CS=$(az webapp config appsettings list \
            --name HobbyIQ3 \
            --resource-group rg-hobbyiq-dev \
            --query "[?name=='COSMOS_CONNECTION_STRING'].value | [0]" \
            -o tsv)
          if [ -z "$CS" ]; then
            echo "::error::FAILED to fetch COSMOS_CONNECTION_STRING"
            exit 1
          fi
          echo "::add-mask::$CS"
          echo "COSMOS_CONNECTION_STRING=$CS" >> "$GITHUB_ENV"
      - name: Run weekly calibration
        env:
          CALIBRATION_APPLY: "true"
          CALIBRATION_WINDOW_DAYS: "90"
        run: node backend/scripts/refresh-calibration-multipliers.cjs
