          # belongs on a workstation, not in a runner that can write.
          - retire-self-derived-identities
          # CF-IF-KNOWN-WE-SHOULD-BE-ABLE-TO-FIGURE-IT-OUT (Drew, 2026-09-05).
          # The PLAN half of the acquisition chain: reads every user's holdings
          # withheld on identity grounds (no-checklist-match /
          # identity-not-in-catalog) plus the identityUnverified rows holdings
          # reference, groups them into (sport, year, setKey) acquisition cells,
          # ranks them holdings-first, and matches each to the universe manifest
          # entry that can serve it -- reusing the driver's OWN setName->setKey
          # resolution, with the alias/era spellings unioned (#1738/#1741) and a
          # ruled-distinct Bowman/Topps pair refused rather than collapsed.
          #
          # IT HAS NO APPLY MODE. BACKFILL_APPLY=true is REFUSED (exit 3), not
          # ignored. The dispatch chain it plans -- driver report -> gate ->
          # driver apply -> rederive report -> gate -> rederive apply -> reprice
          # -- lives in .github/workflows/acquire-for-withheld-holdings.yml,
          # because only the workflow holds the runner's GH token and only
          # gh run watch can gate one dispatch on the banner of the last.
          - acquire-for-withheld-holdings
          - retire-prose-parallel-rows
          - retire-numbered-base-rows
          - conform-card-profile
          - backfill-playerslug
          - emit-staging-to-pool
          - retire-autoseed-window
          - clean-parallel-annotations
          # CF-A-NOTE-IS-NOT-A-RUNG (2026-09-26). Rewrites card_catalog
          # `parallel` names by REVIEWED rules under
          # backend/data/parallel-name-rules/ -- strips a leaked
          # retailer/print-run/odds/SKU note out of the name (251,043 rows,
          # 2026-09-26 census) and folds a genuine spelling split (RayWave,
          # apostrophe/case pairs) onto its checklist-attested rung. SCOPE is
          # the rules file (REQUIRED, no default, same "the list is the
          # scope" doctrine as relocate-catalog-rows-by-list); TITLES filters
          # to one or more rule ids for a canary. Never touches isAuto; only
          # ever fills printRun under the explicit printRunFromName gate, and
          # only when a checklist-grade twin elsewhere attests the exact
          # (parallel, printRun). Retires a duplicate source only when
          # sold_comps sales at it are ZERO; a derived twin at the clean
          # address is HELD, never overwritten.
          - rewrite-parallel-names
          - retire-exploded-checklist-rows
          - purge-unaddressable-catalog-rows

          - repair-parallel-from-title


          - fold-unnumbered-twins
          - fold-umbrella-to-series
          # CF-THE-JAPANESE-CODE-IS-THE-KEY (Drew, 2026-09-01, R1 + R2). Moves a
          # whole product from one setKey to another across all three places an
          # identity lives. MODE=catalog | pool | holdings, and the scope is
          # SPORT + SETKEY(from) + `titles`(to), with YEAR additionally REQUIRED
          # for MODE=pool -- 1997/base4 is the Japanese Rocket Gang set and
          # 2000/base4 is the English Base Set 2, so a pool sweep with no year
          # axis would take both. No new input: the TO key travels in `titles`.
          - rekey-product-setkey
          # CF-THE-ID-FOLLOWS-ITS-OWN-SETKEY-FIELD (2026-09-19, hockey pilot).
          # 127,210 checklist rows carry a correct setKey FIELD (D39 sub-
          # brands like upper-deck-extended-series) while their id's segment 3
          # still says the bare upper-deck umbrella. Rekeys the id onto the
          # row's OWN field via moveCatalogRow's new idFollowsOwnSetKeyField
          # option -- never a rename, never a fold (a target that already
          # exists is out of scope, reported as target-exists). SCOPE is
          # sport:year cells (`scope`, e.g. hockey:2024,hockey:2025); the
          # target setKey list rides `titles` (e.g.
          # upper-deck-extended-series), same convention as
          # repair-rc-marker-playername's SET_KEYS. Both are REQUIRED, no
          # 'all' escape hatch.
          - rekey-catalog-id-to-setkey
          # CF-THE-CHECKLIST-NUMBERED-ROW-IS-THE-IDENTITY, THE SALES HALF
          # (2026-09-19). fold-checklist-numbered-twins.cjs (R1) drives from
          # card_catalog and can only fold a CATALOG TWIN row onto the
          # checklist's :num-N row -- a short id with NO catalog row at all
          # is never read by that lane's pass 1 at all, so its sales,
          # however many, are never reached. #2298
          # (resolveChecklistNumberedIngestId) fixes this going forward, at
          # ingest time, for FRESH sales only -- it has no effect on a sale
          # already stored. This lane closes the STORED half: it still
          # drives from card_catalog's checklist-numbered rows (bounded,
          # never a sold_comps scan) but reaches directly into sold_comps at
          # the SHORT id -- present as a catalog row or not -- and relocates
          # (cardId partition-keyed) or patches (hobbyiqCardId only) every
          # sale it finds there onto the checklist's numbered id. It never
          # touches card_catalog itself (a short id WITH a catalog twin is
          # reported as an input for fold-checklist-numbered-twins.cjs, not
          # acted on here). SCOPE is sport:year cells (`scope`, e.g.
          # baseball:2026); the target setKey list rides `titles` (e.g.
          # topps), same convention as rekey-catalog-id-to-setkey. Both are
          # REQUIRED, no 'all' escape hatch. The pilot dispatch is
          # scope=baseball:2026 titles=topps.
          - repoint-sales-to-checklist-numbered
          # CF-THE-CATALOG-SUFFIX-IS-PART-OF-THE-SPELLING (2026-09-20
          # decomposition). ~10% of unbacked sales in the biggest modern
          # cells (48% in basketball 2024 panini-prizm) fail to match a
          # strict checklist row ONLY because the parallel slug differs from
          # the checklist's own spelling by the product's own suffix word --
          # "silver" vs "silver-prizm", "holo-prizm" vs "holo",
          # "fast-break-blue" vs "fast-break-blue-prizm" -- in BOTH
          # directions. Drives from card_catalog's STRICT rows for the
          # scoped cell(s), builds the suffix-word candidate set for each
          # unbacked sale's own parallel slug (one word per product family,
          # from an explicit table -- panini-prizm/donruss-optic/panini-
          # optic/panini-mosaic/topps-chrome/bowman-chrome/topps-finest;
          # panini-select is DELIBERATELY excluded, see the script's own
          # header), and moves it onto the ONE checklist row that matches on
          # number/auto/sub -- refusing product-wide
          # (both-slugs-are-real-rungs) whenever the checklist itself carries
          # BOTH the bare and suffixed spelling as distinct real cards
          # anywhere in the product. SCOPE is sport:year cells (`scope`,
          # e.g. basketball:2024); the target setKey list rides `titles`
          # (e.g. panini-prizm), same convention as repoint-sales-to-
          # checklist-numbered immediately above. Both are REQUIRED, no
          # 'all' escape hatch. The pilot dispatch is scope=basketball:2024
          # titles=panini-prizm.
          - repoint-sales-parallel-suffix
          # STAMP-MOVING NOTICE: this lane changes NO derivation source file
          # -- CF-DASH-SUFFIX-IS-PART-OF-THE-NUMBER (commit 80482103,
          # 2026-09-12/13) already fixed the parser bug that truncated
          # letters-then-digits card numbers with a dash suffix ("#B24-CMO"
          # -> "B24"). This lane REALIZES that already-shipped fix on STORED
          # rows minted before it landed: 1,095 sold_comps rows measured at
          # hiq:baseball:2024:bowmans-best:b24:* (90 players collapsed onto
          # ONE address), all _ts pre-fix and all already carrying
          # __migratedByBackfill from a run that itself predates the fix.
          # Blast radius (20,000-row sample, 4 sports): 381 rows are this
          # exact suffix-restoring shape (b25:286, b24:68, f15:16, b23:11).
          # Re-parses each in-scope sale's own title with the LIVE parser and
          # moves it ONLY when the result is a STRICT, hyphen-bounded suffix
          # extension of the stored cardNumber segment ("b24" -> "b24-cmo"),
          # AND the destination is a STRICT checklist row, AND that row's
          # player matches the sale's -- never a guess from the title alone,
          # never touches a verifiedByUser/flaggedWrong/excludedFromFmv/
          # identityUnverified row. SCOPE is sport:year cells (`scope`); the
          # target setKey list rides `titles`, same convention as every
          # sibling repoint lane above. Both are REQUIRED, no 'all' escape
          # hatch. The pilot dispatch is scope=baseball:2024
          # titles=bowmans-best.
          - repoint-sales-cardnumber-suffix
          # OWNER RULING (Drew, 2026-09-22): "1989 Traded -> Tiffany: move
          # only when title says Tiffany." A Topps/Topps Traded baseball
          # sale, 1984-1991 (the years Tiffany actually shipped), moves onto
          # its Tiffany sibling ONLY when the sale's own title matches
          # /\bTiffany\b/i -- CF-A-TIFFANY-SALE-IS-A-TIFFANY-CARD
          # (SAME_NUMBER_PARALLEL_SETS, productSetKeys.ts) already rules that
          # Tiffany reprints its flagship card-for-card on the SAME numbers,
          # so the card number carries no information and only the title
          # can separate the two markets. Destination keys (topps-tiffany,
          # topps-traded-tiffany) are resolved from the live normalizeSetKey,
          # never guessed, and a move requires a STRICT checklist row at the
          # exact destination id -- absent beats wrong, never minted from a
          # sale. A sale (or the destination row) whose own player name
          # contains "Tiffany" is guarded off, never read as the finish
          # word. SCOPE is REQUIRED (`scope`, baseball:<year> cells,
          # 1984-1991 only -- any other sport/year is refused, exit 2);
          # `titles` is OPTIONAL here (topps and/or topps-traded; empty =
          # both) since the lane's own scope is already a bounded, named
          # write. The pilot dispatch is scope=baseball:1989
          # titles=topps-traded.
          - repoint-sales-tiffany-title-gated
          # LIVE TRACE (C:/tmp/bb25_trace_1530/RESULT.md, 2026-09-26). Of
          # 23,383 2025 Bowman's Best base-parallel sales, 5,121 (21.9%) are
          # backed ONLY at the OTHER isAuto value -- same sport/year/setKey/
          # cardNumber/parallel/printRun, wrong auto/no-auto segment.
          # feedback_isauto_boundary_is_cardnumber_not_text.md: isAuto is a
          # property of the checklist's OWN card-number section, never the
          # sale's title, so a checklist row at the flipped id is the truth
          # and the sale's id is wrong. Repoints a sale whose exact id has NO
          # checklist-grade card_catalog row but whose isAuto-flipped id
          # (auto <-> no-auto, every other segment byte-for-byte unchanged,
          # grade tail preserved) DOES -- NEVER moves when BOTH ids carry a
          # checklist row (ambiguous, logged by cardNumber, left alone), and
          # NEVER treats a DERIVED/VENDOR row at the flip as a destination
          # (CF-CATALOG-AUTHORITY). SCOPE is REQUIRED (`scope`, sport:year
          # cells, no whole-corpus mode); `titles` (BCP_TITLES/SET_KEYS)
          # OPTIONALLY narrows to one or more setKeys, same convention as
          # every sibling repoint lane above. Owner Drew, 2026-09-26: "Let's
          # get these done FAST." The pilot dispatch is scope=baseball:2025
          # titles=bowmans-best.
          - repoint-sales-isauto-flip
          # CF-INGEST-KEEPS-STORED-IDENTITY repair (Drew, 2026-09-19, PR #2331
          # follow-up). The R66/R67/R70 ingest-time insert re-key only ever
          # fires for a FRESH sale being written today; a sale that landed in
          # a BASE product's pool before #2331 shipped stays there on every
          # re-upsert. This lane drives from a REGISTERED INSERT's own
          # checklist (never a pool-wide title scan): `titles` (SET_KEYS,
          # REQUIRED, no 'all'/'*') names one or more insert setKeys (e.g.
          # panini-photogenic-rookie-pix); productParentOf resolves each
          # one's BASE product. Candidate sales are found by
          # STARTSWITH(c.hobbyiqCardId, "hiq:sport:year:baseSetKey:") over the
          # base product's own cell (the same query shape rekey-product-
          # setkey.cjs's own MODE=pool lane already runs against sold_comps),
          # then confirmed against the insert's own checklist rows (already
          # loaded, no per-sale Cosmos read) via the real compiled
          # insertSetNamedInTitle + a pure mirror of insertSetChecklistConfirm
          # .ts's FIX-1 rule -- AND the exact destination rung (number +
          # parallel + auto flag) must itself be checklist-attested, not the
          # number alone ("price only checklist-matched identities"). Units
          # are (cell, BASE PRODUCT), never (cell, insert key), so a base
          # product shared by several requested inserts is STARTSWITH-scanned
          # exactly once. Only writes the two shapes where cardId and
          # hobbyiqCardId AGREE (both the base slug -> relocate; cardId a raw
          # vendor id -> patch hobbyiqCardId only) -- a PRE-EXISTING split
          # between the two (both hiq: slugs, different products) is left
          # untouched by name, never deepened by moving one side alone, and
          # guardSoldCompDoc runs on the would-be doc before every write.
          # Same-id twins (CardHedge dual-id duplicates) are grouped and
          # handled serially within one unit, plus a last-line _etag
          # re-read-before-write refusing `changed-since-planned` on a race.
          # `scope` is REQUIRED sport:year cells, no 'all'. Never touches a
          # verifiedByUser, flaggedWrong, excludedFromFmv, USER_SEED_SOURCES,
          # or already-parked (identityUnverified) sale. The pilot dispatch is
          # scope=football:2024 titles=panini-photogenic-rookie-pix,panini-
          # photogenic-troops-tribute,panini-zenith-z-marquee.
          - repoint-stored-insert-sales
          # CONFUSABLE-SIBLING repair (census decomposition, 2026-09-20). Many
          # stored sales carry a hobbyiqCardId whose card NUMBER does not exist
          # in that product's strict checklist at all, but exists VERBATIM
          # under a confusable SIBLING setKey of the same sport+year: baseball
          # 2025 `topps` holds Update Series `US###` numbers (~12% of that
          # cell's unbacked sales) while those rows live under
          # `topps-update-series`; football 2023 `donruss-optic` holds
          # base-Donruss insert numbers (BS-, CIH-, SM-, SBD-) that live under
          # `panini-donruss`. Neither existing repoint lane reaches this:
          # repoint-stored-insert-sales asks whether the TITLE names an
          # insert (a US-number sale's title usually says only "2025 Topps"),
          # and repoint-sales-to-checklist-numbered moves along the print-run
          # axis inside ONE product and never changes the setKey segment.
          # This lane moves exactly ONE axis -- the setKey -- via
          # withProductSetKey, keeping number/parallel/auto byte-identical.
          # THE SIBLING PAIRS ARE OPERATOR-RULED, NEVER INFERRED: `titles`
          # carries an explicit `fromSetKey>toSetKey` list (see the
          # SET_KEYS/BCP_TITLES comment block below); empty, a wildcard, or a
          # token with no '>' is REFUSED (exit 2). A sale MOVES only when all
          # four gates hold -- (1) the FROM product's strict checklist does NOT
          # list that number at any parallel, (2) the TO product (or a
          # registered insert whose parent is TO) DOES, at the EXACT (number,
          # parallel, auto) rung, (3) the destination row's roster names the
          # sale's player and the title does not contradict the row, (4) the
          # title does not name the FROM product -- otherwise it refuses by a
          # named class. `scope` is REQUIRED sport:year cells, no 'all'. Never
          # touches a verifiedByUser, flaggedWrong, excludedFromFmv,
          # USER_SEED_SOURCES, or already-parked sale; a pre-existing split
          # identity refuses from whichever side reaches it (#2339); a
          # DIFFERENT sale already at the destination is left as
          # possible-twin-at-destination, never deleted on a guess. The pilot
          # dispatches are scope=baseball:2025 titles=topps>topps-update-series
          # and scope=football:2023 titles=donruss-optic>panini-donruss.
          - repoint-sales-to-sibling-product
          # GAP ROUTER (census decomposition, 2026-09-20). sold_comps is only
          # 60.4% strict-checklist-backed for sports; the 120 biggest gap
          # cells hold 51% of the gap and were triaged BY HAND
          # (gap-classes-top120.json) -- the rest is a long tail too large for
          # that. THIS LANE IS READ-ONLY / DECISION-ONLY: it makes NO Cosmos
          # writes in any mode (there is no apply branch in the script at
          # all) and dispatches nothing itself. For every unbacked cell in
          # the committed backend/data/census/backing-cells.json table
          # (publish-census-backing.cjs's output), it classifies the CELL
          # (ALIAS-KEY / UNKNOWN-KEY / MISSING / PRESENT-MISMATCH) and -- for
          # every cell except ALIAS-KEY (the whole cell re-keys) and MISSING
          # (nothing to match against) -- SAMPLES the cell's own UNBACKED
          # sales (<= 400, four soldAt windows, id-prefix reads only) to size
          # each sale-level shape: NUMBER-IN-SIBLING, INSERT-UNDER-PARENT,
          # PARALLEL-SUFFIX, PRINTRUN-SHORT-ID, PRINTRUN-VARIANT-ABSENT,
          # RUNG-ABSENT, NUMBER-ABSENT, ROW-EXISTS-NON-STRICT, JUNK-PARALLEL,
          # PHRASE-LEAK, AUTO-MISMATCH, UNPARSEABLE. A cell with plentiful
          # strict rows is NOT excused: that is 85% of the measured gap.
          # Sibling pairs are DISCOVERED (registered ancestors, children and
          # family of the key, <= 12 checklists probed per cell, cached per
          # run) and reported as SUGGESTIONS with counts + samples; the
          # acting lanes still move only pairs an operator names. Output is a
          # console banner rollup plus a PLAN_OUT NDJSON queue (one record per
          # in-scope cell), same mechanism as resolve-split-identity-parks.
          # `scope` is REQUIRED: a bare sport (baseball) sweeps every cell of
          # that sport, or sport:year (baseball:2025) narrows to one year; no
          # 'all'. `titles` is an OPTIONAL setKey filter (comma list, NOT a
          # from>to pair like the sibling repoint lanes) -- empty means every
          # cell in scope. `limit` caps the cells routed by the whole relaunch
          # chain. `scan_limit` is this lane's RESUME VALUE (hop * 1,000,000
          # + cell offset) -- leave it 0; the budget relaunch below sets it.
          # SELF-THROTTLED: 300k RU per link, sold_comps reads paced to
          # 1,500 RU/s, 20 throttles ends the run with no relaunch. The
          # pilot dispatch is scope=baseball limit=150.
          - route-backing-gaps
          # R76 (Drew, 2026-09-19). repair-set-sport.cjs (2026-08-20) flipped
