name: Backfill Runner (sold_comps re-slug / verify_queue batch)

# CF-BACKFILL-RUNNER (Drew, 2026-07-29). Server-side runner for any
# `backend/scripts/reslug-*.cjs` or `backend/scripts/approve-*.cjs`
# backfill so we can execute long-running data cleanup jobs without
# tying up a laptop. Cosmos connection string is fetched from
# HobbyIQ3 App Service at run time (same pattern as
# auto-multiplier-refresh.yml).
#
# Whitelisted scripts only — the input is a dropdown, not free-form —
# so this workflow can't be turned into a general "run arbitrary code"
# vector.
#
# Modes:
#   dry-run (default): scan + report distribution + sample; NO writes
#   apply:             actually mutate sold_comps / verify_queue
#
# Always run the dry-run first; review the distribution + samples in
# the workflow log; then re-dispatch with apply=true if it looks right.
#
# CF-REPORT-RELAUNCHES-AS-A-REPORT (D34, 2026-08-30). Every marker-gated
# self-relaunch step below used to carry `&& inputs.apply == true` and
# re-dispatch with a hardcoded `-f apply=true`. So a REPORT-ONLY run that
# stopped at its 140-minute budget — printing "stopped at the 140-minute
# budget — the relaunch continues from here", exactly as an apply does —
# re-dispatched nothing, and no report longer than one budget could ever
# finish (observed on run 33330120651, repair-bcp-misfiled-parallels).
#
# The gate is the MARKER, never the mode (CF-RELAUNCH-ONLY-ON-BUDGET,
# #1361): the script itself is the only thing that knows work is left, and
# it says so identically in both modes. `run:` below pipes through
# `tee /tmp/backfill.log` unconditionally, so a report writes the same log
# the relaunch greps. `apply` is now forwarded verbatim with every other
# input — a report relaunches as a report, an apply as an apply — and
# `!cancelled()` still keeps a cancel or a crash from re-dispatching.

