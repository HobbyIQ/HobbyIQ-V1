        run: |
          set +e
          N=$(grep -aoE "^  RENAMED +[0-9,]+" /tmp/backfill.log | tail -1 | grep -oE "[0-9,]+$" | tr -d ,)
          echo "renamed=${N:-0}"
          if grep -aqE "stopped at the .*budget" /tmp/backfill.log; then
            echo "::notice::budget hit (renamed=${N:-0}) — re-dispatching slot ${{ inputs.slot }}/${{ inputs.slots }} to continue"
            gh workflow run backfill-runner.yml --repo "$GITHUB_REPOSITORY" --ref main -f script=rename-setkey-to-product -f apply=true -f concurrency="${{ inputs.concurrency }}" -f slot="${{ inputs.slot }}" -f slots="${{ inputs.slots }}" -f mode="${{ inputs.mode }}" -f sports="${{ inputs.sports }}" -f years="${{ inputs.years }}" -f scope="${{ inputs.scope }}" -f sources="${{ inputs.sources }}"
          else
            echo "::notice::slot ${{ inputs.slot }}/${{ inputs.slots }} finished within budget (renamed=${N:-0}) — done, no re-dispatch."
          fi

      - name: Self-relaunch the misfiled-parallel repair until the slot is clean
        # D33. The five repairs behind Drew's "still a mess" on 2020 Bowman
        # Draft BD-152. Stops at its own 140-minute budget and PRINTS its
        # summary; a run killed by the 150-minute step ceiling prints nothing.
        # CF-RELAUNCH-ONLY-ON-BUDGET (#1361): relaunch iff the marker printed,
        # never on a count and never on a cancel; every input forwarded
        # verbatim (mode / scope / sources / sports / years / slot / slots), so
        # the relaunch is the same dispatch -- and MODE especially, because the
        # script exits 1 without it rather than picking a population itself.
        if: ${{ !cancelled() && inputs.script == 'repair-bcp-misfiled-parallels' && inputs.apply == true }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        working-directory: backend
        run: |
          set +e
          N=$(grep -aoE "^  CHANGED +[0-9,]+" /tmp/backfill.log | tail -1 | grep -oE "[0-9,]+$" | tr -d ,)
          echo "changed=${N:-0}"
          if grep -aqE "stopped at the .*budget" /tmp/backfill.log; then
            echo "::notice::budget hit (changed=${N:-0}) — re-dispatching slot ${{ inputs.slot }}/${{ inputs.slots }} to continue"
            gh workflow run backfill-runner.yml --repo "$GITHUB_REPOSITORY" --ref main -f script=repair-bcp-misfiled-parallels -f apply=true -f concurrency="${{ inputs.concurrency }}" -f slot="${{ inputs.slot }}" -f slots="${{ inputs.slots }}" -f mode="${{ inputs.mode }}" -f sports="${{ inputs.sports }}" -f years="${{ inputs.years }}" -f scope="${{ inputs.scope }}" -f sources="${{ inputs.sources }}"
          else
            echo "::notice::slot ${{ inputs.slot }}/${{ inputs.slots }} finished within budget (changed=${N:-0}) — done, no re-dispatch."
          fi

      - name: Self-relaunch the card-number repair until the slot is clean
        # D28 (CF-A-CARD-NUMBER-IS-NOT-A-GRADE). Stops at its own 140-minute
        # budget and PRINTS its summary; a run killed by the 150-minute step
        # ceiling prints nothing. CF-RELAUNCH-ONLY-ON-BUDGET (#1361): relaunch
        # iff the marker printed, never on a count; every input forwarded
        # verbatim (mode / scope / sources / slot / slots), so the relaunch is
        # the same dispatch.
        if: ${{ !cancelled() && inputs.script == 'repair-card-number-from-title' && inputs.apply == true }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        working-directory: backend
        run: |
          set +e
          N=$(grep -aoE "^  REPAIRED +[0-9,]+" /tmp/backfill.log | tail -1 | grep -oE "[0-9,]+$" | tr -d ,)
          echo "repaired=${N:-0}"
          if grep -aqE "stopped at the .*budget" /tmp/backfill.log; then
            echo "::notice::budget hit (repaired=${N:-0}) — re-dispatching slot ${{ inputs.slot }}/${{ inputs.slots }} to continue"
            gh workflow run backfill-runner.yml --repo "$GITHUB_REPOSITORY" --ref main -f script=repair-card-number-from-title -f apply=true -f concurrency="${{ inputs.concurrency }}" -f slot="${{ inputs.slot }}" -f slots="${{ inputs.slots }}" -f mode="${{ inputs.mode }}" -f scope="${{ inputs.scope }}" -f sources="${{ inputs.sources }}"
          else
            echo "::notice::slot ${{ inputs.slot }}/${{ inputs.slots }} finished within budget (repaired=${N:-0}) — done, no re-dispatch."
          fi

      - name: Self-relaunch the base-cards clean until the slot is clean
        # D28. Same contract as above: the marker is the predicate, and mode /
        # scope / sources / sports travel with the relaunch.
        if: ${{ !cancelled() && inputs.script == 'clean-base-cards-parallel-slug' && inputs.apply == true }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        working-directory: backend
        run: |
          set +e
          N=$(grep -aoE "^  CLEANED +[0-9,]+" /tmp/backfill.log | tail -1 | grep -oE "[0-9,]+$" | tr -d ,)
          echo "cleaned=${N:-0}"
          if grep -aqE "stopped at the .*budget" /tmp/backfill.log; then
            echo "::notice::budget hit (cleaned=${N:-0}) — re-dispatching slot ${{ inputs.slot }}/${{ inputs.slots }} to continue"
            gh workflow run backfill-runner.yml --repo "$GITHUB_REPOSITORY" --ref main -f script=clean-base-cards-parallel-slug -f apply=true -f concurrency="${{ inputs.concurrency }}" -f slot="${{ inputs.slot }}" -f slots="${{ inputs.slots }}" -f mode="${{ inputs.mode }}" -f scope="${{ inputs.scope }}" -f sources="${{ inputs.sources }}" -f sports="${{ inputs.sports }}"
          else
            echo "::notice::slot ${{ inputs.slot }}/${{ inputs.slots }} finished within budget (cleaned=${N:-0}) — done, no re-dispatch."
          fi

      - name: Self-relaunch the checklist-backing annotation until the slot is clean
        # Terminates on its OWN resume predicate rather than on a count that
        # happens to be zero. The script only takes rows with no
        # checklistBacking yet, so "scanned 0" means the slot is finished --
        # whereas relaunching on "annotated > 0" would loop forever once the
        # budget stop sent the next run back to the first product.
        if: ${{ !cancelled() && inputs.script == 'annotate-checklist-backing' && inputs.apply == true }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        working-directory: backend
        run: |
          set +e
          N=$(grep -aoE "^  annotated +[0-9,]+" /tmp/backfill.log | tail -1 | grep -oE "[0-9,]+$" | tr -d ,)
          echo "checklist_backing_annotated=${N:-0}"
          # CF-RELAUNCH-ONLY-ON-BUDGET (2026-08-29). Relaunch iff the script says it
          # stopped at its budget with work left. Gating on "did anything" looped
          # forever once a slot was down to rows it cannot change.
          if grep -aqE "stopped at the .*budget" /tmp/backfill.log; then
            echo "::notice::budget hit (annotated=${N:-0}) — re-dispatching slot ${{ inputs.slot }}/${{ inputs.slots }} to continue"
            gh workflow run backfill-runner.yml --repo "$GITHUB_REPOSITORY" --ref main -f script=annotate-checklist-backing -f apply=true -f concurrency="${{ inputs.concurrency }}" -f slot="${{ inputs.slot }}" -f slots="${{ inputs.slots }}" -f sports="${{ inputs.sports }}" -f mode="${{ inputs.mode }}"
          else
            echo "::notice::slot ${{ inputs.slot }}/${{ inputs.slots }} finished within budget (annotated=${N:-0}) — done, no re-dispatch."
          fi

      - name: Self-relaunch graded identities until the pool is fully minted
        # Same contract as the retire: the script stops at its own 140-minute
        # budget and PRINTS its summary, so "written N" exists to be read. A
        # process killed by the step ceiling never prints one, which is how a
        # fleet stops silently while every run stays green.
        if: ${{ !cancelled() && inputs.script == 'materialize-graded-identities' && inputs.apply == true }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        working-directory: backend
        run: |
          set +e
          MADE=$(grep -aoE "^  written +[0-9,]+" /tmp/backfill.log | tail -1 | grep -oE "[0-9,]+$" | tr -d ,)
          MADE=${MADE:-0}
          echo "graded_identities_written=$MADE"
          # CF-RELAUNCH-ONLY-ON-BUDGET (#1361, D18 2026-08-29). Relaunch iff the
          # script printed its budget marker — never on a count. A count gate
          # looped forever on a slot down to rows it cannot change, and stopped
          # early on a budget stop that happened to change nothing. The inputs
          # are forwarded verbatim so the relaunch is the same dispatch.
          if grep -aqE "stopped at the .*budget" /tmp/backfill.log; then
            echo "::notice::budget hit (minted=$MADE) — re-dispatching slot ${{ inputs.slot }}/${{ inputs.slots }} to continue"
            gh workflow run backfill-runner.yml --repo "$GITHUB_REPOSITORY" --ref main -f script=materialize-graded-identities -f apply=true -f concurrency="${{ inputs.concurrency }}" -f slot="${{ inputs.slot }}" -f slots="${{ inputs.slots }}" -f mode="${{ inputs.mode }}" -f sports="${{ inputs.sports }}" -f years="${{ inputs.years }}" -f scope="${{ inputs.scope }}" -f sources="${{ inputs.sources }}"
          else
            echo "::notice::slot ${{ inputs.slot }}/${{ inputs.slots }} finished within budget (minted=$MADE) — done, no re-dispatch."
          fi

      - name: Self-relaunch the retire until nothing is left to retire
        # CF-RETIRE-SELF-RELAUNCH (Drew, 2026-08-26). 16.2M deletes at ~35k/min
        # outlive the 150-minute ceiling several times over. Since D18 the gate
        # is the budget marker, not "deleted > 0": a drained slice finishes
        # within budget, prints no marker, and stops.
        if: ${{ !cancelled() && inputs.script == 'retire-unreferenced-graded-rows' && inputs.apply == true }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        working-directory: backend
        run: |
          set +e
          MOVED=$(grep -aoE "^  deleted +[0-9,]+" /tmp/backfill.log | tail -1 | grep -oE "[0-9,]+$" | tr -d ,)
          MOVED=${MOVED:-0}
          echo "retire_deleted=$MOVED"
          # CF-RELAUNCH-ONLY-ON-BUDGET (#1361, D18 2026-08-29). Relaunch iff the
          # script printed its budget marker — never on a count. A count gate
          # looped forever on a slot down to rows it cannot change, and stopped
          # early on a budget stop that happened to change nothing. The inputs
          # are forwarded verbatim so the relaunch is the same dispatch.
          if grep -aqE "stopped at the .*budget" /tmp/backfill.log; then
            echo "::notice::budget hit (deleted=$MOVED) — re-dispatching slot ${{ inputs.slot }}/${{ inputs.slots }} to continue"
            gh workflow run backfill-runner.yml --repo "$GITHUB_REPOSITORY" --ref main -f script=retire-unreferenced-graded-rows -f apply=true -f concurrency="${{ inputs.concurrency }}" -f slot="${{ inputs.slot }}" -f slots="${{ inputs.slots }}" -f mode="${{ inputs.mode }}" -f sports="${{ inputs.sports }}" -f years="${{ inputs.years }}" -f scope="${{ inputs.scope }}" -f sources="${{ inputs.sources }}"
          else
            echo "::notice::slot ${{ inputs.slot }}/${{ inputs.slots }} finished within budget (deleted=$MOVED) — done, no re-dispatch."
          fi

      - name: Self-relaunch the re-home until its slice drains
        # CF-REHOME-SELF-RELAUNCH (Drew, 2026-08-25). 17.7M rows do not move
        # inside one 150-minute step. Without this the job stops dead at the
        # ceiling and needs a human to re-dispatch -- at 3am, which is not a
        # plan, it is a hope.
        #
        # The re-home is convergent -- a re-homed row has id == cardId and
        # drops out of the query -- so a relaunch resumes rather than repeating.
        # Since D18 (2026-08-29) the script stops at its OWN RUN_MINUTES budget
        # and prints the marker; a run that drains its slice within budget
        # prints no marker and the loop stops.
        if: ${{ !cancelled() && inputs.script == 'rehome-catalog-rows-to-own-partition' && inputs.apply == true }}
        env:
          GH_TOKEN: ${{ github.token }}
          REHOME_YEARS: ${{ inputs.years }}
        shell: bash
        working-directory: backend
        run: |
          set +e
          # CF-A-RELAUNCH-MUST-TERMINATE (Drew, 2026-08-26). This probe used to
          # ask whether the YEAR still had rows, and slot 3 of 4 (setKeys
          # [v..~), nearly empty) re-dispatched ITSELF forever in ~90 second
          # cycles. It then asked "did THIS run move anything", which
          # terminates -- but a run SIGKILLed at the step ceiling prints no
          # summary, so that gate read 0 and stopped a fleet with work left.
          # The marker below is the script saying, itself, that work is left.
          MOVED=$(grep -aoE "re-homed to their own slug +[0-9,]+" /tmp/backfill.log | tail -1 | grep -oE "[0-9,]+$" | tr -d ,)
          MOVED=${MOVED:-0}
          echo "rehome_moved=$MOVED years=$REHOME_YEARS slot=${{ inputs.slot }}/${{ inputs.slots }}"
          # D18 (2026-08-29): the script now stops at its OWN RUN_MINUTES budget
          # and prints the marker, instead of being SIGKILLed at the step
          # ceiling — a killed job cannot report progress, so "moved > 0" was
          # reading a summary the ceiling guaranteed would never print.
          # CF-RELAUNCH-ONLY-ON-BUDGET (#1361, D18 2026-08-29). Relaunch iff the
          # script printed its budget marker — never on a count. A count gate
          # looped forever on a slot down to rows it cannot change, and stopped
          # early on a budget stop that happened to change nothing. The inputs
          # are forwarded verbatim so the relaunch is the same dispatch.
          if grep -aqE "stopped at the .*budget" /tmp/backfill.log; then
            echo "::notice::budget hit (moved=$MOVED) — re-dispatching slot ${{ inputs.slot }}/${{ inputs.slots }} to continue"
            gh workflow run backfill-runner.yml --repo "$GITHUB_REPOSITORY" --ref main -f script=rehome-catalog-rows-to-own-partition -f apply=true -f concurrency="${{ inputs.concurrency }}" -f slot="${{ inputs.slot }}" -f slots="${{ inputs.slots }}" -f mode="${{ inputs.mode }}" -f sports="${{ inputs.sports }}" -f years="${{ inputs.years }}" -f scope="${{ inputs.scope }}" -f sources="${{ inputs.sources }}" -f setkey_like="${{ inputs.setkey_like }}" -f parents_only="${{ inputs.parents_only }}" -f limit="${{ inputs.limit }}" -f scan_limit="${{ inputs.scan_limit }}"
          else
            echo "::notice::slot ${{ inputs.slot }}/${{ inputs.slots }} finished within budget (moved=$MOVED) — done, no re-dispatch."
          fi

      - name: Self-relaunch until composite backfill fully drains
        # CF-COMPOSITE-BACKFILL-SELF-RELAUNCH (Drew, 2026-07-30). Composite
        # backfill covers ~3.4M sold_comps rows and one 150-min iteration
        # can't drain the whole corpus. This step runs a cheap TOP-1
        # existence query — if ANY row still lacks the target composite
        # field, it re-dispatches this workflow with the same params.
        # Runs until the corpus is fully enriched, no manual re-dispatch.
        #
        # Fires for BOTH composite backfill scripts (v1 checks
        # `c.composite`, v3 checks `c.composite.era`) and only in apply
        # mode. `always()` so a timed-out backfill step still triggers a
        # re-dispatch — resumable-by-design.
        if: ${{ !cancelled() && (inputs.script == 'backfill-composite-fields' || inputs.script == 'backfill-composite-v3') && inputs.apply == true }}
        env:
          GH_TOKEN: ${{ github.token }}
          COMPOSITE_SCRIPT: ${{ inputs.script }}
        shell: bash
        # CF-COMPOSITE-SELF-RELAUNCH-CWD-FIX (Drew, 2026-07-30). Run
        # from backend/ so `require('@azure/cosmos')` resolves. Earlier
        # runs failed at this step with "Cannot find module '@azure/cosmos'"
        # which caused the self-relaunch to skip — killing the loop
        # after 09:38 UTC on 2026-07-30.
        working-directory: backend
        run: |
          set +e
          # v3 checks composite.era (added by enrichCompositeV3); v1
          # checks composite existence itself.
          if [ "$COMPOSITE_SCRIPT" = "backfill-composite-v3" ]; then
            PROBE_QUERY="SELECT TOP 1 c.id FROM c WHERE NOT IS_DEFINED(c.composite.era)"
          else
            PROBE_QUERY="SELECT TOP 1 c.id FROM c WHERE NOT IS_DEFINED(c.composite)"
          fi
          REMAINING=$(node -e "
            const { CosmosClient } = require('@azure/cosmos');
            (async () => {
              const c = new CosmosClient(process.env.COSMOS_CONNECTION_STRING);
              const container = c.database(process.env.COSMOS_DATABASE || 'hobbyiq').container('sold_comps');
              const { resources } = await container.items.query({
                query: process.env.PROBE_QUERY
              }).fetchAll();
              console.log(resources.length > 0 ? 'MORE' : 'DONE');
            })().catch(e => { console.error('check-error:', e.message); process.exit(2); });
          " 2>&1)
          RC=$?
          echo "check_output=$REMAINING (rc=$RC)  script=$COMPOSITE_SCRIPT"
          if [ "$RC" -ne 0 ]; then
            echo "::warning::Composite coverage check FAILED — skipping self-relaunch. Manual re-dispatch will be needed."
            exit 0
          fi
          if [ "$REMAINING" = "MORE" ]; then
            echo "::notice::$COMPOSITE_SCRIPT still has rows — re-dispatching workflow with same params"
            gh workflow run backfill-runner.yml \
              --repo "$GITHUB_REPOSITORY" \
              --ref main \
              -f script="$COMPOSITE_SCRIPT" \
              -f apply=true \
              -f concurrency="${{ inputs.concurrency }}"
            echo "Re-dispatch queued. This workflow exits; new run continues the drain."
          else
            echo "::notice::$COMPOSITE_SCRIPT COMPLETE — 0 rows remaining. No re-dispatch."
          fi

      - name: Self-relaunch bulk-import until date-window hits END_DATE
        # CF-BULK-IMPORT-SELF-RELAUNCH (Drew, 2026-07-30). Bulk import
        # walks backward through ch_daily_sales in 7-day slices, capped
        # at BULK_LIMIT=500K rows per iteration. To cover the full 8yr
        # corpus (~18M rows/yr), the script must re-dispatch itself with
        # the "next start date" as its new BULK_START_DATE. Reads the
        # printed "next start date:" line from the log, then re-dispatches
        # if the date is still > END_DATE (2018-01-01 default).
        if: ${{ !cancelled() && inputs.script == 'bulk-import-ch-daily-to-sold-comps' && inputs.apply == true }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          NEXT_START=$(grep -oE 'next start date:\s+[0-9-]+' /tmp/backfill.log 2>/dev/null | tail -1 | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' | head -1)
          END_DATE="${{ inputs.bulk_end_date }}"
          [ -z "$END_DATE" ] && END_DATE="2018-01-01"
          echo "next_start=$NEXT_START  end_date=$END_DATE"
          if [ -z "$NEXT_START" ]; then
            echo "::warning::Could not parse next start date from log — no self-relaunch. Manual re-dispatch will be needed."
            exit 0
          fi
          if [ "$NEXT_START" \> "$END_DATE" ]; then
            echo "::notice::Bulk import has more history to cover — re-dispatching with BULK_START_DATE=$NEXT_START"
            gh workflow run backfill-runner.yml \
              --repo "$GITHUB_REPOSITORY" \
              --ref main \
              -f script=bulk-import-ch-daily-to-sold-comps \
              -f apply=true \
              -f concurrency="${{ inputs.concurrency }}" \
              -f bulk_start_date="$NEXT_START" \
              -f bulk_end_date="$END_DATE"
            echo "Re-dispatch queued. This workflow exits; new run continues walking backward."
          else
            echo "::notice::Bulk import reached END_DATE ($END_DATE). Full corpus back-import complete."
          fi

      - name: Self-relaunch catalog expansion until RELAUNCH_NEEDED=false
        # CF-CATALOG-EXPANSION-SELF-RELAUNCH (Drew, 2026-08-01). A script on
        # this list prints RELAUNCH_NEEDED=true when there are still tuples to
        # process. The script self-caps to ~25 min per invocation; this step
        # re-dispatches the workflow immediately so it continues in a fresh
        # runner. Loops until the script emits RELAUNCH_NEEDED=false.
        if: ${{ !cancelled() && (inputs.script == 'backfill-catalog-cs-images' || inputs.script == 'normalize-catalog-schema' || inputs.script == 'dedupe-catalog-by-hobbyiq' || inputs.script == 'backfill-cs-card-population' || inputs.script == 'drain-staging-backlog' || inputs.script == 'rescore-anomalies' || inputs.script == 'score-all-sold-comps' || inputs.script == 'reaudit-cardsight-unverified' || inputs.script == 'backfill-searchtokens-all-sports' || inputs.script == 'fix-catalog-parallel-as-player' || inputs.script == 'auto-label-catalog-variants') && inputs.apply == true }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          RN=$(grep -E '^RELAUNCH_NEEDED=' /tmp/backfill.log 2>/dev/null | tail -1 | cut -d'=' -f2)
          echo "RELAUNCH_NEEDED=$RN"
          if [ "$RN" = "true" ]; then
            echo "::notice::${{ inputs.script }} has more tuples — re-dispatching"
            gh workflow run backfill-runner.yml \
              --repo "$GITHUB_REPOSITORY" \
              --ref main \
              -f script="${{ inputs.script }}" \
              -f apply=true \
              -f concurrency="${{ inputs.concurrency }}"
            echo "Re-dispatch queued."
          elif [ "$RN" = "false" ]; then
            echo "::notice::${{ inputs.script }} COMPLETE — no more tuples. Loop stops."
          else
            echo "::warning::Could not parse RELAUNCH_NEEDED from log (got '$RN'). No re-dispatch. Manual re-run needed."
          fi
