          dispatch: |
            gh workflow run backfill-runner.yml --repo "$GITHUB_REPOSITORY" --ref main -f script=annotate-checklist-backing -f apply="${{ inputs.apply }}" -f concurrency="${{ inputs.concurrency }}" -f slot="${{ inputs.slot }}" -f slots="${{ inputs.slots }}" -f sports="${{ inputs.sports }}" -f mode="${{ inputs.mode }}"

      - name: Self-relaunch the engine backtest until its shard hits its target
        # CF-ENGINE-BACKTEST (#1651). Each evaluation point is a full engine
        # call against Cosmos, so a shard aiming at several thousand points
        # will outlive one 150-minute step. The gate is the MARKER and nothing
        # else (CF-RELAUNCH-ONLY-ON-BUDGET, #1361): a shard that reaches its
        # target prints "[done]" and stops, a shard that runs out of clock
        # prints the marker and continues.
        #
        # The backtest is READ ONLY, so `apply` is meaningless to it — but it
        # is forwarded verbatim like every other input, because a relaunch must
        # be the SAME dispatch (D34: a report relaunches as a report).
        if: ${{ !cancelled() && inputs.script == 'engine-backtest' }}
        env:
          GH_TOKEN: ${{ github.token }}
        uses: ./.github/actions/relaunch-on-marker
        with:
          outcome: ${{ steps.backfill.outcome }}
          script: engine-backtest
          preamble: |
            N=$(grep -aoE "scored +[0-9,]+" /tmp/backfill.log | tail -1 | grep -oE "[0-9,]+$" | tr -d , || true)
            echo "engine_backtest_points_scored=${N:-0}"
          budget-notice: |
            echo "::notice::budget hit (scored=${N:-0}) — re-dispatching slot ${{ inputs.slot }}/${{ inputs.slots }} to continue"
          finished-notice: |
            echo "::notice::slot ${{ inputs.slot }}/${{ inputs.slots }} finished within budget (scored=${N:-0}) — done, no re-dispatch."
          dispatch: |
            gh workflow run backfill-runner.yml --repo "$GITHUB_REPOSITORY" --ref main -f script=engine-backtest -f apply="${{ inputs.apply }}" -f concurrency="${{ inputs.concurrency }}" -f slot="${{ inputs.slot }}" -f slots="${{ inputs.slots }}" -f mode="${{ inputs.mode }}" -f sports="${{ inputs.sports }}" -f limit="${{ inputs.limit }}"

      - name: Self-relaunch graded identities until the pool is fully minted
        # Same contract as the retire: the script stops at its own 140-minute
        # budget and PRINTS its summary, so "written N" exists to be read. A
        # process killed by the step ceiling never prints one, which is how a
        # fleet stops silently while every run stays green.
        if: ${{ !cancelled() && inputs.script == 'materialize-graded-identities' }}
        env:
          GH_TOKEN: ${{ github.token }}
        uses: ./.github/actions/relaunch-on-marker
        with:
          outcome: ${{ steps.backfill.outcome }}
          script: materialize-graded-identities
          preamble: |
            MADE=$(grep -aoE "^  written +[0-9,]+" /tmp/backfill.log | tail -1 | grep -oE "[0-9,]+$" | tr -d , || true)
            MADE=${MADE:-0}
            echo "graded_identities_written=$MADE"
          budget-notice: |
            echo "::notice::budget hit (minted=$MADE) — re-dispatching slot ${{ inputs.slot }}/${{ inputs.slots }} to continue"
          finished-notice: |
            echo "::notice::slot ${{ inputs.slot }}/${{ inputs.slots }} finished within budget (minted=$MADE) — done, no re-dispatch."
          dispatch: |
            gh workflow run backfill-runner.yml --repo "$GITHUB_REPOSITORY" --ref main -f script=materialize-graded-identities -f apply="${{ inputs.apply }}" -f concurrency="${{ inputs.concurrency }}" -f slot="${{ inputs.slot }}" -f slots="${{ inputs.slots }}" -f mode="${{ inputs.mode }}" -f sports="${{ inputs.sports }}" -f years="${{ inputs.years }}" -f scope="${{ inputs.scope }}" -f sources="${{ inputs.sources }}"

      - name: Self-relaunch the retire until nothing is left to retire
        # CF-RETIRE-SELF-RELAUNCH (Drew, 2026-08-26). 16.2M deletes at ~35k/min
        # outlive the 150-minute ceiling several times over. Since D18 the gate
        # is the budget marker, not "deleted > 0": a drained slice finishes
        # within budget, prints no marker, and stops.
        if: ${{ !cancelled() && inputs.script == 'retire-unreferenced-graded-rows' }}
        env:
          GH_TOKEN: ${{ github.token }}
        uses: ./.github/actions/relaunch-on-marker
        with:
          outcome: ${{ steps.backfill.outcome }}
          script: retire-unreferenced-graded-rows
          preamble: |
            MOVED=$(grep -aoE "^  deleted +[0-9,]+" /tmp/backfill.log | tail -1 | grep -oE "[0-9,]+$" | tr -d , || true)
            MOVED=${MOVED:-0}
            echo "retire_deleted=$MOVED"
          budget-notice: |
            echo "::notice::budget hit (deleted=$MOVED) — re-dispatching slot ${{ inputs.slot }}/${{ inputs.slots }} to continue"
          finished-notice: |
            echo "::notice::slot ${{ inputs.slot }}/${{ inputs.slots }} finished within budget (deleted=$MOVED) — done, no re-dispatch."
          dispatch: |
            gh workflow run backfill-runner.yml --repo "$GITHUB_REPOSITORY" --ref main -f script=retire-unreferenced-graded-rows -f apply="${{ inputs.apply }}" -f concurrency="${{ inputs.concurrency }}" -f slot="${{ inputs.slot }}" -f slots="${{ inputs.slots }}" -f mode="${{ inputs.mode }}" -f sports="${{ inputs.sports }}" -f years="${{ inputs.years }}" -f scope="${{ inputs.scope }}" -f sources="${{ inputs.sources }}"

      - name: Self-relaunch the re-home until its slice drains
        # CF-REHOME-SELF-RELAUNCH (Drew, 2026-08-25). 17.7M rows do not move
        # inside one 150-minute step. Without this the job stops dead at the
        # ceiling and needs a human to re-dispatch -- at 3am, which is not a
        # plan, it is a hope.
        #
        # The re-home is convergent -- a re-homed row has id == cardId and
        # drops out of the query -- so a relaunch resumes rather than repeating.
        # Since D18 (2026-08-29) the script stops at its OWN RUN_MINUTES budget
        # and prints the marker; a run that drains its slice within budget
        # prints no marker and the loop stops.
        if: ${{ !cancelled() && inputs.script == 'rehome-catalog-rows-to-own-partition' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REHOME_YEARS: ${{ inputs.years }}
        uses: ./.github/actions/relaunch-on-marker
        with:
          outcome: ${{ steps.backfill.outcome }}
          script: rehome-catalog-rows-to-own-partition
          preamble: |
            MOVED=$(grep -aoE "re-homed to their own slug +[0-9,]+" /tmp/backfill.log | tail -1 | grep -oE "[0-9,]+$" | tr -d , || true)
            MOVED=${MOVED:-0}
            echo "rehome_moved=$MOVED years=$REHOME_YEARS slot=${{ inputs.slot }}/${{ inputs.slots }}"
          budget-notice: |
            echo "::notice::budget hit (moved=$MOVED) — re-dispatching slot ${{ inputs.slot }}/${{ inputs.slots }} to continue"
          finished-notice: |
            echo "::notice::slot ${{ inputs.slot }}/${{ inputs.slots }} finished within budget (moved=$MOVED) — done, no re-dispatch."
          dispatch: |
            gh workflow run backfill-runner.yml --repo "$GITHUB_REPOSITORY" --ref main -f script=rehome-catalog-rows-to-own-partition -f apply="${{ inputs.apply }}" -f concurrency="${{ inputs.concurrency }}" -f slot="${{ inputs.slot }}" -f slots="${{ inputs.slots }}" -f mode="${{ inputs.mode }}" -f sports="${{ inputs.sports }}" -f years="${{ inputs.years }}" -f scope="${{ inputs.scope }}" -f sources="${{ inputs.sources }}" -f setkey_like="${{ inputs.setkey_like }}" -f parents_only="${{ inputs.parents_only }}" -f limit="${{ inputs.limit }}" -f scan_limit="${{ inputs.scan_limit }}"

      - name: Self-relaunch the Tiffany rung repair until the slot is clean
        # CF-TIFFANY-IS-A-PRODUCT (#1745). The script stops at its own
        # RUN_MINUTES budget and PRINTS the marker; a run SIGKILLed at the
        # 150-minute step ceiling prints nothing, which is exactly why the gate
        # is the marker and never a count (CF-RELAUNCH-ONLY-ON-BUDGET, #1361).
        #
        # It shipped in #1745 with the marker and the sentence "the relaunch
        # continues from here", and no relaunch step to make that sentence
        # true: a slot that ran out of budget stopped after one cycle, green,
        # with work left and nothing saying so.
        #
        # MODE is forwarded because the script REQUIRES it and exits 1 without
        # one rather than picking a population itself, and `parents_only` is
        # forwarded because it carries the CF-AN-INHERITED-SLOTS-IS-NOT-A-
        # CHOSEN-SHARD opt-in (#1756) — a continuation that dropped it would
        # silently widen from one shard to a full sweep mid-fleet. Every other
        # input is forwarded verbatim, so the relaunch is the same dispatch.
        if: ${{ !cancelled() && inputs.script == 'repair-tiffany-rung-to-product' }}
        env:
          GH_TOKEN: ${{ github.token }}
        uses: ./.github/actions/relaunch-on-marker
        with:
