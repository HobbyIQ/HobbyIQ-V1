            echo "reslugged=${N:-0}"
          budget-notice: |
            echo "::notice::budget hit (reslugged=${N:-0}) — re-dispatching slot ${{ inputs.slot }}/${{ inputs.slots }} to continue"
          finished-notice: |
            echo "::notice::slot ${{ inputs.slot }}/${{ inputs.slots }} finished within budget (reslugged=${N:-0}) — done, no re-dispatch."
          dispatch: |
            gh workflow run backfill-runner.yml --repo "$GITHUB_REPOSITORY" --ref main -f script=reslug-ruled-alias -f apply="${{ inputs.apply }}" -f concurrency="${{ inputs.concurrency }}" -f slot="${{ inputs.slot }}" -f slots="${{ inputs.slots }}" -f sports="${{ inputs.sports }}" -f years="${{ inputs.years }}" -f scope="${{ inputs.scope }}" -f limit="${{ inputs.limit }}" -f parents_only="${{ inputs.parents_only }}"

      - name: Self-relaunch the finish-collision refile until the slot is clean
        # CF-FINISH-FAMILY-COLLISION (#1790, the write half). `scope` is the
        # WHOLE safety argument for this lane -- a comma-separated product list
        # as sport:year:setKey, with no 'all' -- so the continuation carries the
        # SAME list. Forwarding it verbatim also means the "The finish-collision
        # refile names its scope" gate RE-VALIDATES the relaunch: a continuation
        # that somehow lost its scope refuses rather than widening.
        #
        # `apply` is forwarded verbatim too (#1578): a report that relaunches as
        # a write is the defect that rule exists to stop, and hardcoding EITHER
        # value is how it happens.
        #
