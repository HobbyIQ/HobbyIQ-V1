name: Backfill Runner (sold_comps re-slug / verify_queue batch)

# CF-BACKFILL-RUNNER (Drew, 2026-07-29). Server-side runner for any
# `backend/scripts/reslug-*.cjs` or `backend/scripts/approve-*.cjs`
# backfill so we can execute long-running data cleanup jobs without
# tying up a laptop. Cosmos connection string is fetched from
# HobbyIQ3 App Service at run time (same pattern as
# auto-multiplier-refresh.yml).
#
# Whitelisted scripts only — the input is a dropdown, not free-form —
# so this workflow can't be turned into a general "run arbitrary code"
# vector.
#
# Modes:
#   dry-run (default): scan + report distribution + sample; NO writes
#   apply:             actually mutate sold_comps / verify_queue
#
# Always run the dry-run first; review the distribution + samples in
# the workflow log; then re-dispatch with apply=true if it looks right.

on:
  workflow_dispatch:
    inputs:
      script:
        description: "Backfill script to run"
        required: true
        type: choice
        options:
          - reslug-speckle-recovery
          - reslug-chrome-prospects-and-wave
          - reslug-player-sport-fix
          - reslug-brand-root-refinement
          - reslug-cross-brand-fix
          - reslug-heritage-vs-topps-chrome
          - reslug-bowman-paper-vs-bowman
          - reslug-fleer-stickers
          - reslug-recover-cardnumbers
          - reslug-chrome-draft-collision
          - reslug-cross-product-mis-slug
          - audit-setkey-distribution
          - audit-grade-coverage
          - reslug-suspicious-setkeys
          - backfill-grade-from-ch-daily
          - bulk-import-ch-daily-to-sold-comps
          - audit-bulk-import-accuracy
          - quick-check-grade-passthrough
          - approve-topps-finest-2026
          - backfill-verify-queue-grades
          - prototype-slab-ocr
          - slab-ocr-auto-approve-queue
          - discover-auto-cardnumber-prefixes
          - backfill-isauto-from-cardnumber
          - backfill-isauto-cross-sport
          - backfill-printrun-from-title
          - backfill-autostyle-from-title
          - backfill-parallel-enrichment
          - backfill-insert-setkey
          - backfill-composite-fields
          - backfill-composite-v3
          - audit-ladder-violations
          - prototype-neighbor-lookup
          - market-analysis-composite
          - refresh-market-signals
          - refresh-calibration-multipliers
          - ingest-product-checklist
          - ingest-2026-bowman-auto-checklist
          - reprice-user-holdings
      apply:
        description: "Actually write (true) or dry-run only (false)"
        required: true
        type: boolean
        default: false
      concurrency:
        description: "Parallel patch workers (leave default unless tuning)"
        required: false
        default: "16"
      bulk_start_date:
        description: "For bulk-import-ch-daily-to-sold-comps: start walking backward from this date (YYYY-MM-DD). Empty = today. Used by self-relaunch to resume from where the previous run stopped."
        required: false
        default: ""
      bulk_end_date:
        description: "For bulk-import-ch-daily-to-sold-comps: stop at this date (YYYY-MM-DD). Default 2018-01-01."
        required: false
        default: ""

permissions:
  contents: read
  id-token: write   # Azure OIDC for App Service secret fetch
  actions: write    # workflow_dispatch to self-relaunch composite backfill

jobs:
  run-backfill:
    runs-on: ubuntu-latest
    # 180 min ceiling — leaves 60+ min headroom on GH Actions' 6h max so
    # the self-relaunch check (composite backfill only) always has room
    # to run after the actual backfill step's own 150-min timeout.
    timeout-minutes: 180

    steps:
      - name: Checkout repo at dispatched ref
        # workflow_dispatch checks out the branch chosen in the UI, so
        # Drew can run scripts that live on a feature branch before merge.
        uses: actions/checkout@v5

      - name: Setup Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Install backend deps
        working-directory: backend
        run: npm ci

      - name: Build backend dist
        # Backfill scripts require compiled JS from backend/dist. Build
        # here so the checked-out branch's parser code is what runs.
        working-directory: backend
        run: npm run build

      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_1259D9D213E34AE29B2DD54B3E755C4D }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_5AB8B3DC612348FD9D37DBE28FF40802 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_A45CF8552AE94AF68A046FB846E21206 }}

      - name: Fetch COSMOS_CONNECTION_STRING from HobbyIQ3 App Service
        shell: bash
        run: |
          CS=$(az webapp config appsettings list \
            --name HobbyIQ3 \
            --resource-group rg-hobbyiq-dev \
            --query "[?name=='COSMOS_CONNECTION_STRING'].value | [0]" \
            -o tsv)
          if [ -z "$CS" ]; then
            echo "::error::FAILED to fetch COSMOS_CONNECTION_STRING from App Service"
            exit 1
          fi
          echo "::add-mask::$CS"
          echo "COSMOS_CONNECTION_STRING=$CS" >> "$GITHUB_ENV"
          echo "COSMOS_CONNECTION_STRING fetched (length: ${#CS})"

      # Azure OpenAI env — only required by the slab-OCR prototype
      # script; always fetch (cheap read-only) so any future backfill
      # that needs LLM calls can rely on them being present.
      - name: Fetch Azure OpenAI env from HobbyIQ3 App Service
        if: startsWith(inputs.script, 'prototype-slab') || startsWith(inputs.script, 'slab-ocr')
        shell: bash
        run: |
          fetch_setting() {
            az webapp config appsettings list \
              --name HobbyIQ3 \
              --resource-group rg-hobbyiq-dev \
              --query "[?name=='$1'].value | [0]" \
              -o tsv
          }
          ENDPOINT=$(fetch_setting AZURE_OPENAI_ENDPOINT)
          KEY=$(fetch_setting AZURE_OPENAI_API_KEY)
          [ -z "$KEY" ] && KEY=$(fetch_setting AZURE_OPENAI_KEY)
          DEPLOY=$(fetch_setting AZURE_OPENAI_DEPLOYMENT)
          API_VERSION=$(fetch_setting AZURE_OPENAI_API_VERSION)
          if [ -z "$ENDPOINT" ] || [ -z "$KEY" ] || [ -z "$DEPLOY" ]; then
            echo "::error::Azure OpenAI env missing (endpoint / key / deployment)"
            exit 1
          fi
          echo "::add-mask::$KEY"
          echo "AZURE_OPENAI_ENDPOINT=$ENDPOINT" >> "$GITHUB_ENV"
          echo "AZURE_OPENAI_API_KEY=$KEY" >> "$GITHUB_ENV"
          echo "AZURE_OPENAI_DEPLOYMENT=$DEPLOY" >> "$GITHUB_ENV"
          [ -n "$API_VERSION" ] && echo "AZURE_OPENAI_API_VERSION=$API_VERSION" >> "$GITHUB_ENV"
          echo "Azure OpenAI env fetched (deployment: $DEPLOY)"

      - name: Verify script exists
        # Guardrail: whitelisted input, but confirm file is present in
        # the checked-out branch (a script added in a PR branch that
        # never landed on the dispatch ref would silently fail otherwise).
        run: |
          SCRIPT="backend/scripts/${{ inputs.script }}.cjs"
          if [ ! -f "$SCRIPT" ]; then
            echo "::error::Script $SCRIPT not present on branch ${GITHUB_REF#refs/heads/}"
            exit 1
          fi
          echo "Script confirmed: $SCRIPT"

      - name: Run backfill (${{ inputs.apply == true && 'APPLY' || 'DRY-RUN' }})
        # Both RESLUG_APPLY and APPROVE_APPLY env vars are set so this
        # single step works for both reslug-* and approve-* scripts;
        # each script only reads the one it cares about.
        id: backfill
        # 150 min per iteration — leaves 30 min for the self-relaunch
        # decision inside the job's 180-min ceiling.
        timeout-minutes: 150
        env:
          RESLUG_APPLY: ${{ inputs.apply == true && 'true' || 'false' }}
          APPROVE_APPLY: ${{ inputs.apply == true && 'true' || 'false' }}
          BACKFILL_APPLY: ${{ inputs.apply == true && 'true' || 'false' }}
          RESLUG_CONCURRENCY: ${{ inputs.concurrency }}
          APPROVE_CONCURRENCY: ${{ inputs.concurrency }}
          BACKFILL_CONCURRENCY: ${{ inputs.concurrency }}
          BULK_START_DATE: ${{ inputs.bulk_start_date }}
          BULK_END_DATE: ${{ inputs.bulk_end_date }}
          # CF-REPRICE-USER-HOLDINGS: pin Drew's userId + enable composite path
          # so the reprice writes new v2-calibrated FMVs.
          REPRICE_USER_ID: user-199fcbc9-58ba-4643-a0c9-f75bcbc90bd4
          HOBBYIQFMV_COMPOSITE_ENABLED: "true"
        run: node "backend/scripts/${{ inputs.script }}.cjs" | tee /tmp/backfill.log
        shell: bash

      - name: Self-relaunch until composite backfill fully drains
        # CF-COMPOSITE-BACKFILL-SELF-RELAUNCH (Drew, 2026-07-30). Composite
        # backfill covers ~3.27M sold_comps rows and one 150-min iteration
        # can't drain the whole corpus. This step runs a cheap TOP-1
        # existence query — if ANY row still lacks a composite field, it
        # re-dispatches this workflow with the same params. Runs until the
        # corpus is fully enriched, no manual re-dispatch needed.
        #
        # Only fires for the composite backfill script (other scripts are
        # single-shot) and only in apply mode. `always()` so a timed-out
        # backfill step still triggers a re-dispatch — resumable-by-design.
        if: ${{ always() && inputs.script == 'backfill-composite-fields' && inputs.apply == true }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        # CF-COMPOSITE-SELF-RELAUNCH-CWD-FIX (Drew, 2026-07-30). Run
        # from backend/ so `require('@azure/cosmos')` resolves. Earlier
        # runs failed at this step with "Cannot find module '@azure/cosmos'"
        # which caused the self-relaunch to skip — killing the loop
        # after 09:38 UTC on 2026-07-30.
        working-directory: backend
        run: |
          set +e
          REMAINING=$(node -e "
            const { CosmosClient } = require('@azure/cosmos');
            (async () => {
              const c = new CosmosClient(process.env.COSMOS_CONNECTION_STRING);
              const container = c.database(process.env.COSMOS_DATABASE || 'hobbyiq').container('sold_comps');
              const { resources } = await container.items.query({
                query: 'SELECT TOP 1 c.id FROM c WHERE NOT IS_DEFINED(c.composite)'
              }).fetchAll();
              console.log(resources.length > 0 ? 'MORE' : 'DONE');
            })().catch(e => { console.error('check-error:', e.message); process.exit(2); });
          " 2>&1)
          RC=$?
          echo "check_output=$REMAINING (rc=$RC)"
          if [ "$RC" -ne 0 ]; then
            echo "::warning::Composite coverage check FAILED — skipping self-relaunch. Manual re-dispatch will be needed."
            exit 0
          fi
          if [ "$REMAINING" = "MORE" ]; then
            echo "::notice::Composite backfill still has rows — re-dispatching workflow with same params"
            gh workflow run backfill-runner.yml \
              --repo "$GITHUB_REPOSITORY" \
              --ref main \
              -f script=backfill-composite-fields \
              -f apply=true \
              -f concurrency="${{ inputs.concurrency }}"
            echo "Re-dispatch queued. This workflow exits; new run continues the drain."
          else
            echo "::notice::Composite backfill COMPLETE — 0 rows without composite. No re-dispatch."
          fi

      - name: Self-relaunch bulk-import until date-window hits END_DATE
        # CF-BULK-IMPORT-SELF-RELAUNCH (Drew, 2026-07-30). Bulk import
        # walks backward through ch_daily_sales in 7-day slices, capped
        # at BULK_LIMIT=500K rows per iteration. To cover the full 8yr
        # corpus (~18M rows/yr), the script must re-dispatch itself with
        # the "next start date" as its new BULK_START_DATE. Reads the
        # printed "next start date:" line from the log, then re-dispatches
        # if the date is still > END_DATE (2018-01-01 default).
        if: ${{ always() && inputs.script == 'bulk-import-ch-daily-to-sold-comps' && inputs.apply == true }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          NEXT_START=$(grep -oE 'next start date:\s+[0-9-]+' /tmp/backfill.log 2>/dev/null | tail -1 | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' | head -1)
          END_DATE="${{ inputs.bulk_end_date }}"
          [ -z "$END_DATE" ] && END_DATE="2018-01-01"
          echo "next_start=$NEXT_START  end_date=$END_DATE"
          if [ -z "$NEXT_START" ]; then
            echo "::warning::Could not parse next start date from log — no self-relaunch. Manual re-dispatch will be needed."
            exit 0
          fi
          if [ "$NEXT_START" \> "$END_DATE" ]; then
            echo "::notice::Bulk import has more history to cover — re-dispatching with BULK_START_DATE=$NEXT_START"
            gh workflow run backfill-runner.yml \
              --repo "$GITHUB_REPOSITORY" \
              --ref main \
              -f script=bulk-import-ch-daily-to-sold-comps \
              -f apply=true \
              -f concurrency="${{ inputs.concurrency }}" \
              -f bulk_start_date="$NEXT_START" \
              -f bulk_end_date="$END_DATE"
            echo "Re-dispatch queued. This workflow exits; new run continues walking backward."
          else
            echo "::notice::Bulk import reached END_DATE ($END_DATE). Full corpus back-import complete."
          fi
