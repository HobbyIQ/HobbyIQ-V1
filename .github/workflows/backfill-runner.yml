      - name: Self-relaunch the CPA draft refile until its slot drains
        # CF-RELAUNCH-GATES-ON-THE-BUDGET-MARKER (#1361). The lane's own clock
        # stops it under the runner's ceiling and prints the marker ONLY when
        # the budget actually stopped the loop -- the string is assembled at
        # runtime by CLOCK.stoppedAtBudget(), so it never appears in the source
        # and a finished slot cannot manufacture one and re-dispatch forever.
        #
        # The refile is CONVERGENT: a moved sale now sits on the to-key, so the
        # next run's STARTSWITH(hobbyiqCardId, from-key) no longer returns it
        # and the relaunch resumes rather than repeating. `mode` and `scope`
        # ride along so a sales-only or single-year dispatch continues as the
        # lane it started as.
        if: ${{ !cancelled() && inputs.script == 'repair-cpa-draft-refile' }}
        env:
          GH_TOKEN: ${{ github.token }}
        uses: ./.github/actions/relaunch-on-marker
        with:
          outcome: ${{ steps.backfill.outcome }}
          script: repair-cpa-draft-refile
          preamble: |
            N=$(grep -aoE "^  REFILED to the product the checklist names +[0-9,]+" /tmp/backfill.log | tail -1 | grep -oE "[0-9,]+$" | tr -d , || true)
            echo "refiled=${N:-0}"
          budget-notice: |
            echo "::notice::budget hit (refiled=${N:-0}) — re-dispatching slot ${{ inputs.slot }}/${{ inputs.slots }} to continue"
          finished-notice: |
