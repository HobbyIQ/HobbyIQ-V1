          dispatch: |
            gh workflow run backfill-runner.yml --repo "$GITHUB_REPOSITORY" --ref main -f script=repair-clc-signature-unsigned -f apply="${{ inputs.apply }}" -f concurrency="${{ inputs.concurrency }}" -f slot="${{ inputs.slot }}" -f slots="${{ inputs.slots }}" -f sports="${{ inputs.sports }}" -f years="${{ inputs.years }}" -f scope="${{ inputs.scope }}" -f mode="${{ inputs.mode }}" -f limit="${{ inputs.limit }}" -f parents_only="${{ inputs.parents_only }}"

      - name: Self-relaunch the Bowman product refile until the slot is clean
        # CF-IT-CAME-OUT-OF-BOWMAN. `scope` is the WHOLE safety argument for
        # this lane -- a comma-separated product list as sport:year:setKey, with
        # no 'all' -- so the continuation carries the SAME list, and forwarding
        # it verbatim means the "names its scope" gate RE-VALIDATES the
        # relaunch: a continuation that somehow lost its scope refuses rather
        # than widening.
        #
        # `apply` is forwarded verbatim too (#1578): a report that relaunches as
        # a write is the defect that rule exists to stop, and hardcoding EITHER
        # value is how it happens. `mode` rides along so a sales-only or
        # catalog-only dispatch continues as the lane it started as.
        #
        # The refile is convergent: a moved row's field now AGREES with its
        # stem, so `isStaleGenericField` no longer flags it and the relaunch
        # resumes rather than repeating.
        if: ${{ !cancelled() && inputs.script == 'repair-bowman-product-refile' }}
        env:
          GH_TOKEN: ${{ github.token }}
        uses: ./.github/actions/relaunch-on-marker
        with:
