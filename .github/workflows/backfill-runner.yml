          preamble: |
            N=$(grep -aoE "^  rows scanned \(this slot\) +[0-9,]+" /tmp/backfill.log | tail -1 | grep -oE "[0-9,]+$" | tr -d , || true)
            echo "scanned=${N:-0}"
          budget-notice: |
            echo "::notice::budget hit (scanned=${N:-0}) — re-dispatching slot ${{ inputs.slot }}/${{ inputs.slots }} to continue"
          finished-notice: |
            echo "::notice::slot ${{ inputs.slot }}/${{ inputs.slots }} finished within budget (scanned=${N:-0}) — done, no re-dispatch."
          dispatch: |
            gh workflow run backfill-runner.yml --repo "$GITHUB_REPOSITORY" --ref main -f script=repair-tiffany-rung-to-product -f apply="${{ inputs.apply }}" -f concurrency="${{ inputs.concurrency }}" -f slot="${{ inputs.slot }}" -f slots="${{ inputs.slots }}" -f mode="${{ inputs.mode }}" -f sports="${{ inputs.sports }}" -f years="${{ inputs.years }}" -f scope="${{ inputs.scope }}" -f sources="${{ inputs.sources }}" -f parents_only="${{ inputs.parents_only }}" -f limit="${{ inputs.limit }}"

      - name: Self-relaunch the Tiffany pool enumeration until the slot is clean
        # CF-THE-POOL-IS-ENUMERATED-FROM-THE-POOL (#1752). Same contract as the
        # rung repair above: stops at its own RUN_MINUTES budget, prints the
        # marker, and the relaunch is keyed on the marker alone.
        #
        # MODE (pool | num1951) is REQUIRED with no default, and `parents_only`
        # carries the #1756 shard opt-in for this lane too — both forwarded, or
        # the continuation is a different dispatch from the one that stopped.
        if: ${{ !cancelled() && inputs.script == 'repair-tiffany-pool-enumeration' }}
        env:
          GH_TOKEN: ${{ github.token }}
        uses: ./.github/actions/relaunch-on-marker
        with:
          outcome: ${{ steps.backfill.outcome }}
          script: repair-tiffany-pool-enumeration
          preamble: |
            N=$(grep -aoE "^  rows scanned \(this slot\) +[0-9,]+" /tmp/backfill.log | tail -1 | grep -oE "[0-9,]+$" | tr -d , || true)
            echo "scanned=${N:-0}"
          budget-notice: |
            echo "::notice::budget hit (scanned=${N:-0}) — re-dispatching slot ${{ inputs.slot }}/${{ inputs.slots }} to continue"
          finished-notice: |
            echo "::notice::slot ${{ inputs.slot }}/${{ inputs.slots }} finished within budget (scanned=${N:-0}) — done, no re-dispatch."
          dispatch: |
            gh workflow run backfill-runner.yml --repo "$GITHUB_REPOSITORY" --ref main -f script=repair-tiffany-pool-enumeration -f apply="${{ inputs.apply }}" -f concurrency="${{ inputs.concurrency }}" -f slot="${{ inputs.slot }}" -f slots="${{ inputs.slots }}" -f mode="${{ inputs.mode }}" -f sports="${{ inputs.sports }}" -f years="${{ inputs.years }}" -f scope="${{ inputs.scope }}" -f sources="${{ inputs.sources }}" -f parents_only="${{ inputs.parents_only }}" -f limit="${{ inputs.limit }}"

      - name: Self-relaunch the CH-product-label census until the shard is finished
        # READ ONLY, and `apply` is still forwarded verbatim rather than
        # hardcoded -- the same reasoning census-split-identity carries above.
        # The "Refuse an APPLY dispatch of the read-only CH-product-label
        # lanes" gate runs before Cosmos, so a relaunch carrying apply=true
        # fails there exactly as its parent did, loudly, instead of quietly
        # running as something it was not asked to be. Hardcoding EITHER value
        # is how #1578 happened.
        #
        # The census re-reads its scope from the top each run (read-only: there
        # is no predicate that shrinks as it works), so a shard that cannot fit
        # one budget relaunches without finishing. That is a real limit and the
        # fix is more slots, not a cursor -- the banner prints rows scanned, so
        # a shard that never completes is visible rather than silent.
        #
        # SETKEY/SETKEYS ride `setkey_like` and MIN_ROWS/SUSPECT_PCT are not
        # dispatch inputs, so the scope forwarded here is the whole scope the
        # parent ran with.
        if: ${{ !cancelled() && inputs.script == 'census-ch-product-label-parallel' }}
        env:
          GH_TOKEN: ${{ github.token }}
        uses: ./.github/actions/relaunch-on-marker
        with:
          outcome: ${{ steps.backfill.outcome }}
          script: census-ch-product-label-parallel
          preamble: |
            N=$(grep -aoE "^  rows scanned \(this slot\) +[0-9,]+" /tmp/backfill.log | tail -1 | grep -oE "[0-9,]+$" | tr -d , || true)
            echo "scanned=${N:-0}"
          budget-notice: |
            echo "::notice::budget hit (scanned=${N:-0}) — re-dispatching slot ${{ inputs.slot }}/${{ inputs.slots }} to continue"
          finished-notice: |
            echo "::notice::slot ${{ inputs.slot }}/${{ inputs.slots }} finished within budget (scanned=${N:-0}) — done, no re-dispatch."
          dispatch: |
            gh workflow run backfill-runner.yml --repo "$GITHUB_REPOSITORY" --ref main -f script=census-ch-product-label-parallel -f apply="${{ inputs.apply }}" -f concurrency="${{ inputs.concurrency }}" -f slot="${{ inputs.slot }}" -f slots="${{ inputs.slots }}" -f sports="${{ inputs.sports }}" -f years="${{ inputs.years }}" -f scope="${{ inputs.scope }}" -f setkey_like="${{ inputs.setkey_like }}" -f limit="${{ inputs.limit }}"

      - name: Self-relaunch the CH-product-label repair until the slot is clean
        # `scope` is the WHOLE safety argument for this lane -- a comma-
        # separated list of CardHedge product ids, with no 'all' -- so the
        # continuation carries the SAME list. Forwarding it verbatim also means
        # the "The CH-product-label repair names its scope" gate re-validates
        # the relaunch: a continuation that somehow lost its scope refuses
        # rather than widening.
        if: ${{ !cancelled() && inputs.script == 'repair-ch-product-label-parallel' }}
        env:
          GH_TOKEN: ${{ github.token }}
        uses: ./.github/actions/relaunch-on-marker
        with:
          outcome: ${{ steps.backfill.outcome }}
          script: repair-ch-product-label-parallel
          preamble: |
            N=$(grep -aoE "^  REKEYED onto the base pool +[0-9,]+" /tmp/backfill.log | tail -1 | grep -oE "[0-9,]+$" | tr -d , || true)
            echo "rekeyed=${N:-0}"
          budget-notice: |
            echo "::notice::budget hit (rekeyed=${N:-0}) — re-dispatching slot ${{ inputs.slot }}/${{ inputs.slots }} to continue"
          finished-notice: |
            echo "::notice::slot ${{ inputs.slot }}/${{ inputs.slots }} finished within budget (rekeyed=${N:-0}) — done, no re-dispatch."
          dispatch: |
            gh workflow run backfill-runner.yml --repo "$GITHUB_REPOSITORY" --ref main -f script=repair-ch-product-label-parallel -f apply="${{ inputs.apply }}" -f concurrency="${{ inputs.concurrency }}" -f slot="${{ inputs.slot }}" -f slots="${{ inputs.slots }}" -f sports="${{ inputs.sports }}" -f years="${{ inputs.years }}" -f scope="${{ inputs.scope }}" -f limit="${{ inputs.limit }}"

      - name: Self-relaunch the ruled-alias re-key until the slot is clean
        # CF-AN-ALIAS-IS-NOT-A-SECOND-POOL (#1783/#1786). `scope` names the
        # RULED KEY and the script refuses the inherited "refractor" and any
        # unruled key before it builds a Cosmos client -- so forwarding it
        # verbatim is what keeps the continuation the same dispatch, and a
        # continuation that lost it refuses rather than sweeping.
        #
        # The re-key is convergent: a row already on the ruled key derives
        # AGREE and is skipped, so a relaunch resumes rather than repeating.
        if: ${{ !cancelled() && inputs.script == 'reslug-ruled-alias' }}
        env:
          GH_TOKEN: ${{ github.token }}
