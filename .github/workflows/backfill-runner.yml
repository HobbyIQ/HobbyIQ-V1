        # is deliberately NOT marked, so it is re-done whole.
        #
        # #1598 remaps: this script's DIR rides `inputs.scope` and its SOURCE
        # rides `inputs.sources`, so those are the input names forwarded here —
        # forwarding `dir`/`source_label` would forward nothing, and without
        # SOURCE the script cannot decide authority.
        #
        # CF-RELAUNCH-ONLY-ON-BUDGET (#1361): the marker is the gate, never the
        # count — `written` legitimately reaches 0 on a cycle whose files were
        # all already ingested. CF-REPORT-RELAUNCHES-AS-A-REPORT (#1578): the
        # gate is mode-blind and `apply` is forwarded verbatim, so a report
        # longer than one budget finishes as a report.
        if: ${{ !cancelled() && inputs.script == 'ingest-checklist-csv-to-catalog' }}
        env:
          GH_TOKEN: ${{ github.token }}
        uses: ./.github/actions/relaunch-on-marker
        with:
          outcome: ${{ steps.backfill.outcome }}
          script: ingest-checklist-csv-to-catalog
          preamble: |
            N=$(grep -aoE "^  catalog rows written +[0-9,]+" /tmp/backfill.log | tail -1 | grep -oE "[0-9,]+$" | tr -d , || true)
            echo "written=${N:-0}"
          budget-notice: |
            echo "::notice::budget hit (written=${N:-0}) — re-dispatching slot ${{ inputs.slot }}/${{ inputs.slots }} to continue"
          finished-notice: |
            echo "::notice::slot ${{ inputs.slot }}/${{ inputs.slots }} finished within budget (written=${N:-0}) — done, no re-dispatch."
          dispatch: |
            gh workflow run backfill-runner.yml --repo "$GITHUB_REPOSITORY" --ref main -f script=ingest-checklist-csv-to-catalog -f apply="${{ inputs.apply }}" -f concurrency="${{ inputs.concurrency }}" -f slot="${{ inputs.slot }}" -f slots="${{ inputs.slots }}" -f scope="${{ inputs.scope }}" -f sources="${{ inputs.sources }}" -f limit="${{ inputs.limit }}"

      - name: Self-relaunch the truncated-year repair until the slot is clean
        # D41 (2026-08-31). Convergent, so the relaunch is the same dispatch:
        # the query selects `cardYear >= 100 AND cardYear <= 999 AND source =
        # @src`, and a repaired row's cardYear becomes a real four-digit year,
        # so it leaves the population. A relaunch that finds nothing left reads
        # no marker and stops.
        #
        # SOURCE is REQUIRED (CF-A-WHOLE-SOURCE-RETIRE-NEEDS-ITS-NAME — the
        # script exits 1 without it rather than deriving its own scope) and per
        # #1598 it rides `inputs.sources`, so that input travels with the
        # relaunch or every continuation would refuse to start.
        if: ${{ !cancelled() && inputs.script == 'repair-truncated-card-year' }}
        env:
          GH_TOKEN: ${{ github.token }}
        uses: ./.github/actions/relaunch-on-marker
        with:
          outcome: ${{ steps.backfill.outcome }}
          script: repair-truncated-card-year
          preamble: |
            N=$(grep -aoE "^  (REPAIRED|WOULD REPAIR) +[0-9,]+" /tmp/backfill.log | tail -1 | grep -oE "[0-9,]+$" | tr -d , || true)
            echo "repaired=${N:-0}"
          budget-notice: |
            echo "::notice::budget hit (repaired=${N:-0}) — re-dispatching slot ${{ inputs.slot }}/${{ inputs.slots }} to continue"
          finished-notice: |
            echo "::notice::slot ${{ inputs.slot }}/${{ inputs.slots }} finished within budget (repaired=${N:-0}) — done, no re-dispatch."
          dispatch: |
            gh workflow run backfill-runner.yml --repo "$GITHUB_REPOSITORY" --ref main -f script=repair-truncated-card-year -f apply="${{ inputs.apply }}" -f concurrency="${{ inputs.concurrency }}" -f slot="${{ inputs.slot }}" -f slots="${{ inputs.slots }}" -f sources="${{ inputs.sources }}" -f limit="${{ inputs.limit }}"

      - name: Self-relaunch the sub-brand mis-slug repair until the slot is clean
        # D41 (2026-08-31). Convergent: the query selects `setKey = @sk AND
        # sport = @sp AND cardYear = @y`, and a moved row is re-keyed OUT of
        # @sk onto its own sub-brand, so it leaves the population. The marker
        # is the gate — `MOVED` reaches 0 on a slot whose remaining rows name
        # no whitelisted sub-brand, and a count gate would loop on those
        # forever.
        #
        # The whole scope is required (SPORT + YEAR + SETKEY; the script exits
        # 1 if any is empty), so every scope input travels verbatim: SPORT
        # rides `inputs.sports` and SETKEY rides `inputs.setkey_like` per the
        # #1598 remap, and `years` carries the year scope.
        if: ${{ !cancelled() && inputs.script == 'repair-select-subbrand-misslug' }}
        env:
          GH_TOKEN: ${{ github.token }}
        uses: ./.github/actions/relaunch-on-marker
        with:
          outcome: ${{ steps.backfill.outcome }}
          script: repair-select-subbrand-misslug
          preamble: |
            N=$(grep -aoE "^  (MOVED|WOULD MOVE) +[0-9,]+" /tmp/backfill.log | tail -1 | grep -oE "[0-9,]+$" | tr -d , || true)
            echo "moved=${N:-0}"
          budget-notice: |
            echo "::notice::budget hit (moved=${N:-0}) — re-dispatching slot ${{ inputs.slot }}/${{ inputs.slots }} to continue"
          finished-notice: |
            echo "::notice::slot ${{ inputs.slot }}/${{ inputs.slots }} finished within budget (moved=${N:-0}) — done, no re-dispatch."
          dispatch: |
            gh workflow run backfill-runner.yml --repo "$GITHUB_REPOSITORY" --ref main -f script=repair-select-subbrand-misslug -f apply="${{ inputs.apply }}" -f concurrency="${{ inputs.concurrency }}" -f slot="${{ inputs.slot }}" -f slots="${{ inputs.slots }}" -f sports="${{ inputs.sports }}" -f years="${{ inputs.years }}" -f setkey_like="${{ inputs.setkey_like }}" -f limit="${{ inputs.limit }}"

      - name: Self-relaunch the self-derived retire/label lane until the slot is clean
        # CF-RELAUNCH-ONLY-ON-BUDGET (#1361). The gate is the MARKER and
        # nothing else: the lane stops at its clock budget with products still
        # unscanned and says so in those words. Gating on "did it mark
        # anything" would loop forever once a slot is down to rows already
        # marked -- the pass is idempotent, so a finished slot legitimately
        # writes zero.
        #
        # `parents_only` is forwarded because it carries this lane's
        # CF-AN-INHERITED-SLOTS-IS-NOT-A-CHOSEN-SHARD opt-in (see the SHARD
        # export above). A slot-0 continuation that dropped it would rebind as
        # an inherited default and silently widen from one sixteenth to the
        # WHOLE sport mid-fleet -- the same trap the repair-tiffany-* relaunch
        # steps forward it to avoid. Slots 1..15 do not need it (a non-zero
        # slot is self-evidently chosen) but forwarding it is harmless there.
        if: ${{ !cancelled() && inputs.script == 'retire-self-derived-identities' }}
        env:
          GH_TOKEN: ${{ github.token }}
        uses: ./.github/actions/relaunch-on-marker
        with:
          outcome: ${{ steps.backfill.outcome }}
          script: retire-self-derived-identities
          preamble: |
            R=$(grep -aoE "^  retired \(twin\) +[0-9,]+" /tmp/backfill.log | tail -1 | grep -oE "[0-9,]+$" | tr -d , || true)
            U=$(grep -aoE "^  identityUnverified +[0-9,]+" /tmp/backfill.log | tail -1 | grep -oE "[0-9,]+$" | tr -d , || true)
            echo "self_derived_retired=${R:-0} identity_unverified=${U:-0}"
            if grep -aq "DOES NOT BALANCE" /tmp/backfill.log; then
              echo "::error::reconciliation did not balance — not re-dispatching"
              exit 1
            fi
          budget-notice: |
            echo "::notice::budget hit (retired=${R:-0} unverified=${U:-0}) — re-dispatching slot ${{ inputs.slot }}/${{ inputs.slots }} to continue"
          finished-notice: |
            echo "::notice::slot ${{ inputs.slot }}/${{ inputs.slots }} finished within budget (retired=${R:-0} unverified=${U:-0}) — done, no re-dispatch."
          dispatch: |
            gh workflow run backfill-runner.yml --repo "$GITHUB_REPOSITORY" --ref main -f script=retire-self-derived-identities -f apply="${{ inputs.apply }}" -f concurrency="${{ inputs.concurrency }}" -f slot="${{ inputs.slot }}" -f slots="${{ inputs.slots }}" -f sports="${{ inputs.sports }}" -f years="${{ inputs.years }}" -f parents_only="${{ inputs.parents_only }}"

      - name: Self-relaunch the checklist-backing annotation until the slot is clean
        # Terminates on its OWN resume predicate rather than on a count that
        # happens to be zero. The script only takes rows with no
        # checklistBacking yet, so "scanned 0" means the slot is finished --
        # whereas relaunching on "annotated > 0" would loop forever once the
        # budget stop sent the next run back to the first product.
        if: ${{ !cancelled() && inputs.script == 'annotate-checklist-backing' }}
        env:
          GH_TOKEN: ${{ github.token }}
        uses: ./.github/actions/relaunch-on-marker
        with:
          outcome: ${{ steps.backfill.outcome }}
