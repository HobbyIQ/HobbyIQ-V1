name: Backfill Runner (sold_comps re-slug / verify_queue batch)

# CF-BACKFILL-RUNNER (Drew, 2026-07-29). Server-side runner for any
# `backend/scripts/reslug-*.cjs` or `backend/scripts/approve-*.cjs`
# backfill so we can execute long-running data cleanup jobs without
# tying up a laptop. Cosmos connection string is fetched from
# HobbyIQ3 App Service at run time (same pattern as
# auto-multiplier-refresh.yml).
#
# Whitelisted scripts only — the input is a dropdown, not free-form —
# so this workflow can't be turned into a general "run arbitrary code"
# vector.
#
# Modes:
#   dry-run (default): scan + report distribution + sample; NO writes
#   apply:             actually mutate sold_comps / verify_queue
#
# Always run the dry-run first; review the distribution + samples in
# the workflow log; then re-dispatch with apply=true if it looks right.

on:
  workflow_dispatch:
    inputs:
      script:
        description: "Backfill script to run"
        required: true
        type: choice
        options:
          - reslug-speckle-recovery
          - reslug-chrome-prospects-and-wave
          - reslug-player-sport-fix
          - reslug-brand-root-refinement
          - reslug-cross-brand-fix
          - reslug-heritage-vs-topps-chrome
          - reslug-bowman-paper-vs-bowman
          - reslug-fleer-stickers
          - reslug-recover-cardnumbers
          - reslug-chrome-draft-collision
          - reslug-cross-product-mis-slug
          - audit-setkey-distribution
          - audit-grade-coverage
          - reslug-suspicious-setkeys
          - backfill-grade-from-ch-daily
          - bulk-import-ch-daily-to-sold-comps
          - audit-bulk-import-accuracy
          - quick-check-grade-passthrough
          - approve-topps-finest-2026
          - backfill-verify-queue-grades
          - prototype-slab-ocr
          - slab-ocr-auto-approve-queue
          - discover-auto-cardnumber-prefixes
          - backfill-isauto-from-cardnumber
          - backfill-isauto-cross-sport
          - backfill-printrun-from-title
          - backfill-autostyle-from-title
          - backfill-parallel-enrichment
          - backfill-insert-setkey
          - backfill-composite-fields
          - backfill-composite-v3
          - audit-ladder-violations
          - audit-source-coverage
          - prototype-neighbor-lookup
          - market-analysis-composite
          - refresh-market-signals
          - refresh-calibration-multipliers
          - ingest-product-checklist
          - ingest-2026-bowman-auto-checklist
          - reprice-user-holdings
          - backfill-cardsight-title-identity
          - backfill-canonicalize-chrome-slugs
          - backfill-catalog-driven-canonicalize
          - backfill-stage2-title-parser
          - backfill-stage3-price-sanity
          # CF-CS-KILL-SWITCH (Drew, 2026-08-02). CS API calls halted.
          # Any script that hits Cardsight is removed from the whitelist
          # so no dispatch can call CS. See:
          #   - backfill-catalog-cs-images (image probe)
          #   - backfill-cs-card-population (pop probe)
          #   - reaudit-cardsight-unverified (reads sold_comps only, no CS API — kept)
          - promote-sold-comps-trust-tier
          - baseline-pool-snapshot
          - backfill-cardsight-unverified-flag
          - migrate-cardsight-to-staging
          - backfill-grade-from-title
          - backfill-bowman-mega-box-reslug
          - backfill-sub-channel-vocabulary
          - auto-quarantine-contaminated-pools
          # CS-touching scripts removed from whitelist (CF-CS-KILL-SWITCH):
          #   - backfill-catalog-cs-images
          #   - backfill-cs-card-population
          - normalize-catalog-schema
          - dedupe-catalog-by-hobbyiq
          - discover-parallels-from-pool
          - audit-ch-ingest-completeness
          - nightly-reingest-top-ch-cards
          - backfill-ch-catalog-additions
          - drain-staging-backlog
          - backfill-searchtokens-all-sports
          - fix-catalog-parallel-as-player
          - auto-label-catalog-variants
          - rescore-anomalies
          - score-all-sold-comps
          - reaudit-cardsight-unverified
          - recover-chrome-collapse-damage
          - normalize-catalog-format
          - retire-flattened-attestations
          - repair-refractor-mislabel
          - merge-bare-colour-parallels
          - dedupe-catalog-partition-shadows
          - rehome-catalog-rows-to-own-partition
          - reslug-tcg-out-of-sports-namespace
          - retire-unreferenced-graded-rows
          - retire-impossible-grade-rows
          - materialize-graded-identities
          - canonicalize-vendor-shaped-rows
          - repair-parallel-subset-fold
          - ingest-checklists-end-to-end
          - reslugAllSoldComps
          - annotate-checklist-backing
          - retire-prose-parallel-rows
          - retire-numbered-base-rows
          - conform-card-profile
          - backfill-playerslug
          - emit-staging-to-pool
          - retire-autoseed-window
          - clean-parallel-annotations
          - retire-exploded-checklist-rows
          - purge-unaddressable-catalog-rows

          - repair-parallel-from-title


          - fold-unnumbered-twins
          - fold-checklist-numbered-twins
          - apply-cpa-product-rule
          - consolidate-catalog-duplicates
          - revert-d30-base-onto-one-of-one

          - rekey-user-comps
          - collapse-ch-dual-ids

          - audit-all-holdings
          - rename-setkey
          - parse-player-from-checklist
          - identity-triangulation
          - backfill-holding-ebay-ids
          - map-derived-parallels-to-rungs
          - repair-pokemon-glued-numbers
          - map-pokemon-setkeys-to-checklist
          - map-yearprefixed-setkeys
          - apply-setkey-rulings
          - conform-holdings-to-catalog
          # D14 read-only probes (apply is irrelevant; they never write).
          - audit-pool-identity
          - probe-price-routes
          # D15 (2026-08-29): three catalog repairs on catalogRowOps.
          - repair-trailing-comma-player-names
          - repair-isauto-from-cardnumber-catalog
          - conform-one-of-one-parallels
          # D23 (2026-08-30): the id carries the product -- the rename fleet
          # (MODE=product | hyphen | holdings | estimate; SCOPE, SOURCES).
          - rename-setkey-to-product
          # D28 (2026-08-30): a card number is never a grade, a print run, a
          # year, an ordinal or a lot. The measure is READ ONLY and has no
          # write path at all -- `apply` is irrelevant to it.
          - measure-card-number-integrity
          - repair-card-number-from-title
          - clean-base-cards-parallel-slug
          # D26 (2026-08-30): replay the connected eBay accounts' last 90 days
          # through the resolve/record/mark path. Needs the eBay app
          # credentials (fetched below) as well as Cosmos, because it refreshes
          # each user's token to call getOrders. REPORT ONLY unless apply=true;
          # shards by connected user; leaves lastPolledAt to the hourly poll.
          - backfill-ebay-account-sales
          - run-ebay-order-poll
          - run-ebay-finances-enrichment
          - run-ebay-purchase-sync
          # D33 (2026-08-30): the five stored-row repairs behind Drew's "still
          # a mess" on 2020 Bowman Draft BD-152. MODE is REQUIRED and has no
          # default -- card-as-parallel | chrome-ladder | first-edition |
          # names | number-glued. Sharded by sha1(id); SCOPE narrows to setKeys.
          - repair-bcp-misfiled-parallels
      apply:
        description: "Actually write (true) or dry-run only (false)"
        required: true
        type: boolean
        default: false
      concurrency:
        description: "Parallel patch workers (leave default unless tuning)"
        required: false
        default: "16"
      bulk_start_date:
        description: "For bulk-import-ch-daily-to-sold-comps: start walking backward from this date (YYYY-MM-DD). Empty = today. Used by self-relaunch to resume from where the previous run stopped."
        required: false
        default: ""
      bulk_end_date:
        description: "For bulk-import-ch-daily-to-sold-comps: stop at this date (YYYY-MM-DD). Default 2018-01-01."
        required: false
        default: ""
      card_numbers:
        description: "For backfill-cardsight-title-identity: comma-separated cardNumbers to scope the scan (e.g. CPA-EHA,CPA-JHA). Empty = scan all."
        required: false
        default: ""
      slot:
        description: "Which partition this run owns (0..slots-1). Dispatch once per slot. Used by normalize-catalog-format and rehome-catalog-rows-to-own-partition."
        required: false
        default: "0"
      slots:
        description: "Total partitions. normalize splits by year; rehome splits a YEAR by setKey letter range, so SLOTS=4 with the same YEARS runs one year four ways."
        required: false
        default: "16"
      scope:
        description: "For repair-refractor-mislabel: 'refractor' (plain segment only) or 'all' (every parallel pool). For rename-setkey-to-product MODE=product: comma-separated ruled product keys (e.g. topps-series-1,leaf-metal); the default here or 'all' = every ruled product."
        required: false
        default: "refractor"
        type: string
      setkey_like:
        description: "Substring the setKey must contain (e.g. bowman). EMPTY = every setKey. Read by dedupe-catalog-partition-shadows and rehome-catalog-rows-to-own-partition."
        required: false
        default: ""
        type: string
      phases:
        description: "For ingest-checklists-end-to-end: which phases to run (beckett,insider,bcp,tcgdexja). Empty = all."
        required: false
        default: ""
        type: string
      titles:
        description: "For ingest-checklists-end-to-end (bcp phase): extra baseballcardpedia page titles, comma-separated (e.g. 2012_Topps_Allen_and_Ginter,1990_Donruss). Empty = the per-year flagship list."
        required: false
        default: ""
        type: string
      sources:
        description: "Comma-separated catalog sources (SOURCES env) -- REQUIRED for retire-exploded-checklist-rows mode=source, for audit-source-coverage (the OLD sources; `scope` is the replacement source), and for rename-setkey-to-product mode=hyphen (the sources whose hyphen-free card numbers fold onto the checklist's spelling, e.g. bccp)"
        required: false
        type: string
        default: ""
      min_coverage_pct:
        description: "For retire-exploded-checklist-rows mode=source and audit-source-coverage: a product is retired only when the replacement source covers at least this % of its (cardNumber, parallel, printRun) keys; below it the product is KEPT."
        required: false
        type: string
        default: "95"
      years:
        description: "Optional comma-separated years to scope a run (e.g. 1950,1955). Empty = all years."
        required: false
        default: ""
      limit:
        description: "For rehome-catalog-rows-to-own-partition: stop after N rows are moved. 0 = no limit. Use a small number to prove a slice before running it wide."
        required: false
        default: "0"
        type: string
      scan_limit:
        description: "For rehome-catalog-rows-to-own-partition: stop SCANNING after N rows. Lets a dry-run size a slice without walking all of it. 0 = no limit."
        required: false
        default: "0"
        type: string
      sports:
        description: "For reslug-tcg-out-of-sports-namespace: which non-sport categories to sweep (comma-separated). Empty = all of them."
        required: false
        default: ""
        type: string
      parents_only:
        description: "For rehome-catalog-rows-to-own-partition: only move identity rows, skipping graded rows (which are regenerable from their parent)."
        required: false
        default: false
        type: boolean
      mode:
        description: "For canonicalize-vendor-shaped-rows: 'vendor' (id is not a hiq slug) or 'nopk' (cardId missing entirely). For repair-parallel-subset-fold: 'prefix' or 'glue'. For rename-setkey-to-product: 'product' (the catalog rename, sharded), 'hyphen' (needs sources), 'holdings' (slot 0), 'estimate' (read-only counts). For repair-card-number-from-title (D28): 'grade' | 'slash' | 'ordinal' | 'year' | 'nonumber' | 'all' (needs scope=all) -- REQUIRED, no default. For clean-base-cards-parallel-slug: 'cards' | 'subset' | 'both' (needs scope=all) -- REQUIRED. For measure-card-number-integrity: 'grade' | 'shapes' | 'months' | 'catalog-year'. For repair-bcp-misfiled-parallels (D33): 'card-as-parallel' (retire the rows whose parallel is another card) | 'chrome-ladder' (move the refractor ladder from the paper number to the chrome one) | 'first-edition' (move 1st Edition rows to their own product) | 'names' (the comma before Jr./Sr./II) | 'number-glued' (black-1 -> black:num-1) -- REQUIRED, no default. Empty = the script's default."
        required: false
        default: ""
      shard_hex:
        description: "For reslugAllSoldComps: contentHash first-char shards, e.g. 0,1,2,3. 16 shards total; run disjoint sets in parallel. Empty = all."
        required: false
        default: ""
        type: string
      max_rows:
        description: "For reslugAllSoldComps: cap rows scanned (0 = no cap)."
        required: false
        default: "0"
        type: string
      retire_no_partition_key:
        description: "For dedupe-catalog-partition-shadows: also retire duplicate rows that carry NO partition key. They ARE addressable; off by default because it is a delete."
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write   # Azure OIDC for App Service secret fetch
  actions: write    # workflow_dispatch to self-relaunch composite backfill

jobs:
  run-backfill:
    runs-on: ubuntu-latest
    # 180 min ceiling — leaves 60+ min headroom on GH Actions' 6h max so
    # the self-relaunch check (composite backfill only) always has room
    # to run after the actual backfill step's own 150-min timeout.
    timeout-minutes: 180

    steps:
      - name: Checkout repo at dispatched ref
        # workflow_dispatch checks out the branch chosen in the UI, so
        # Drew can run scripts that live on a feature branch before merge.
        uses: actions/checkout@v5

      - name: Setup Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Install backend deps
        working-directory: backend
        run: npm ci

      - name: Build backend dist
        # Backfill scripts require compiled JS from backend/dist. Build
        # here so the checked-out branch's parser code is what runs.
        working-directory: backend
        run: npm run build

      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_1259D9D213E34AE29B2DD54B3E755C4D }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_5AB8B3DC612348FD9D37DBE28FF40802 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_A45CF8552AE94AF68A046FB846E21206 }}

      - name: Fetch COSMOS_CONNECTION_STRING from HobbyIQ3 App Service
        shell: bash
        run: |
          CS=$(az webapp config appsettings list \
            --name HobbyIQ3 \
            --resource-group rg-hobbyiq-dev \
            --query "[?name=='COSMOS_CONNECTION_STRING'].value | [0]" \
            -o tsv)
          if [ -z "$CS" ]; then
            echo "::error::FAILED to fetch COSMOS_CONNECTION_STRING from App Service"
            exit 1
          fi
          echo "::add-mask::$CS"
          echo "COSMOS_CONNECTION_STRING=$CS" >> "$GITHUB_ENV"
          echo "COSMOS_CONNECTION_STRING fetched (length: ${#CS})"

      # AUTH_SESSION_SECRET — required by reprice-user-holdings because
      # the script imports the portfolioStore.service.js which pulls in
      # the app's env validation module. Fetch from App Service so the
      # secret matches prod exactly (never echoed to stdout).
      # CF-REPRICE-AUTH-ENV (Drew, 2026-07-31). Prior run failed at boot
      # with "AUTH_SESSION_SECRET is unset — refusing to start."
      # CF-AUTO-LABEL-AZURE-OPENAI (Drew, 2026-08-02). auto-label-
      # catalog-variants uses labelerAiSuggest which needs Azure OpenAI.
      - name: Fetch Azure OpenAI credentials from HobbyIQ3 App Service
        if: inputs.script == 'auto-label-catalog-variants'
        shell: bash
        run: |
          for name in AZURE_OPENAI_ENDPOINT AZURE_OPENAI_API_KEY AZURE_OPENAI_DEPLOYMENT AZURE_OPENAI_API_VERSION; do
            v=$(az webapp config appsettings list --name HobbyIQ3 --resource-group rg-hobbyiq-dev \
              --query "[?name=='$name'].value | [0]" -o tsv)
            if [ -z "$v" ]; then
              echo "::warning::${name} not set in HobbyIQ3 App Service"
              continue
            fi
            echo "::add-mask::$v"
            echo "${name}=$v" >> "$GITHUB_ENV"
            echo "${name} fetched (length: ${#v})"
          done

      # CF-DRAIN-ADMIN-TOKEN (Drew, 2026-08-01). drain-staging-backlog
      # calls /api/staging/* admin endpoints; needs ADMIN_API_TOKEN.
      - name: Fetch ADMIN_API_TOKEN from HobbyIQ3 App Service
        if: inputs.script == 'drain-staging-backlog'
        shell: bash
        run: |
          TOK=$(az webapp config appsettings list \
            --name HobbyIQ3 \
            --resource-group rg-hobbyiq-dev \
            --query "[?name=='ADMIN_API_TOKEN'].value | [0]" \
            -o tsv)
          if [ -z "$TOK" ]; then
            echo "::error::FAILED to fetch ADMIN_API_TOKEN from App Service"
            exit 1
          fi
          echo "::add-mask::$TOK"
          echo "ADMIN_API_TOKEN=$TOK" >> "$GITHUB_ENV"
          echo "ADMIN_API_TOKEN fetched (length: ${#TOK})"

      # D14 (2026-08-29). probe-price-routes replays slugs through the live
      # pricing routes; requireSession admits the harness token as a
      # synthetic pro_seller user. Fetched from App Service the way
      # AUTH_SESSION_SECRET is, scoped to this one script, never echoed.
      - name: Fetch TIER1_HARNESS_TOKEN from HobbyIQ3 App Service
        if: inputs.script == 'probe-price-routes'
        shell: bash
        run: |
          TOK=$(az webapp config appsettings list             --name HobbyIQ3             --resource-group rg-hobbyiq-dev             --query "[?name=='TIER1_HARNESS_TOKEN'].value | [0]"             -o tsv)
          if [ -z "$TOK" ]; then
            echo "::error::FAILED to fetch TIER1_HARNESS_TOKEN from App Service"
            exit 1
          fi
          echo "::add-mask::$TOK"
          echo "TIER1_HARNESS_TOKEN=$TOK" >> "$GITHUB_ENV"
          echo "TIER1_HARNESS_TOKEN fetched (length: ${#TOK})"

      - name: Fetch AUTH_SESSION_SECRET from HobbyIQ3 App Service
        if: inputs.script == 'reprice-user-holdings'
        shell: bash
        run: |
          SEC=$(az webapp config appsettings list \
            --name HobbyIQ3 \
            --resource-group rg-hobbyiq-dev \
            --query "[?name=='AUTH_SESSION_SECRET'].value | [0]" \
            -o tsv)
          if [ -z "$SEC" ]; then
            echo "::error::FAILED to fetch AUTH_SESSION_SECRET from App Service"
            exit 1
          fi
          echo "::add-mask::$SEC"
          echo "AUTH_SESSION_SECRET=$SEC" >> "$GITHUB_ENV"
          echo "AUTH_SESSION_SECRET fetched (length: ${#SEC})"

      # D26 (2026-08-30). backfill-ebay-account-sales refreshes each connected
      # user's OAuth token to call /sell/fulfillment/v1/order, so it needs the
      # eBay APP credentials -- the same ones HobbyIQ3 runs with. Fetched from
      # App Service, masked, never echoed. EBAY_ENV must come across too: it
      # defaults to "sandbox" in code, and a sandbox run would fetch zero
      # orders and report a perfectly green nothing.
      - name: Fetch eBay app credentials from HobbyIQ3 App Service
        if: inputs.script == 'backfill-ebay-account-sales' || inputs.script == 'run-ebay-order-poll' || inputs.script == 'run-ebay-finances-enrichment' || inputs.script == 'run-ebay-purchase-sync'
        shell: bash
        run: |
          # AUTH_SESSION_SECRET is in this list because ebayAuth.service THROWS
          # AT MODULE LOAD without it ("cannot sign OAuth state"). The backfill
          # never signs an OAuth state -- it only refreshes tokens -- but the
          # import kills the process before it can say so. Found by running the
          # script's harness locally against a user that does not exist.
          for NAME in EBAY_CLIENT_ID EBAY_CLIENT_SECRET EBAY_ENV EBAY_REDIRECT_URI AUTH_SESSION_SECRET; do
            V=$(az webapp config appsettings list \
              --name HobbyIQ3 \
              --resource-group rg-hobbyiq-dev \
              --query "[?name=='$NAME'].value | [0]" \
              -o tsv)
            if [ -z "$V" ] || [ "$V" = "None" ]; then
              if [ "$NAME" = "EBAY_REDIRECT_URI" ]; then
                echo "::warning::$NAME absent; the backfill never runs the OAuth redirect so this is fine"
                continue
              fi
              echo "::error::FAILED to fetch $NAME from App Service"
              exit 1
            fi
            echo "::add-mask::$V"
            echo "$NAME=$V" >> "$GITHUB_ENV"
            echo "$NAME fetched (length: ${#V})"
          done
          # A production run must say so out loud: EBAY_ENV defaults to sandbox
          # in code, and sandbox returns no real orders.
          if [ "${EBAY_ENV:-}" != "production" ]; then
            echo "::notice::EBAY_ENV is not 'production' in this shell; the value written to GITHUB_ENV is what the script reads."
          fi

      # CF-CS-KEY-FOR-CATALOG-EXPANSION (Drew, 2026-08-01). Cardsight
      # image backfill + population probe need CARDSIGHT_API_KEY.
      - name: Fetch CARDSIGHT_API_KEY from HobbyIQ3 App Service
        if: inputs.script == 'backfill-catalog-cs-images' || inputs.script == 'backfill-cs-card-population'
        shell: bash
        run: |
          CS_KEY=$(az webapp config appsettings list \
            --name HobbyIQ3 \
            --resource-group rg-hobbyiq-dev \
            --query "[?name=='CARDSIGHT_API_KEY'].value | [0]" \
            -o tsv)
          if [ -z "$CS_KEY" ]; then
            echo "::error::FAILED to fetch CARDSIGHT_API_KEY from App Service"
            exit 1
          fi
          echo "::add-mask::$CS_KEY"
          echo "CARDSIGHT_API_KEY=$CS_KEY" >> "$GITHUB_ENV"
          echo "CARDSIGHT_API_KEY fetched (length: ${#CS_KEY})"

      # CF-CH-KEY-FOR-CATALOG-EXPANSION (Drew, 2026-08-01). The catalog
      # expansion scripts hit CH's search API for every (year, product)
      # tuple. Fetch CARD_HEDGE_API_KEY from App Service so the runner
      # has authenticated access; never echoed to log.
      - name: Fetch CARD_HEDGE_API_KEY from HobbyIQ3 App Service
        if: startsWith(inputs.script, 'expand-catalog') || inputs.script == 'audit-ch-ingest-completeness' || inputs.script == 'nightly-reingest-top-ch-cards' || inputs.script == 'backfill-ch-catalog-additions'
        shell: bash
        run: |
          CH_KEY=$(az webapp config appsettings list \
            --name HobbyIQ3 \
            --resource-group rg-hobbyiq-dev \
            --query "[?name=='CARD_HEDGE_API_KEY'].value | [0]" \
            -o tsv)
          if [ -z "$CH_KEY" ]; then
            echo "::error::FAILED to fetch CARD_HEDGE_API_KEY from App Service"
            exit 1
          fi
          echo "::add-mask::$CH_KEY"
          echo "CARD_HEDGE_API_KEY=$CH_KEY" >> "$GITHUB_ENV"
          echo "CARD_HEDGE_API_KEY fetched (length: ${#CH_KEY})"

      # Azure OpenAI env — only required by the slab-OCR prototype
      # script; always fetch (cheap read-only) so any future backfill
      # that needs LLM calls can rely on them being present.
      - name: Fetch Azure OpenAI env from HobbyIQ3 App Service
        if: startsWith(inputs.script, 'prototype-slab') || startsWith(inputs.script, 'slab-ocr')
        shell: bash
        run: |
          fetch_setting() {
            az webapp config appsettings list \
              --name HobbyIQ3 \
              --resource-group rg-hobbyiq-dev \
              --query "[?name=='$1'].value | [0]" \
              -o tsv
          }
          ENDPOINT=$(fetch_setting AZURE_OPENAI_ENDPOINT)
          KEY=$(fetch_setting AZURE_OPENAI_API_KEY)
          [ -z "$KEY" ] && KEY=$(fetch_setting AZURE_OPENAI_KEY)
          DEPLOY=$(fetch_setting AZURE_OPENAI_DEPLOYMENT)
          API_VERSION=$(fetch_setting AZURE_OPENAI_API_VERSION)
          if [ -z "$ENDPOINT" ] || [ -z "$KEY" ] || [ -z "$DEPLOY" ]; then
            echo "::error::Azure OpenAI env missing (endpoint / key / deployment)"
            exit 1
          fi
          echo "::add-mask::$KEY"
          echo "AZURE_OPENAI_ENDPOINT=$ENDPOINT" >> "$GITHUB_ENV"
          echo "AZURE_OPENAI_API_KEY=$KEY" >> "$GITHUB_ENV"
          echo "AZURE_OPENAI_DEPLOYMENT=$DEPLOY" >> "$GITHUB_ENV"
          [ -n "$API_VERSION" ] && echo "AZURE_OPENAI_API_VERSION=$API_VERSION" >> "$GITHUB_ENV"
          echo "Azure OpenAI env fetched (deployment: $DEPLOY)"

      - name: Verify script exists
        # Guardrail: whitelisted input, but confirm file is present in
        # the checked-out branch (a script added in a PR branch that
        # never landed on the dispatch ref would silently fail otherwise).
        run: |
          SCRIPT="backend/scripts/${{ inputs.script }}.cjs"
          if [ ! -f "$SCRIPT" ]; then
            echo "::error::Script $SCRIPT not present on branch ${GITHUB_REF#refs/heads/}"
            exit 1
          fi
          echo "Script confirmed: $SCRIPT"

          # The wrapper SHELLS OUT, so its own presence proves nothing about
          # the scripts it calls. ingest-checklists-end-to-end passed this
          # check, scraped 349 products, then died on a child that had never
          # been committed. Check the children too.
          if [ "${{ inputs.script }}" = "ingest-checklists-end-to-end" ]; then
            for CHILD in scrape-beckett-checklists scrape-checklistinsider \
                         convertChecklistInsiderToChecklistCsv \
                         ingest-checklist-csv-to-catalog; do
              if [ ! -f "backend/scripts/$CHILD.cjs" ]; then
                echo "::error::$CHILD.cjs is missing — the wrapper would acquire and then have nowhere to land the rows"
                exit 1
              fi
            done
            echo "Child scripts confirmed: 4"
          fi

      # A relaunch starts with an empty /tmp, so without this the job re-scrapes
      # 718 Beckett set pages and 604 insider pages every single time: 76 minutes
      # of a 140-minute budget spent re-acquiring what the previous run already
      # had. --skipExisting tests the staged CSV path BEFORE fetching, so a
      # restored directory skips the fetch entirely, not just the parse.
      - name: Restore staged checklists across relaunches
        if: ${{ inputs.script == 'ingest-checklists-end-to-end' }}
        uses: actions/cache@v4
        with:
          path: /tmp/hiq-checklists
          key: hiq-checklists-${{ github.run_id }}
          restore-keys: |
            hiq-checklists-

      - name: Run backfill (${{ inputs.apply == true && 'APPLY' || 'DRY-RUN' }})
        # Both RESLUG_APPLY and APPROVE_APPLY env vars are set so this
        # single step works for both reslug-* and approve-* scripts;
        # each script only reads the one it cares about.
        id: backfill
        # 150 min per iteration — leaves 30 min for the self-relaunch
        # decision inside the job's 180-min ceiling.
        timeout-minutes: 150
        env:
          RESLUG_APPLY: ${{ inputs.apply == true && 'true' || 'false' }}
          APPROVE_APPLY: ${{ inputs.apply == true && 'true' || 'false' }}
          BACKFILL_APPLY: ${{ inputs.apply == true && 'true' || 'false' }}
          RESLUG_CONCURRENCY: ${{ inputs.concurrency }}
          APPROVE_CONCURRENCY: ${{ inputs.concurrency }}
          BACKFILL_CONCURRENCY: ${{ inputs.concurrency }}
          BULK_START_DATE: ${{ inputs.bulk_start_date }}
          BULK_END_DATE: ${{ inputs.bulk_end_date }}
          BACKFILL_CARD_NUMBERS: ${{ inputs.card_numbers }}
          # CF-ONE-NAME-FORMAT-FOR-EVERY-CARD: normalize-catalog-format owns one
          # partition per dispatch, computed from live row counts at startup and
          # balanced by row count (2025 alone is 7.1M, ~400x a vintage year).
          # Slots never overlap, so 16 dispatches need no coordination and any
          # one can be re-run alone — the script skips rows already normalised.
          SLOT: ${{ inputs.slot }}
          SLOTS: ${{ inputs.slots }}
          # Optional year scoping (ingest-checklists-end-to-end, rehome-catalog-
          # rows-to-own-partition, dedupe-catalog-partition-shadows, merge-bare-
          # colour-parallels, repair-refractor-mislabel).
          YEARS: ${{ inputs.years }}
          PHASES: ${{ inputs.phases }}
          BCP_TITLES: ${{ inputs.titles }}
          SOURCES: ${{ inputs.sources }}
          # retire mode=source / audit-source-coverage: the per-product key
          # coverage floor under which an old product is kept, not retired.
          MIN_COVERAGE_PCT: ${{ inputs.min_coverage_pct }}
          # repair-refractor-mislabel: "refractor" (plain segment only) or
          # "all" (every slug whose parallel disagrees with its own title).
          SCOPE: ${{ inputs.scope }}
          # dedupe-catalog-partition-shadows: which products to sweep.
          SETKEY_LIKE: ${{ inputs.setkey_like }}
          # CF-A-ROW-IN-THE-WRONG-PARTITION-IS-AN-INVISIBLE-ROW: bound the
          # re-home so a slice can be proven before it runs across 17.7M rows.
          LIMIT: ${{ inputs.limit }}
          SCAN_LIMIT: ${{ inputs.scan_limit }}
          # reslug-tcg-out-of-sports-namespace: which non-sport categories.
          SPORTS: ${{ inputs.sports }}
          # reslugAllSoldComps: contentHash first-char shard, 16 total.
          SHARD_HEX: ${{ inputs.shard_hex }}
          # Without this the script silently runs its DEFAULT mode and reports
          # success having touched none of the population you dispatched it for.
          MODE: ${{ inputs.mode }}
          MAX_ROWS: ${{ inputs.max_rows }}
          # rehome: only move identity rows; graded rows are regenerable.
          PARENTS_ONLY: ${{ inputs.parents_only == true && 'true' || 'false' }}
          # dedupe-catalog-partition-shadows: opt in to deleting keyless rows.
          RETIRE_NO_PARTITION_KEY: ${{ inputs.retire_no_partition_key == true && 'true' || 'false' }}
          # CF-REPRICE-USER-HOLDINGS: pin Drew's userId + enable composite path
          # so the reprice writes new v2-calibrated FMVs.
          REPRICE_USER_ID: user-199fcbc9-58ba-4643-a0c9-f75bcbc90bd4
          HOBBYIQFMV_COMPOSITE_ENABLED: "true"
          # CF-NODE-HEAP-8G (Drew, 2026-08-02). dedupe-catalog-by-hobbyiq
          # crashed at ~2M rows scanned with "JavaScript heap out of memory"
          # (exit 134). It builds an in-memory Map of every vendor row for
          # slug grouping. 8GB heap easily fits 2.4M rows and gives
          # headroom for future catalog growth.
          # D26 backfill-ebay-account-sales. DAYS and USER_IDS are script-level
          # knobs whose defaults ARE the ruling (90 days, every connected
          # user), so they get no dispatch input -- this workflow already
          # carries 23 and a knob nobody sets is a knob that drifts. `limit`
          # bounds USERS for this script, and `slot`/`slots` shard by userId.
          # RUN_MINUTES stays at the script's own 140 so the budget marker
          # lands inside the 150-minute step ceiling.
          DAYS: "90"
          NODE_OPTIONS: "--max-old-space-size=8192"
        run: node "backend/scripts/${{ inputs.script }}.cjs" | tee /tmp/backfill.log
        shell: bash

      - name: Self-relaunch the re-slug until nothing changes
        # touched=N is the line this greps, and the script only prints it on a
        # clean exit -- which is why it now stops at its own 140-minute budget
        # rather than being SIGKILLed at the 150-minute ceiling with nothing
        # printed and nothing re-dispatched.
        #
        # Convergent, so re-running is safe: a row whose slug already matches
        # what the generator produces is counted as skipped, not rewritten, so
        # a relaunch that finds nothing left to change stops the loop.
        if: ${{ !cancelled() && inputs.script == 'reslugAllSoldComps' && inputs.apply == true }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        working-directory: backend
        run: |
          set +e
          N=$(grep -aoE "touched=[0-9]+" /tmp/backfill.log | tail -1 | grep -oE "[0-9]+$")
          echo "reslug_touched=${N:-0}"
          # CF-RELAUNCH-ONLY-ON-BUDGET (2026-08-29). Relaunch iff the script says it
          # stopped at its budget with work left. Gating on "did anything" looped
          # forever once a slot was down to rows it cannot change.
          if grep -aqE "stopped at the .*budget" /tmp/backfill.log; then
            echo "::notice::budget hit (touched=${N:-0}) — re-dispatching slot ${{ inputs.slot }}/${{ inputs.slots }} to continue"
            gh workflow run backfill-runner.yml --repo "$GITHUB_REPOSITORY" --ref main -f script=reslugAllSoldComps -f apply=true -f concurrency="${{ inputs.concurrency }}" -f slot="${{ inputs.slot }}" -f slots="${{ inputs.slots }}" -f shard_hex="${{ inputs.shard_hex }}"
          else
            echo "::notice::slot ${{ inputs.slot }}/${{ inputs.slots }} finished within budget (touched=${N:-0}) — done, no re-dispatch."
          fi
      - name: Self-relaunch the checklist ingest until every phase completes
        # Acquire + convert + ingest is far longer than one 150-minute step, so
        # the script slices RUN_MINUTES across phases and prints what it
        # reached. --skipExisting means a relaunch resumes rather than
        # re-scraping what is already on the runner disk.
        if: ${{ !cancelled() && inputs.script == 'ingest-checklists-end-to-end' && inputs.apply == true }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        working-directory: backend
        run: |
          set +e
          N=$(grep -aoE "checklist_phases_done=[0-9]+" /tmp/backfill.log | tail -1 | grep -oE "[0-9]+$")
          echo "phases_done=${N:-0}"
          # CF-RELAUNCH-ONLY-ON-BUDGET (2026-08-29). Relaunch iff the script says it
          # stopped at its budget with work left. Gating on "did anything" looped
          # forever once a slot was down to rows it cannot change.
          if grep -aqE "stopped at the .*budget" /tmp/backfill.log; then
            echo "::notice::budget hit (phases_done=${N:-0}) — re-dispatching slot ${{ inputs.slot }}/${{ inputs.slots }} to continue"
            gh workflow run backfill-runner.yml --repo "$GITHUB_REPOSITORY" --ref main -f script=ingest-checklists-end-to-end -f apply=true -f concurrency="${{ inputs.concurrency }}" -f slot="${{ inputs.slot }}" -f slots="${{ inputs.slots }}" -f years="${{ inputs.years }}" -f phases="${{ inputs.phases }}" -f titles="${{ inputs.titles }}"
          else
            echo "::notice::slot ${{ inputs.slot }}/${{ inputs.slots }} finished within budget (phases_done=${N:-0}) — done, no re-dispatch."
          fi
      - name: Self-relaunch the parallel repair until nothing is folded
        # Stops at its own 140-minute budget and PRINTS its summary, so
        # "moved to the unfolded slug N" exists for this step to read. A run
        # killed by the 150-minute step ceiling prints nothing, the relaunch
        # reads 0, and the fleet stops silently with every run green.
        if: ${{ !cancelled() && inputs.script == 'repair-parallel-subset-fold' && inputs.apply == true }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        working-directory: backend
        run: |
          set +e
          A=$(grep -aoE "^  moved to the unfolded slug +[0-9,]+" /tmp/backfill.log | tail -1 | grep -oE "[0-9,]+$" | tr -d ,)
          B=$(grep -aoE "^  merged into an existing row +[0-9,]+" /tmp/backfill.log | tail -1 | grep -oE "[0-9,]+$" | tr -d ,)
          MOVED=$(( ${A:-0} + ${B:-0} ))
          echo "parallel_repaired=$MOVED"
          # CF-RELAUNCH-ONLY-ON-BUDGET (#1361, D18 2026-08-29). Relaunch iff the
          # script printed its budget marker — never on a count. A count gate
          # looped forever on a slot down to rows it cannot change, and stopped
          # early on a budget stop that happened to change nothing. The inputs
          # are forwarded verbatim so the relaunch is the same dispatch.
          if grep -aqE "stopped at the .*budget" /tmp/backfill.log; then
            echo "::notice::budget hit (repaired=$MOVED) — re-dispatching slot ${{ inputs.slot }}/${{ inputs.slots }} to continue"
            gh workflow run backfill-runner.yml --repo "$GITHUB_REPOSITORY" --ref main -f script=repair-parallel-subset-fold -f apply=true -f concurrency="${{ inputs.concurrency }}" -f slot="${{ inputs.slot }}" -f slots="${{ inputs.slots }}" -f mode="${{ inputs.mode }}" -f sports="${{ inputs.sports }}" -f years="${{ inputs.years }}" -f scope="${{ inputs.scope }}" -f sources="${{ inputs.sources }}"
          else
            echo "::notice::slot ${{ inputs.slot }}/${{ inputs.slots }} finished within budget (repaired=$MOVED) — done, no re-dispatch."
          fi
      - name: Self-relaunch canonicalize until no vendor-shaped rows remain
        # Stops at its own 140-minute budget and PRINTS its summary, so
        # "re-homed N" exists for this step to read. A run killed by the step
        # ceiling prints nothing and the relaunch reads 0 -- which is how a
        # fleet stops silently with every run green.
        if: ${{ !cancelled() && inputs.script == 'canonicalize-vendor-shaped-rows' && inputs.apply == true }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        working-directory: backend
        run: |
          set +e
          A=$(grep -aoE "^  re-homed to their own slug +[0-9,]+" /tmp/backfill.log | tail -1 | grep -oE "[0-9,]+$" | tr -d ,)
          B=$(grep -aoE "^  retired as redundant copies +[0-9,]+" /tmp/backfill.log | tail -1 | grep -oE "[0-9,]+$" | tr -d ,)
          MOVED=$(( ${A:-0} + ${B:-0} ))
          echo "canonicalized=$MOVED"
          # CF-RELAUNCH-ONLY-ON-BUDGET (#1361, D18 2026-08-29). Relaunch iff the
          # script printed its budget marker — never on a count. A count gate
          # looped forever on a slot down to rows it cannot change, and stopped
          # early on a budget stop that happened to change nothing. The inputs
          # are forwarded verbatim so the relaunch is the same dispatch.
          if grep -aqE "stopped at the .*budget" /tmp/backfill.log; then
            echo "::notice::budget hit (canonicalized=$MOVED) — re-dispatching slot ${{ inputs.slot }}/${{ inputs.slots }} to continue"
            gh workflow run backfill-runner.yml --repo "$GITHUB_REPOSITORY" --ref main -f script=canonicalize-vendor-shaped-rows -f apply=true -f concurrency="${{ inputs.concurrency }}" -f slot="${{ inputs.slot }}" -f slots="${{ inputs.slots }}" -f mode="${{ inputs.mode }}" -f sports="${{ inputs.sports }}" -f years="${{ inputs.years }}" -f scope="${{ inputs.scope }}" -f sources="${{ inputs.sources }}"
          else
            echo "::notice::slot ${{ inputs.slot }}/${{ inputs.slots }} finished within budget (canonicalized=$MOVED) — done, no re-dispatch."
          fi

      - name: Self-relaunch the eBay account-sales backfill until every user is replayed
        # D26. The script stops at its OWN 140-minute budget and PRINTS its
        # summary, so "SALES IN THE POOL n" exists for this step to read. A run
        # killed by the 150-minute step ceiling prints nothing, the relaunch
        # reads 0, and the fleet stops silently with every run green.
        if: ${{ !cancelled() && inputs.script == 'backfill-ebay-account-sales' && inputs.apply == true }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        working-directory: backend
        run: |
          set +e
          N=$(grep -aoE "^  SALES IN THE POOL +[0-9,]+" /tmp/backfill.log | tail -1 | grep -oE "[0-9,]+$" | tr -d ,)
          N=${N:-0}
          echo "ebay_account_sales_recorded=$N"
          # CF-RELAUNCH-ONLY-ON-BUDGET (#1361, D18 2026-08-29). Relaunch iff the
          # script printed its budget marker -- never on a count. A count gate
          # loops forever on a slot whose users have no sales left, and stops
          # early on a budget stop that happened to record nothing. The inputs
          # are forwarded verbatim so the relaunch is the same dispatch.
          if grep -aqE "stopped at the .*budget" /tmp/backfill.log; then
            echo "::notice::budget hit (recorded=$N) -- re-dispatching slot ${{ inputs.slot }}/${{ inputs.slots }} to continue"
            gh workflow run backfill-runner.yml --repo "$GITHUB_REPOSITORY" --ref main -f script=backfill-ebay-account-sales -f apply=true -f concurrency="${{ inputs.concurrency }}" -f slot="${{ inputs.slot }}" -f slots="${{ inputs.slots }}" -f limit="${{ inputs.limit }}"
          else
            echo "::notice::slot ${{ inputs.slot }}/${{ inputs.slots }} finished within budget (recorded=$N) -- done, no re-dispatch."
          fi

      - name: Self-relaunch the numbered-Base retirement until nothing retires
        # Whitelisted without a relaunch step, so six shards ran one cycle and
        # stopped at 290k remaining while every run stayed green.
        if: ${{ !cancelled() && inputs.script == 'retire-numbered-base-rows' && inputs.apply == true }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        working-directory: backend
        run: |
          set +e
          N=$(grep -aoE "RETIRED — numbered .Base.[^0-9]+[0-9,]+" /tmp/backfill.log | grep -oE "[0-9,]+$" | tr -d ,)
          N=${N:-0}
          echo "numbered_base_retired=$N"
          # CF-RELAUNCH-ONLY-ON-BUDGET (#1361, D18 2026-08-29). Relaunch iff the
          # script printed its budget marker — never on a count. A count gate
          # looped forever on a slot down to rows it cannot change, and stopped
          # early on a budget stop that happened to change nothing. The inputs
          # are forwarded verbatim so the relaunch is the same dispatch.
          if grep -aqE "stopped at the .*budget" /tmp/backfill.log; then
            echo "::notice::budget hit (retired=$N) — re-dispatching slot ${{ inputs.slot }}/${{ inputs.slots }} to continue"
            gh workflow run backfill-runner.yml --repo "$GITHUB_REPOSITORY" --ref main -f script=retire-numbered-base-rows -f apply=true -f concurrency="${{ inputs.concurrency }}" -f slot="${{ inputs.slot }}" -f slots="${{ inputs.slots }}" -f mode="${{ inputs.mode }}" -f sports="${{ inputs.sports }}" -f years="${{ inputs.years }}" -f scope="${{ inputs.scope }}" -f sources="${{ inputs.sources }}"
          else
            echo "::notice::slot ${{ inputs.slot }}/${{ inputs.slots }} finished within budget (retired=$N) — done, no re-dispatch."
          fi

      - name: Self-relaunch the pokemon number repair until nothing unglues
        if: ${{ !cancelled() && inputs.script == 'repair-pokemon-glued-numbers' && inputs.apply == true }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        working-directory: backend
        run: |
          set +e
          N=$(grep -aoE "numbers UNGLUED[^0-9]+[0-9,]+" /tmp/backfill.log | tail -1 | grep -oE "[0-9,]+$" | tr -d ,)
          N=${N:-0}
          echo "unglued=$N"
          # CF-RELAUNCH-ONLY-ON-BUDGET (#1361, D18 2026-08-29). Relaunch iff the
          # script printed its budget marker — never on a count. A count gate
          # looped forever on a slot down to rows it cannot change, and stopped
          # early on a budget stop that happened to change nothing. The inputs
          # are forwarded verbatim so the relaunch is the same dispatch.
          if grep -aqE "stopped at the .*budget" /tmp/backfill.log; then
            echo "::notice::budget hit (unglued=$N) — re-dispatching slot ${{ inputs.slot }}/${{ inputs.slots }} to continue"
            gh workflow run backfill-runner.yml --repo "$GITHUB_REPOSITORY" --ref main -f script=repair-pokemon-glued-numbers -f apply=true -f concurrency="${{ inputs.concurrency }}" -f slot="${{ inputs.slot }}" -f slots="${{ inputs.slots }}" -f mode="${{ inputs.mode }}" -f sports="${{ inputs.sports }}" -f years="${{ inputs.years }}" -f scope="${{ inputs.scope }}" -f sources="${{ inputs.sources }}"
          else
            echo "::notice::slot ${{ inputs.slot }}/${{ inputs.slots }} finished within budget (unglued=$N) — done, no re-dispatch."
          fi

      - name: Self-relaunch the pokemon setKey mapping until nothing moves
        if: ${{ !cancelled() && inputs.script == 'map-pokemon-setkeys-to-checklist' && inputs.apply == true }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        working-directory: backend
        run: |
          set +e
          N=$(grep -aoE "MOVED to checklist key[^0-9]+[0-9,]+" /tmp/backfill.log | tail -1 | grep -oE "[0-9,]+$" | tr -d ,)
          N=${N:-0}
          echo "moved=$N"
          # CF-RELAUNCH-ONLY-ON-BUDGET (#1361, D18 2026-08-29). Relaunch iff the
          # script printed its budget marker — never on a count. A count gate
          # looped forever on a slot down to rows it cannot change, and stopped
          # early on a budget stop that happened to change nothing. The inputs
          # are forwarded verbatim so the relaunch is the same dispatch.
          if grep -aqE "stopped at the .*budget" /tmp/backfill.log; then
            echo "::notice::budget hit (moved=$N) — re-dispatching slot ${{ inputs.slot }}/${{ inputs.slots }} to continue"
            gh workflow run backfill-runner.yml --repo "$GITHUB_REPOSITORY" --ref main -f script=map-pokemon-setkeys-to-checklist -f apply=true -f concurrency="${{ inputs.concurrency }}" -f slot="${{ inputs.slot }}" -f slots="${{ inputs.slots }}" -f mode="${{ inputs.mode }}" -f sports="${{ inputs.sports }}" -f years="${{ inputs.years }}" -f scope="${{ inputs.scope }}" -f sources="${{ inputs.sources }}"
          else
            echo "::notice::slot ${{ inputs.slot }}/${{ inputs.slots }} finished within budget (moved=$N) — done, no re-dispatch."
          fi

      - name: Self-relaunch the parallel mapping until the slot is clean
        # Unresolved rows are stamped, so the pending query drains to zero and
        # a run that scans nothing IS a finished slot.
        if: ${{ !cancelled() && inputs.script == 'map-derived-parallels-to-rungs' && inputs.apply == true }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        working-directory: backend
        run: |
          set +e
          N=$(grep -aoE "MOVED to a checklist rung +[0-9,]+" /tmp/backfill.log | tail -1 | grep -oE "[0-9,]+$" | tr -d ,)
          echo "parallel_map_moved=${N:-0}"
          # CF-RELAUNCH-ONLY-ON-BUDGET (2026-08-29). Relaunch iff the script says it
          # stopped at its budget with work left. Gating on "did anything" looped
          # forever once a slot was down to rows it cannot change.
          if grep -aqE "stopped at the .*budget" /tmp/backfill.log; then
            echo "::notice::budget hit (moved=${N:-0}) — re-dispatching slot ${{ inputs.slot }}/${{ inputs.slots }} to continue"
            gh workflow run backfill-runner.yml --repo "$GITHUB_REPOSITORY" --ref main -f script=map-derived-parallels-to-rungs -f apply=true -f concurrency="${{ inputs.concurrency }}" -f slot="${{ inputs.slot }}" -f slots="${{ inputs.slots }}" -f sports="${{ inputs.sports }}" -f mode="${{ inputs.mode }}"
          else
            echo "::notice::slot ${{ inputs.slot }}/${{ inputs.slots }} finished within budget (moved=${N:-0}) — done, no re-dispatch."
          fi

      - name: Self-relaunch the one-pool emission until staging drains
        # Staging rows flip to in-pool as they are written, so the query drains
        # to zero and a run that writes nothing IS a finished pass.
        if: ${{ !cancelled() && inputs.script == 'emit-staging-to-pool' && inputs.apply == true }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        working-directory: backend
        run: |
          set +e
          N=$(( $(grep -aoE "INTO POOL, matched +[0-9,]+" /tmp/backfill.log | tail -1 | grep -oE "[0-9,]+$" | tr -d , || echo 0) + $(grep -aoE "INTO POOL, unmatched +[0-9,]+" /tmp/backfill.log | tail -1 | grep -oE "[0-9,]+$" | tr -d , || echo 0) ))
          echo "pool_emitted=${N:-0}"
          # CF-RELAUNCH-ONLY-ON-BUDGET (2026-08-29). Relaunch iff the script says it
          # stopped at its budget with work left. Gating on "did anything" looped
          # forever once a slot was down to rows it cannot change.
          if grep -aqE "stopped at the .*budget" /tmp/backfill.log; then
            echo "::notice::budget hit (emitted=${N:-0}) — re-dispatching slot ${{ inputs.slot }}/${{ inputs.slots }} to continue"
            gh workflow run backfill-runner.yml --repo "$GITHUB_REPOSITORY" --ref main -f script=emit-staging-to-pool -f apply=true -f concurrency="${{ inputs.concurrency }}" -f slot="${{ inputs.slot }}" -f slots="${{ inputs.slots }}" -f mode="${{ inputs.mode }}"
          else
            echo "::notice::slot ${{ inputs.slot }}/${{ inputs.slots }} finished within budget (emitted=${N:-0}) — done, no re-dispatch."
          fi

      - name: Self-relaunch the playerSlug backfill until the field exists everywhere
        if: ${{ !cancelled() && inputs.script == 'backfill-playerslug' && inputs.apply == true }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        working-directory: backend
        run: |
          set +e
          N=$(grep -aoE "playerSlug derived +[0-9,]+" /tmp/backfill.log | tail -1 | grep -oE "[0-9,]+$" | tr -d ,)
          N=${N:-0}
          echo "playerslug_derived=$N"
          # CF-RELAUNCH-ONLY-ON-BUDGET (#1361, D18 2026-08-29). Relaunch iff the
          # script printed its budget marker — never on a count. A count gate
          # looped forever on a slot down to rows it cannot change, and stopped
          # early on a budget stop that happened to change nothing. The inputs
          # are forwarded verbatim so the relaunch is the same dispatch.
          if grep -aqE "stopped at the .*budget" /tmp/backfill.log; then
            echo "::notice::budget hit (derived=$N) — re-dispatching slot ${{ inputs.slot }}/${{ inputs.slots }} to continue"
            gh workflow run backfill-runner.yml --repo "$GITHUB_REPOSITORY" --ref main -f script=backfill-playerslug -f apply=true -f concurrency="${{ inputs.concurrency }}" -f slot="${{ inputs.slot }}" -f slots="${{ inputs.slots }}" -f mode="${{ inputs.mode }}" -f sports="${{ inputs.sports }}" -f years="${{ inputs.years }}" -f scope="${{ inputs.scope }}" -f sources="${{ inputs.sources }}"
          else
