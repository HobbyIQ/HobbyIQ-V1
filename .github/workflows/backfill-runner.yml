          dispatch: |
            gh workflow run backfill-runner.yml --repo "$GITHUB_REPOSITORY" --ref main -f script=repair-cpa-draft-refile -f apply="${{ inputs.apply }}" -f concurrency="${{ inputs.concurrency }}" -f slot="${{ inputs.slot }}" -f slots="${{ inputs.slots }}" -f sports="${{ inputs.sports }}" -f years="${{ inputs.years }}" -f scope="${{ inputs.scope }}" -f mode="${{ inputs.mode }}" -f limit="${{ inputs.limit }}" -f parents_only="${{ inputs.parents_only }}"

      - name: Self-relaunch the catalog list relocation until the list is drained
        # CF-A-KILLED-JOB-CANNOT-REPORT-PROGRESS, for the list lane.
        #
        # Run 34079952456 -- APPLY over the 13,295-entry soccer bare-key list --
        # was killed at this step's 150-minute ceiling with no marker, no
        # reconcile and no finishLane line, because the lane had NO BUDGET AT
        # ALL. Measured from that run's log the apply costs 1.826 s/entry
        # against the report's 0.076 s/entry, so 13,295 entries needed ~6.7
        # hours: 2.7x the ceiling. The lane now budgets, stops itself, prints
        # the marker and exits; this step is what continues it.
        #
        # THE SCOPE IS RE-DISPATCHED VERBATIM, and it must be: `scope` names
        # the committed list file, the lane has no default, and a relaunch that
        # dropped it would be fatal at entry 0 rather than merely wrong. There
        # is no cursor input and none is wanted -- the continuation re-reads the
        # same file from the top.
        #
        # THAT RE-READ IS SAFE BECAUSE THE LIST IS IDEMPOTENT. A retire whose
        # row is already gone reads back as `already gone` and is SKIPPED, never
        # re-deleted and never counted as written; a reslug whose source has
        # already moved is NOT FOUND and skipped. So a continuation pays one
        # cheap point read per finished entry and writes only the remainder --
        # which is also why a killed run of this lane never needs a repair list.
        if: ${{ !cancelled() && inputs.script == 'relocate-catalog-rows-by-list' }}
        env:
          GH_TOKEN: ${{ github.token }}
        uses: ./.github/actions/relaunch-on-marker
        with:
          outcome: ${{ steps.backfill.outcome }}
          script: relocate-catalog-rows-by-list
          preamble: |
            N=$(grep -aoE "^  entries considered +[0-9,]+" /tmp/backfill.log | tail -1 | grep -oE "[0-9,]+$" | tr -d , || true)
            echo "entries_considered=${N:-0}"
          budget-notice: |
            echo "::notice::budget hit (considered=${N:-0}) — re-dispatching ${{ inputs.scope }} to continue"
          finished-notice: |
            echo "::notice::${{ inputs.scope }} finished within budget (considered=${N:-0}) — done, no re-dispatch."
          dispatch: |
            gh workflow run backfill-runner.yml --repo "$GITHUB_REPOSITORY" --ref main -f script=relocate-catalog-rows-by-list -f apply="${{ inputs.apply }}" -f scope="${{ inputs.scope }}"

      - name: Self-relaunch a newly budgeted write lane until its scope is drained
        # CF-A-KILLED-JOB-CANNOT-REPORT-PROGRESS, for the lanes #1944's ratchet
        # named. Run 34079952456 proved what an unbudgeted write lane does when
        # its scope outgrows one step: it is KILLED at the 150-minute ceiling,
        # printing no marker, no reconcile and no finishLane line, and #1913's
        # KILLED branch then correctly withholds the re-dispatch -- leaving the
        # work half done and the run red. The census that was supposed to catch
        # that could not see it, because a lane with NO budget matched neither
        # RUN_MINUTES nor BUDGET_MS and was skipped rather than failed.
        #
        # The lanes below have now been given the same clock relocate-catalog-
        # rows-by-list got: budget(), a per-unit outOfClock() PRE-check, a unit
        # reserve sized to that lane's largest unit, the marker as a source
        # literal, a reconcile that still balances after a partial run, and
        # finishLane() on every exit path. This step is what continues them.
        #
        # ONE STEP, NOT FIFTEEN. Every lane here has the same continuation
        # semantics -- re-read the scope, skip what is already done, write only
        # the remainder -- so fifteen copies of this shell would be fifteen
        # places for the three-way outcome logic to drift apart. The gate names
        # each lane explicitly rather than matching a pattern, so adding a lane
        # is a deliberate edit and a lane cannot join by being named a certain
        # way.
        #
        # EVERY ONE OF THESE IS IDEMPOTENT ON RE-READ, which is what makes a
        # verbatim re-dispatch safe rather than merely convenient:
        #   - the sweeps (conform-holdings-to-catalog, backfill-holding-ebay-ids,
        #     backfill-canonicalize-chrome-slugs, backfillCatalogCardYearFromSlug,
        #     normalize-catalog-format, reslug-tcg-out-of-sports-namespace) skip a
        #     row that already carries the value they would write;
        #   - the list lane (relocate-pool-rows-by-list) re-reads a finished
        #     entry as `already at the target` and never re-writes it;
        #   - the retires (retire-impossible-grade-rows,
        #     retire-flattened-attestations) read a row that is already gone as
        #     a skip, never as a second delete;
        #   - the repairs (repair-refractor-mislabel, merge-bare-colour-parallels,
        #     dedupe-catalog-partition-shadows, recover-chrome-collapse-damage,
        #     revert-d30-base-onto-one-of-one, reap-orphan-price-trails) re-derive
        #     their population from the live containers, so work already done is
        #     simply no longer in scope on the next pass.
        # So a continuation pays cheap reads over the finished part and writes
        # only what is left. That is also why none of them needs a cursor input.
        #
        # `apply` and `scope` are forwarded VERBATIM: a report relaunches as a
        # report and an apply as an apply (#1578), and a lane whose scope is a
        # committed list would be fatal at entry 0 without it.
        # `!cancelled()` sits on the `if:` LINE, not folded onto the next one:
        # the pin that requires every marker-keyed relaunch step to run after a
        # kill reads the gate with a single-line regex, and a gate whose first
        # line is bare `>-` reads as empty. A step that looked correct here but
        # parsed as ungated is exactly the silent hole this whole rule exists to
        # close, so the formatting is load-bearing rather than cosmetic.
        if: ${{ !cancelled() && (
            inputs.script == 'conform-holdings-to-catalog' ||
            inputs.script == 'reap-orphan-price-trails' ||
            inputs.script == 'backfill-holding-ebay-ids' ||
            inputs.script == 'backfill-canonicalize-chrome-slugs' ||
            inputs.script == 'repair-refractor-mislabel' ||
            inputs.script == 'merge-bare-colour-parallels' ||
            inputs.script == 'dedupe-catalog-partition-shadows' ||
            inputs.script == 'retire-impossible-grade-rows' ||
            inputs.script == 'retire-flattened-attestations' ||
            inputs.script == 'relocate-pool-rows-by-list' ||
            inputs.script == 'backfillCatalogCardYearFromSlug' ||
            inputs.script == 'normalize-catalog-format' ||
            inputs.script == 'recover-chrome-collapse-damage' ||
            inputs.script == 'revert-d30-base-onto-one-of-one' ||
            inputs.script == 'reslug-tcg-out-of-sports-namespace'
          ) }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: ./.github/actions/relaunch-on-marker
        with:
          outcome: ${{ steps.backfill.outcome }}
          script: ${{ inputs.script }}
          budget-notice: |
            W=$(grep -aoE "reconciled: [a-z]+ [0-9,]+ = [a-z]+ [0-9,]+" /tmp/backfill.log | tail -1 || true)
            echo "::notice::budget hit on ${{ inputs.script }} (${W:-no reconcile line}) — re-dispatching to continue"
          finished-notice: |
            echo "::notice::${{ inputs.script }} finished within budget — done, no re-dispatch."
          dispatch: |
            gh workflow run backfill-runner.yml --repo "$GITHUB_REPOSITORY" --ref main -f script="${{ inputs.script }}" -f apply="${{ inputs.apply }}" -f scope="${{ inputs.scope }}"

      - name: Self-relaunch a wave-2 budgeted write lane until its scope is drained
        # CF-A-KILLED-JOB-CANNOT-REPORT-PROGRESS, wave 2 of the #1944 ratchet
        # (44 -> 29). Same contract as the wave-1 step above -- budget(), a
        # per-unit outOfClock() PRE-check, a reserve sized to that lane's largest
        # unit, the marker as a source literal, a reconcile that still balances
        # after a partial run, and finishLane() on every exit path -- and a
        # SEPARATE step rather than fifteen more names on the wave-1 gate, so
        # each wave's population stays readable next to the reasoning that
        # produced it.
        #
        # FIVE OF THESE ARRIVE FROM A DIFFERENT PROTOCOL, and that is the part
        # worth reading twice. auto-label-catalog-variants,
        # backfill-searchtokens-all-sports, dedupe-catalog-by-hobbyiq,
        # fix-catalog-parallel-as-player and normalize-catalog-schema were NOT
        # unclocked -- they carried a local BACKFILL_MAX_MINUTES cap and
        # continued through `RELAUNCH_NEEDED=true|false`, read by the
        # "Self-relaunch catalog expansion" step further down. That step has
        # TWO arms and no third: `true` re-dispatches, `false` stops, and
        # ANYTHING ELSE -- including the empty string a KILLED step leaves,
        # because a killed step prints no line at all -- lands on a
        # `::warning::` that does not fail the job. So a lane killed at the
        # 150-minute ceiling reported a warning, went GREEN, and left its work
        # half done: exactly #1906's defect, in a protocol
        # relaunchNeverCallsAKilledRunFinished.test.ts does not police because
        # its population is the marker-keyed steps.
        #
        # Those five now print the marker and are named HERE, and are removed
        # from the RELAUNCH_NEEDED gate below -- not left on both, which would
        # double-dispatch every budget stop.
        #
        # EVERY ONE OF THESE IS IDEMPOTENT ON RE-READ, which is what makes a
        # verbatim re-dispatch safe rather than merely convenient:
        #   - the marker-stamped sweeps (backfill-stage2-title-parser,
        #     normalize-catalog-schema, auto-label-catalog-variants,
        #     backfill-cardsight-unverified-flag) exclude their own marker field
        #     in the scan query, so a written row is never re-read;
        #   - the field backfills (backfill-composite-fields,
        #     backfill-composite-v3, backfill-autostyle-from-title,
        #     backfill-searchtokens-all-sports) select only rows where the field
        #     they write is still absent or null -- EXCEPT
        #     backfill-searchtokens-all-sports under mode=recompute-stale, whose
        #     scan is deliberately unfiltered (a STALE row's tokens are neither
        #     absent nor empty, so the predicate could never select one). It is
        #     idempotent by a different mechanism: it re-reads the finished part
        #     and classifyRowTokens returns "ok", so the row is counted `fresh`
        #     and not rewritten. Continuation is paid in cheap reads, and still
        #     needs no cursor input;
        #   - the reslugs (backfill-catalog-driven-canonicalize,
        #     backfill-bowman-mega-box-reslug,
        #     backfill-cardsight-title-identity) re-derive the target and read a
        #     row already at it as `unchanged`;
        #   - dedupe-catalog-by-hobbyiq re-reads a folded group as a singleton
        #     and moveCatalogRow returns `noop` for a row already at its slug;
        #   - fix-catalog-parallel-as-player files an already-fixed row among a
        #     group's GOOD names rather than its bad rows;
        #   - auto-quarantine-contaminated-pools selects only rows whose
        #     __poolAutoQuarantined is absent or not true;
        #   - reprice-user-holdings re-reads its user list and the nightly lane
        #     skips a holding priced within 20h whose pool has not grown.
        # So a continuation pays cheap reads over the finished part and writes
        # only what is left. That is also why none of them needs a cursor input.
        #
        # THREE OF THEM CAN EXIT 5 -- A REFUSAL, NOT A FAILURE.
        # dedupe-catalog-by-hobbyiq, fix-catalog-parallel-as-player and
        # auto-quarantine-contaminated-pools each compute their write plan from
        # the SHAPE of a whole-container scan (a group's membership, a majority
        # vote, a contamination ratio), so a scan-phase budget stop makes the
        # plan wrong rather than short and the write phase refuses outright
        # (#1947's retire-flattened-attestations lesson). They still print the
        # marker, so the first arm below re-dispatches them: nothing was
        # written, and the next run re-scans from the top. The marker check runs
        # BEFORE the outcome check for exactly that reason.
        #
        # `apply` and `scope` are forwarded VERBATIM: a report relaunches as a
        # report and an apply as an apply (#1578).
        # `!cancelled()` sits on the `if:` LINE, not folded onto the next one:
        # the pin that requires every marker-keyed relaunch step to run after a
        # kill reads the gate with a single-line regex, and a gate whose first
        # line is bare `>-` parses as EMPTY. A step that looks gated and is not
        # is precisely the silent hole this rule exists to close, so the
        # formatting is load-bearing rather than cosmetic.
        if: ${{ !cancelled() && (
            inputs.script == 'reprice-user-holdings' ||
            inputs.script == 'backfill-catalog-driven-canonicalize' ||
            inputs.script == 'backfill-stage2-title-parser' ||
            inputs.script == 'auto-label-catalog-variants' ||
            inputs.script == 'backfill-searchtokens-all-sports' ||
            inputs.script == 'dedupe-catalog-by-hobbyiq' ||
            inputs.script == 'fix-catalog-parallel-as-player' ||
            inputs.script == 'normalize-catalog-schema' ||
            inputs.script == 'auto-quarantine-contaminated-pools' ||
            inputs.script == 'backfill-autostyle-from-title' ||
            inputs.script == 'backfill-bowman-mega-box-reslug' ||
            inputs.script == 'backfill-cardsight-title-identity' ||
            inputs.script == 'backfill-cardsight-unverified-flag' ||
            inputs.script == 'backfill-composite-fields' ||
            inputs.script == 'backfill-composite-v3'
          ) }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: ./.github/actions/relaunch-on-marker
        with:
          outcome: ${{ steps.backfill.outcome }}
          script: ${{ inputs.script }}
          budget-notice: |
            W=$(grep -aoE "reconciled: [a-z]+ [0-9,]+ = [a-z]+ [0-9,]+" /tmp/backfill.log | tail -1 || true)
            echo "::notice::budget hit on ${{ inputs.script }} (${W:-no reconcile line}) — re-dispatching to continue"
          finished-notice: |
            echo "::notice::${{ inputs.script }} finished within budget — done, no re-dispatch."
          dispatch: |
            gh workflow run backfill-runner.yml --repo "$GITHUB_REPOSITORY" --ref main -f script="${{ inputs.script }}" -f apply="${{ inputs.apply }}" -f scope="${{ inputs.scope }}"

      - name: Self-relaunch a wave-3 budgeted write lane until its scope is drained
        # CF-A-KILLED-JOB-CANNOT-REPORT-PROGRESS, wave 3 of the #1944 ratchet
        # (29 -> 14). Same contract as the wave-1 and wave-2 steps above --
        # budget(), a per-unit outOfClock() PRE-check, a reserve sized to that
        # lane's largest unit, the marker as a source literal, a reconcile that
        # still balances after a partial run, and finishLane() on every exit
        # path -- and a SEPARATE step rather than fifteen more names on an
        # existing gate, so each wave's population stays readable next to the
        # reasoning that produced it.
        #
        # TWO OF THESE ARRIVE FROM THE RELAUNCH_NEEDED PROTOCOL, and one of them
        # arrives from nothing at all.
        #
        #   reaudit-cardsight-unverified carried a local BACKFILL_MAX_MINUTES
        #   cap and printed `RELAUNCH_NEEDED=true|false`, read by the
        #   "Self-relaunch catalog expansion" step further down. That step has
        #   TWO arms and no third: `true` re-dispatches, `false` stops, and
        #   ANYTHING ELSE -- including the empty string a KILLED step leaves,
        #   because a killed step prints no line at all -- lands on a
        #   `::warning::` that does not fail the job. So a lane killed at the
        #   150-minute ceiling reported a warning, went GREEN, and left its work
        #   half done. It is named HERE and REMOVED from that gate below -- not
        #   left on both, which would double-dispatch every budget stop.
        #
        #   nightly-reingest-top-ch-cards printed the same
        #   `RELAUNCH_NEEDED=<bool>` line and NO STEP IN THIS FILE EVER READ IT.
        #   It is not on the catalog-expansion gate and never was, so its
        #   continuation signal went to the log and nowhere else: a 25-minute
        #   local cap that stopped the lane, announced that more work remained,
        #   and was then simply not acted upon. The lane has been dispatched
        #   nightly against a top-1000 walk it cannot finish in one pass. That
        #   is why the fan-out is arriving here rather than being repaired in
        #   place.
        #
        # EVERY ONE OF THESE IS IDEMPOTENT ON RE-READ, which is what makes a
        # verbatim re-dispatch safe rather than merely convenient:
        #   - the field backfills (backfill-grade-from-title,
        #     backfill-grade-from-ch-daily, backfill-printrun-from-title,
        #     backfill-sub-channel-vocabulary) select only rows where the field
        #     they write is still absent, null or empty;
        #   - the slug rewrites (backfill-insert-setkey,
        #     backfill-isauto-from-cardnumber, backfill-isauto-cross-sport)
        #     re-derive the target and skip a row already at it --
        #     `already compound` for the first, isAuto=false for the other two;
        #   - the flag stampers (backfill-stage3-price-sanity,
        #     promote-sold-comps-trust-tier, reaudit-cardsight-unverified)
        #     exclude their own marker field in the scan, so a written row is
        #     never re-read;
        #   - migrate-cardsight-to-staging keys the staging upsert on the row's
        #     own id + cardId, so a re-copy overwrites with itself, and with
        #     MIGRATION_DELETE_SOURCE=true an already-deleted row no longer
        #     appears in the scan at all;
        #   - baseline-pool-snapshot writes `<snapshotDate>::<slug>`, so a
        #     continuation on the same day overwrites its own rows;
        #   - anomaly-force-scan is the one lane here that is NOT a cheap
        #     re-read over already-written rows: a stop persists a
        #     crawl_state cursor (next unit index + the in-memory per-slug
        #     accumulator) and a same-day continuation resumes the sweep from
        #     there rather than re-scanning finished units. The FINAL report
        #     only ever gets ONE upsert, on the run that finishes every unit;
        #   - refresh-calibration-multipliers re-reads the whole window and
        #     overwrites the calibration wholesale;
        #   - nightly-reingest-top-ch-cards writes nothing at all (its insert
        #     path is a documented TODO), so a re-read costs CardHedge calls
        #     and no rows;
        #   - backfill-parallel-enrichment is DISARMED for apply and refuses at
        #     the top of the file.
        # So a continuation pays cheap reads over the finished part and writes
        # only what is left (anomaly-force-scan resumes its unit sweep from
        # crawl_state instead, per its own bullet above). None of them needs a
        # new workflow_dispatch INPUT for this -- the state that makes a
        # continuation cheap lives in Cosmos, not in the dispatch form.
        #
        # FIVE OF THEM CAN EXIT 5 -- A REFUSAL, NOT A FAILURE.
        # backfill-stage3-price-sanity, promote-sold-comps-trust-tier,
        # baseline-pool-snapshot, anomaly-force-scan and
        # refresh-calibration-multipliers each
        # compute their write plan from a STATISTIC over a whole-container or
        # whole-window scan -- a per-slug median, a per-slug percentile set, a
        # median of per-identity price ratios -- so a scan-phase budget stop
        # makes the plan WRONG rather than short (#1947's
        # retire-flattened-attestations lesson, and #1951's three sharper
        # instances). A median over part of a pool is a DIFFERENT median, not a
        # smaller one, and the row floors those lanes carry (MIN_POOL_SIZE,
        # MIN_POOL_FOR_MEDIAN, MIN_SAMPLES, identityN >= 3) do not save them:
        # a partial pool can clear a row floor and still misstate the
        # statistic. Each exits 5 having written nothing, and still prints the
        # marker -- the first arm below runs BEFORE the outcome check for
        # exactly that reason, so a refusal re-dispatches and the next run
        # re-scans from the top with a full clock.
        #
        # `apply` and `scope` are forwarded VERBATIM: a report relaunches as a
        # report and an apply as an apply (#1578).
        # `!cancelled()` sits on the `if:` LINE, not folded onto the next one:
        # the pin that requires every marker-keyed relaunch step to run after a
        # kill reads the gate with a single-line regex, and a gate whose first
        # line is bare `>-` parses as EMPTY. A step that looks gated and is not
        # is precisely the silent hole this rule exists to close, so the
        # formatting is load-bearing rather than cosmetic.
        if: ${{ !cancelled() && (
            inputs.script == 'anomaly-force-scan' ||
            inputs.script == 'backfill-grade-from-ch-daily' ||
            inputs.script == 'backfill-grade-from-title' ||
            inputs.script == 'backfill-insert-setkey' ||
            inputs.script == 'backfill-isauto-cross-sport' ||
            inputs.script == 'backfill-isauto-from-cardnumber' ||
            inputs.script == 'backfill-parallel-enrichment' ||
            inputs.script == 'backfill-printrun-from-title' ||
            inputs.script == 'backfill-stage3-price-sanity' ||
            inputs.script == 'backfill-sub-channel-vocabulary' ||
            inputs.script == 'baseline-pool-snapshot' ||
            inputs.script == 'migrate-cardsight-to-staging' ||
            inputs.script == 'nightly-reingest-top-ch-cards' ||
            inputs.script == 'promote-sold-comps-trust-tier' ||
            inputs.script == 'reaudit-cardsight-unverified' ||
            inputs.script == 'refresh-calibration-multipliers'
          ) }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: ./.github/actions/relaunch-on-marker
        with:
          outcome: ${{ steps.backfill.outcome }}
          script: ${{ inputs.script }}
          budget-notice: |
            W=$(grep -aoE "reconciled: [a-z]+ [0-9,]+ = [a-z]+ [0-9,]+" /tmp/backfill.log | tail -1 || true)
            echo "::notice::budget hit on ${{ inputs.script }} (${W:-no reconcile line}) — re-dispatching to continue"
          finished-notice: |
            echo "::notice::${{ inputs.script }} finished within budget — done, no re-dispatch."
          dispatch: |
            gh workflow run backfill-runner.yml --repo "$GITHUB_REPOSITORY" --ref main -f script="${{ inputs.script }}" -f apply="${{ inputs.apply }}" -f scope="${{ inputs.scope }}"

      - name: Self-relaunch a wave-4 budgeted write lane until its scope is drained
        # CF-A-KILLED-JOB-CANNOT-REPORT-PROGRESS, wave 4 of the #1944 ratchet
        # (14 -> ZERO). Same contract as the wave-1, -2 and -3 steps above --
        # budget(), a per-unit outOfClock() PRE-check, a reserve sized to that
        # lane's largest unit, the marker as a source literal, a reconcile that
        # still balances after a partial run, and finishLane() on every exit
        # path -- and a SEPARATE step rather than fourteen more names on an
        # existing gate, so each wave's population stays readable next to the
        # reasoning that produced it.
        #
        # THIS IS THE LAST WAVE. KNOWN_UNBUDGETED_WRITE_LANES is now EMPTY and
        # the ratchet in backend/tests/runnerBudgetMargin.test.ts has become a
        # HARD RULE: any dispatchable write lane with no budget fails CI by
        # name, with no allowlist left to be added to.
        #
        # THREE OF THESE ARRIVE FROM THE RELAUNCH_NEEDED PROTOCOL --
        # drain-staging-backlog, rescore-anomalies and score-all-sold-comps.
        # Each carried a local BACKFILL_MAX_MINUTES cap and printed
        # `RELAUNCH_NEEDED=true|false`, read by the "Self-relaunch catalog
        # expansion" step further down. That step has TWO arms and no third:
        # `true` re-dispatches, `false` stops, and ANYTHING ELSE -- including
        # the empty string a KILLED step leaves, because a killed step prints no
        # line at all -- lands on a `::warning::` that does not fail the job. So
        # a lane killed at the 150-minute ceiling reported a warning, went
        # GREEN, and left its work half done. They are named HERE and REMOVED
        # from that gate below -- not left on both, which would double-dispatch
        # every budget stop. With them gone, only the two lanes that gate has
        # always had for its own reasons remain on it.
        #
        # TWO OF THEM SWALLOWED A FATAL INTO A GREEN RUN, which no gate could
        # have caught because there was nothing to read. rescore-anomalies and
        # score-all-sold-comps both ended
        #
        #   main().catch(e => { console.error(e); console.log("RELAUNCH_NEEDED=true"); process.exit(0); })
        #
        # -- a crash printed a re-dispatch request and exited ZERO, so the step
        # went green, the job went green, and the only evidence was a stack
        # trace nobody was told to look for. Both exit 1 through finishLane now.
        #
        # AND ONE HAD A MARKER NOTHING HAS EVER GREPPED.
        # bulk-import-ch-daily-to-sold-comps carried a real time budget
        # (BULK_TIME_BUDGET_MIN) that ch-fanout-to-sold-comps.yml sets to 300 --
        # and printed its stop as "TIME BUDGET REACHED (300m)". The marker every
        # relaunch in this file greps is `stopped at the .*budget`
        # (CF-RELAUNCH-ONLY-ON-BUDGET, #1361), so the lane named exactly which
        # window to resume from and no step in this repository ever read it.
        # Worse on the runner: that budget DEFAULTS TO ZERO, and the guard read
        # `TIME_BUDGET_MIN > 0`, so every dispatch from the dropdown ran an
        # eight-year-capable walk with no clock at all.
        #
        # EVERY ONE OF THESE IS IDEMPOTENT ON RE-READ, which is what makes a
        # verbatim re-dispatch safe rather than merely convenient:
        #   - the slug rewrites (reslug-cross-product-mis-slug,
        #     reslug-suspicious-setkeys) re-derive the target and skip a row
        #     already at it -- the only-improve guards find derived === existing,
        #     or the existing setKey already canonical;
        #   - the field stampers (score-all-sold-comps,
        #     backfill-verify-queue-grades) exclude their own written value in
        #     the scan or in the already-correct guard, so a written row is
        #     never re-written;
        #   - rescore-anomalies drops a PROMOTED row from its population
        #     (status flips to 'clean'), and deliberately re-reads a stay-low
        #     one -- that is the `__rescoreScore < 0.60` arm of its query, and
        #     it re-scores to the same verdict from the same inputs;
        #   - bulk-import-ch-daily-to-sold-comps dedups by contentHash inside
        #     recordSoldComp, so re-reading the overlap costs a hash comparison
        #     and writes nothing;
        #   - the checklist ingesters (ingest-product-checklist,
        #     ingest-2026-bowman-auto-checklist) key the upsert on the DERIVED
        #     entry id, so a re-mint overwrites a row with itself;
        #   - backfill-ch-catalog-additions is CHECKPOINTED: the next run
        #     resumes from the highest added_date the last one saw;
        #   - drain-staging-backlog asks the endpoints for their next batch of
        #     PENDING rows, and a row this run promoted is no longer pending;
        #   - the eBay lanes advance a per-user cursor (order poll) or key
        #     candidacy on the fetch having ANSWERED (finances refill), so a
        #     finished unit drops out of the next run's population.
        # So a continuation pays cheap reads over the finished part and writes
        # only what is left. That is also why none of them needs a cursor input.
        #
        # FIVE OF THEM CAN EXIT 5 -- A REFUSAL, NOT A FAILURE, and they split
        # into two kinds worth telling apart.
        #
        #   THE STATISTIC LANE. refresh-market-signals computes every number it
        #   publishes -- priceMomentum, volumeMomentum, both medians, both
        #   volumes -- as a ratio over a whole 60-day fetch held in memory. A
        #   median over part of a pool is a DIFFERENT median, and a COUNT over
        #   part of a window is a ratio against a denominator that was never
        #   real. Worse than the #1970 cases: its query carries no ORDER BY, so
        #   a partial fetch is a partition-ordered slice rather than a sample,
        #   and a dimension key whose sales sit in the unread partitions would
        #   publish as a -100% volume COLLAPSE. MARKET_SIGNALS_MIN_VOLUME does
        #   not save it, and upsertMomentumSignal OVERWRITES on
        #   (dimension, key, windowDays) -- so the wrong signal replaces the
        #   right one rather than sitting beside it.
        #
        #   THE OPAQUE-SWEEP LANES. run-ebay-purchase-sync,
        #   run-ebay-finances-enrichment and backfill-ch-catalog-additions each
        #   hand their whole job to ONE service call that loops internally and
        #   returns a summary. There is no seam at which the script could stop
        #   it half way, and racing the call would ABANDON it -- the #1809 wedge
        #   exactly. So their clock is a PRE-FLIGHT GATE: if it cannot seat a
        #   whole sweep, the lane refuses to start one, rather than being killed
        #   mid-import with no summary at all. Each of the three is resumable
        #   (per-user cursors, feeFetchedAt candidacy, a stored checkpoint), so
        #   a refusal costs nothing but the dispatch.
        #
        # Each exits 5 having written nothing, and still prints the marker --
        # the first arm below runs BEFORE the outcome check for exactly that
        # reason, so a refusal re-dispatches and the next run gets a full clock.
        #
        # `apply` and `scope` are forwarded VERBATIM: a report relaunches as a
        # report and an apply as an apply (#1578).
        # `!cancelled()` sits on the `if:` LINE, not folded onto the next one:
        # the pin that requires every marker-keyed relaunch step to run after a
        # kill reads the gate with a single-line regex, and a gate whose first
        # line is bare `>-` parses as EMPTY. A step that looks gated and is not
        # is precisely the silent hole this rule exists to close, so the
        # formatting is load-bearing rather than cosmetic.
        if: ${{ !cancelled() && (
            inputs.script == 'backfill-ch-catalog-additions' ||
            inputs.script == 'backfill-verify-queue-grades' ||
            inputs.script == 'bulk-import-ch-daily-to-sold-comps' ||
            inputs.script == 'drain-staging-backlog' ||
            inputs.script == 'ingest-2026-bowman-auto-checklist' ||
            inputs.script == 'ingest-product-checklist' ||
            inputs.script == 'refresh-market-signals' ||
            inputs.script == 'rescore-anomalies' ||
            inputs.script == 'reslug-cross-product-mis-slug' ||
            inputs.script == 'reslug-suspicious-setkeys' ||
            inputs.script == 'run-ebay-finances-enrichment' ||
            inputs.script == 'run-ebay-order-poll' ||
            inputs.script == 'run-ebay-purchase-sync' ||
            inputs.script == 'score-all-sold-comps'
          ) }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: ./.github/actions/relaunch-on-marker
        with:
          outcome: ${{ steps.backfill.outcome }}
          script: ${{ inputs.script }}
          budget-notice: |
            W=$(grep -aoE "reconciled: [a-z]+ [0-9,]+ = [a-z]+ [0-9,]+" /tmp/backfill.log | tail -1 || true)
            echo "::notice::budget hit on ${{ inputs.script }} (${W:-no reconcile line}) — re-dispatching to continue"
          finished-notice: |
            echo "::notice::${{ inputs.script }} finished within budget — done, no re-dispatch."
          dispatch: |
            gh workflow run backfill-runner.yml --repo "$GITHUB_REPOSITORY" --ref main -f script="${{ inputs.script }}" -f apply="${{ inputs.apply }}" -f scope="${{ inputs.scope }}"

      - name: Self-relaunch until composite backfill fully drains
        # CF-COMPOSITE-BACKFILL-SELF-RELAUNCH (Drew, 2026-07-30). Composite
        # backfill covers ~3.4M sold_comps rows and one 150-min iteration
        # can't drain the whole corpus. This step runs a cheap TOP-1
        # existence query — if ANY row still lacks the target composite
        # field, it re-dispatches this workflow with the same params.
        # Runs until the corpus is fully enriched, no manual re-dispatch.
        #
        # Fires for BOTH composite backfill scripts (v1 checks
        # `c.composite`, v3 checks `c.composite.era`) and only in apply
        # mode. `always()` so a timed-out backfill step still triggers a
        # re-dispatch — resumable-by-design.
        if: ${{ !cancelled() && (inputs.script == 'backfill-composite-fields' || inputs.script == 'backfill-composite-v3') && inputs.apply == true }}
        env:
          GH_TOKEN: ${{ github.token }}
          COMPOSITE_SCRIPT: ${{ inputs.script }}
        shell: bash
        # CF-COMPOSITE-SELF-RELAUNCH-CWD-FIX (Drew, 2026-07-30). Run
        # from backend/ so `require('@azure/cosmos')` resolves. Earlier
        # runs failed at this step with "Cannot find module '@azure/cosmos'"
        # which caused the self-relaunch to skip — killing the loop
        # after 09:38 UTC on 2026-07-30.
        working-directory: backend
        run: |
          set +e
          # v3 checks composite.era (added by enrichCompositeV3); v1
          # checks composite existence itself.
          if [ "$COMPOSITE_SCRIPT" = "backfill-composite-v3" ]; then
            PROBE_QUERY="SELECT TOP 1 c.id FROM c WHERE NOT IS_DEFINED(c.composite.era)"
          else
            PROBE_QUERY="SELECT TOP 1 c.id FROM c WHERE NOT IS_DEFINED(c.composite)"
          fi
          REMAINING=$(node -e "
            const { CosmosClient } = require('@azure/cosmos');
            (async () => {
              const c = new CosmosClient(process.env.COSMOS_CONNECTION_STRING);
              const container = c.database(process.env.COSMOS_DATABASE || 'hobbyiq').container('sold_comps');
              const { resources } = await container.items.query({
                query: process.env.PROBE_QUERY
              }).fetchAll();
              console.log(resources.length > 0 ? 'MORE' : 'DONE');
            })().catch(e => { console.error('check-error:', e.message); process.exit(2); });
          " 2>&1)
          RC=$?
          echo "check_output=$REMAINING (rc=$RC)  script=$COMPOSITE_SCRIPT"
          if [ "$RC" -ne 0 ]; then
            echo "::warning::Composite coverage check FAILED — skipping self-relaunch. Manual re-dispatch will be needed."
            exit 0
          fi
          if [ "$REMAINING" = "MORE" ]; then
            echo "::notice::$COMPOSITE_SCRIPT still has rows — re-dispatching workflow with same params"
            gh workflow run backfill-runner.yml \
              --repo "$GITHUB_REPOSITORY" \
              --ref main \
              -f script="$COMPOSITE_SCRIPT" \
              -f apply=true \
              -f concurrency="${{ inputs.concurrency }}"
            echo "Re-dispatch queued. This workflow exits; new run continues the drain."
          else
            echo "::notice::$COMPOSITE_SCRIPT COMPLETE — 0 rows remaining. No re-dispatch."
          fi

      - name: Self-relaunch bulk-import until date-window hits END_DATE
        # CF-BULK-IMPORT-SELF-RELAUNCH (Drew, 2026-07-30). Bulk import
        # walks backward through ch_daily_sales in 7-day slices, capped
        # at BULK_LIMIT=500K rows per iteration. To cover the full 8yr
        # corpus (~18M rows/yr), the script must re-dispatch itself with
        # the "next start date" as its new BULK_START_DATE. Reads the
        # printed "next start date:" line from the log, then re-dispatches
        # if the date is still > END_DATE (2018-01-01 default).
        if: ${{ !cancelled() && inputs.script == 'bulk-import-ch-daily-to-sold-comps' && inputs.apply == true }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          NEXT_START=$(grep -oE 'next start date:\s+[0-9-]+' /tmp/backfill.log 2>/dev/null | tail -1 | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' | head -1 || true)
          END_DATE="${{ inputs.bulk_end_date }}"
          [ -z "$END_DATE" ] && END_DATE="2018-01-01"
          echo "next_start=$NEXT_START  end_date=$END_DATE"
          if [ -z "$NEXT_START" ]; then
            echo "::warning::Could not parse next start date from log — no self-relaunch. Manual re-dispatch will be needed."
            exit 0
          fi
          if [ "$NEXT_START" \> "$END_DATE" ]; then
            echo "::notice::Bulk import has more history to cover — re-dispatching with BULK_START_DATE=$NEXT_START"
            gh workflow run backfill-runner.yml \
              --repo "$GITHUB_REPOSITORY" \
              --ref main \
              -f script=bulk-import-ch-daily-to-sold-comps \
              -f apply=true \
              -f concurrency="${{ inputs.concurrency }}" \
              -f bulk_start_date="$NEXT_START" \
              -f bulk_end_date="$END_DATE"
            echo "Re-dispatch queued. This workflow exits; new run continues walking backward."
          else
            echo "::notice::Bulk import reached END_DATE ($END_DATE). Full corpus back-import complete."
          fi

      - name: Self-relaunch catalog expansion until RELAUNCH_NEEDED=false
        # CF-CATALOG-EXPANSION-SELF-RELAUNCH (Drew, 2026-08-01). A script on
        # this list prints RELAUNCH_NEEDED=true when there are still tuples to
        # process. The script self-caps to ~25 min per invocation; this step
        # re-dispatches the workflow immediately so it continues in a fresh
        # runner. Loops until the script emits RELAUNCH_NEEDED=false.
        #
        # FIVE LANES LEFT THIS LIST in the #1944 ratchet's wave 2 --
        # normalize-catalog-schema, dedupe-catalog-by-hobbyiq,
        # backfill-searchtokens-all-sports, fix-catalog-parallel-as-player and
        # auto-label-catalog-variants -- and are now gated by the wave-2 marker
        # step above. They are removed HERE rather than left on both gates:
        # two steps reacting to the same stop would re-dispatch it twice.
        #
        # WHY THEY LEFT, because it is the same bug this file has fixed twice
        # already in the other protocol. The three-arm logic below has only two
        # real arms: `true` re-dispatches, `false` stops, and anything else --
        # INCLUDING THE EMPTY STRING A KILLED STEP LEAVES, since a killed step
        # prints no line at all -- reaches the `::warning::` at the bottom,
        # which does NOT fail the job. So a lane killed at the 150-minute
        # ceiling went green with its work half done. That is #1906's "a killed
        # run is not a finished run" defect, and the pin that governs it
        # (relaunchNeverCallsAKilledRunFinished.test.ts) does not see this step,
        # because its population is the MARKER-keyed relaunches.
        #
        # THREE MORE LEFT IN WAVE 4 -- drain-staging-backlog, rescore-anomalies
        # and score-all-sold-comps -- and are now gated by the wave-4 marker
        # step above, for the same reason. That empties the ratchet.
        #
        # >>> THE TWO NAMES LEFT BELOW ARE NOT DISPATCHABLE AT ALL. <<<
        #
        # backfill-catalog-cs-images and backfill-cs-card-population were both
        # REMOVED from the `script` dropdown under CF-CS-KILL-SWITCH (Drew,
        # 2026-08-02) when the Cardsight API calls were halted -- they are
        # commented out of the options list twice over, at the top of this file.
        # They are absent from the ratchet for that reason and not because they
        # are budgeted: both still read BACKFILL_APPLY and declare no clock, and
        # the census population is the dropdown, because a script nobody can
        # dispatch cannot time a step out.
        #
        # SO THIS GATE'S SURVIVING ARMS ARE UNREACHABLE, and worse than merely
        # dead: `inputs.script` is a `choice`, so no dispatch can ever set it to
        # either name, and the `gh workflow run ... -f script=<name>` inside
        # this step would be REJECTED by the API if one somehow did. Left as-is
        # deliberately rather than deleted: if the kill switch is ever lifted,
        # these two come back to the dropdown and land straight on the ratchet's
        # hard rule (backend/tests/runnerBudgetMargin.test.ts), which will fail
        # CI by name until they are budgeted -- and this step is where the
        # reader will look to find out what used to relaunch them. Deleting it
        # would hide that, and the whole point of the ratchet becoming a hard
        # rule is that a lane cannot re-enter the dropdown unbudgeted and quiet.
        #
        # ONE MORE LANE LEFT THIS LIST in the #1944 ratchet's wave 3 --
        # reaudit-cardsight-unverified -- and is now gated by the wave-3 marker
        # step above, for the same reason the five in wave 2 left: this step's
        # third arm is a `::warning::` that does not fail the job, so the empty
        # string a KILLED step leaves reads as neither `true` nor `false` and the
        # run goes GREEN with its work half done. It is removed HERE rather than
        # left on both gates: two steps reacting to the same stop would
        # re-dispatch it twice.
        #
        # THREE MORE LEFT IN WAVE 4 -- drain-staging-backlog, rescore-anomalies
        # and score-all-sold-comps -- and are now gated by the wave-4 marker
        # step above, for the same reason. That empties the ratchet.
        #
        # >>> THE TWO NAMES LEFT BELOW ARE NOT DISPATCHABLE AT ALL. <<<
        #
        # backfill-catalog-cs-images and backfill-cs-card-population were both
        # REMOVED from the `script` dropdown under CF-CS-KILL-SWITCH (Drew,
        # 2026-08-02) when the Cardsight API calls were halted -- they are
        # commented out of the options list twice over, at the top of this file.
        # They are absent from the ratchet for that reason and not because they
        # are budgeted: both still read BACKFILL_APPLY and declare no clock, and
        # the census population is the dropdown, because a script nobody can
        # dispatch cannot time a step out.
        #
        # SO THIS GATE'S SURVIVING ARMS ARE UNREACHABLE, and worse than merely
        # dead: `inputs.script` is a `choice`, so no dispatch can ever set it to
        # either name, and the `gh workflow run ... -f script=<name>` inside
        # this step would be REJECTED by the API if one somehow did. Left as-is
        # deliberately rather than deleted: if the kill switch is ever lifted,
        # these two come back to the dropdown and land straight on the ratchet's
        # hard rule (backend/tests/runnerBudgetMargin.test.ts), which will fail
        # CI by name until they are budgeted -- and this step is where the
        # reader will look to find out what used to relaunch them. Deleting it
        # would hide that, and the whole point of the ratchet becoming a hard
        # rule is that a lane cannot re-enter the dropdown unbudgeted and quiet.
        if: ${{ !cancelled() && (inputs.script == 'backfill-catalog-cs-images' || inputs.script == 'backfill-cs-card-population') && inputs.apply == true }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          RN=$(grep -E '^RELAUNCH_NEEDED=' /tmp/backfill.log 2>/dev/null | tail -1 | cut -d'=' -f2 || true)
          echo "RELAUNCH_NEEDED=$RN"
          if [ "$RN" = "true" ]; then
            echo "::notice::${{ inputs.script }} has more tuples — re-dispatching"
            gh workflow run backfill-runner.yml \
              --repo "$GITHUB_REPOSITORY" \
              --ref main \
              -f script="${{ inputs.script }}" \
              -f apply=true \
              -f concurrency="${{ inputs.concurrency }}"
            echo "Re-dispatch queued."
          elif [ "$RN" = "false" ]; then
            echo "::notice::${{ inputs.script }} COMPLETE — no more tuples. Loop stops."
          else
            echo "::warning::Could not parse RELAUNCH_NEEDED from log (got '$RN'). No re-dispatch. Manual re-run needed."
          fi
