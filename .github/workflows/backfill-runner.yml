          # entry (verdicted `ingested` by the run that minted its 396-row
          # cross-join) meant re-running that cross-join. `mode` needs no new
          # input: MODE is already exported below for every script, and no
          # other script's mode token is `refetch`.
          - ingest-universe-driver
