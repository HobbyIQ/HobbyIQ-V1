        # ride along so a sales-only or single-year dispatch continues as the
        # lane it started as.
        if: ${{ !cancelled() && inputs.script == 'repair-cpa-draft-refile' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        working-directory: backend
        run: |
          set +e
          N=$(grep -aoE "^  REFILED to the product the checklist names +[0-9,]+" /tmp/backfill.log | tail -1 | grep -oE "[0-9,]+$" | tr -d , || true)
          echo "refiled=${N:-0}"
          if grep -aqE "stopped at the .*budget" /tmp/backfill.log; then
            echo "::notice::budget hit (refiled=${N:-0}) — re-dispatching slot ${{ inputs.slot }}/${{ inputs.slots }} to continue"
            gh workflow run backfill-runner.yml --repo "$GITHUB_REPOSITORY" --ref main -f script=repair-cpa-draft-refile -f apply="${{ inputs.apply }}" -f concurrency="${{ inputs.concurrency }}" -f slot="${{ inputs.slot }}" -f slots="${{ inputs.slots }}" -f sports="${{ inputs.sports }}" -f years="${{ inputs.years }}" -f scope="${{ inputs.scope }}" -f mode="${{ inputs.mode }}" -f limit="${{ inputs.limit }}" -f parents_only="${{ inputs.parents_only }}"
          else
            echo "::notice::slot ${{ inputs.slot }}/${{ inputs.slots }} finished within budget (refiled=${N:-0}) — done, no re-dispatch."
          fi

      - name: Self-relaunch until composite backfill fully drains
        # CF-COMPOSITE-BACKFILL-SELF-RELAUNCH (Drew, 2026-07-30). Composite
        # backfill covers ~3.4M sold_comps rows and one 150-min iteration
        # can't drain the whole corpus. This step runs a cheap TOP-1
        # existence query — if ANY row still lacks the target composite
        # field, it re-dispatches this workflow with the same params.
        # Runs until the corpus is fully enriched, no manual re-dispatch.
        #
        # Fires for BOTH composite backfill scripts (v1 checks
        # `c.composite`, v3 checks `c.composite.era`) and only in apply
        # mode. `always()` so a timed-out backfill step still triggers a
        # re-dispatch — resumable-by-design.
        if: ${{ !cancelled() && (inputs.script == 'backfill-composite-fields' || inputs.script == 'backfill-composite-v3') && inputs.apply == true }}
        env:
          GH_TOKEN: ${{ github.token }}
          COMPOSITE_SCRIPT: ${{ inputs.script }}
        shell: bash
        # CF-COMPOSITE-SELF-RELAUNCH-CWD-FIX (Drew, 2026-07-30). Run
        # from backend/ so `require('@azure/cosmos')` resolves. Earlier
        # runs failed at this step with "Cannot find module '@azure/cosmos'"
        # which caused the self-relaunch to skip — killing the loop
        # after 09:38 UTC on 2026-07-30.
        working-directory: backend
        run: |
          set +e
          # v3 checks composite.era (added by enrichCompositeV3); v1
          # checks composite existence itself.
          if [ "$COMPOSITE_SCRIPT" = "backfill-composite-v3" ]; then
            PROBE_QUERY="SELECT TOP 1 c.id FROM c WHERE NOT IS_DEFINED(c.composite.era)"
          else
            PROBE_QUERY="SELECT TOP 1 c.id FROM c WHERE NOT IS_DEFINED(c.composite)"
          fi
          REMAINING=$(node -e "
            const { CosmosClient } = require('@azure/cosmos');
            (async () => {
              const c = new CosmosClient(process.env.COSMOS_CONNECTION_STRING);
              const container = c.database(process.env.COSMOS_DATABASE || 'hobbyiq').container('sold_comps');
              const { resources } = await container.items.query({
                query: process.env.PROBE_QUERY
              }).fetchAll();
              console.log(resources.length > 0 ? 'MORE' : 'DONE');
            })().catch(e => { console.error('check-error:', e.message); process.exit(2); });
          " 2>&1)
          RC=$?
          echo "check_output=$REMAINING (rc=$RC)  script=$COMPOSITE_SCRIPT"
          if [ "$RC" -ne 0 ]; then
            echo "::warning::Composite coverage check FAILED — skipping self-relaunch. Manual re-dispatch will be needed."
            exit 0
          fi
          if [ "$REMAINING" = "MORE" ]; then
            echo "::notice::$COMPOSITE_SCRIPT still has rows — re-dispatching workflow with same params"
            gh workflow run backfill-runner.yml \
              --repo "$GITHUB_REPOSITORY" \
              --ref main \
              -f script="$COMPOSITE_SCRIPT" \
              -f apply=true \
              -f concurrency="${{ inputs.concurrency }}"
            echo "Re-dispatch queued. This workflow exits; new run continues the drain."
          else
            echo "::notice::$COMPOSITE_SCRIPT COMPLETE — 0 rows remaining. No re-dispatch."
          fi

      - name: Self-relaunch bulk-import until date-window hits END_DATE
        # CF-BULK-IMPORT-SELF-RELAUNCH (Drew, 2026-07-30). Bulk import
        # walks backward through ch_daily_sales in 7-day slices, capped
        # at BULK_LIMIT=500K rows per iteration. To cover the full 8yr
        # corpus (~18M rows/yr), the script must re-dispatch itself with
        # the "next start date" as its new BULK_START_DATE. Reads the
        # printed "next start date:" line from the log, then re-dispatches
        # if the date is still > END_DATE (2018-01-01 default).
        if: ${{ !cancelled() && inputs.script == 'bulk-import-ch-daily-to-sold-comps' && inputs.apply == true }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          NEXT_START=$(grep -oE 'next start date:\s+[0-9-]+' /tmp/backfill.log 2>/dev/null | tail -1 | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' | head -1 || true)
          END_DATE="${{ inputs.bulk_end_date }}"
          [ -z "$END_DATE" ] && END_DATE="2018-01-01"
          echo "next_start=$NEXT_START  end_date=$END_DATE"
          if [ -z "$NEXT_START" ]; then
            echo "::warning::Could not parse next start date from log — no self-relaunch. Manual re-dispatch will be needed."
            exit 0
          fi
          if [ "$NEXT_START" \> "$END_DATE" ]; then
            echo "::notice::Bulk import has more history to cover — re-dispatching with BULK_START_DATE=$NEXT_START"
            gh workflow run backfill-runner.yml \
              --repo "$GITHUB_REPOSITORY" \
              --ref main \
              -f script=bulk-import-ch-daily-to-sold-comps \
              -f apply=true \
              -f concurrency="${{ inputs.concurrency }}" \
              -f bulk_start_date="$NEXT_START" \
              -f bulk_end_date="$END_DATE"
            echo "Re-dispatch queued. This workflow exits; new run continues walking backward."
          else
            echo "::notice::Bulk import reached END_DATE ($END_DATE). Full corpus back-import complete."
          fi

      - name: Self-relaunch catalog expansion until RELAUNCH_NEEDED=false
        # CF-CATALOG-EXPANSION-SELF-RELAUNCH (Drew, 2026-08-01). A script on
        # this list prints RELAUNCH_NEEDED=true when there are still tuples to
        # process. The script self-caps to ~25 min per invocation; this step
        # re-dispatches the workflow immediately so it continues in a fresh
        # runner. Loops until the script emits RELAUNCH_NEEDED=false.
        if: ${{ !cancelled() && (inputs.script == 'backfill-catalog-cs-images' || inputs.script == 'normalize-catalog-schema' || inputs.script == 'dedupe-catalog-by-hobbyiq' || inputs.script == 'backfill-cs-card-population' || inputs.script == 'drain-staging-backlog' || inputs.script == 'rescore-anomalies' || inputs.script == 'score-all-sold-comps' || inputs.script == 'reaudit-cardsight-unverified' || inputs.script == 'backfill-searchtokens-all-sports' || inputs.script == 'fix-catalog-parallel-as-player' || inputs.script == 'auto-label-catalog-variants') && inputs.apply == true }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          RN=$(grep -E '^RELAUNCH_NEEDED=' /tmp/backfill.log 2>/dev/null | tail -1 | cut -d'=' -f2 || true)
          echo "RELAUNCH_NEEDED=$RN"
          if [ "$RN" = "true" ]; then
            echo "::notice::${{ inputs.script }} has more tuples — re-dispatching"
            gh workflow run backfill-runner.yml \
              --repo "$GITHUB_REPOSITORY" \
              --ref main \
              -f script="${{ inputs.script }}" \
              -f apply=true \
              -f concurrency="${{ inputs.concurrency }}"
            echo "Re-dispatch queued."
          elif [ "$RN" = "false" ]; then
            echo "::notice::${{ inputs.script }} COMPLETE — no more tuples. Loop stops."
          else
            echo "::warning::Could not parse RELAUNCH_NEEDED from log (got '$RN'). No re-dispatch. Manual re-run needed."
          fi
