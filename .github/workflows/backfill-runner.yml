          # mode was not write-free, then recreates every quarter's basket
          # from that quarter's OWN trailing window (no lookahead) and
          # recomputes the stored 180-day series under the unified method.
          #
          # REPORT BY DEFAULT. The default dispatch writes nothing and is
          # provably write-free: the recompute is driven through a
          # container facade whose every write method throws, and the run
          # asserts the attempted-write count is zero. `apply=true` (which
          # this workflow already exports as BACKFILL_APPLY) is what turns
          # on the delete and the persist.
          #
          # A stray is condemned by TWO markers, never by a date: it is
          # cited by no stored index point, AND it carries no
          # builtBy:"apply" stamp from the path that legitimately writes.
          # `sports` narrows the scope; the purge never touches a sport the
          # dispatch did not name.
          - rebuild-market-indexes
          # CF-TIFFANY-IS-A-PRODUCT (Drew, 2026-09-01, restated 2026-09-04).
          # Tiffany has its own setKey (topps-tiffany / topps-traded-tiffany /
          # bowman-tiffany) and a BLANK parallel; a row filed
          # `parallel: "Tiffany"` on the paper product is a SPLIT POOL. MODE is
          # REQUIRED and has no default:
          #   MODE=catalog  retire the rung row (a MARKER -- retired/retiredAt
          #                 /retiredIntoSetKey -- never a delete) when the
          #                 sibling already holds that cardNumber; otherwise
          #                 CONVERT it into the sibling product row through
          #                 moveCatalogRow, so a checklist-backed incumbent
          #                 wins on authority and is never downgraded.
          #   MODE=pool     re-key the sold_comps rows -- cardId AND
          #                 hobbyiqCardId -- onto the sibling identity, keeping
          #                 the grade and auto segments, ONLY when the row's own
          #                 title states Tiffany. The 93 rows whose title says
          #                 "Base" under a :tiffany: slug are report-only
          #                 CONFLICT: moving one carries a base sale into the
          #                 Tiffany pool.
          # THE SIBLING GATE is a live per-(sport,year) count, not a compiled
          # list: fleer / fleer-update / fleer-tradition / base-set have NO
          # Tiffany product, so those 1,215+ rungs are reported and LEFT
          # (acquire before retire). Acquiring the checklist arms them by
          # itself. No new dispatch input -- mode/years/scope/sports/limit and
          # slot/slots are the shared ones above.
          - repair-tiffany-rung-to-product
          # CF-TIFFANY-IS-A-PRODUCT, the two gaps #1745 left. MODE is REQUIRED:
          #   MODE=pool     enumerate THE POOL directly (slug `:tiffany:` OR
          #                 parallel ~ tiffany) rather than from the catalog's
          #                 rung groups -- #1745 walked the catalog, so the
          #                 2,127 comps with no rung row to hang off survived
          #                 it. The sibling is resolved from the STAGED
          #                 checklists, never by appending "-tiffany": #1748
          #                 minted 1987-1989 Fleer as `fleer-glossy` (the
          #                 Glossy Tin) and 1996/1997/2002 as `fleer-tiffany`,
          #                 so a naming rule would route a third of the
          #                 population to a product that will never exist. Two
          #                 gates, reported separately: is a checklist STAGED,
          #                 and has it been INGESTED (a staged CSV cannot
          #                 receive a comp). The title guard is unchanged.
          #   MODE=num1951  retire the 132 rows whose id carries a navbox YEAR
          #                 as a print run (`num-1951`, read from "Topps
          #                 (flagship) Classic Era: 1951") and/or whose
          #                 parallel NAMES the sibling product. Found BY SHAPE
          #                 (a year-shaped run, 1900-2100), never by the
          #                 literal 1951 -- the captured number is whatever
          #                 leads that page's navbox. RETIRE, not convert: the
          #                 staged 1991 checklist already carries the 132
          #                 correct rows with a BLANK print run.
          # No new dispatch input; mode/years/scope/sports/limit/slot/slots.
          - repair-tiffany-pool-enumeration
          # CF-CARDYEAR-IS-A-MIRROR, the stored half (2026-09-04). #1769 fixed
          # the READER (`(c.cardYear = @y OR c.year = @y)`) and the WRITER
          # (deriveCatalogEntry + the checklist ingest dual-write); neither
          # reaches a row already stored. Measured read-only against prod
          # 2026-09-04: 2,100,230 card_catalog rows carry `year` and NO
          # `cardYear`, and every consumer still filtering on cardYear alone
          # misses all of them -- 1,521,172 baseballcardpedia-ladders,
          # 373,603 hobbymonitor, 205,013 sportscardchecklist, 423 tcgdex-ja,
          # 19 seed/user rows.
          #
          # The ruling: stamp cardYear on EVERY row whose SLUG carries a year,
          # regardless of source. cardYear is a MIRROR of the identity year in
          # the slug, never a second fact and never an assertion about the card,
          # so no source is excluded -- a mirror present on a checklist row and
          # absent on a vendor row is exactly the inconsistency being repaired.
          # Authority is still decided by `source`, everywhere, unchanged.
          #
          # `sources` carries the per-lane source scope (comma-separated; empty
          # sweeps every source) -- an EXISTING input, because the dispatch form
          # is at 24 of GitHub's 25. `apply` drives BACKFILL_APPLY as usual, and
          # sharding is OPT-IN through the #1765 helper: the inherited
          # slot=0/slots=16 prints "sweeps EVERY row" rather than covering a
          # sixteenth. Reconciliation is intended = written + skipped + failed,
          # and the run COUNTs rows-missing-cardYear per source before AND after
          # itself -- the banner cannot certify the write.
          - backfillCatalogCardYearFromSlug
          # CF-AN-ALIAS-IS-NOT-A-SECOND-POOL (2026-09-04) -- the WRITE half of
          # #1783. Declaring a RULED_ALIAS fixes the deriver and moves no stored
          # row: post-alias the census sees stored identity == derived key and
          # calls those rows AGREE, and AGREE is never written -- so the pool
          # stays split on the OLD segment while the holding re-derives onto
          # the ruled key. This lane re-keys segment 3 of cardId AND
          # hobbyiqCardId (the exact pool reader ORs them) to the ruled key,
          # through relocateSoldComp: upsert, read back, then delete -- a sale
          # is never lost. Every other segment is carried byte for byte (D28:
          # surgery, never a recompute). The alias list is READ from
          # ruledAliases(), never retyped, so it cannot drift from the ruling.
          # `scope` is REQUIRED and names the RULED KEY (the destination); the
          # inherited "refractor" and an unruled key both REFUSE with exit 1
          # before a Cosmos client is built. `years`/`sports` narrow the sweep
          # and make the BEFORE/AFTER pool counts index-served. Sharding is
          # OPT-IN via the #1765 helper. Catalog rows on an alias slug are
          # REPORTED (count + sources) and NEVER written.
          - reslug-ruled-alias
          # CF-FINISH-FAMILY-COLLISION (Drew, 2026-09-05) -- the WRITE half of
          # #1790. A row whose TITLE names a finish the stored slug lacks
          # ("Gold Shimmer /50" stored as gold-refractor) is a sale of the card
          # the TITLE names, when the title-stated identity is CHECKLIST-BACKED
          # and the stored row is not user-verified / ruled. #1790 made that
          # population VISIBLE (finishFamilyCollision now reads the hiq:
          # address from either identity field) and it stays REPORT-ONLY inside
          # the rematch: the subclass sets a tag, never `writable`, and
          # SPECIALIZATION-STATED's L4 leg refuses any parallel-axis move. This
          # lane is the targeted refile, over a NAMED scope.
          #
          # `scope` is REQUIRED and carries a comma-separated PRODUCT LIST as
          # sport:year:setKey -- the axis chosen because only a product list
          # lets a whole-scope write NAME its ruling: a finish family is a WORD
          # and a word spans every product that ever printed it. There is no
          # 'all' in EITHER mode, and the inherited `scope=refractor` is
          # REFUSED (exit 2) -- a report over an unnamed scope is how an apply
          # over an unnamed scope gets authorised.
          #
          # Five assertions must ALL hold per row, and they live in
          # lib/finish-collision-refile.cjs so the tests pin the code that
          # runs: (1) the CLASSIFIER's own finishFamilyCollision flags it --
          # not a second title reader; (2) the destination differs from the
          # stored slug on the parallel/printRun segments ALONE; (3) the
          # destination is checklist-backed, corpus AND catalog, read
          # cardYear-aware; (4) the row is AUTO tier -- ruled and user rows are
          # report-only forever; (5) the title's finish word does not name two
          # card families at the number, and unanswerable counts as ambiguous.
          - repair-finish-collision-refile
          # repair-bowman-product-refile -- a Bowman CPA/BCP card, and its
          # sales, go back to the product they came out of.
          # CF-IT-CAME-OUT-OF-BOWMAN (Drew 2026-08-13, re-affirmed 2026-09-05:
          # "chrome stock is a property of the card, not the name of the
          # product"). #1800 stopped the MINT; this moves what is stored.
          #
          # scope is REQUIRED and is a comma-separated list of products as
          # sport:year:setKey. There is no 'all' in EITHER mode and the
          # inherited `scope=refractor` is REFUSED (exit 2). `mode` selects the
          # lane: catalog | sales | both (default both).
          #
          # THE ABSOLUTE GUARD: no move may land one player's row on another
          # player's address. Nine 2026 CPA/BCP numbers name two DIFFERENT
          # players (CPA-AG = Adrian Gil in Bowman AND Angeibel Gomez in Bowman
          # Chrome); every refusal is reported with BOTH names. A SALE on a
          # collision number whose player cannot be read PARKS rather than
          # pooling -- Drew: "never default to either side".
          #
          # The sales half is time-critical: zero 2026 Bowman Chrome sales
          # exist yet, so the 10,532 rows on that stem are Bowman sales at a
          # Chrome address. Once real Chrome sales arrive they land on top and
          # two players price as one card with no way back.
          - repair-bowman-product-refile
          # repair-cpa-draft-refile -- #1824 stopped the MINT (the CPA- rule in
          # CHROME_PREFIX_OVERRIDES now carries maxYear: 2022, because Bowman
          # DRAFT began numbering its chrome prospect autos CPA- in 2023). It
          # moved nothing already stored.
          #
          # Measured read-only 2026-09-05: the CATALOG is clean -- 43,273 CPA
          # rows in 2023-2025 and only TEN are wrong, all ingest-auto-seed --
          # because the checklist ingests pass authoritativeSetKey and never
          # consulted the override. The SALES are not: 20,083 chrome-stem CPA
          # sales name a player a bowman-draft checklist claims and no
          # bowman-chrome one does.
          #
          # Its scope is a (year, from-key, to-key) TRIPLE, not the pair the
          # Bowman refile takes: these rows' setKey FIELD and id STEM AGREE and
          # are both wrong, so there is no drift to read a destination from and
          # the destination must be NAMED. Scopes are 2023-2025; it does not
          # overlap the Bowman refile's baseball:2026:bowman-chrome.
          - repair-cpa-draft-refile
          # repair-clc-signature-unsigned -- the clc rows whose parallel SAYS
          # the card is signed and whose flag says it is not.
          #
          # #1831 stopped the MINT: the converter's auto decision now reads the
          # WHOLE Set value, so "Jumbo Rookie Signature Swatches Gold Prizm" is
          # an autograph. It moved nothing already stored.
          #
          # RE-MEASURED 2026-09-06, per (sport, year), read-only: 79,000
          # actionable rows -- NOT the 74,448 #1831 reported, because a
          # `checklistcenter-2026-09-05` pass staged 4,552 more before the fix
          # merged. The first post-fix pass (checklistcenter-2026-09-06,
          # 942,188 rows) contributes ZERO, which is the fix confirmed on
          # stored data. Biggest cells: baseball:2023 43,915, baseball:2026
          # 13,374, baseball:2025 12,835.
          #
          # A RE-INGEST CANNOT FIX THESE: isAuto is segment 6 of the canonical
          # id, so the fixed converter mints at the `:auto` address and leaves
          # the wrong `:no-auto` row standing beside it -- a second row and a
          # split pool. patchCatalogRowFields refuses the field by design
          # (changing where a row LIVES is a move), so the lane calls
          # moveCatalogRow, which folds onto an existing `:auto` twin rather
          # than duplicating it.
          #
          # scope is REQUIRED and is a comma-separated list of cells as
          # sport:year. There is no 'all' in any mode and the inherited
          # `scope=refractor` is REFUSED (exit 2). `mode` selects the lane:
          # catalog | sales | both (default both).
          #
          # THE SALES ARE MEASURED AND ARE (TODAY) NONE: 26,209 actionable
          # slugs across the two largest cells hold ZERO sold_comps rows, read
          # exhaustively on BOTH identity fields (a control over unrestricted
          # clc rows in the same cell found 139/300 slugs with 609 sales, so
          # the reader works). The matcher never routes an auto sale to a
          # `:no-auto` address, so the pool stayed empty rather than wrong.
          # When a sale does exist it rides ONLY if its own title states an
          # autograph -- a title that says nothing is PARKED, never moved,
          # and parked rows are their own term in the reconciliation.
          - repair-clc-signature-unsigned
      apply:
        description: "Actually write (true) or dry-run only (false)"
        required: true
        type: boolean
        default: false
      concurrency:
        description: "Parallel patch workers (leave default unless tuning)"
        required: false
        default: "16"
      bulk_start_date:
        description: "For bulk-import-ch-daily-to-sold-comps: start walking backward from this date (YYYY-MM-DD). Empty = today. Used by self-relaunch to resume from where the previous run stopped."
        required: false
        default: ""
      bulk_end_date:
        description: "For bulk-import-ch-daily-to-sold-comps: stop at this date (YYYY-MM-DD). Default 2018-01-01."
        required: false
        default: ""
      card_numbers:
        description: "For backfill-cardsight-title-identity: comma-separated cardNumbers to scope the scan (e.g. CPA-EHA,CPA-JHA). Empty = scan all. For rekey-product-setkey (MODE=catalog or MODE=pool, 2026-09-25): OPTIONAL comma-separated card-number PREFIXES (e.g. bma-,rma-,bst-,es-) or exact numbers, matched case-insensitively as ^<prefix> against the id's own cardNumber segment -- narrows a whole-product fold to a card-number SUBSET (e.g. 2026 Mega Box's BMA-/RMA-/BST-/ES-/Mojo numbers under bowman-chrome -> bowman-mega, leaving the rest of bowman-chrome untouched). Empty = every card number in the FROM key is in scope, same as before this option existed. Read as BACKFILL_CARD_NUMBERS, same env both scripts share; the two are never dispatched together."
        required: false
        default: ""
      slot:
        description: "Which partition this run owns (0..slots-1). Dispatch once per slot. Used by normalize-catalog-format and rehome-catalog-rows-to-own-partition."
        required: false
        default: "0"
      slots:
        description: "Total partitions. normalize splits by year; rehome splits a YEAR by setKey letter range, so SLOTS=4 with the same YEARS runs one year four ways."
        required: false
        default: "16"
      scope:
        description: "For repair-refractor-mislabel: 'refractor' (plain segment only) or 'all' (every parallel pool). For rename-setkey-to-product MODE=product: comma-separated ruled product keys (e.g. topps-series-1,leaf-metal); the default here or 'all' = every ruled product. NOTE the default is 'refractor' and it is INHERITED, not chosen -- for triage-contenthash-collisions and consolidate-catalog-duplicates it narrows NOTHING (both read SCOPE only as the 'all' escape hatch for the no-sports/no-years refusal), so the triage now REFUSES any non-'all' value rather than ignoring it: pass scope=all with those two and narrow with sports/years/slot instead. For rematch-sold-comps MODE=apply-improve this is the APPLY CLASS SCOPE: 'base-eviction' | 'improve' | 'both' -- REQUIRED, and the inherited default 'refractor' is REFUSED (exit 2), because an apply names the class it writes. MODE=census ignores it. ALSO the three RULED SCOPES of 2026-09-06, each armed ONLY by its own name and deliberately NOT by 'improve'/'both'/'all' (every fleet dispatch in flight predates the rulings): 'grade-from-title' -- a FIELD BACKFILL, not a re-key: stamps gradeCompany/gradeValue on rows whose title states a grader token and whose grade fields are empty, at the row's EXISTING address (the slug carries no grade segment; see CF-CARD-IDENTITY-VS-GRADE). 'year-from-title-vintage' -- moves a vintage sale off the slug year that is really its SALE year onto the title's issue year (#1890's class). 'sport-from-product' -- a card's sport is the PRODUCT's sport, read from the product's own checklist; multi-sport products are refused by name. ALSO 'revert-eviction' on the SAME script and mode: the UNDO. It moves the rows a base-eviction wave wrote whose titles G6 now refuses back to the slug their own rekeyedFrom marker recorded, arms NO write class, and is refused if combined with one (a run cannot revert and write at once). It shards on sha1(id) rather than the 32-slot year table, so slots=1 is correct for it. For repair-rc-marker-playername and rekey-catalog-id-to-setkey: REQUIRED comma-separated `sport:year` cells (e.g. hockey:2024,hockey:2025) -- the inherited default 'refractor' and the values '' / 'all' are all REFUSED (exit 2) for both; there is no whole-source sweep. For revert-set-sport-repair (R76): REQUIRED, either the literal 'all-repaired' (typed explicitly -- sweeps every row this lane can reach) or a comma-separated list of `setKey|year` cells (note the pipe, not a colon -- e.g. fleer|1988,score|1989) parsed from each row's OWN hobbyiqCardIdBefore; the inherited defaults ('', 'refractor', 'all') are all REFUSED (exit 2), and 'all' is deliberately NOT accepted as a synonym for 'all-repaired' -- a whole-source restore needs its own name. The pilot dispatch is scope=fleer|1988. For resolve-split-identity-parks (R80): REQUIRED, either the literal 'all-splits' (typed explicitly) or a comma-separated list of `sport:year` cells (colon, not the model lane's pipe -- e.g. basketball:2023,baseball:2023), matched against EITHER candidate id's own sport/year since a parked split-identity row disagrees on sport by definition; the inherited defaults ('', 'refractor', 'all') are all REFUSED (exit 2), and 'all' is deliberately NOT a synonym for 'all-splits'. The pilot dispatch (the Wembanyama cells) is scope=basketball:2023."
        required: false
        default: "refractor"
        type: string
      setkey_like:
        description: "Substring the setKey must contain (e.g. bowman). EMPTY = every setKey. Read by dedupe-catalog-partition-shadows and rehome-catalog-rows-to-own-partition. NOTE retire-wiki-footer-catalog-rows reads this as a COMMA-SEPARATED LIST OF EXACT setKeys (it matches `c.setKey IN (...)`, never a substring) and REFUSES an empty value -- its population is 3,136 rows across 585 distinct setKeys, so naming one product per dispatch would take 585 dispatches; the refusal that guards it is 'say which products', not 'say ONE product'. For rematch-sold-comps it is half of the IN-SLOT ROW FILTER (2026-09-07): a PREFIX on the row's STORED setKey segment, `-` bounded, so `panini-prizm` selects `panini-prizm` and every `panini-prizm-*` specialization and nothing else. It narrows the rows a slot CLASSIFIES, never the rows a slot OWNS -- the measured 32-slot shard table is untouched and slots stay disjoint -- and the banner prints the filter plus the counts skipped-by-filter vs classified."
        required: false
        default: ""
        type: string
      phases:
        description: "For ingest-checklists-end-to-end: which phases to run (beckett,insider,bcp,tcgdexja). Empty = all."
        required: false
        default: ""
        type: string
      titles:
        description: "For ingest-checklists-end-to-end (bcp phase): extra baseballcardpedia page titles, comma-separated (e.g. 2012_Topps_Allen_and_Ginter,1990_Donruss). Empty = the per-year flagship list. For rekey-product-setkey: the TO setKey -- the product the rows move ONTO (e.g. japanese-rocket-gang); `setkey_like` is the FROM key. For repair-rc-marker-playername: an OPTIONAL comma-separated setKey filter narrowing `scope`'s sport:year cells. For rekey-catalog-id-to-setkey: the REQUIRED comma-separated target setKey list whose id should adopt its own setKey field (e.g. upper-deck-extended-series) -- empty or a wildcard ('all','*') is refused; `scope` carries the required sport:year cells (e.g. hockey:2024,hockey:2025). For resolve-split-identity-parks: OPTIONAL comma-separated substring filter matched case-insensitively against the sale's own title (e.g. topps now,panini prizm) -- narrows a `scope` sweep to one product family for a pilot; empty = no filter. ALSO for resolve-split-identity-parks: one or both of two `;`-joined segments (e.g. exclude-winner:a,b;exclude-id:x,y) -- `exclude-winner:<id>[,<id>...]` names one or more WINNER candidate ids to leave PARKED untouched this run instead of resolving to them (named `excluded-by-operator`); `exclude-id:<id>[,<id>...]` (2026-09-20) names one or more sold_comps DOCUMENT ids to leave PARKED untouched, row-level, checked before any catalog read (named `excluded-by-operator-id`). Both fold case, echo the id as-dispatched in the startup banner, print a per-id match count with a loud warning on zero matches, and REFUSE (exit 2) if a segment carries no usable ids; once either prefix is used every `;`-segment must recognise one of the two, and the ordinary title-substring filter is unavailable on that same dispatch."
        required: false
        default: ""
        type: string
      sources:
        description: "Comma-separated catalog sources (SOURCES env) -- REQUIRED for retire-exploded-checklist-rows mode=source, for audit-source-coverage (the OLD sources; `scope` is the replacement source), and for rename-setkey-to-product mode=hyphen (the sources whose hyphen-free card numbers fold onto the checklist's spelling, e.g. bccp). For backfillCatalogCardYearFromSlug it is the per-lane source scope and is OPTIONAL: empty sweeps EVERY source, which is the ruling (cardYear is a mirror, so it is source-agnostic); name one source to run a lane at a time."
        required: false
        type: string
        default: ""
      min_coverage_pct:
        description: "For retire-exploded-checklist-rows mode=source and audit-source-coverage: a product is retired only when the replacement source covers at least this % of its (cardNumber, parallel, printRun) keys; below it the product is KEPT."
        required: false
        type: string
        default: "95"
      years:
        description: "Optional comma-separated years to scope a run (e.g. 1950,1955). Empty = all years."
        required: false
        default: ""
      limit:
        description: "For rehome-catalog-rows-to-own-partition: stop after N rows are moved. 0 = no limit. Use a small number to prove a slice before running it wide."
        required: false
        default: "0"
        type: string
      scan_limit:
        description: "For rehome-catalog-rows-to-own-partition: stop SCANNING after N rows. Lets a dry-run size a slice without walking all of it. 0 = no limit."
        required: false
        default: "0"
        type: string
      sports:
        description: "For reslug-tcg-out-of-sports-namespace: which non-sport categories to sweep (comma-separated). Empty = all of them. For rematch-sold-comps it is the other half of the IN-SLOT ROW FILTER (2026-09-07): a comma list matched against the row's OWN sport segment (e.g. soccer). It exists because the shard table's SPORT_CLASSES names only baseball/football/basketball/pokemon -- every other vertical rides the `other` catch-all or an undifferentiated whole-year unit, so there was no dispatch that could read one sport's rows and nothing else. Filters the rows CLASSIFIED, not the rows OWNED."
        required: false
        default: ""
        type: string
      parents_only:
        description: "Two meanings, and only ONE script reads the value itself. For rehome-catalog-rows-to-own-partition: only move identity rows, skipping graded rows (which are regenerable from their parent). For every lane on the SHARD line (repair-tiffany-*, retire-self-derived-identities, repair-bowman-product-refile, rekey-product-setkey, repair-finish-collision-refile, reslug-ruled-alias, repair-cpa-draft-refile, repair-clc-signature-unsigned) it is the SHARD OPT-IN: pass true with slot=0 so slot 0 of a real fan-out is a chosen shard rather than the runner's inherited default. Slots 1..15 shard on their non-zero slot and do not need it. Leave false for a full sweep."
        required: false
        default: false
        type: boolean
      mode:
        description: "For canonicalize-vendor-shaped-rows: 'vendor' (id is not a hiq slug) or 'nopk' (cardId missing entirely). For repair-parallel-subset-fold: 'prefix' or 'glue'. For rename-setkey-to-product: 'product' (the catalog rename, sharded), 'hyphen' (needs sources), 'holdings' (slot 0), 'estimate' (read-only counts). For repair-card-number-from-title (D28): 'grade' | 'slash' | 'ordinal' | 'year' | 'nonumber' | 'all' (needs scope=all) -- REQUIRED, no default. For clean-base-cards-parallel-slug: 'cards' | 'subset' | 'both' (needs scope=all) -- REQUIRED. For measure-card-number-integrity: 'grade' | 'shapes' | 'months' | 'catalog-year'. For repair-bcp-misfiled-parallels (D33): 'card-as-parallel' (retire the rows whose parallel is another card) | 'chrome-ladder' (move the refractor ladder from the paper number to the chrome one) | 'first-edition' (move 1st Edition rows to their own product) | 'names' (the comma before Jr./Sr./II) | 'number-glued' (black-1 -> black:num-1) -- REQUIRED, no default. For rekey-product-setkey: 'catalog' (move the catalog rows by id stem) | 'pool' (re-key the sold_comps rows; REQUIRES years) | 'holdings' (conform the holdings, slot 0) -- REQUIRED, no default. For backfill-searchtokens-all-sports: 'recompute-stale' widens the scan past the missing-tokens predicate (a STALE row satisfies neither half of it) and rewrites only rows the coverage canary's own classifyRowTokens calls stale; pass the sport in `sports`. For repair-rc-marker-playername (RULING R72, 2026-09-19): 'rc' (default, empty = rc) | 'rr' | 'dp' | 'tc' | 'uer' | 'sp' | 'ssp' | 'tier-rc' -- selects ONE marker family's slug-ending scan per dispatch (see the script header for the full mapping); sp/ssp/uer list every row for human review because that marker can name a different card. Empty = the script's default. For revert-set-sport-repair (R76 second pass, 2026-09-19): '' (default, empty) | 'title-evidence' (same thing spelled out) runs the ORIGINAL title-word-evidence pass unchanged; 'checklist-evidence' runs the SECOND pass -- builds two candidate card_catalog ids per row (current sport, and current id with its sport segment swapped to sportBefore) and restores the row when ONLY the before-sport candidate has a checklist-authority row, keeps when only the current one does, leaves when both or neither do. This mode ALSO restores rekeyed-since rows the title pass leaves (a later lane's :num-N tail or setKey cleanup survives the restore, since the target is built from the CURRENT id, never hobbyiqCardIdBefore). The pilot dispatch for this mode is mode=checklist-evidence scope=fleer|1988."
        required: false
        default: ""
      slug_prefix:
        description: "For repair-parallel-from-title mode=backfill-stamp: bound the sweep to one slug or slug prefix (e.g. hiq:baseball:2026:bowman-chrome:cpa-vf:). Empty = the whole pool."
        required: false
        default: ""
      shard_hex:
        description: "For reslugAllSoldComps: contentHash first-char shards, e.g. 0,1,2,3. 16 shards total; run disjoint sets in parallel. Empty = all."
        required: false
        default: ""
        type: string
      max_rows:
        description: "For reslugAllSoldComps: cap rows scanned (0 = no cap)."
        required: false
        default: "0"
        type: string
      retire_no_partition_key:
        description: "For dedupe-catalog-partition-shadows: also retire duplicate rows that carry NO partition key. They ARE addressable; off by default because it is a delete."
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write   # Azure OIDC for App Service secret fetch
  actions: write    # workflow_dispatch to self-relaunch composite backfill

jobs:
  run-backfill:
    runs-on: ubuntu-latest
    # 180 min ceiling — leaves 60+ min headroom on GH Actions' 6h max so
    # the self-relaunch check (composite backfill only) always has room
    # to run after the actual backfill step's own 150-min timeout.
    timeout-minutes: 180

    steps:
      - name: Checkout repo at dispatched ref
        # workflow_dispatch checks out the branch chosen in the UI, so
        # Drew can run scripts that live on a feature branch before merge.
        uses: actions/checkout@v5

      - name: Setup Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Install backend deps
        working-directory: backend
        run: npm ci

      - name: Build backend dist
        # Backfill scripts require compiled JS from backend/dist. Build
        # here so the checked-out branch's parser code is what runs.
        working-directory: backend
        run: npm run build

      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_1259D9D213E34AE29B2DD54B3E755C4D }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_5AB8B3DC612348FD9D37DBE28FF40802 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_A45CF8552AE94AF68A046FB846E21206 }}

      # GATE 2 for census-split-identity: the census is READ ONLY, in every
      # mode, with no write path in the script at all. A dispatch carrying
      # apply=true is therefore a dispatch whose author believed it would
      # repair something -- and it would silently report instead, while they
      # waited for a repair that was never coming. Refuse rather than run:
      # a wrong belief about what a job did is exactly what the
      # green-run-is-not-a-data-flow rule exists to stop. Report the finding
      # first, then repair through an audited lane that actually writes.
      - name: Refuse an APPLY dispatch of the read-only census
        if: ${{ inputs.script == 'census-split-identity' && inputs.apply == true }}
        shell: bash
        run: |
          echo "::error::census-split-identity is READ ONLY — it has no write path. Re-dispatch with apply=false; the repair is a separate audited lane."
          exit 1

      # The same gate, same reasoning, for the duplicate-sale-ids census. It
      # has no write path in any mode: the repair for the copies it finds is
      # the audited relocate-pool-rows-by-list PARK lane, which is report-first
      # and names its rows in a committed list.
      - name: Refuse an APPLY dispatch of the read-only duplicate-sale-ids census
        if: ${{ inputs.script == 'census-duplicate-sale-ids' && inputs.apply == true }}
        shell: bash
        run: |
          echo "::error::census-duplicate-sale-ids is READ ONLY — it has no write path. Re-dispatch with apply=false; the repair is the relocate-pool-rows-by-list PARK lane."
          exit 1

      # The same gate, same reasoning, for the unknown-setKey census. It has no
      # write path in any mode: the repair for the rows it finds is either the
      # Great Rematch's own IMPROVE arm (already running) or a vocabulary
      # change, and neither is this script's to make.
      - name: Refuse an APPLY dispatch of the read-only unknown-setKey census
        if: ${{ inputs.script == 'census-unknown-setkey' && inputs.apply == true }}
        shell: bash
        run: |
          echo "::error::census-unknown-setkey is READ ONLY — it has no write path. Re-dispatch with apply=false; the repair is the Great Rematch's IMPROVE arm or a vocabulary change."
          exit 1

      # The same gate for the TCG volume census. It is stricter than the others
      # by intent: for the non-Pokemon TCGs there is not merely no write path in
      # THIS script, there is no sanctioned ingest for these games AT ALL.
      # Drew's ruling (2026-09-05) is measure first, then ask each publisher in
      # writing. An apply dispatch here would be someone believing we had
      # permission we have not asked for yet, so it is refused twice -- here,
      # and again inside the script (exit 3) if it is ever run another way.
      - name: Refuse an APPLY dispatch of the read-only TCG volume census
        if: ${{ inputs.script == 'census-tcg-verticals' && inputs.apply == true }}
        shell: bash
        run: |
          echo "::error::census-tcg-verticals is READ ONLY — it measures volume and nothing else. There is no sanctioned ingest for Magic / Yu-Gi-Oh / One Piece / Lorcana: Drew's 2026-09-05 ruling is MEASURE FIRST, THEN ASK EACH PUBLISHER IN WRITING (see backend/docs/reports/tcg-source-permissions-2026-09-05.md). Re-dispatch with apply=false."
          exit 1

      # The same gate, same reasoning, for the two READ-ONLY lanes of
      # CF-THE-ENGINE-CONSUMES-CH-SALES-NOT-CH-PRODUCT-FIELDS. Neither script
      # has a write path in any mode, so an apply=true dispatch is a dispatch
      # whose author expected a repair and would have got a report.
      - name: Refuse an APPLY dispatch of the read-only CH-product-label lanes
        if: ${{ (inputs.script == 'census-ch-product-label-parallel' || inputs.script == 'report-ch-product-label-catalog-aliases') && inputs.apply == true }}
        shell: bash
        run: |
          echo "::error::${{ inputs.script }} is READ ONLY — it has no write path. Re-dispatch with apply=false; repair-ch-product-label-parallel is the lane that writes."
          exit 1

      # THE SCOPE IS THE WHOLE SAFETY ARGUMENT for the repair lane, so it is
      # checked HERE as well as inside the script. `scope` carries a
      # comma-separated list of CardHedge PRODUCT IDS
      # (e.g. 1778540428361x447194681698603460); there is no 'all'.
      #
      # The runner-wide default is `refractor`, INHERITED rather than chosen,
      # and it is refused rather than treated as "everything" -- the same
      # doctrine rematch-sold-comps applies to its own apply-class scope. The
      # refusal covers REPORT mode too: a report over an unnamed scope is how
      # an apply over an unnamed scope gets authorised.
      - name: The CH-product-label repair names its scope
        if: ${{ inputs.script == 'repair-ch-product-label-parallel' }}
        shell: bash
        run: |
          SCOPE='${{ inputs.scope }}'
          if [ -z "$SCOPE" ] || [ "$SCOPE" = "refractor" ] || [ "$SCOPE" = "all" ]; then
            echo "::error::repair-ch-product-label-parallel requires scope = a comma-separated list of CardHedge product ids. Got '$SCOPE' (the runner default 'refractor' and 'all' are refused — this lane has no whole-corpus mode)."
            exit 1
          fi
          IFS=',' read -ra IDS <<< "$SCOPE"
          for ID in "${IDS[@]}"; do
            ID="$(echo "$ID" | tr -d '[:space:]')"
            if ! echo "$ID" | grep -Eq '^[0-9]+x[0-9]+$'; then
              echo "::error::'$ID' is not a CardHedge product id (expected <digits>x<digits>, e.g. 1778540428361x447194681698603460)."
              exit 1
            fi
          done
          echo "Scope confirmed: ${#IDS[@]} CardHedge product id(s)."

      # Same lesson as the triage and the census libs one layer down: the
      # five-assertion PREDICATE lives in a lib so the tests pin the code that
      # runs. Both lanes require it, and a dispatch that reached Cosmos and
      # then died on a missing require would have read the pool for nothing --
      # or, in an apply, could have moved rows before failing.
      - name: The CH-product-label predicate lib is present
        if: ${{ inputs.script == 'census-ch-product-label-parallel' || inputs.script == 'repair-ch-product-label-parallel' }}
        shell: bash
        run: |
          for LIB in ch-product-label rematch-classify relocate-sold-comp; do
            if [ ! -f "backend/scripts/lib/$LIB.cjs" ]; then
              echo "::error::backend/scripts/lib/$LIB.cjs is missing — the lane would read the pool and have no rule to classify it with"
              exit 1
            fi
          done
          echo "Predicate libs confirmed: ch-product-label, rematch-classify, relocate-sold-comp"

      # CF-FINISH-FAMILY-COLLISION (Drew, 2026-09-05). THE SCOPE IS THE WHOLE
      # SAFETY ARGUMENT for the refile lane, so it is checked HERE as well as
      # inside the script. `scope` carries a comma-separated PRODUCT LIST as
      # sport:year:setKey (e.g. baseball:2026:bowman-chrome); there is no 'all'.
      #
      # The product axis was chosen over the finish-family axis for exactly the
      # reason this gate can exist: a product list is ENUMERABLE before the run,
      # so a dispatcher can read what they are authorising and the pool counts
      # are index-served. A finish family is a WORD, and a word spans every
      # product that ever printed it.
      #
      # The runner-wide default `refractor` is INHERITED rather than chosen and
      # is refused, and the refusal covers REPORT mode too: a report over an
      # unnamed scope is how an apply over an unnamed scope gets authorised.
      - name: The finish-collision refile names its scope
        if: ${{ inputs.script == 'repair-finish-collision-refile' }}
        shell: bash
        run: |
          SCOPE='${{ inputs.scope }}'
          if [ -z "$SCOPE" ] || [ "$SCOPE" = "refractor" ] || [ "$SCOPE" = "all" ]; then
            echo "::error::repair-finish-collision-refile requires scope = a comma-separated list of products as sport:year:setKey. Got '$SCOPE' (the runner default 'refractor' and 'all' are refused — this lane has no whole-corpus mode)."
            exit 1
          fi
          IFS=',' read -ra PRODUCTS <<< "$SCOPE"
          for P in "${PRODUCTS[@]}"; do
            P="$(echo "$P" | tr -d '[:space:]')"
            if ! echo "$P" | grep -Eq '^[a-z0-9-]+:[0-9]{4}:[a-z0-9-]+$'; then
              echo "::error::'$P' is not a product (expected sport:year:setKey, e.g. baseball:2026:bowman-chrome)."
              exit 1
            fi
          done
          echo "Scope confirmed: ${#PRODUCTS[@]} product(s)."

      # THE CLC SIGNATURE REPAIR NAMES ITS SCOPE, in both modes.
      #
      # This lane moves rows across a 79,000-row measured population, and a move
      # re-points sales and retires graded children. A whole-source write refuses
      # without its name (feedback_a_whole_source_retire_needs_its_name), and the
      # refusal covers REPORT too: a report over an unnamed scope is how an apply
      # over an unnamed scope gets authorised.
      #
      # Its scope axis is the CELL -- sport:year -- not the product triple the
      # refile lanes take, because the defect is a converter vocabulary gap that
      # cuts across 88 products within a cell.
      - name: The clc signature repair names its scope
        if: ${{ inputs.script == 'repair-clc-signature-unsigned' }}
        shell: bash
        run: |
          SCOPE='${{ inputs.scope }}'
          if [ -z "$SCOPE" ] || [ "$SCOPE" = "refractor" ] || [ "$SCOPE" = "all" ]; then
            echo "::error::repair-clc-signature-unsigned requires scope = a comma-separated list of cells as sport:year. Got '$SCOPE' (the runner default 'refractor' and 'all' are refused - this lane has no whole-corpus mode)."
            exit 1
          fi
          IFS=',' read -ra CELLS <<< "$SCOPE"
          for C in "${CELLS[@]}"; do
            C="$(echo "$C" | tr -d '[:space:]')"
            if ! echo "$C" | grep -Eq '^[a-z]+:[0-9]{4}$'; then
              echo "::error::'$C' is not a cell (expected sport:year, e.g. baseball:2023)."
              exit 1
            fi
          done
          echo "Scope confirmed: ${#CELLS[@]} cell(s)."

      # Same lesson as every other lane one layer down: the FIVE-ASSERTION
      # predicate lives in a lib so the tests pin the code that runs. A dispatch
      # that reached Cosmos and then died on a missing require would have read
      # the pool for nothing -- or, in an apply, could have moved rows before
      # failing.
      - name: The finish-collision predicate lib is present
        if: ${{ inputs.script == 'repair-finish-collision-refile' }}
        shell: bash
        run: |
          for LIB in finish-collision-refile rematch-classify relocate-sold-comp; do
            if [ ! -f "backend/scripts/lib/$LIB.cjs" ]; then
              echo "::error::backend/scripts/lib/$LIB.cjs is missing — the lane would read the pool and have no rule to classify it with"
              exit 1
            fi
          done
          echo "Predicate libs confirmed: finish-collision-refile, rematch-classify, relocate-sold-comp"

      # CF-A-WHOLE-SOURCE-RETIRE-NEEDS-ITS-NAME. Same lesson, same shape: the
      # inherited `refractor` is not a chosen scope, and the refusal covers
      # REPORT mode too.
      - name: The Bowman product refile names its scope
        if: ${{ inputs.script == 'repair-bowman-product-refile' }}
        shell: bash
        run: |
          SCOPE='${{ inputs.scope }}'
          if [ -z "$SCOPE" ] || [ "$SCOPE" = "refractor" ] || [ "$SCOPE" = "all" ]; then
            echo "::error::repair-bowman-product-refile requires scope = a comma-separated list of products as sport:year:setKey. Got '$SCOPE' (the runner default 'refractor' and 'all' are refused — this lane has no whole-corpus mode)."
            exit 1
          fi
          IFS=',' read -ra PRODUCTS <<< "$SCOPE"
          for P in "${PRODUCTS[@]}"; do
            P="$(echo "$P" | tr -d '[:space:]')"
            if ! echo "$P" | grep -Eq '^[a-z0-9-]+:[0-9]{4}:[a-z0-9-]+$'; then
              echo "::error::'$P' is not a product (expected sport:year:setKey, e.g. baseball:2026:bowman-chrome)."
              exit 1
            fi
          done
          echo "Scope confirmed: ${#PRODUCTS[@]} product(s)."

      # The per-row decisions live in a lib so the tests pin the code that runs,
      # and relocate-sold-comp is what makes the sale-side write survivable
      # (upsert, verify, THEN delete -- CF-A-SALE-IS-NEVER-LOST).
      - name: The Bowman refile predicate lib is present
        if: ${{ inputs.script == 'repair-bowman-product-refile' }}
        shell: bash
        run: |
          for LIB in bowman-product-refile relocate-sold-comp runner-shard-scope; do
            if [ ! -f "backend/scripts/lib/$LIB.cjs" ]; then
              echo "::error::backend/scripts/lib/$LIB.cjs is missing — the lane would read the pool and have no rule to classify it with"
              exit 1
            fi
          done
          echo "Predicate libs confirmed: bowman-product-refile, relocate-sold-comp, runner-shard-scope"

      # CF-A-WHOLE-SOURCE-RETIRE-NEEDS-ITS-NAME, and one turn tighter than the
      # Bowman refile's: a scope must name BOTH ends of the move. The pair
      # grammar `sport:year:setKey` names only where to READ and lets the
      # re-mint choose where rows land -- right when the destination comes from
      # the row's own words, wrong here, where the row's words are exactly what
      # the broken override overwrote. So the triple is required and the pair
      # is refused, along with the runner's inherited `refractor` and `all`.
      - name: The CPA draft refile names both ends of its move
        if: ${{ inputs.script == 'repair-cpa-draft-refile' }}
        shell: bash
        run: |
          SCOPE='${{ inputs.scope }}'
          if [ -z "$SCOPE" ] || [ "$SCOPE" = "refractor" ] || [ "$SCOPE" = "all" ]; then
            echo "::error::repair-cpa-draft-refile requires scope = a comma-separated list of moves as sport:year:fromKey>toKey. Got '$SCOPE' (the runner default 'refractor' and 'all' are refused — this lane has no whole-corpus mode)."
            exit 1
          fi
          IFS=',' read -ra MOVES <<< "$SCOPE"
          for M in "${MOVES[@]}"; do
            M="$(echo "$M" | tr -d '[:space:]')"
            if ! echo "$M" | grep -Eq '^[a-z0-9-]+:[0-9]{4}:[a-z0-9-]+>[a-z0-9-]+$'; then
              echo "::error::'$M' is not a move (expected sport:year:fromKey>toKey, e.g. baseball:2025:bowman-chrome>bowman-draft; the old sport:year:setKey pair names no destination and is refused)."
              exit 1
            fi
            FROM="$(echo "$M" | cut -d: -f3 | cut -d'>' -f1)"
            TO="$(echo "$M" | cut -d'>' -f2)"
            if [ "$FROM" = "$TO" ]; then
              echo "::error::'$M' moves a key onto itself — a typo must not report a clean run over a scope nothing can match."
              exit 1
            fi
          done
          echo "Scope confirmed: ${#MOVES[@]} move(s)."

      - name: The CPA draft refile predicate lib is present
        if: ${{ inputs.script == 'repair-cpa-draft-refile' }}
        shell: bash
        run: |
          for LIB in cross-product-refile bowman-product-refile relocate-sold-comp runner-shard-scope runner-budget; do
            if [ ! -f "backend/scripts/lib/$LIB.cjs" ]; then
              echo "::error::backend/scripts/lib/$LIB.cjs is missing — the lane would read the pool and have no rule to classify it with"
              exit 1
            fi
          done
          echo "Predicate libs confirmed: cross-product-refile, bowman-product-refile, relocate-sold-comp, runner-shard-scope, runner-budget"

      - name: Fetch COSMOS_CONNECTION_STRING from HobbyIQ3 App Service
        shell: bash
        run: |
          CS=$(az webapp config appsettings list \
            --name HobbyIQ3 \
            --resource-group rg-hobbyiq-dev \
            --query "[?name=='COSMOS_CONNECTION_STRING'].value | [0]" \
            -o tsv)
          if [ -z "$CS" ]; then
            echo "::error::FAILED to fetch COSMOS_CONNECTION_STRING from App Service"
            exit 1
          fi
          echo "::add-mask::$CS"
          echo "COSMOS_CONNECTION_STRING=$CS" >> "$GITHUB_ENV"
          echo "COSMOS_CONNECTION_STRING fetched (length: ${#CS})"

      # AUTH_SESSION_SECRET — required by reprice-user-holdings because
      # the script imports the portfolioStore.service.js which pulls in
      # the app's env validation module. Fetch from App Service so the
      # secret matches prod exactly (never echoed to stdout).
      # CF-REPRICE-AUTH-ENV (Drew, 2026-07-31). Prior run failed at boot
      # with "AUTH_SESSION_SECRET is unset — refusing to start."
      # CF-AUTO-LABEL-AZURE-OPENAI (Drew, 2026-08-02). auto-label-
      # catalog-variants uses labelerAiSuggest which needs Azure OpenAI.
      - name: Fetch Azure OpenAI credentials from HobbyIQ3 App Service
        if: inputs.script == 'auto-label-catalog-variants'
        shell: bash
        run: |
          for name in AZURE_OPENAI_ENDPOINT AZURE_OPENAI_API_KEY AZURE_OPENAI_DEPLOYMENT AZURE_OPENAI_API_VERSION; do
            v=$(az webapp config appsettings list --name HobbyIQ3 --resource-group rg-hobbyiq-dev \
              --query "[?name=='$name'].value | [0]" -o tsv)
            if [ -z "$v" ]; then
              echo "::warning::${name} not set in HobbyIQ3 App Service"
              continue
            fi
            echo "::add-mask::$v"
            echo "${name}=$v" >> "$GITHUB_ENV"
            echo "${name} fetched (length: ${#v})"
          done

      # CF-DRAIN-ADMIN-TOKEN (Drew, 2026-08-01). drain-staging-backlog
      # calls /api/staging/* admin endpoints; needs ADMIN_API_TOKEN.
      - name: Fetch ADMIN_API_TOKEN from HobbyIQ3 App Service
        if: inputs.script == 'drain-staging-backlog'
        shell: bash
        run: |
          TOK=$(az webapp config appsettings list \
            --name HobbyIQ3 \
            --resource-group rg-hobbyiq-dev \
            --query "[?name=='ADMIN_API_TOKEN'].value | [0]" \
            -o tsv)
          if [ -z "$TOK" ]; then
            echo "::error::FAILED to fetch ADMIN_API_TOKEN from App Service"
            exit 1
          fi
          echo "::add-mask::$TOK"
          echo "ADMIN_API_TOKEN=$TOK" >> "$GITHUB_ENV"
          echo "ADMIN_API_TOKEN fetched (length: ${#TOK})"

      # D14 (2026-08-29). probe-price-routes replays slugs through the live
      # pricing routes; requireSession admits the harness token as a
      # synthetic pro_seller user. Fetched from App Service the way
      # AUTH_SESSION_SECRET is, scoped to this one script, never echoed.
      - name: Fetch TIER1_HARNESS_TOKEN from HobbyIQ3 App Service
        if: inputs.script == 'probe-price-routes'
        shell: bash
        run: |
          TOK=$(az webapp config appsettings list             --name HobbyIQ3             --resource-group rg-hobbyiq-dev             --query "[?name=='TIER1_HARNESS_TOKEN'].value | [0]"             -o tsv)
          if [ -z "$TOK" ]; then
            echo "::error::FAILED to fetch TIER1_HARNESS_TOKEN from App Service"
            exit 1
          fi
          echo "::add-mask::$TOK"
          echo "TIER1_HARNESS_TOKEN=$TOK" >> "$GITHUB_ENV"
          echo "TIER1_HARNESS_TOKEN fetched (length: ${#TOK})"

      # CF-ENGINE-BACKTEST (#1651). Same module-load trap the eBay backfills
      # hit: the backtest requires the compiled pricing engine, whose import
      # graph reaches authService, which THROWS AT MODULE LOAD without this
      # ("refusing to start"). The backtest signs nothing and reads no session
      # — the import kills the process before it can say so. Found by running
      # the script locally against prod Cosmos.
      - name: Fetch AUTH_SESSION_SECRET from HobbyIQ3 App Service
        if: inputs.script == 'reprice-user-holdings' || inputs.script == 'backfill-ebay-purchase-comps' || inputs.script == 'engine-backtest'
        shell: bash
        run: |
          SEC=$(az webapp config appsettings list \
            --name HobbyIQ3 \
            --resource-group rg-hobbyiq-dev \
            --query "[?name=='AUTH_SESSION_SECRET'].value | [0]" \
            -o tsv)
          if [ -z "$SEC" ]; then
            echo "::error::FAILED to fetch AUTH_SESSION_SECRET from App Service"
            exit 1
          fi
          echo "::add-mask::$SEC"
          echo "AUTH_SESSION_SECRET=$SEC" >> "$GITHUB_ENV"
          echo "AUTH_SESSION_SECRET fetched (length: ${#SEC})"

      # D26 (2026-08-30). backfill-ebay-account-sales refreshes each connected
      # user's OAuth token to call /sell/fulfillment/v1/order, so it needs the
      # eBay APP credentials -- the same ones HobbyIQ3 runs with. Fetched from
      # App Service, masked, never echoed. EBAY_ENV must come across too: it
      # defaults to "sandbox" in code, and a sandbox run would fetch zero
      # orders and report a perfectly green nothing.
      - name: Fetch eBay app credentials from HobbyIQ3 App Service
        if: inputs.script == 'backfill-ebay-account-sales' || inputs.script == 'run-ebay-order-poll' || inputs.script == 'run-ebay-finances-enrichment' || inputs.script == 'run-ebay-purchase-sync'
        shell: bash
        run: |
          # AUTH_SESSION_SECRET is in this list because ebayAuth.service THROWS
          # AT MODULE LOAD without it ("cannot sign OAuth state"). The backfill
          # never signs an OAuth state -- it only refreshes tokens -- but the
          # import kills the process before it can say so. Found by running the
          # script's harness locally against a user that does not exist.
          for NAME in EBAY_CLIENT_ID EBAY_CLIENT_SECRET EBAY_ENV EBAY_REDIRECT_URI AUTH_SESSION_SECRET; do
            V=$(az webapp config appsettings list \
              --name HobbyIQ3 \
              --resource-group rg-hobbyiq-dev \
              --query "[?name=='$NAME'].value | [0]" \
              -o tsv)
            if [ -z "$V" ] || [ "$V" = "None" ]; then
              if [ "$NAME" = "EBAY_REDIRECT_URI" ]; then
                echo "::warning::$NAME absent; the backfill never runs the OAuth redirect so this is fine"
                continue
              fi
              echo "::error::FAILED to fetch $NAME from App Service"
              exit 1
            fi
            echo "::add-mask::$V"
            echo "$NAME=$V" >> "$GITHUB_ENV"
            echo "$NAME fetched (length: ${#V})"
          done
          # A production run must say so out loud: EBAY_ENV defaults to sandbox
          # in code, and sandbox returns no real orders.
          if [ "${EBAY_ENV:-}" != "production" ]; then
            echo "::notice::EBAY_ENV is not 'production' in this shell; the value written to GITHUB_ENV is what the script reads."
          fi

      # CF-CS-KEY-FOR-CATALOG-EXPANSION (Drew, 2026-08-01). Cardsight
      # image backfill + population probe need CARDSIGHT_API_KEY.
      - name: Fetch CARDSIGHT_API_KEY from HobbyIQ3 App Service
        if: inputs.script == 'backfill-catalog-cs-images' || inputs.script == 'backfill-cs-card-population'
        shell: bash
        run: |
          CS_KEY=$(az webapp config appsettings list \
            --name HobbyIQ3 \
            --resource-group rg-hobbyiq-dev \
            --query "[?name=='CARDSIGHT_API_KEY'].value | [0]" \
            -o tsv)
          if [ -z "$CS_KEY" ]; then
            echo "::error::FAILED to fetch CARDSIGHT_API_KEY from App Service"
            exit 1
          fi
          echo "::add-mask::$CS_KEY"
          echo "CARDSIGHT_API_KEY=$CS_KEY" >> "$GITHUB_ENV"
          echo "CARDSIGHT_API_KEY fetched (length: ${#CS_KEY})"

      # CF-CH-KEY-FOR-CATALOG-EXPANSION (Drew, 2026-08-01). The catalog
      # expansion scripts hit CH's search API for every (year, product)
      # tuple. Fetch CARD_HEDGE_API_KEY from App Service so the runner
      # has authenticated access; never echoed to log.
      - name: Fetch CARD_HEDGE_API_KEY from HobbyIQ3 App Service
        if: startsWith(inputs.script, 'expand-catalog') || inputs.script == 'audit-ch-ingest-completeness' || inputs.script == 'nightly-reingest-top-ch-cards' || inputs.script == 'backfill-ch-catalog-additions'
        shell: bash
        run: |
          CH_KEY=$(az webapp config appsettings list \
            --name HobbyIQ3 \
            --resource-group rg-hobbyiq-dev \
            --query "[?name=='CARD_HEDGE_API_KEY'].value | [0]" \
            -o tsv)
          if [ -z "$CH_KEY" ]; then
            echo "::error::FAILED to fetch CARD_HEDGE_API_KEY from App Service"
            exit 1
          fi
          echo "::add-mask::$CH_KEY"
          echo "CARD_HEDGE_API_KEY=$CH_KEY" >> "$GITHUB_ENV"
          echo "CARD_HEDGE_API_KEY fetched (length: ${#CH_KEY})"

      # Azure OpenAI env — only required by the slab-OCR prototype
      # script; always fetch (cheap read-only) so any future backfill
      # that needs LLM calls can rely on them being present.
      - name: Fetch Azure OpenAI env from HobbyIQ3 App Service
        if: startsWith(inputs.script, 'prototype-slab') || startsWith(inputs.script, 'slab-ocr')
        shell: bash
        run: |
          fetch_setting() {
            az webapp config appsettings list \
              --name HobbyIQ3 \
              --resource-group rg-hobbyiq-dev \
              --query "[?name=='$1'].value | [0]" \
              -o tsv
          }
          ENDPOINT=$(fetch_setting AZURE_OPENAI_ENDPOINT)
          KEY=$(fetch_setting AZURE_OPENAI_API_KEY)
          [ -z "$KEY" ] && KEY=$(fetch_setting AZURE_OPENAI_KEY)
          DEPLOY=$(fetch_setting AZURE_OPENAI_DEPLOYMENT)
          API_VERSION=$(fetch_setting AZURE_OPENAI_API_VERSION)
          if [ -z "$ENDPOINT" ] || [ -z "$KEY" ] || [ -z "$DEPLOY" ]; then
            echo "::error::Azure OpenAI env missing (endpoint / key / deployment)"
            exit 1
          fi
          echo "::add-mask::$KEY"
          echo "AZURE_OPENAI_ENDPOINT=$ENDPOINT" >> "$GITHUB_ENV"
          echo "AZURE_OPENAI_API_KEY=$KEY" >> "$GITHUB_ENV"
          echo "AZURE_OPENAI_DEPLOYMENT=$DEPLOY" >> "$GITHUB_ENV"
          [ -n "$API_VERSION" ] && echo "AZURE_OPENAI_API_VERSION=$API_VERSION" >> "$GITHUB_ENV"
          echo "Azure OpenAI env fetched (deployment: $DEPLOY)"

      - name: Verify script exists
        # Guardrail: whitelisted input, but confirm file is present in
        # the checked-out branch (a script added in a PR branch that
        # never landed on the dispatch ref would silently fail otherwise).
        run: |
          SCRIPT="backend/scripts/${{ inputs.script }}.cjs"
          if [ ! -f "$SCRIPT" ]; then
            echo "::error::Script $SCRIPT not present on branch ${GITHUB_REF#refs/heads/}"
            exit 1
          fi
          echo "Script confirmed: $SCRIPT"

          # Same lesson, one layer down: the triage's CLASSIFICATION RULE lives
          # in a lib so the tests pin the code that runs. The entrypoint being
          # present proves nothing about the lib, and a dispatch that reached
          # Cosmos and then died on a missing require would have read the pool
          # for nothing. Both libs it requires are checked here.
          if [ "${{ inputs.script }}" = "triage-contenthash-collisions" ]; then
            for LIB in collision-triage relocate-sold-comp; do
              if [ ! -f "backend/scripts/lib/$LIB.cjs" ]; then
                echo "::error::backend/scripts/lib/$LIB.cjs is missing — the triage would read the pool and then have no rule to classify with"
                exit 1
              fi
            done
            echo "Triage libs confirmed: collision-triage, relocate-sold-comp"
          fi

          # Same lesson again: the census's CLASSIFICATION RULE -- including
          # the vendor-design exemption that keeps 13.5M designed rows out of
          # the findings -- lives in a lib so the tests pin the code that runs.
          # A dispatch that reached Cosmos and then died on a missing require
          # would have walked the corpus for nothing.
          if [ "${{ inputs.script }}" = "census-split-identity" ]; then
            if [ ! -f "backend/scripts/lib/split-identity.cjs" ]; then
              echo "::error::backend/scripts/lib/split-identity.cjs is missing — the census would read 16.4M rows and have no rule to classify them with"
              exit 1
            fi
            echo "Census lib confirmed: split-identity"
          fi

          # The wrapper SHELLS OUT, so its own presence proves nothing about
          # the scripts it calls. ingest-checklists-end-to-end passed this
          # check, scraped 349 products, then died on a child that had never
          # been committed. Check the children too.
          if [ "${{ inputs.script }}" = "ingest-checklists-end-to-end" ]; then
            for CHILD in scrape-beckett-checklists scrape-checklistinsider \
                         convertChecklistInsiderToChecklistCsv \
                         ingest-checklist-csv-to-catalog \
                         materialize-ungraded-parents \
                         repair-price-inferred-grades; do
              if [ ! -f "backend/scripts/$CHILD.cjs" ]; then
                echo "::error::$CHILD.cjs is missing — the wrapper would acquire and then have nowhere to land the rows"
                exit 1
              fi
            done
            echo "Child scripts confirmed: 4"
          fi

          # CF-MARKET-INDEXES. The rebuild does not implement the index: it
          # requires the COMPILED services out of backend/dist and drives
          # them. Its own presence proves nothing about those, and a
          # dispatch that reached Cosmos and then died on a missing require
          # would have read the pool for nothing -- and, in an apply, could
          # have deleted baskets before failing to rebuild them.
          if [ "${{ inputs.script }}" = "rebuild-market-indexes" ]; then
            for SVC in marketIndex.service.js marketIndexCompute.service.js; do
              if [ ! -f "backend/dist/services/insights/$SVC" ]; then
                echo "::error::backend/dist/services/insights/$SVC is missing — the rebuild would purge baskets and then have nothing to recreate them with"
                exit 1
              fi
            done
            echo "Compiled index services confirmed: marketIndex, marketIndexCompute"
          fi

          # D38. Same lesson, same shape: ingest-universe-driver SHELLS OUT to a
          # different scraper per lane, so its own presence proves nothing about
          # the lane it was dispatched for. It would acquire nothing and still
          # write verdicts. Check the manifest and every lane child up front.
          if [ "${{ inputs.script }}" = "ingest-universe-driver" ]; then
            if [ ! -f "backend/data/ingest-universe.json" ]; then
              echo "::error::backend/data/ingest-universe.json is missing — the driver has no universe to drive"
              exit 1
            fi
            for CHILD in fetchHobbyMonitorChecklist scrape-checklistinsider \
                         convertChecklistInsiderToChecklistCsv scrape-bcp-ladders \
                         convertBeckettChecklistXlsx scrape-checklistcenter-products \
                         convertChecklistCenterToChecklistCsv scrape-tcgdex-ja \
                         fetchSportsCardChecklist \
                         ingest-checklist-csv-to-catalog; do
              if [ ! -f "backend/scripts/$CHILD.cjs" ]; then
                echo "::error::$CHILD.cjs is missing — the driver would acquire and then have nowhere to land the rows"
                exit 1
              fi
            done
            echo "Manifest + lane children confirmed: 10"
          fi

      # A relaunch starts with an empty /tmp, so without this the job re-scrapes
      # 718 Beckett set pages and 604 insider pages every single time: 76 minutes
      # of a 140-minute budget spent re-acquiring what the previous run already
      # had. --skipExisting tests the staged CSV path BEFORE fetching, so a
      # restored directory skips the fetch entirely, not just the parse.
      - name: Restore staged checklists across relaunches
        if: ${{ inputs.script == 'ingest-checklists-end-to-end' }}
        uses: actions/cache@v4
        with:
          path: /tmp/hiq-checklists
          key: hiq-checklists-${{ github.run_id }}
          restore-keys: |
            hiq-checklists-

      # ── THE CANARY GATE, WIRED INSIDE THE APPLY (audit gate, 2026-09-03) ──
      #
      # It was not wired at all. `rematch-canary-check` was an enum value in
      # the script dropdown and nothing else: there were no before/after steps,
      # so the baseline MODE=before wrote to /tmp on an ephemeral runner was
      # gone by the time any later dispatch ran MODE=after -- which then exited
      # 2 ("no baseline") rather than gating anything. A gate that cannot run
      # is not a gate, and the apply was reachable without it.
      #
      # before / apply / after now live in ONE JOB, on ONE runner, so /tmp
      # persists across all three and the baseline is the same file. The
      # baseline is ALSO uploaded as an artifact -- not because the after step
      # needs it (it does not, same runner) but because a shard that fails
      # needs its before-state readable by Drew without re-running anything.
      #
      # Gated on `mode == 'apply-improve' && apply == true`: a census is READ
      # ONLY and has nothing to regress, and a report-only apply-improve dry
      # run writes nothing either. SLOT is exported so the check refuses a
      # shard that has no canary in it, instead of measuring pools this shard
      # cannot touch and calling that a pass.
      - name: Canary gate BEFORE the rematch apply
        if: ${{ inputs.script == 'rematch-sold-comps' && inputs.mode == 'apply-improve' && inputs.apply == true }}
        shell: bash
        env:
          MODE: before
          BASELINE: /tmp/rematch-canary-baseline.json
          SLOT: ${{ inputs.slot }}
          # The gate must know WHICH CLASS is being applied: under
          # scope=base-eviction a parallel-pool canary is SUPPOSED to lose
          # base-titled rows, and the same value goes to the fleet script.
          SCOPE: ${{ inputs.scope }}
          NODE_OPTIONS: "--max-old-space-size=8192"
        run: node backend/scripts/rematch-canary-check.cjs

      # Keep the before-state whatever happens next. A shard that regresses is
      # a shard whose baseline Drew has to read, and re-deriving it after the
      # apply is impossible -- the pools have already moved.
      - name: Upload the canary baseline
        if: ${{ always() && inputs.script == 'rematch-sold-comps' && inputs.mode == 'apply-improve' && inputs.apply == true }}
        uses: actions/upload-artifact@v4
        with:
          name: rematch-canary-baseline-slot-${{ inputs.slot }}-${{ github.run_id }}
          path: /tmp/rematch-canary-baseline.json
          if-no-files-found: warn
          retention-days: 90

      - name: Run backfill (${{ inputs.apply == true && 'APPLY' || 'DRY-RUN' }})
        # Both RESLUG_APPLY and APPROVE_APPLY env vars are set so this
        # single step works for both reslug-* and approve-* scripts;
        # each script only reads the one it cares about.
        id: backfill
        # 150 min per iteration — leaves 30 min for the self-relaunch
        # decision inside the job's 180-min ceiling.
        timeout-minutes: 150
        env:
          RESLUG_APPLY: ${{ inputs.apply == true && 'true' || 'false' }}
          APPROVE_APPLY: ${{ inputs.apply == true && 'true' || 'false' }}
          BACKFILL_APPLY: ${{ inputs.apply == true && 'true' || 'false' }}
          RESLUG_CONCURRENCY: ${{ inputs.concurrency }}
          APPROVE_CONCURRENCY: ${{ inputs.concurrency }}
          BACKFILL_CONCURRENCY: ${{ inputs.concurrency }}
          BULK_START_DATE: ${{ inputs.bulk_start_date }}
          BULK_END_DATE: ${{ inputs.bulk_end_date }}
          BACKFILL_CARD_NUMBERS: ${{ inputs.card_numbers }}
          # ingest-checklists-end-to-end only: mode=force-acquire bypasses the
          # restored checklist cache (the script re-scrapes even when staged;
          # YEARS against a stale cache otherwise matches nothing). Guarded on
          # script so the token cannot leak into another lane's MODE. The
          # budget relaunch deliberately does NOT forward mode: a continuation
          # reuses the cache its own first pass just refreshed.
          FORCE_ACQUIRE: ${{ inputs.script == 'ingest-checklists-end-to-end' && inputs.mode == 'force-acquire' && 'true' || '' }}
          # CF-FORCE-ACQUIRE-PIERCES-ALL-CACHE-STATE (2026-09-01). There are TWO
          # caches between a dispatch and a written row, and force-acquire was
          # only piercing one. FORCE_ACQUIRE re-scrapes; the per-CSV `.ingested`
          # marker then makes ingest-checklist-csv-to-catalog skip the very
          # files that scrape just refreshed. That zeroed 2025 Rookies & Stars:
          # a clean 605-page scrape staged 504 CSVs / 2,398,591 card rows and
          # ingested none of them. REINGEST clears the marker, and it is wired
          # from the SAME guarded expression -- one mode, one meaning, both
          # caches -- rather than a new input (dispatch is at 24 of 25).
          #
          # NOT the same as MODE=reingest below. That token is the global
          # `mode` input, so `mode=force-acquire` makes the end-to-end script's
          # own MODE==='reingest' test false by construction; the two can never
          # both be satisfied by one dispatch. This env var is what force-acquire
          # uses to say the same thing. The budget relaunch keeps NOT forwarding
          # mode: a continuation reuses the cache its own first pass refreshed,
          # and must not re-ingest what it already landed.
          REINGEST: ${{ inputs.script == 'ingest-checklists-end-to-end' && inputs.mode == 'force-acquire' && 'true' || '' }}
          # The Beckett archive index is baseball-only (all 29 pages walked
          # live 2026-09-01: 719 set pages, 708 baseball; the nested basketball
          # and football categories 404 in every form), so no `sports` value
          # reaches a basketball release. BECKETT_URLS is the direct-URL lane --
          # a set page or the workbook itself -- carried on the existing
          # `titles` input, which the header above already documents as the
          # spare carrier for a lane that needs an address rather than a name.
          # ingest-checklists-end-to-end ONLY; BCP_TITLES reads the same input
          # for its own lane and the guard keeps them from crossing.
          BECKETT_URLS: ${{ inputs.script == 'ingest-checklists-end-to-end' && inputs.titles || '' }}
          # CF-ONE-NAME-FORMAT-FOR-EVERY-CARD: normalize-catalog-format owns one
          # partition per dispatch, computed from live row counts at startup and
          # balanced by row count (2025 alone is 7.1M, ~400x a vintage year).
          # Slots never overlap, so 16 dispatches need no coordination and any
          # one can be re-run alone — the script skips rows already normalised.
          SLOT: ${{ inputs.slot }}
          SLOTS: ${{ inputs.slots }}
          # CF-AN-INHERITED-SLOTS-IS-NOT-A-CHOSEN-SHARD (2026-09-04). `slot` and
          # `slots` BOTH carry workflow-wide defaults ("0" and "16"), so a
          # script cannot tell "I chose slot 0 of 16" from "I chose nothing".
          # repair-tiffany-* therefore shard only on a non-zero slot or on this
          # explicit opt-in, and otherwise sweep every row. Set it when you
          # really are fanning out and slot 0 is one of the shards.
          # #1745 and #1752 both APPLIED at 1/16th coverage without it, green
          # and honestly reconciled: "intended 11 = written 0 + skipped 11".
          # The opt-in rides `parents_only`, a BOOLEAN input already in the
          # dispatch form and read by exactly one unrelated script
          # (rehome-catalog-rows-to-own-partition), so it cannot collide with
          # the repair-tiffany-* lanes' own `mode`. Ticking it on a
          # repair-tiffany-* dispatch means "slot 0 really is one shard of a
          # fan-out I am running in full".
          #
          # retire-self-derived-identities JOINED THE LIST (#1799 proved its
          # axis, 2026-09-05). Its fan-out is not a nicety: baseball is
          # 1,998,165 self-derived rows over 6,804 (year, setKey) products at a
          # measured 51.5 rows/s, so ONE slot is ~10.8 hours of loop -- five
          # serial budget-stop relaunches -- while sixteen slots run ~40m each
          # with 2.4x of headroom under the 150m step ceiling. Slots 1..15 are
          # self-evidently chosen and shard on the non-zero slot alone; only
          # slot 0 is ambiguous, so only slot 0 needs this. Without it a
          # `slot=0 slots=16` dispatch sweeps the WHOLE sport and the other
          # fifteen slots redo the work it already did.
          #
          # WHY AN EXISTING INPUT AND NOT A GENERIC RULE. A cleaner-looking
          # rule -- "slots != 16 is the choice" -- reads the ambiguity
          # backwards: 16 is exactly the fan-out width this lane's own budget
          # arithmetic recommends, so the generic rule would refuse to shard
          # the one width anybody would pick and would shard a typo'd `slots=15`
          # by accident. The tie genuinely cannot be broken from `slot`/`slots`
          # (CF-AN-INHERITED-SLOTS-IS-NOT-A-CHOSEN-SHARD), so the signal has to
          # come from a DIFFERENT input the dispatcher had to tick on purpose.
          # `parents_only` is that input for the same three reasons it was for
          # repair-tiffany-*: it is a BOOLEAN (so `== true` is unambiguous, and
          # its `false` default can never opt anyone in by accident), it is
          # already in the dispatch form (workflow_dispatch is at 24 of
          # GitHub's 25 inputs and a new one is not available), and it is read
          # by exactly ONE script -- rehome-catalog-rows-to-own-partition --
          # which is not on this list, so the signal cannot collide with a
          # meaning any lane here already has. Ticking it on any script named
          # below means "slot 0 really is one shard of a fan-out I am running
          # in full"; it means nothing at all to any other script.
          #
          # Pinned by backend/tests/shardOptInWhitelist.test.ts, which parses
          # this very expression and asserts every script it names is in the
          # dropdown whitelist AND calls runnerShardScope without alwaysShard.
          # Drop a script from the line and that suite turns red.
          SHARD: ${{ (inputs.script == 'repair-tiffany-pool-enumeration' || inputs.script == 'repair-tiffany-rung-to-product' || inputs.script == 'retire-self-derived-identities' || inputs.script == 'repair-bowman-product-refile' || inputs.script == 'rekey-product-setkey' || inputs.script == 'repair-finish-collision-refile' || inputs.script == 'reslug-ruled-alias' || inputs.script == 'repair-cpa-draft-refile' || inputs.script == 'repair-clc-signature-unsigned' || inputs.script == 'resolve-disagreeing-sale-twins') && inputs.parents_only == true && 'true' || '' }}
          # Optional year scoping (ingest-checklists-end-to-end, rehome-catalog-
          # rows-to-own-partition, dedupe-catalog-partition-shadows, merge-bare-
          # colour-parallels, repair-refractor-mislabel).
          YEARS: ${{ inputs.years }}
          PHASES: ${{ inputs.phases }}
          # rekey-product-setkey reads BCP_TITLES as its TO key (the product the
          # rows move ONTO). GitHub caps workflow_dispatch at 25 inputs and 24
          # are used, so a ruled rename carries its destination in an existing
          # input rather than claiming the last one; `setkey_like` is the FROM
          # half and `titles` is the TO half. Documented here because the name
          # does not say so on its own.
          BCP_TITLES: ${{ inputs.titles }}
          # rederive-holding-identity (R2, 2026-09-04) reads BCP_TITLES as its
          # HOLDING-ID list -- comma-separated holding ids or id prefixes --
          # for the same reason rekey-product-setkey reads it as a setKey:
          # workflow_dispatch is at its input cap and a new one is not
          # available. USER_ID is the other half of its scope (re-derive one
          # user instead of a named list); it reuses the pinned userId the
          # reprice lane already carries, and the script REFUSES to run with
          # both halves empty rather than sweeping every holding.
          # repair-rc-marker-playername (2026-09-19) reads BCP_TITLES as an
          # OPTIONAL comma-separated setKey filter (SET_KEYS), narrowing its
          # required SCOPE=sport:year cells to one or more products. Same
          # reuse reason as above: no dispatch input left to claim. Empty =
          # every setKey in the scoped cell(s).
          # rekey-catalog-id-to-setkey (2026-09-19) reads BCP_TITLES as its
          # REQUIRED comma-separated target-setKey list (SET_KEYS) -- e.g.
          # upper-deck-extended-series -- narrowing its required
          # SCOPE=sport:year cells. Unlike repair-rc-marker-playername's use
          # above, empty or a wildcard ('all', '*') is REFUSED here (exit 2):
          # this lane rewrites the id segment itself, so "every setKey" is a
          # whole-source write that needs its own name
          # (feedback_a_whole_source_retire_needs_its_name). The pilot dispatch
          # is scope=hockey:2024,hockey:2025 titles=upper-deck-extended-series.
          #
          # repoint-sales-to-checklist-numbered (2026-09-19) reads BCP_TITLES
          # as its REQUIRED comma-separated target-setKey list (SET_KEYS) --
          # e.g. topps -- narrowing its required SCOPE=sport:year cells, same
          # convention as rekey-catalog-id-to-setkey immediately above. Empty
          # or a wildcard ('all', '*') is REFUSED (exit 2): this lane moves
          # sold_comps rows onto a checklist's numbered id, so "every setKey"
          # is a whole-source write that needs its own name. The pilot
          # dispatch is scope=baseball:2026 titles=topps.
          #
          # repoint-sales-parallel-suffix (2026-09-20) reads BCP_TITLES as its
          # REQUIRED comma-separated target-setKey list (SET_KEYS) -- e.g.
          # panini-prizm -- narrowing its required SCOPE=sport:year cells,
          # same convention as repoint-sales-to-checklist-numbered
          # immediately above. Empty or a wildcard ('all', '*') is REFUSED
          # (exit 2): this lane moves sold_comps rows onto a checklist's
          # differently-suffixed row, so "every setKey" is a whole-source
          # write that needs its own name. The pilot dispatch is
          # scope=basketball:2024 titles=panini-prizm.
          #
          # repoint-stored-insert-sales (2026-09-19) reads BCP_TITLES as its
          # REQUIRED comma-separated REGISTERED INSERT setKey list (SET_KEYS)
          # -- e.g. panini-photogenic-rookie-pix -- narrowing its required
          # SCOPE=sport:year cells, same convention as the two lanes just
          # above. Empty or a wildcard ('all', '*') is REFUSED (exit 2): a key
          # with no registered parent product is ALSO refused (exit 2), since
          # this lane repairs an insert's sales against its base product and
          # a key naming no base product has nothing to repair away from. The
          # pilot dispatch is scope=football:2024 titles=panini-photogenic-
          # rookie-pix,panini-photogenic-troops-tribute,panini-zenith-z-marquee.
          #
          # repoint-sales-to-sibling-product (2026-09-20) reads BCP_TITLES as
          # its REQUIRED SIBLING PAIR LIST (SET_KEYS) -- and this is the ONE
          # lane whose `titles` value is NOT a plain comma list of keys. Each
          # comma-separated token is a PAIR, `fromSetKey>toSetKey` (a literal
          # '>'; whitespace either side is trimmed, so `topps > topps-update-
          # series` is accepted). A token with no '>', more than one '>', an
          # empty half, halves that are the same key, or a wildcard ('', 'all',
          # '*') on either side is REFUSED (exit 2) before any Cosmos read.
          #
          # WHY A PAIR AND NOT AN INFERENCE. "These two products are
          # confusable siblings" is a collector-taxonomy RULING, not something
          # a script may derive from name similarity (feedback_ratio_
          # similarity_is_not_identity). The lane owns no sibling heuristic at
          # all: the operator's list is the only source of truth, which is also
          # what makes a dispatch auditable -- the banner echoes the pairs it
          # parsed, and a REPORT with PLAN_OUT set writes one NDJSON record per
          # in-scope row so the move list can be read row-by-row before the
          # matching APPLY runs.
          #
          # The pilot dispatches (both REPORT first):
          #   -f scope=baseball:2025 -f titles=topps>topps-update-series
          #   -f scope=football:2023 -f titles=donruss-optic>panini-donruss
          # Several pairs in one dispatch are comma-separated, and every pair
          # is run against every `scope` cell.
          USER_ID: ${{ inputs.script == 'rederive-holding-identity' && inputs.scope == 'user' && 'user-199fcbc9-58ba-4643-a0c9-f75bcbc90bd4' || '' }}
          SOURCES: ${{ inputs.sources }}
          # CF-A-SOURCE-THAT-CONTRADICTS-ITSELF-MINTS-NO-IDENTITIES (Drew,
          # 2026-09-05). rekey-product-setkey MODE=catalog: a row with NO twin
          # at the destination is LABELLED IN PLACE instead of MOVED, because a
          # move on one unreliable source's word MINTS an identity nothing
          # adjudicated. Folds and replaces proceed untouched -- they were each
          # decided against a rival.
          #
          # ARMED BY THE SOURCE LIST, NOT BY A NEW INPUT. workflow_dispatch is
          # at 24 of GitHub's 25 inputs, so there is no boolean to spare -- and
          # the arming condition is better this way regardless: the flag is on
          # exactly when the operator has NAMED what to distrust (`sources`),
          # which is the CF-A-WHOLE-SOURCE-RETIRE-NEEDS-ITS-NAME shape. The
          # script re-checks both halves and refuses without either, so a
          # half-typed dispatch dies on its arguments rather than mid-sweep.
          #
          # rematch-sold-comps MODE=census (2026-09-19 census batch) reads the
          # SAME SOURCES env as a SECOND, non-colliding meaning: the literal
          # value "backing" arms the per-sale catalog BACKING tally (see
          # CENSUS_BACKING in that script). rekey-product-setkey never
          # produces or reads "backing" as a sources value and
          # rematch-sold-comps only checks it under MODE=census, so the two
          # meanings cannot collide on the same dispatch. Dispatch:
          # script=rematch-sold-comps mode=census slots=32 scope=improve
          # apply=false sources=backing.
          #
          # It is scoped to the ONE script by name so the token cannot leak into
          # another lane: every other script sees the empty string.
          RETIRE_UNTWINNED: ${{ (inputs.script == 'rekey-product-setkey' && inputs.mode == 'catalog' && inputs.sources != '') && 'true' || '' }}
          # retire mode=source / audit-source-coverage: the per-product key
          # coverage floor under which an old product is kept, not retired.
          MIN_COVERAGE_PCT: ${{ inputs.min_coverage_pct }}
          # repair-refractor-mislabel: "refractor" (plain segment only) or
          # "all" (every slug whose parallel disagrees with its own title).
          #
          # rematch-sold-comps MODE=apply-improve reads SCOPE as its APPLY CLASS
          # SCOPE (audit gate item 8, 2026-09-03): base-eviction | improve |
          # both. The two writable classes were measured separately and came
          # back unequal -- BASE-EVICTION is clean corpus-wide (0 bad in 1,236
          # audited lines over 16 shards) while IMPROVE is dirty at 4.9%
          # (298/6,106) -- so the class that earned its apply can now have it
          # without dragging the other along. This input carries it because
          # workflow_dispatch is capped at 25 inputs and 24 are used; a new one
          # is not available.
          #
          # The runner-wide default "refractor" is INHERITED, not chosen, and
          # the script REFUSES it (exit 2) rather than treating it as "both":
          # an apply says which class it writes, by name. MODE=census ignores
          # SCOPE entirely and counts every class.
          #
          # For purge-seed-queue-sport-hygiene (2026-09-07) SCOPE is THE LIST
          # PATH, as it is for the two relocate-*-by-list lanes: the committed
          # .json emitted by audit-seed-queue-sport-hygiene --purge-list
          # (docs/reports/2026-09-07-seed-queue-sport-purge-list.json). It is
          # REQUIRED and has no default -- the lane writes, and a whole-scope
          # write refuses without its scope. The inherited runner-wide default
          # "refractor" does not end in .json, so it is REFUSED (exit 2) rather
          # than read as a scope, exactly as the rematch apply refuses it.
          SCOPE: ${{ inputs.scope }}
          # dedupe-catalog-partition-shadows: which products to sweep.
          SETKEY_LIKE: ${{ inputs.setkey_like }}
          # repair-base-to-title-finish: the setKey axis of its scope. The
          # parser defects it repairs are year- and sport-agnostic, so all
          # three axes (SPORTS/YEARS/SETKEYS) are inputs and the script
          # REFUSES an apply with all three empty -- a whole-pool mutation
          # has to say its own name (CF-A-WHOLE-SOURCE-RETIRE-NEEDS-ITS-NAME,
          # the same doctrine fold-umbrella-to-series applies just below).
          # repair-setkey-from-title-parallel shares this same SETKEYS axis,
          # where it names the WRONG setKey being swept (e.g. `topps` for the
          # flagship rows whose titles say Topps Chrome). Its scope is
          # SPORTS + YEARS + SETKEYS, all three the shared inputs above, and it
          # REFUSES an apply with all three empty -- a cross-product mutation
          # has to say its own name (CF-A-WHOLE-SOURCE-RETIRE-NEEDS-ITS-NAME).
          SETKEYS: ${{ inputs.setkey_like }}
          # fold-umbrella-to-series (D39, CF-THE-UMBRELLA-FOLDS-ONTO-ITS-SERIES).
          # The scope is SPORT + YEARS + SETKEY and the script refuses when any
          # of the three is empty -- a whole-scope write must be asked for by
          # name (CF-A-WHOLE-SOURCE-RETIRE-NEEDS-ITS-NAME). YEARS is the shared
          # input above.
          # rekey-product-setkey (2026-09-01, CF-THE-JAPANESE-CODE-IS-THE-KEY)
          # shares this same SPORT + SETKEY + YEAR scope, where SETKEY names the
          # FROM key. It REFUSES when SPORT, SETKEY or the TO key is empty, and
          # MODE=pool additionally refuses an empty YEAR: pokemon/1997/base4 is
          # the Japanese Rocket Gang set and pokemon/2000/base4 is the English
          # Base Set 2, so the year is the only thing keeping one product's
          # repair off the other's pool.
          SPORT: ${{ inputs.sports }}
          SETKEY: ${{ inputs.setkey_like }}
          SET_KEY: ${{ inputs.setkey_like }}
          YEAR: ${{ inputs.years }}
          # ingest-checklist-csv-to-catalog: a committed CSV dir (e.g. the
          # drew-ruled Bellingham entry) ingested through the ONE generic
          # ingester; SOURCE decides authority and the script refuses non-
          # checklist labels.
          DIR: ${{ inputs.scope }}
          SOURCE: ${{ inputs.sources }}
          # CF-A-ROW-IN-THE-WRONG-PARTITION-IS-AN-INVISIBLE-ROW: bound the
          # re-home so a slice can be proven before it runs across 17.7M rows.
          LIMIT: ${{ inputs.limit }}
          SCAN_LIMIT: ${{ inputs.scan_limit }}
          # reslug-tcg-out-of-sports-namespace: which non-sport categories.
          SPORTS: ${{ inputs.sports }}
          # CF-A-MISSING-ONLY-LANE-CANNOT-HEAL-A-STALE-ROW (#1614, 2026-09-07).
          # backfill-searchtokens-all-sports' single-sport scope. It reads
          # SPORT_FILTER, which the runner never exported -- so before this
          # line the ONLY thing a dispatch could run was the whole catalog, and
          # a per-sport apply (the shape a 35.7M-row heal actually wants) was
          # undispatchable. Guarded on the script name so `sports`, which other
          # lanes read as a comma LIST, cannot arrive here as one.
          #
          # Its other new knob, mode=recompute-stale, needs no line here: the
          # generic `MODE: ${{ inputs.mode }}` below already carries it. A
          # second MODE key in this same block would be a duplicate mapping key
          # -- YAML keeps the last and drops the first silently, which is how a
          # guard that looks present stops existing.
          SPORT_FILTER: ${{ inputs.script == 'backfill-searchtokens-all-sports' && inputs.sports || '' }}
          # reslugAllSoldComps: contentHash first-char shard, 16 total.
          SHARD_HEX: ${{ inputs.shard_hex }}
          # repair-parallel-from-title mode=backfill-stamp: bound the sweep to
          # one slug or slug prefix so the blast radius is measured in slices
          # before any pool-wide run. Empty = the whole pool.
          SLUG_PREFIX: ${{ inputs.slug_prefix }}
          # Without this the script silently runs its DEFAULT mode and reports
          # success having touched none of the population you dispatched it for.
          MODE: ${{ inputs.mode }}
          MAX_ROWS: ${{ inputs.max_rows }}
          # rehome: only move identity rows; graded rows are regenerable.
          PARENTS_ONLY: ${{ inputs.parents_only == true && 'true' || 'false' }}
          # dedupe-catalog-partition-shadows: opt in to deleting keyless rows.
          RETIRE_NO_PARTITION_KEY: ${{ inputs.retire_no_partition_key == true && 'true' || 'false' }}
          # retire-wiki-footer-catalog-rows: a REPORT counts the graded children
          # an apply would take with each row. The probe is one STARTSWITH
          # cross-partition scan per row (~4s measured), so it is opt-in rather
          # than default: on the full 585-setKey scope it is hours, for a number
          # the apply reports anyway. NO NEW INPUT -- dispatch is at 24 of
          # GitHub's 25 -- so it rides `mode`, guarded on the script name so the
          # token cannot leak into another lane's MODE.
          COUNT_CHILDREN: ${{ (inputs.script == 'retire-wiki-footer-catalog-rows' && inputs.mode == 'count-children') && 'true' || '' }}
          # CF-REPRICE-USER-HOLDINGS: pin Drew's userId + enable composite path
          # so the reprice writes new v2-calibrated FMVs.
          #
          # CF-A-PINNED-USER-CANNOT-BE-EVERY-USER (C-2, 2026-09-03). This was
          # an unconditional pin to Drew's userId, and reprice-user-holdings
          # reads MODE=all to sweep EVERY user -- so the nightly cadence lane
          # would have set out to reprice the whole corpus with one userId
          # nailed to the env.
          #
          # THE REAL PRECEDENCE (verified against the script, 2026-09-03):
          # MODE=all WINS. reprice-user-holdings.cjs tests ALL_USERS first and
          # returns from that branch, so a REPRICE_USER_ID set alongside
          # MODE=all is IGNORED, not honoured. An earlier revision of this
          # comment said the opposite; it was wrong, and a wrong comment about
          # precedence is how a corpus sweep silently becomes a one-user run
          # in someone's head.
          #
          # The pin still yields whenever a mode is named -- belt and braces,
          # and it keeps the env honest about intent rather than relying on the
          # script's ordering. mode=all is the corpus sweep and carries no
          # user; any other dispatch keeps Drew's id as the default it always
          # was. reap-orphan-price-trails reads the same var as its optional
          # one-user scope and gets the same treatment, for the same reason --
          # the corpus repair must not be quietly narrowed to one doc.
          #
          # CF-IF-KNOWN-WE-SHOULD-BE-ABLE-TO-FIGURE-IT-OUT (2026-09-05). The
          # acquisition chain reprices the users whose holdings it just
          # re-pointed, and those are whoever owned the withheld cards -- not
          # necessarily Drew. There was no way to say so: the pin was the only
          # source of a userId, and mode=all (the sole escape) is a CORPUS
          # sweep, which is far too wide for "reprice the two people whose four
          # holdings moved tonight".
          #
          # NO NEW INPUT. `titles` is already the runner's scope-by-name
          # channel for exactly this shape of thing (rederive-holding-identity
          # carries its holding ids there; rekey-product-setkey its TO key). A
          # reprice dispatch that names a user in `titles` reprices THAT user;
          # one that names none keeps the pin it always had, so every existing
          # dispatch of this lane is unchanged. mode=all still wins over both,
          # because the script tests ALL_USERS first and returns from it.
          REPRICE_USER_ID: ${{ (inputs.script == 'reprice-user-holdings' && inputs.titles != '') && inputs.titles || (inputs.mode == '' && 'user-199fcbc9-58ba-4643-a0c9-f75bcbc90bd4' || '') }}
          HOBBYIQFMV_COMPOSITE_ENABLED: "true"
          # CF-NODE-HEAP-8G (Drew, 2026-08-02). dedupe-catalog-by-hobbyiq
          # crashed at ~2M rows scanned with "JavaScript heap out of memory"
          # (exit 134). It builds an in-memory Map of every vendor row for
          # slug grouping. 8GB heap easily fits 2.4M rows and gives
          # headroom for future catalog growth.
          # D26 backfill-ebay-account-sales. DAYS and USER_IDS are script-level
          # knobs whose defaults ARE the ruling (90 days, every connected
          # user), so they get no dispatch input -- this workflow already
          # carries 23 and a knob nobody sets is a knob that drifts. `limit`
          # bounds USERS for this script, and `slot`/`slots` shard by userId.
          # RUN_MINUTES stays at the script's own 140 so the budget marker
          # lands inside the 150-minute step ceiling.
          DAYS: "90"
          # THE GREAT REMATCH. Both are fixed paths, not knobs: this workflow
          # already carries 24 inputs and a knob nobody sets is a knob that
          # drifts. The census JSON lands where the artifact step can find it;
          # the canary baseline is written by MODE=before and read by
          # MODE=after within one dispatch pair.
          # census-split-identity writes its own census to its own directory,
          # so the two lanes' artifacts can never overwrite each other. Guarded
          # on script for the same reason MODE tokens are: one name, one
          # meaning, and no chance of a path leaking into another lane.
          CENSUS_OUT: ${{ inputs.script == 'census-split-identity' && '/tmp/split-identity-census' || (inputs.script == 'census-duplicate-sale-ids' && '/tmp/duplicate-sale-ids-census' || (inputs.script == 'census-ch-product-label-parallel' && '/tmp/ch-product-label-census' || (inputs.script == 'census-unknown-setkey' && '/tmp/unknown-setkey-census' || '/tmp/rematch-census'))) }}
          # The TCG volume census writes ONE JSON document rather than a
          # directory, so it reads OUT (its own env name) rather than
          # CENSUS_OUT. Guarded on script for the same one-name-one-meaning
          # reason as the line above: an empty string on every other lane, so
          # no path can leak sideways into a script that would honour it.
          OUT: ${{ inputs.script == 'census-tcg-verticals' && '/tmp/tcg-verticals/census.json' || '' }}
          # CENSUS_FROM_TS is deliberately NOT wired to a dispatch input. A
          # relaunch re-reads its shard from the top, exactly as the rematch
          # census does and for the same reason: the walk is READ ONLY, so
          # there is no predicate that shrinks as it works, and a census that
          # resumed from a cursor would be a census of a SUFFIX of the shard
          # rather than of the shard. The re-read is cheap next to the
          # alternative -- a partial census nobody can quote. The env var
          # exists for a local operator narrowing a re-run by hand.
          BASELINE: /tmp/rematch-canary-baseline.json
          # THE WRITE LEDGER (2026-09-04): pool -> the ids this apply actually
          # moved. The AFTER canary gate reads this file, in this same job on
          # this same runner, so its verdict can be ATTRIBUTED -- a canary pool
          # this shard never wrote in cannot be regressed by it. Two shards
          # that reconciled `intended 0 = written 0` were failed on anchor
          # moves caused by the CardHedge daily ingest landing new sales
          # mid-apply; the ledger is what makes that distinguishable. A fixed
          # path for the same reason BASELINE is one.
          WRITE_LEDGER_OUT: /tmp/rematch-write-ledger.json
          # CF-MARKET-INDEXES: the rebuild's report is the document an
          # operator reads BEFORE authorising the purge, so it is written
          # to a file and uploaded rather than left in a log that scrolls.
          # A fixed path, not an input -- this workflow is at 24 of 25 and
          # a knob nobody sets is a knob that drifts.
          REPORT_OUT: /tmp/market-index-rebuild/report.json
          # resolve-split-identity-parks (2026-09-20). The script's own module
          # header has always documented reading a plain TITLES env var (an
          # optional title-substring filter, or -- as of this same date --
          # the exclude-winner:<id>[,...] syntax), but this workflow never
          # actually set it: only BCP_TITLES (a DIFFERENT env var, read by
          # other lanes riding the same `titles` dispatch input) existed
          # above. Guarded on script so this cannot leak a value into any
          # other lane's own env -- every other script here already reads
          # BCP_TITLES for its own `titles`-carried meaning, and TITLES was
          # simply never wired for this one.
          # fold-catalog-duplicate-rungs (2026-09-20) reads the SAME plain
          # TITLES env var as its REQUIRED comma-separated setKey list
          # narrowing a SCOPE cell (e.g. panini-prizm) -- guarded into the
          # SAME expression as resolve-split-identity-parks's own use of this
          # var (both scripts read `TITLES` directly, never BCP_TITLES, and
          # the `||` chain keeps them from stepping on one another since
          # `inputs.script` can only equal one value per dispatch).
          # resolve-disagreeing-sale-twins (OWNER RULING, 2026-09-21): reads a
          # `;`-separated TITLES token list for its OWN opt-in gate (the
          # literal token "rule:named-and-specific" arms the R1/R2
          # both-sides-valid flagging rules) -- same `TITLES` var, same
          # guarded-on-script `||` chain, never BCP_TITLES. Without this the
          # feature has no dispatch path at all: the script only ever reads
          # process.env.TITLES, which this workflow never set for this
          # script before now.
          TITLES: ${{ inputs.script == 'resolve-split-identity-parks' && inputs.titles || inputs.script == 'fold-catalog-duplicate-rungs' && inputs.titles || inputs.script == 'resolve-disagreeing-sale-twins' && inputs.titles || inputs.script == 'rewrite-parallel-names' && inputs.titles || '' }}
          # route-backing-gaps (2026-09-20). The GAP ROUTER reads `titles` as
          # an OPTIONAL comma-separated setKey filter (SET_KEYS) -- NOT a
          # from>to pair list like the sibling repoint lanes above: this lane
          # decides which lane applies, it does not carry that lane's own
          # dispatch arguments. Empty (the common case) means every in-scope
          # cell, filtered only by SCOPE/LIMIT/slot-shard.
          SET_KEYS: ${{ inputs.script == 'route-backing-gaps' && inputs.titles || '' }}
          # route-backing-gaps' LOAD LIMITS are deliberately NOT set here:
          # RU_BUDGET_MAX (300,000/link), SOLD_COMPS_RU_PER_SEC (1,500 over a
          # 10 s window) and MAX_THROTTLES (20) default inside the script, so
          # there is one place to read them and no dispatch can loosen them
          # -- sold_comps is 10,000 RU/s shared with production pricing reads.
          # resolve-split-identity-parks (2026-09-20). The banner's own
          # samples cap at 20-60 lines per bucket and, until now, the banner
          # claimed a fuller list lived "in the uploaded artifact" when the
          # artifact was only ever /tmp/backfill.log -- the SAME capped text.
          # PLAN_OUT is a fixed directory (not a new input; the 25-input cap
          # is spent) the script writes one NDJSON record per in-scope row
          # into, guarded on script for the same one-name-one-meaning reason
          # as CENSUS_OUT/REPORT_OUT above so no path can leak sideways into
          # a script that would honour it. Uploaded by the SAME step that
          # already uploads this lane's backfill.log, below.
          # repoint-sales-parallel-suffix (2026-09-20). ONE NDJSON record per
          # in-scope sale (action, reason, fromSlug/toSlug, target id) --
          # same auditability doctrine as resolve-split-identity-parks's own
          # PLAN_OUT, and the SAME fixed-path-guarded-on-script convention
          # (no new input; workflow_dispatch is at 24 of 25). Uploaded by the
          # SAME step that already uploads this lane's backfill.log, below.
          # fold-catalog-duplicate-rungs (2026-09-20): one NDJSON record per
          # fold-candidate GROUP -- same auditability doctrine as
          # resolve-split-identity-parks's own PLAN_OUT, same fixed-path-
          # guarded-on-script convention (no new input).
          # resolve-disagreeing-sale-twins (2026-09-20): one NDJSON record per
          # twins-disagree pair -- same fixed-path-guarded-on-script
          # convention, no new input.
          PLAN_OUT: ${{ inputs.script == 'resolve-split-identity-parks' && '/tmp/resolve-split-identity-parks-plan' || inputs.script == 'collapse-ch-synthetic-twins' && '/tmp/collapse-ch-synthetic-twins-plan' || inputs.script == 'resolve-disagreeing-sale-twins' && '/tmp/resolve-disagreeing-sale-twins-plan' || inputs.script == 'repoint-sales-to-sibling-product' && '/tmp/repoint-sales-to-sibling-product-plan' || inputs.script == 'repoint-sales-parallel-suffix' && '/tmp/repoint-sales-parallel-suffix-plan' || inputs.script == 'repoint-sales-cardnumber-suffix' && '/tmp/repoint-sales-cardnumber-suffix-plan' || inputs.script == 'repoint-sales-tiffany-title-gated' && '/tmp/repoint-sales-tiffany-title-gated-plan' || inputs.script == 'repoint-sales-isauto-flip' && '/tmp/repoint-sales-isauto-flip-plan' || inputs.script == 'route-backing-gaps' && '/tmp/route-backing-gaps-plan' || inputs.script == 'fold-catalog-duplicate-rungs' && '/tmp/fold-catalog-duplicate-rungs-plan' || '' }}
          NODE_OPTIONS: "--max-old-space-size=8192"
        # CF-A-REFUSAL-ON-STDERR-IS-NOT-A-KILLED-RUN (#1981). `tee` sees STDOUT
        # ONLY, so a lane that refuses on stderr — before its first stdout write
        # — left an EMPTY /tmp/backfill.log, and the relaunch's outcome test then
        # read that absence as "KILLED before finish" or "EMPTY LOG": confident,
        # wrong verdicts about a lane that started, decided, said so on stderr,
        # and exited on purpose. `2>&1` puts the verdict in the file the gate
        # reads, whichever stream carried it.
        #
        # `set -o pipefail` is the other half and is NOT optional: without it the
        # pipeline exits on tee's status — always 0 — so a crashed lane would
        # report SUCCESS. The finished arm requires `steps.backfill.outcome ==
        # 'success'` as its second witness, so zeroing the exit code would
        # promote every verdict into a clean finish: strictly worse than the bug
        # being fixed.
        #
        # #1981 fixed every teed lane in the repo and had to EXEMPT this one
        # file: at 553,411 bytes it was over GitHub's 512 KB ceiling, queuing
        # with zero jobs, and adding lines to a file that must shrink before it
        # runs at all was the wrong order. That exemption was written as a
        # self-retiring assertion. The composite extraction in this PR brings the
        # file to 283 KB, so the exemption has retired itself and the rule binds
        # here like everywhere else.
        run: |
          set -o pipefail
          node "backend/scripts/${{ inputs.script }}.cjs" 2>&1 | tee /tmp/backfill.log
        shell: bash

      # ── THE MARKET-INDEX REBUILD SAYS WHAT IT DID ────────────────────────
      #
      # CF-GREEN-WORKFLOW-IS-NOT-DATA-FLOW. This lane can DELETE documents,
      # so a zero exit code is not enough: the banner has to prove the run
      # bound the mode and scope it was dispatched for, and that the purge
      # accounted for every doc it named.
      #
      # Three assertions, all read off the run's own banner:
      #   1. the mode line matches the dispatch (an apply that printed
      #      REPORT-ONLY bound the wrong thing and deleted nothing);
      #   2. the purge reconciled (intended == deleted + skipped);
      #   3. no write was attempted in report mode.
      #
      # The script already exits 2 on 2 and 3, so this is belt and braces
      # for the case where the banner and the exit code disagree -- which
      # is exactly the class of defect that put nine baskets in prod.
      - name: The rebuild banner reconciles
        if: ${{ always() && inputs.script == 'rebuild-market-indexes' }}
        shell: bash
        run: |
          if [ ! -s /tmp/backfill.log ]; then
            echo "::error::no run log — the rebuild produced no banner at all"
            exit 1
          fi

          EXPECTED='REPORT-ONLY'
          if [ "${{ inputs.apply }}" = "true" ]; then EXPECTED='APPLY'; fi
          if ! grep -q "\"event\":\"market_index_rebuild_start\".*\"mode\":\"$EXPECTED" /tmp/backfill.log; then
            echo "::error::the run did not bind mode=$EXPECTED — read the start banner"
            grep -o '"event":"market_index_rebuild_start"[^}]*}' /tmp/backfill.log || true
            exit 1
          fi

          if ! grep -q '"event":"market_index_purge_reconcile".*"reconciled":true' /tmp/backfill.log; then
            echo "::error::the purge did not reconcile — intended != deleted + skipped"
            grep -o '"event":"market_index_purge_reconcile"[^}]*}' /tmp/backfill.log || true
            exit 1
          fi

          if grep -q 'market_index_rebuild_write_in_report_mode\|market_index_purge_deleted_in_report_mode' /tmp/backfill.log; then
            echo "::error::a REPORT-ONLY run attempted a write — this is the defect the lane exists to close"
            exit 1
          fi

          echo "Banner reconciles: mode=$EXPECTED, purge accounted for."
          grep -o '"event":"market_index_purge_reconcile"[^}]*}' /tmp/backfill.log || true
          grep -o '"event":"market_index_rebuild_verify"[^}]*"ok":[a-z]*' /tmp/backfill.log || true
          grep -o '"event":"market_index_rebuild_done"[^}]*}' /tmp/backfill.log || true

      # The report names every doc the purge would delete (or did), with the
      # marker that condemned it. A report that only ever lived in a log is
      # a report nobody can quote when authorising the apply.
      - name: Upload the market-index rebuild report
        if: ${{ always() && inputs.script == 'rebuild-market-indexes' }}
        uses: actions/upload-artifact@v4
        with:
          name: market-index-rebuild-${{ inputs.apply == true && 'apply' || 'report' }}-${{ github.run_id }}
          path: |
            /tmp/market-index-rebuild/report.json
            /tmp/backfill.log
          if-no-files-found: warn
          retention-days: 90

      # ── THE CANARY GATE, AFTER ───────────────────────────────────────────
      #
      # Same runner, same /tmp, same baseline the BEFORE step wrote. The script
      # exits 5 on any regression -- a canary pool that lost rows, went empty,
      # lost a protected row, or moved its anchor past tolerance -- and this
      # step does not swallow it, so exit 5 FAILS THE JOB. That is the whole
      # point: the shard's own banner cannot certify the shard.
      #
      # `always()` is deliberate and is NOT an unconditional pass: if the apply
      # step itself failed or hit its timeout, the pool has already been
      # partially written and the canaries are exactly what has to be measured.
      # Skipping the check on a failed apply would leave the damage unmeasured.
      #
      # This step runs BEFORE the self-relaunch step below, so a regressed
      # shard fails the job and `!cancelled()` on the relaunch is false --
      # a damaged shard never re-dispatches itself.
      - name: Canary gate AFTER the rematch apply (exit 5 fails this job)
        # The relaunch below reads this step's outcome to decide whether the
        # continuation may carry apply=true, so the step needs an id to be
        # referenceable. Nothing else about the gate changes.
        id: canary_after
        if: ${{ always() && inputs.script == 'rematch-sold-comps' && inputs.mode == 'apply-improve' && inputs.apply == true }}
        shell: bash
        env:
          MODE: after
          BASELINE: /tmp/rematch-canary-baseline.json
          # The ledger the apply step just wrote, same runner, same /tmp. It is
          # what lets a regression be ATTRIBUTED to this shard instead of to
          # whichever ingest lane happened to be running. If the apply died
          # before writing it, the checker finds no file and degrades CLOSED --
          # every canary treated as touched, the old strict rules.
          WRITE_LEDGER: /tmp/rematch-write-ledger.json
          SLOT: ${{ inputs.slot }}
          SCOPE: ${{ inputs.scope }}
          NODE_OPTIONS: "--max-old-space-size=8192"
        run: |
          set -o pipefail
          # CF-A-REFUSAL-ON-STDERR-IS-NOT-A-KILLED-RUN (#1981): `tee` sees stdout
          # only, so a checker that refuses on stderr would leave an empty
          # canary log and the uploaded artifact would say nothing about why.
          # `pipefail` was already here, and `rc=${PIPESTATUS[0]}` below keeps
          # the checker's own exit 5 rather than tee's zero.
          node backend/scripts/rematch-canary-check.cjs 2>&1 | tee /tmp/canary-after.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" = "5" ]; then
            echo "::error::CANARY REGRESSION on slot ${{ inputs.slot }} — a canary pool THIS SHARD WROTE IN regressed, or a protected row left / a pool went empty. The fleet STOPS here; the diff and the write ledger go to Drew."
          fi
          exit "$rc"

      # The write ledger is the shard's own answer to "what did YOU move?", and
      # it is the evidence the AFTER gate's verdict rests on. Uploaded so a
      # halt can be re-read without re-running anything -- the same reason the
      # baseline is. `always()` because a shard that FAILED is exactly the one
      # whose ledger has to be readable. It sits AFTER both the apply that
      # writes it and the gate that reads it.
      - name: Upload the shard's write ledger
        if: ${{ always() && inputs.script == 'rematch-sold-comps' && inputs.mode == 'apply-improve' && inputs.apply == true }}
        uses: actions/upload-artifact@v4
        with:
          name: rematch-write-ledger-slot-${{ inputs.slot }}-${{ github.run_id }}
          path: /tmp/rematch-write-ledger.json
          if-no-files-found: warn
          retention-days: 90

      # THE GREAT REMATCH: keep the shard census. The census is the whole
      # product of mode=census -- it is what the 500-row sample audit reads and
      # what Drew reads for the CONFLICT and UNDERIVABLE classes, which are
      # report-only forever. A census whose banner scrolled out of a log is a
      # census that has to be re-run across 500k rows, so it is uploaded.
      # if: always() -- a run that stopped at its budget still censused
      # everything it reached, and that partial census is worth keeping.
      - name: Upload the shard census
        if: ${{ always() && inputs.script == 'rematch-sold-comps' }}
        uses: actions/upload-artifact@v4
        with:
          name: rematch-census-slot-${{ inputs.slot }}-${{ github.run_id }}
          path: /tmp/rematch-census/
          if-no-files-found: warn
          retention-days: 90

      # The split-identity census IS the product of this lane -- the flagged
      # rows, their two addresses and the damaged-slug ranking are what a
      # repair list is built from, and re-deriving them costs another walk of
      # 16.4M rows. always(): a run that stopped at its budget still censused
      # everything it reached.
      - name: Upload the split-identity census
        if: ${{ always() && inputs.script == 'census-split-identity' }}
        uses: actions/upload-artifact@v4
        with:
          name: split-identity-census-slot-${{ inputs.slot }}-${{ github.run_id }}
          path: /tmp/split-identity-census/
          if-no-files-found: warn
          retention-days: 90

      # The TCG volume census IS the deliverable -- Drew reads these numbers to
      # decide whether the sport->vertical refactor is worth its cost and what
      # to say to four publishers. A number that only ever lived in a log is a
      # number nobody can quote in a permission request.
      - name: Upload the TCG volume census
        if: ${{ always() && inputs.script == 'census-tcg-verticals' }}
        uses: actions/upload-artifact@v4
        with:
          name: tcg-verticals-census-slot-${{ inputs.slot }}-${{ github.run_id }}
          path: |
            /tmp/tcg-verticals/
            /tmp/backfill.log
          if-no-files-found: warn
          retention-days: 90

      # TCG volume census self-relaunch. Relaunch iff the budget marker printed
      # (CF-RELAUNCH-ONLY-ON-BUDGET, #1361), forwarding every input verbatim --
      # `apply` included (#1578), though there is no live apply case to forward:
      # the gate above refuses an apply dispatch of this script before it
      # reaches Cosmos, so a relaunch carrying apply=true fails there exactly as
      # its parent did, loudly, rather than quietly running as something else.
      #
      # The continuation restarts its shard from the top, like every other
      # READ-ONLY census here and for the same reason: nothing shrinks as it
      # works, so a cursor-resumed run would census a SUFFIX of the shard and
      # report it as the whole. A shard that cannot fit one budget needs more
      # slots, not a cursor -- the banner prints PARTIAL and names the sports
      # that did not finish, so a shard that never completes is visible in the
      # log rather than silent.
      - name: Self-relaunch census-tcg-verticals until the shard is finished
        if: ${{ !cancelled() && inputs.script == 'census-tcg-verticals' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: ./.github/actions/relaunch-on-marker
        with:
          outcome: ${{ steps.backfill.outcome }}
          script: census-tcg-verticals
          budget-notice: |
            echo "::notice::budget hit — re-dispatching slot ${{ inputs.slot }} to continue the TCG census"
          finished-notice: |
            echo "::notice::finished within budget — done, no re-dispatch."
          dispatch: |
            gh workflow run backfill-runner.yml --repo "$GITHUB_REPOSITORY" --ref main -f script=census-tcg-verticals -f apply="${{ inputs.apply }}" -f mode="${{ inputs.mode }}" -f concurrency="${{ inputs.concurrency }}" -f slot="${{ inputs.slot }}" -f slots="${{ inputs.slots }}" -f limit="${{ inputs.limit }}"

      - name: Upload the CH-product-label census
        if: ${{ always() && inputs.script == 'census-ch-product-label-parallel' }}
        uses: actions/upload-artifact@v4
        with:
          name: ch-product-label-census-slot-${{ inputs.slot }}-${{ github.run_id }}
          path: |
            /tmp/ch-product-label-census/
            /tmp/backfill.log
          if-no-files-found: warn
          retention-days: 90

      # The unknown-setKey census's own artifact. Its JSON carries the buckets,
      # the per-(sport,year) sample sizes, the acquisition list and the top
      # products needing a vocabulary rule -- which is exactly the input the
      # alias/vocab ruling reads. A report that only ever lived in a log is a
      # report nobody can quote when authorising the change.
      - name: Upload the unknown-setKey census
        if: ${{ always() && inputs.script == 'census-unknown-setkey' }}
        uses: actions/upload-artifact@v4
        with:
          name: unknown-setkey-census-slot-${{ inputs.slot }}-${{ github.run_id }}
          path: |
            /tmp/unknown-setkey-census/
            /tmp/backfill.log
          if-no-files-found: warn
          retention-days: 90

      # The repair's own log is the record of what moved and what was skipped
      # by which leg, with the canary anchors before and after. Kept for the
      # same reason: an apply has to be quotable afterwards.
      - name: Upload the CH-product-label repair log
        if: ${{ always() && inputs.script == 'repair-ch-product-label-parallel' }}
        uses: actions/upload-artifact@v4
        with:
          name: ch-product-label-repair-${{ inputs.apply == true && 'apply' || 'report' }}-${{ github.run_id }}
          path: /tmp/backfill.log
          if-no-files-found: warn
          retention-days: 90

      # The finish-collision refile's log carries the per-BUCKET report -- in
      # scope, would-write, and the skips grouped by which assertion refused --
      # plus the canary anchors before and after. That report is what an apply
      # dispatch is authorised from, and a report that only ever lived in a log
      # is a report nobody can quote.
      - name: Upload the finish-collision refile log
        if: ${{ always() && inputs.script == 'repair-finish-collision-refile' }}
        uses: actions/upload-artifact@v4
        with:
          name: finish-collision-refile-${{ inputs.apply == true && 'apply' || 'report' }}-slot-${{ inputs.slot }}-${{ github.run_id }}
          path: /tmp/backfill.log
          if-no-files-found: warn
          retention-days: 90

      # The Bowman refile's log carries the per-BUCKET report and, crucially,
      # the REFUSED-BY-NAME list: every row whose destination held a different
      # player. That list is the evidence the nine collisions stayed apart, so
      # it is kept as long as the apply it justifies.
      - name: Upload the Bowman product refile log
        if: ${{ always() && inputs.script == 'repair-bowman-product-refile' }}
        uses: actions/upload-artifact@v4
        with:
          name: bowman-product-refile-${{ inputs.apply == true && 'apply' || 'report' }}-slot-${{ inputs.slot }}-${{ github.run_id }}
          path: /tmp/backfill.log
          if-no-files-found: warn
          retention-days: 90

      # The checklist-numbered fold's log carries every FAILED fold in full
      # (never a 5-line sample), every REFUSED-different-player pair, and the
      # new cross-product (not folded) bucket -- the evidence an APPLY dispatch
      # is quotable from, same reason the Bowman refile log above is kept.
      - name: Upload the checklist-numbered fold log
        if: ${{ always() && inputs.script == 'fold-checklist-numbered-twins' }}
        uses: actions/upload-artifact@v4
        with:
          name: fold-checklist-numbered-twins-${{ inputs.apply == true && 'apply' || 'report' }}-slot-${{ inputs.slot }}-${{ github.run_id }}
          path: /tmp/backfill.log
          if-no-files-found: warn
          retention-days: 90

      # The catalog-duplicate-rungs fold's log carries the banner (cells, rows
      # scanned, groups, would-fold rows, survivors re-keyed, sales to
      # re-point, refusals BY CLASS, failed, RU) and the top-40 (loser slug ->
      # canonical slug) pairs -- the evidence an APPLY dispatch is quotable
      # from. PLAN_OUT's own NDJSON (one record per fold-candidate GROUP) is
      # uploaded alongside it, same doctrine as resolve-split-identity-parks.
      - name: Upload the catalog-duplicate-rungs fold log
        if: ${{ always() && inputs.script == 'fold-catalog-duplicate-rungs' }}
        uses: actions/upload-artifact@v4
        with:
          name: fold-catalog-duplicate-rungs-${{ inputs.apply == true && 'apply' || 'report' }}-slot-${{ inputs.slot }}-${{ github.run_id }}
          path: |
            /tmp/backfill.log
            /tmp/fold-catalog-duplicate-rungs-plan/
          if-no-files-found: warn
          retention-days: 90

      # Split-identity census self-relaunch. Relaunch iff the budget marker
      # printed (#1361), forwarding every input verbatim -- `apply` included
      # (#1578: a report that relaunches as a write is the defect that rule
      # exists to stop, and hardcoding EITHER value is how it happens). There
      # is no live apply case to forward here anyway: the gate above refuses an
      # apply dispatch of this script before it reaches Cosmos, so a relaunch
      # carrying apply=true fails at that gate exactly as its parent did,
      # loudly, instead of quietly running as something it was not asked to be.
      #
      # A shard that cannot finish inside one budget will relaunch forever
      # without making progress, because the continuation restarts from the
      # top (see CENSUS_FROM_TS above). That is a REAL limit and the fix is
      # more slots, not a cursor: raise `slots` so each shard fits a budget.
      # The banner prints planned vs classified rows, so a shard that never
      # completes is visible in the log rather than silent.
      - name: Self-relaunch census-split-identity until the shard is finished
        if: ${{ !cancelled() && inputs.script == 'census-split-identity' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: ./.github/actions/relaunch-on-marker
        with:
          outcome: ${{ steps.backfill.outcome }}
          script: census-split-identity
          budget-notice: |
            N=$(grep -aoE "flagged +[0-9,]+" /tmp/backfill.log | grep -oE "[0-9,]+" | tail -1 || true)
            echo "::notice::budget hit (flagged=${N:-0}) — re-dispatching slot ${{ inputs.slot }} to continue"
          finished-notice: |
            echo "::notice::finished within budget — done, no re-dispatch."
          dispatch: |
            gh workflow run backfill-runner.yml --repo "$GITHUB_REPOSITORY" --ref main -f script=census-split-identity -f apply="${{ inputs.apply }}" -f mode="${{ inputs.mode }}" -f concurrency="${{ inputs.concurrency }}" -f slot="${{ inputs.slot }}" -f slots="${{ inputs.slots }}" -f limit="${{ inputs.limit }}"

      - name: Self-relaunch census-duplicate-sale-ids until the shard is finished
        if: ${{ !cancelled() && inputs.script == 'census-duplicate-sale-ids' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: ./.github/actions/relaunch-on-marker
        with:
          outcome: ${{ steps.backfill.outcome }}
          script: census-duplicate-sale-ids
          budget-notice: |
            N=$(grep -aoE "ids in >1 partition +[0-9,]+" /tmp/backfill.log | grep -oE "[0-9,]+" | tail -1 || true)
            echo "::notice::budget hit (dupIds=${N:-0}) — re-dispatching slot ${{ inputs.slot }} to continue"
          finished-notice: |
            echo "::notice::finished within budget — done, no re-dispatch."
          dispatch: |
            gh workflow run backfill-runner.yml --repo "$GITHUB_REPOSITORY" --ref main -f script=census-duplicate-sale-ids -f apply="${{ inputs.apply }}" -f mode="${{ inputs.mode }}" -f concurrency="${{ inputs.concurrency }}" -f slot="${{ inputs.slot }}" -f slots="${{ inputs.slots }}" -f limit="${{ inputs.limit }}"

      - name: Self-relaunch rematch-sold-comps until the shard is finished
        if: ${{ !cancelled() && inputs.script == 'rematch-sold-comps' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: ./.github/actions/relaunch-on-marker
        with:
          outcome: ${{ steps.backfill.outcome }}
          script: rematch-sold-comps
          budget-notice: |
            N=$(grep -aoE "(re-keyed|would re-key) +[0-9,]+" /tmp/backfill.log | grep -oE "[0-9,]+" | tail -1 || true)
            if [ "${{ inputs.apply }}" = "true" ] && [ "${{ steps.canary_after.outcome }}" = "success" ]; then
              echo "::notice::budget hit on an APPLY of slot ${{ inputs.slot }} (written=${N:-0}) — this link's AFTER canary PASSED, so the continuation is dispatched as an APPLY. Every link takes its own before/apply/after triple on its own runner, so the continuation is gated by its OWN canary, never by this one."
            elif [ "${{ inputs.apply }}" = "true" ]; then
              echo "::warning::budget hit on an APPLY of slot ${{ inputs.slot }} (written=${N:-0}) — this link's AFTER canary did NOT pass (outcome: ${{ steps.canary_after.outcome }}), so the continuation is dispatched as a REPORT (apply=false). A regressed or unverified link never hands the next one a write mandate; the diff and the write ledger go to Drew."
            else
              echo "::notice::budget hit (written=${N:-0}) — re-dispatching slot ${{ inputs.slot }} to continue"
            fi
          finished-notice: |
            echo "::notice::finished within budget — done, no re-dispatch."
          dispatch: |
            gh workflow run backfill-runner.yml --repo "$GITHUB_REPOSITORY" --ref main -f script=rematch-sold-comps -f mode="${{ inputs.mode }}" -f apply="${{ inputs.apply == true && steps.canary_after.outcome == 'success' }}" -f concurrency="${{ inputs.concurrency }}" -f slot="${{ inputs.slot }}" -f slots="${{ inputs.slots }}" -f years="${{ inputs.years }}" -f limit="${{ inputs.limit }}" -f scope="${{ inputs.scope }}" -f sports="${{ inputs.sports }}" -f setkey_like="${{ inputs.setkey_like }}" -f sources="${{ inputs.sources }}"
          startup-marker-prefix: rematch-sold-comps
          startup-banner-regex: "^rematch-sold-comps  MODE="

      - name: Self-relaunch repair-price-inferred-grades until the sweep completes
        if: ${{ !cancelled() && inputs.script == 'repair-price-inferred-grades' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: ./.github/actions/relaunch-on-marker
        with:
          outcome: ${{ steps.backfill.outcome }}
          script: repair-price-inferred-grades
          budget-notice: |
            N=$(grep -aoE "demoted +[0-9,]+" /tmp/backfill.log | grep -oE "[0-9,]+" | tail -1 || true)
            echo "::notice::budget hit (demoted=${N:-0}) — re-dispatching to continue"
          finished-notice: |
            echo "::notice::finished within budget — done, no re-dispatch."
          dispatch: |
            gh workflow run backfill-runner.yml --repo "$GITHUB_REPOSITORY" --ref main -f script=repair-price-inferred-grades -f apply="${{ inputs.apply }}" -f concurrency="${{ inputs.concurrency }}" -f slot="${{ inputs.slot }}" -f slots="${{ inputs.slots }}" -f sources="${{ inputs.sources }}" -f limit="${{ inputs.limit }}"

      - name: Self-relaunch materialize-ungraded-parents until every parent exists
        if: ${{ !cancelled() && inputs.script == 'materialize-ungraded-parents' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: ./.github/actions/relaunch-on-marker
        with:
          outcome: ${{ steps.backfill.outcome }}
          script: materialize-ungraded-parents
          budget-notice: |
            N=$(grep -aoE "parents minted +[0-9,]+" /tmp/backfill.log | grep -oE "[0-9,]+" | tail -1 || true)
            echo "::notice::budget hit (minted=${N:-0}) — re-dispatching to continue"
          finished-notice: |
            echo "::notice::finished within budget — done, no re-dispatch."
          dispatch: |
            gh workflow run backfill-runner.yml --repo "$GITHUB_REPOSITORY" --ref main -f script=materialize-ungraded-parents -f apply="${{ inputs.apply }}" -f concurrency="${{ inputs.concurrency }}" -f slot="${{ inputs.slot }}" -f slots="${{ inputs.slots }}" -f sports="${{ inputs.sports }}" -f years="${{ inputs.years }}" -f setkey_like="${{ inputs.setkey_like }}" -f limit="${{ inputs.limit }}"

      - name: Self-relaunch repair-missing-search-fields until the scope is healed
        if: ${{ !cancelled() && inputs.script == 'repair-missing-search-fields' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: ./.github/actions/relaunch-on-marker
        with:
          outcome: ${{ steps.backfill.outcome }}
          script: repair-missing-search-fields
          budget-notice: |
            N=$(grep -aoE "healed=[0-9,]+" /tmp/backfill.log | grep -oE "[0-9,]+" | tail -1 || true)
            echo "::notice::budget hit (healed=${N:-0}) — re-dispatching to continue"
          finished-notice: |
            echo "::notice::finished within budget — done, no re-dispatch."
          dispatch: |
            gh workflow run backfill-runner.yml --repo "$GITHUB_REPOSITORY" --ref main -f script=repair-missing-search-fields -f apply="${{ inputs.apply }}" -f concurrency="${{ inputs.concurrency }}" -f slot="${{ inputs.slot }}" -f slots="${{ inputs.slots }}" -f sports="${{ inputs.sports }}" -f years="${{ inputs.years }}" -f setkey_like="${{ inputs.setkey_like }}" -f limit="${{ inputs.limit }}"

      - name: Self-relaunch retire-wiki-footer-catalog-rows until the scope is clear
        if: ${{ !cancelled() && inputs.script == 'retire-wiki-footer-catalog-rows' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: ./.github/actions/relaunch-on-marker
        with:
          outcome: ${{ steps.backfill.outcome }}
          script: retire-wiki-footer-catalog-rows
          budget-notice: |
            N=$(grep -aoE "deleted=[0-9,]+" /tmp/backfill.log | grep -oE "[0-9,]+" | tail -1 || true)
            echo "::notice::budget hit (deleted=${N:-0}) — re-dispatching to continue"
          finished-notice: |
            echo "::notice::finished within budget — done, no re-dispatch."
          dispatch: |
            gh workflow run backfill-runner.yml --repo "$GITHUB_REPOSITORY" --ref main -f script=retire-wiki-footer-catalog-rows -f apply="${{ inputs.apply }}" -f setkey_like="${{ inputs.setkey_like }}"

      - name: Self-relaunch purge-seed-queue-sport-hygiene until the list is drained
        if: ${{ !cancelled() && inputs.script == 'purge-seed-queue-sport-hygiene' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: ./.github/actions/relaunch-on-marker
        with:
          outcome: ${{ steps.backfill.outcome }}
          script: purge-seed-queue-sport-hygiene
          budget-notice: |
            N=$(grep -aoE "written [0-9,]+" /tmp/backfill.log | grep -oE "[0-9,]+" | tail -1 || true)
            echo "::notice::budget hit (written=${N:-0}) — re-dispatching to continue"
          finished-notice: |
            echo "::notice::finished within budget — done, no re-dispatch."
          dispatch: |
            gh workflow run backfill-runner.yml --repo "$GITHUB_REPOSITORY" --ref main -f script=purge-seed-queue-sport-hygiene -f apply="${{ inputs.apply }}" -f scope="${{ inputs.scope }}"

      - name: Self-relaunch the re-slug until nothing changes
        # touched=N is the line this greps, and the script only prints it on a
        # clean exit -- which is why it now stops at its own 140-minute budget
        # rather than being SIGKILLed at the 150-minute ceiling with nothing
        # printed and nothing re-dispatched.
        #
        # Convergent, so re-running is safe: a row whose slug already matches
        # what the generator produces is counted as skipped, not rewritten, so
        # a relaunch that finds nothing left to change stops the loop.
        if: ${{ !cancelled() && inputs.script == 'reslugAllSoldComps' }}
        env:
          GH_TOKEN: ${{ github.token }}
        uses: ./.github/actions/relaunch-on-marker
        with:
          outcome: ${{ steps.backfill.outcome }}
          script: reslugAllSoldComps
          preamble: |
            N=$(grep -aoE "touched=[0-9]+" /tmp/backfill.log | tail -1 | grep -oE "[0-9]+$" || true)
            echo "reslug_touched=${N:-0}"
          budget-notice: |
            echo "::notice::budget hit (touched=${N:-0}) — re-dispatching slot ${{ inputs.slot }}/${{ inputs.slots }} to continue"
          finished-notice: |
            echo "::notice::slot ${{ inputs.slot }}/${{ inputs.slots }} finished within budget (touched=${N:-0}) — done, no re-dispatch."
          dispatch: |
            gh workflow run backfill-runner.yml --repo "$GITHUB_REPOSITORY" --ref main -f script=reslugAllSoldComps -f apply="${{ inputs.apply }}" -f concurrency="${{ inputs.concurrency }}" -f slot="${{ inputs.slot }}" -f slots="${{ inputs.slots }}" -f shard_hex="${{ inputs.shard_hex }}"

      - name: Self-relaunch the universe driver until its lane is drained
        # D38. One generation takes N entries for ONE lane, records a verdict per
        # entry in crawl_state, and stops at its own 140-minute budget. Because
        # the position lives in Cosmos and not on disk, a relaunch resumes from
        # the verdicts rather than from the head of the list -- so this needs no
        # cache, and a killed generation loses at most the entry in flight.
        #
        # Gated on the MARKER, never on a count. A count gate loops forever on a
        # lane whose remainder is entries the source does not serve (they settle
        # as `unreachable` and stay that way), and stops early on a generation
        # that happened to refuse everything it took -- which is a real outcome
        # here, not an error. The inputs are forwarded verbatim so the relaunch
        # is the same dispatch against a smaller pending set.
        # CF-REPORT-RELAUNCHES-AS-A-REPORT (D34). The gate is the MARKER and is
        # mode-blind -- the driver prints the marker from the same line in both
        # modes. Gating on `apply` would mean a REPORT longer than one budget
        # could never finish, and hardcoding the forwarded apply input to true
        # would bring an accidental relaunch of a report back as a WRITE. So
        # `apply` is forwarded verbatim like every other input.
        if: ${{ !cancelled() && inputs.script == 'ingest-universe-driver' }}
        env:
          GH_TOKEN: ${{ github.token }}
