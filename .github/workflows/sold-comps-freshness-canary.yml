name: Sold Comps Freshness Canary

# CF-FRESHNESS-CANARY (Drew, 2026-08-07). Alerts if the sold_comps
# pool isn't receiving fresh writes. Backstop against silent ingest
# failures — the 2026-08-03..07 TCA APPLY-fallback bug is the motivating
# case (green workflow, zero writes, no alert for 5 days).
#
# Runs every 6h. Fails loudly (red ❌ → GitHub emails Drew) when the
# latest observedAt on sold_comps is more than 25h old. Threshold
# tolerates one full inter-cron window plus slop; anything stale beyond
# that means either the nightly TCA cron didn't run, ran silent, or
# Cosmos writes are failing.
#
# D13 (2026-08-29) — the row-count axis. Staleness alone cannot tell the
# firehose from the webhook trickle: while the nightly firehose is dead
# the 30-minute webhook keeps observedAt fresh, so the 08-03 outage shape
# read "OK" here. MIN_ROWS_24H fails when a source's trailing-24h row
# count is below its floor and always prints the count.
#
# Measured 2026-08-29 (read-only GROUP BY source, day — UTC calendar
# days 08-22..08-28):
#   tca-ebay   100190 / 114513 / 108922 / 100966 /  9340 / 11911 /  9280   min  9280
#   cardhedge  197620 /  36640 /  58927 /  96621 / 101911 / 58272 / 32422   min 32422
# Floor = ~25% of the observed minimum day → tca-ebay=2300. The 08-26
# step-down from ~100k/day to ~10k/day is itself the shape this axis
# exists for: if the firehose is confirmed back, raise the floor toward
# 25000 (25% of the firehose-era minimum). cardhedge stays off (runtime,
# demand-driven; a quiet day is not an outage).

on:
  schedule:
    - cron: '30 */6 * * *'
  workflow_dispatch:
    inputs:
      max_staleness_hours:
        description: 'Override threshold (hours). Default 25.'
        required: false
        type: string
        default: '25'
      min_rows_24h:
        description: 'Per-source 24h row floors, e.g. tca-ebay=2300,cardhedge=0 (0 = off). Default tca-ebay=2300.'
        required: false
        type: string
        default: 'tca-ebay=2300'

jobs:
  check-freshness:
    name: Check sold_comps ingest freshness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend deps
        working-directory: backend
        run: npm ci --omit=dev

      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_1259D9D213E34AE29B2DD54B3E755C4D }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_5AB8B3DC612348FD9D37DBE28FF40802 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_A45CF8552AE94AF68A046FB846E21206 }}

      - name: Run freshness canary
        working-directory: backend
        run: |
          COSMOS_CONNECTION_STRING=$(az webapp config appsettings list \
            --name HobbyIQ3 --resource-group rg-hobbyiq-dev \
            --query "[?name=='COSMOS_CONNECTION_STRING'].value" -o tsv | tr -d '\r\n')
          if [ -z "$COSMOS_CONNECTION_STRING" ]; then
            echo "::error::COSMOS_CONNECTION_STRING empty from App Service"
            exit 1
          fi
          COSMOS_CONNECTION_STRING="$COSMOS_CONNECTION_STRING" \
          COSMOS_DATABASE=hobbyiq \
          MAX_STALENESS_HOURS="${{ inputs.max_staleness_hours || '25' }}" \
          MIN_ROWS_24H="${{ inputs.min_rows_24h || 'tca-ebay=2300' }}" \
          node scripts/checkSoldCompsFreshness.cjs
