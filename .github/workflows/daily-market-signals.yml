name: Daily Market Signals Refresh

# CF-DAILY-MARKET-SIGNALS (Drew, 2026-07-30). Runs after the 5 AM ET
# refresh + CH ingest completes. Computes 30d-vs-prior-30d momentum
# per (dimension, key) across colorFamily/edition/finishModifier/
# insertSet/sport/productLine/isAuto/autoStyle/gradeTier. Writes to
# market_signals container with 8-day TTL. Consumed by hobbyIqFmv
# for daily-refreshed momentum adjustment.
#
# CF-MARKET-MOVERS-PERSISTED-SNAPSHOT (Fable, 2026-09-12). Also refreshes
# every scheduled GET /api/compiq/market-movers snapshot shape (see
# backend/src/services/compiq/marketMoversSnapshot.service.ts). Reusing
# THIS workflow rather than a new one: it already runs daily right after
# the CH ingest (freshest pool for both jobs), already does azure/login for
# OIDC, and has ~18 unused minutes under its 30-minute timeout. The refresh
# is a raw cross-partition scan of sold_comps per shape, which under fleet
# load can exceed the App Service front end's 240s idle cut — so it is
# dispatched (202 + jobId) and polled via poll-admin-job.cjs, same pattern
# as the "Warm DailyIQ brief" step in daily-refresh.yml and the nightly
# sub-raw-inversion scan, rather than held open as one HTTP response.

on:
  schedule:
    # 5:30 AM ET = 09:30 UTC (EST) / 10:30 UTC (EDT). Use 10:30 UTC
    # to catch both — it's 6:30 EDT / 5:30 EST which both fall after
    # the 5:00 AM ingest.
    - cron: "30 10 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # Azure OIDC for App Service secret fetch

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
      - name: Setup Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Install backend deps
        working-directory: backend
        run: npm ci
      - name: Build backend dist
        working-directory: backend
        run: npm run build
      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_1259D9D213E34AE29B2DD54B3E755C4D }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_5AB8B3DC612348FD9D37DBE28FF40802 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_A45CF8552AE94AF68A046FB846E21206 }}
      - name: Fetch COSMOS_CONNECTION_STRING
        shell: bash
        run: |
          CS=$(az webapp config appsettings list \
            --name HobbyIQ3 \
            --resource-group rg-hobbyiq-dev \
            --query "[?name=='COSMOS_CONNECTION_STRING'].value | [0]" \
            -o tsv)
          if [ -z "$CS" ]; then
            echo "::error::FAILED to fetch COSMOS_CONNECTION_STRING"
            exit 1
          fi
          echo "::add-mask::$CS"
          echo "COSMOS_CONNECTION_STRING=$CS" >> "$GITHUB_ENV"
      - name: Run market signals refresh
        # CF-A-KILLED-JOB-CANNOT-REPORT-PROGRESS. refresh-market-signals gained
        # the shared clock in the #1944 ratchet's wave 4, and its DEFAULT is
        # sized for the backfill runner's 150-minute step. THIS job has
        # `timeout-minutes: 30` -- shared with npm ci and a full backend build --
        # so the default would be a "budget" a whole order of magnitude above
        # the ceiling it is supposed to stop under, i.e. no budget at all.
        #
        # 12 minutes leaves the install + build their share and still stops the
        # lane with time to print its refusal, reconcile and finishLane line
        # before the 30-minute kill. RESERVE_MS stays at the lane's own default
        # (one 5,000-row page).
        #
        # A STOP HERE REFUSES AND EXITS 5, by design: the signals are ratios of
        # medians and counts over the whole window, so a partial scan would
        # publish wrong momentum over the top of right momentum. A red run
        # saying "the window did not fit in 12 minutes" is the correct outcome
        # and the signal to widen this job, never to widen the budget past the
        # ceiling.
        env:
          MARKET_SIGNALS_APPLY: "true"
          MARKET_SIGNALS_WINDOW_DAYS: "30"
          MARKET_SIGNALS_MIN_VOLUME: "20"
          RUN_MINUTES: "12"
        run: node backend/scripts/refresh-market-signals.cjs

      # CF-MARKET-MOVERS-PERSISTED-SNAPSHOT (Fable, 2026-09-12).
      - name: Guard — ADMIN_API_TOKEN present
        env:
          ADMIN_API_TOKEN: ${{ secrets.ADMIN_API_TOKEN }}
        run: |
          if [ -z "$ADMIN_API_TOKEN" ]; then
            echo "::error::ADMIN_API_TOKEN secret missing — skipping market-movers snapshot refresh"
            exit 1
          fi
          echo "::add-mask::$ADMIN_API_TOKEN"

      - name: Refresh market-movers snapshots (dispatch + poll)
        # Same dispatch+poll shape as "Warm DailyIQ brief" in daily-refresh.yml
        # and the nightly sub-raw-inversion scan: the refresh walks sold_comps
        # once per scheduled shape (see scheduledSnapshotShapes()) and can
        # exceed the App Service front end's 240s idle cut under fleet load,
        # so this dispatches (202 + jobId) and polls instead of holding one
        # HTTP response open.
        env:
          ADMIN_API_TOKEN: ${{ secrets.ADMIN_API_TOKEN }}
        run: |
          set -o pipefail
          set +e
          node backend/scripts/poll-admin-job.cjs \
            --label market-movers-snapshots \
            --method POST \
            --dispatch-url "https://hobbyiq3-e5a4dgfsdnb5fbha.centralus-01.azurewebsites.net/api/admin/market-movers/refresh-snapshots" \
            --status-url "https://hobbyiq3-e5a4dgfsdnb5fbha.centralus-01.azurewebsites.net/api/admin/market-movers/refresh-snapshots/status" \
            --auth-header "Authorization: Bearer $ADMIN_API_TOKEN" \
            2>&1 | tee /tmp/market-movers-poll.log
          POLL_RC=$?
          set -e
          if [ "$POLL_RC" -eq 2 ]; then
            echo "::error::market-movers snapshot refresh never reported settled — UNKNOWN, not a failure; the run may have finished on the other instance"
            exit 1
          fi
          if [ "$POLL_RC" -ne 0 ]; then
            echo "::error::market-movers snapshot refresh failed"
            exit 1
          fi
          RESULT=$(sed -n 's/^RESULT_JSON //p' /tmp/market-movers-poll.log | tail -n1)
          if [ -z "$RESULT" ]; then
            echo "::error::market-movers snapshot refresh settled without a summary body"
            exit 1
          fi
          echo "$RESULT" | jq '.result'
