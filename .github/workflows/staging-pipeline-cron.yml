name: Staging Pipeline Cron

# CF-STAGING-PIPELINE-CRON (Drew, 2026-07-28). Autonomous drain of
# the staging pipeline every 5 minutes. Each run walks all three
# jobs in order: data-clean → image-verify → promotion.
#
# CF-STAGING-BATCH-BUMP (Drew, 2026-08-01). Batch sizes bumped 4×
# after audit found 416K pending rows and the old sizing (data-clean
# 200 / promotion 500) would take 17 days to drain.
#   data-clean:  200 → 800   (intended ~230K/day drain capacity)
#   image-verify: 50 → 100
#   promotion:   500 → 2000  (intended ~575K/day promotion capacity)
#
# CORRECTION (2026-08-13): that bump never took effect. The route clamped
# `limit` with Math.min(500, ...), so 800 and 2000 both became 500 and the
# real capacity stayed 144K/day per stage — under the ~300K/day inbound,
# which is why the backlog grew to 3.5M instead of draining. Nothing
# surfaced it: the workflow passed 800, got HTTP 200, and reported success.
# Cap is now MAX_BATCH=5000 and the numbers above are finally reachable.
#
# Rate-limit friendly:
#   - Vision: 50 rows × 2s/call = 100s per run, well under 300s job
#   - Cosmos: batch operations already bounded server-side
#
# Silent-safe: any transient failure just fails this run; the next
# 5-minute tick picks up where we left off (no state to corrupt).

on:
  schedule:
    - cron: '*/5 * * * *'   # every 5 minutes
  workflow_dispatch:
    inputs:
      data_clean_limit:
        # CF-DATACLEAN-HEADROOM (Drew, 2026-08-14). Same failure as promotion,
        # one step earlier: shards 0/2/4 hit --max-time 240 while 1/3/5 returned
        # fine. Verified NOT contention — it still failed with the local drain
        # stopped, which was my first (wrong) theory.
        #
        # Cost per row is not uniform: data-clean does per-slug rolling-median
        # lookups for the price band, so a shard whose slice lands on
        # high-volume slugs does far more work at the same batch size. Sizing
        # for the average shard guarantees the slow ones fail.
        description: 'Data-clean batch size PER SHARD (must finish inside 240s)'
        default: '750'
      image_verify_limit:
        description: 'Image-verify batch size'
        default: '100'
      promotion_limit:
        # CF-PROMOTION-SIZED-TO-THE-CEILING (Drew, 2026-08-14: "we need to
        # really work on the ingestion and matching to catch up and stay
        # ahead"). 2000 could NEVER finish: promotion is bounded by App
        # Service's 240s request ceiling, so an oversized batch times out and
        # accomplishes nothing — the cron was asking for work it could not
        # complete. Measured on f5cbed54 after the RU fix:
        #   limit=200 -> 132s (90 rows/min)
        #   limit=400 -> 195s (123 rows/min)   <- completes, with headroom
        # CORRECTION (2026-08-14, same day): 400 was sized from a 195s
        # measurement against a --max-time of 200s. A five-second margin is not
        # a margin. Measured on the cron itself, shards 1/3/5 returned in
        # 114-121s while shards 0/2/4 hit the timeout exactly — same batch size,
        # ~2x spread, because per-row matcher cost varies by set.
        #
        # "Largest size that completes" was the wrong target; it has to be the
        # largest that completes on the SLOWEST shard, on a bad day. 250 lands
        # around 120s at the observed rate, leaving real headroom, and the
        # curl timeout below is raised to the App Service ceiling so a slow
        # shard is killed by the server rather than by us at 200s.
        description: 'Promotion batch size PER SHARD (must finish well inside 240s)'
        default: '250'
      shards:
        # Throughput is per-worker (123 rows/min), so shards are the multiplier.
        # 4 shards = ~708K rows/day against ~300K/day inbound — enough to stay
        # ahead AND draw down the 3.2M backlog in roughly 8 days. 6 shards is
        # ~1.06M/day. Raise if RU headroom allows; comps_staging autoscales to
        # 40,000 RU and the matcher queries are now ~6.5x cheaper.
        # CF-SHARDS-MUST-DIVIDE-16 (Drew, 2026-08-14). MUST divide 16 evenly.
        # The jobs shard by STARTSWITH(c.id, <hex char>) with chars assigned
        # `i % SHARDS`, so with 6 shards over 16 hex characters the split is
        # both uneven AND aliased:
        #
        #   shard 0 -> '0','6','c'      shard 1 -> '1','7','d'
        #   shard 2 -> '2','8','e'      shard 3 -> '3','9','f'
        #   shard 4 -> '4','a'          shard 5 -> '5','b'
        #
        # Even shards get the even-indexed chars, odd shards the odd ones, and
        # shards 0-3 carry three chars against 4-5's two. Measured on prod:
        # shards 0/2/4 hit the 240s timeout on EVERY run while 1/3/5 returned
        # 250/250 every time — deterministic, and reproduced with the local
        # drain stopped, so it is the split and not RU contention.
        #
        # 8 divides 16: two chars per shard, no aliasing, equal slices.
        description: 'Parallel worker shards (MUST divide 16 — see note)'
        default: '8'

concurrency:
  group: staging-pipeline
  cancel-in-progress: false   # never cancel — pipeline is safe to overlap

jobs:
  drain:
    name: Drain staging pipeline
    runs-on: ubuntu-latest
    # Raised from 5: shards run concurrently, but data-clean and promotion are
    # still sequential steps, each allowed ~200-240s. A tick that overruns the
    # 5-minute cron cadence is fine — the concurrency group serialises runs, and
    # one run now moves ~8,000 rows per stage instead of 500.
    timeout-minutes: 12
    steps:
      # CF-STAGING-FANOUT (Drew, 2026-08-13: "how can we speed it up? ... go
      # live date is 9/14").
      #
      # Two compounding problems, both silent:
      #
      #   1. The route capped `limit` at 500 via Math.min, so the 800 below was
      #      clamped and the 2026-08-01 batch bump never took effect. Real
      #      capacity was 144K/day against ~300K/day inbound — the backlog could
      #      only grow. Cap is now MAX_BATCH=5000.
      #   2. Both jobs already supported worker sharding, but the routes never
      #      exposed it, so every tick was one serial batch.
      #
      # Now: SHARDS parallel calls over disjoint id-prefix slices. Wall-clock is
      # one shard, not the sum. Each shard gets its own --max-time; a slow shard
      # cannot stall the others because they run concurrently.
      #
      # `wait` without an argument returns the highest exit status among the
      # jobs, so a failing shard still fails the step.
      - name: Data-clean (sharded)
        env:
          BASE: https://hobbyiq3-e5a4dgfsdnb5fbha.centralus-01.azurewebsites.net
          ADMIN_TOKEN: ${{ secrets.ADMIN_API_TOKEN }}
          LIMIT: ${{ inputs.data_clean_limit || '750' }}
          SHARDS: ${{ inputs.shards || '8' }}
        run: |
          pids=""
          for i in $(seq 0 $((SHARDS - 1))); do
            (
              R=$(curl -sf -X POST -H "Authorization: Bearer $ADMIN_TOKEN" \
                "$BASE/api/staging/data-clean?limit=$LIMIT&shard=$i&shards=$SHARDS" \
                --max-time 240) || { echo "::warning::data-clean shard $i failed"; exit 1; }
              echo "shard $i: $(echo "$R" | jq -c '{scanned,cleaned,anomalies,zeroPriceRejected}')"
            ) &
            pids="$pids $!"
          done
          rc=0
          for p in $pids; do wait "$p" || rc=1; done
          exit $rc
      # CF-STAGING-IMAGE-VERIFY-NONBLOCKING (Drew, 2026-08-13). Image-verify is
      # ENRICHMENT; promotion is the data path. This step is a separate job
      # step, so when its curl exceeded --max-time 240 the job aborted and
      # Auto-triage + Promotion never ran at all — staged comps stopped
      # reaching sold_comps because a picture took too long to fetch.
      #
      # Observed 2026-08-13 at 16:09 and 17:12 UTC, both exit code 28 (curl
      # timeout) at exactly 240s, each between successful runs. The runs either
      # side promoted normally, so the effect was intermittent stalling of
      # ingestion rather than an outage — the kind that hides in a mostly-green
      # run list.
      #
      # continue-on-error keeps the pipeline moving. The failure is NOT
      # swallowed: the explicit ::warning:: makes it visible in the run
      # summary, so a persistently slow image-verify is still noticeable
      # instead of silently passing. Promotion stays fatal — if THAT breaks,
      # the run should go red.
      - name: Image-verify
        id: image_verify
        continue-on-error: true
        env:
          BASE: https://hobbyiq3-e5a4dgfsdnb5fbha.centralus-01.azurewebsites.net
          ADMIN_TOKEN: ${{ secrets.ADMIN_API_TOKEN }}
          LIMIT: ${{ inputs.image_verify_limit || '100' }}
        run: |
          if RESULT=$(curl -sf -X POST -H "Authorization: Bearer $ADMIN_TOKEN" \
            "$BASE/api/staging/image-verify?limit=$LIMIT" --max-time 240 2>&1); then
            echo "$RESULT" | jq .
          else
            CODE=$?
            echo "::warning::image-verify failed (curl exit $CODE — 28 means it exceeded --max-time 240s at limit=$LIMIT). Continuing so promotion still runs; lower image_verify_limit if this persists."
            exit 0
          fi
      - name: Auto-triage
        env:
          BASE: https://hobbyiq3-e5a4dgfsdnb5fbha.centralus-01.azurewebsites.net
          ADMIN_TOKEN: ${{ secrets.ADMIN_API_TOKEN }}
          LIMIT: '2000'
        run: |
          RESULT=$(curl -sf -X POST -H "Authorization: Bearer $ADMIN_TOKEN" \
            "$BASE/api/staging/auto-triage?limit=$LIMIT" --max-time 120 2>&1)
          echo "$RESULT" | jq .
      # Sharded for the same reason as data-clean. Promotion stays FATAL — it is
      # the data path, and if it breaks the run should go red.
      - name: Promotion (sharded)
        env:
          BASE: https://hobbyiq3-e5a4dgfsdnb5fbha.centralus-01.azurewebsites.net
          ADMIN_TOKEN: ${{ secrets.ADMIN_API_TOKEN }}
          LIMIT: ${{ inputs.promotion_limit || '250' }}
          SHARDS: ${{ inputs.shards || '8' }}
        run: |
          pids=""
          for i in $(seq 0 $((SHARDS - 1))); do
            (
              R=$(curl -sf -X POST -H "Authorization: Bearer $ADMIN_TOKEN" \
                "$BASE/api/staging/promotion?limit=$LIMIT&shard=$i&shards=$SHARDS" \
                --max-time 240) || { echo "promotion shard $i FAILED"; exit 1; }
              echo "shard $i: $(echo "$R" | jq -c '{scanned,promoted,awaitingCatalog,errors}')"
            ) &
            pids="$pids $!"
          done
          rc=0
          for p in $pids; do wait "$p" || rc=1; done
          exit $rc
      - name: Health snapshot
        env:
          BASE: https://hobbyiq3-e5a4dgfsdnb5fbha.centralus-01.azurewebsites.net
          ADMIN_TOKEN: ${{ secrets.ADMIN_API_TOKEN }}
        run: |
          curl -sf -H "Authorization: Bearer $ADMIN_TOKEN" \
            "$BASE/api/staging/health" | jq .
