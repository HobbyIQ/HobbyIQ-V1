name: Staging Pipeline Cron

# CF-STAGING-PIPELINE-CRON (Drew, 2026-07-28). Autonomous drain of
# the staging pipeline every 5 minutes. Each run walks all three
# jobs in order: data-clean → image-verify → promotion.
#
# CF-STAGING-BATCH-BUMP (Drew, 2026-08-01). Batch sizes bumped 4×
# after audit found 416K pending rows and the old sizing (data-clean
# 200 / promotion 500) would take 17 days to drain. Endpoints are
# fast (~8s for 200 rows) so 4× headroom is safe within the 5-min
# job budget.
#   data-clean:  200 → 800   (~230K/day drain capacity)
#   image-verify: 50 → 100
#   promotion:   500 → 2000  (~575K/day promotion capacity)
#
# Rate-limit friendly:
#   - Vision: 50 rows × 2s/call = 100s per run, well under 300s job
#   - Cosmos: batch operations already bounded server-side
#
# Silent-safe: any transient failure just fails this run; the next
# 5-minute tick picks up where we left off (no state to corrupt).

on:
  schedule:
    - cron: '*/5 * * * *'   # every 5 minutes
  workflow_dispatch:
    inputs:
      data_clean_limit:
        description: 'Data-clean batch size'
        default: '800'
      image_verify_limit:
        description: 'Image-verify batch size'
        default: '100'
      promotion_limit:
        description: 'Promotion batch size'
        default: '2000'

concurrency:
  group: staging-pipeline
  cancel-in-progress: false   # never cancel — pipeline is safe to overlap

jobs:
  drain:
    name: Drain staging pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Data-clean
        env:
          BASE: https://hobbyiq3-e5a4dgfsdnb5fbha.centralus-01.azurewebsites.net
          ADMIN_TOKEN: ${{ secrets.ADMIN_API_TOKEN }}
          LIMIT: ${{ inputs.data_clean_limit || '800' }}
        run: |
          RESULT=$(curl -sf -X POST -H "Authorization: Bearer $ADMIN_TOKEN" \
            "$BASE/api/staging/data-clean?limit=$LIMIT" --max-time 120 2>&1)
          echo "$RESULT" | jq .
      # CF-STAGING-IMAGE-VERIFY-NONBLOCKING (Drew, 2026-08-13). Image-verify is
      # ENRICHMENT; promotion is the data path. This step is a separate job
      # step, so when its curl exceeded --max-time 240 the job aborted and
      # Auto-triage + Promotion never ran at all — staged comps stopped
      # reaching sold_comps because a picture took too long to fetch.
      #
      # Observed 2026-08-13 at 16:09 and 17:12 UTC, both exit code 28 (curl
      # timeout) at exactly 240s, each between successful runs. The runs either
      # side promoted normally, so the effect was intermittent stalling of
      # ingestion rather than an outage — the kind that hides in a mostly-green
      # run list.
      #
      # continue-on-error keeps the pipeline moving. The failure is NOT
      # swallowed: the explicit ::warning:: makes it visible in the run
      # summary, so a persistently slow image-verify is still noticeable
      # instead of silently passing. Promotion stays fatal — if THAT breaks,
      # the run should go red.
      - name: Image-verify
        id: image_verify
        continue-on-error: true
        env:
          BASE: https://hobbyiq3-e5a4dgfsdnb5fbha.centralus-01.azurewebsites.net
          ADMIN_TOKEN: ${{ secrets.ADMIN_API_TOKEN }}
          LIMIT: ${{ inputs.image_verify_limit || '100' }}
        run: |
          if RESULT=$(curl -sf -X POST -H "Authorization: Bearer $ADMIN_TOKEN" \
            "$BASE/api/staging/image-verify?limit=$LIMIT" --max-time 240 2>&1); then
            echo "$RESULT" | jq .
          else
            CODE=$?
            echo "::warning::image-verify failed (curl exit $CODE — 28 means it exceeded --max-time 240s at limit=$LIMIT). Continuing so promotion still runs; lower image_verify_limit if this persists."
            exit 0
          fi
      - name: Auto-triage
        env:
          BASE: https://hobbyiq3-e5a4dgfsdnb5fbha.centralus-01.azurewebsites.net
          ADMIN_TOKEN: ${{ secrets.ADMIN_API_TOKEN }}
          LIMIT: '2000'
        run: |
          RESULT=$(curl -sf -X POST -H "Authorization: Bearer $ADMIN_TOKEN" \
            "$BASE/api/staging/auto-triage?limit=$LIMIT" --max-time 120 2>&1)
          echo "$RESULT" | jq .
      - name: Promotion
        env:
          BASE: https://hobbyiq3-e5a4dgfsdnb5fbha.centralus-01.azurewebsites.net
          ADMIN_TOKEN: ${{ secrets.ADMIN_API_TOKEN }}
          LIMIT: ${{ inputs.promotion_limit || '2000' }}
        run: |
          RESULT=$(curl -sf -X POST -H "Authorization: Bearer $ADMIN_TOKEN" \
            "$BASE/api/staging/promotion?limit=$LIMIT" --max-time 120 2>&1)
          echo "$RESULT" | jq .
      - name: Health snapshot
        env:
          BASE: https://hobbyiq3-e5a4dgfsdnb5fbha.centralus-01.azurewebsites.net
          ADMIN_TOKEN: ${{ secrets.ADMIN_API_TOKEN }}
        run: |
          curl -sf -H "Authorization: Bearer $ADMIN_TOKEN" \
            "$BASE/api/staging/health" | jq .
