# Paired "skip job" for web-unit-tests (.github/workflows/web-unit-tests.yml).
#
# Same contract as test-skip.yml, in the other direction. `Web Unit Tests` is a
# REQUIRED status check on main, and web-unit-tests.yml is path-filtered to
# apps/web + the compiq services the web's rung test reads. A backend-only PR —
# a backend/scripts change, say — therefore produced no `Web Unit Tests`
# context, and branch protection blocked it on a check that was never coming.
#
# This workflow triggers on exactly the complement of those paths and declares
# a job with the IDENTICAL name, `Web Unit Tests`, so the required context is
# always satisfied. The real job is only ~45s, but it still runs `npm ci` plus
# a full `next build`; skipping it on backend-only PRs keeps those minutes off
# the bill while never leaving the check missing.
#
# backendWebCheckContexts.test.ts pins the complement and the shared job name.
name: web-unit-tests-skip

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "apps/web/**"
      - "backend/src/services/compiq/**"
      - ".github/workflows/web-unit-tests.yml"
      - ".github/workflows/web-unit-tests-skip.yml"
  push:
    branches: [main]
    paths-ignore:
      - "apps/web/**"
      - "backend/src/services/compiq/**"
      - ".github/workflows/web-unit-tests.yml"
      - ".github/workflows/web-unit-tests-skip.yml"

concurrency:
  group: web-unit-tests-skip-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-unit-tests-skip:
    # MUST stay byte-identical to the job name in web-unit-tests.yml — this is
    # the required-context string in branch protection.
    name: Web Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: No web changes — nothing to test
        run: echo "No files under apps/web/ or backend/src/services/compiq/ changed; the web suite does not apply to this PR."
