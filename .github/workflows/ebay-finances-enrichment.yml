# Drew, 2026-08-30 12:40Z ("wont reconcile"): the fee enrichment ran in-process
# in SHADOW mode (default on) and every cycle was skipped by the worker lock,
# so no eBay sale ever received its fee fields. It now runs on the backfill
# runner every 6 hours (fees post to eBay's Finances API 1–3 days after the
# sale; the sweep takes 2–90-day-old sales). The in-process scheduler stays
# armed until EBAY_FINANCES_ENRICHMENT_DISABLE_SCHEDULER=true is set on
# HobbyIQ3 (a live App Service change — Drew's confirm).
name: eBay finances enrichment (6-hourly)

on:
  schedule:
    - cron: "41 */6 * * *"   # 00:41, 06:41, 12:41, 18:41 UTC
  workflow_dispatch:
    inputs:
      apply:
        description: "true to write fees / net proceeds / realized P&L; false = REPORT ONLY (shadow)"
        required: false
        default: "true"
        type: string

permissions:
  contents: read
  id-token: write
  actions: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch run-ebay-finances-enrichment on the backfill runner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APPLY="${{ inputs.apply || 'true' }}"
          gh workflow run backfill-runner.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f script=run-ebay-finances-enrichment \
            -f apply="$APPLY"
          sleep 20
          gh run list --repo "$GITHUB_REPOSITORY" --workflow=backfill-runner.yml --limit 1 \
            --json url,displayTitle,status --jq '"dispatched run-ebay-finances-enrichment (apply=" + "'"$APPLY"'" + ") → " + .[0].url + " (" + .[0].status + ")"' \
            || echo "::warning::could not list the backfill-runner run for run-ebay-finances-enrichment"
