name: Baseballcardpedia Older-Year Sweep

# Runs the BCP sweep for older baseball years (1950-2014). BCP
# rate-limits aggressive local runs; cloud runners typically get
# fresh IPs. Chunked across nightly dispatches until all years
# processed. Idempotent — re-ingests existing products with same
# slugs (upserts are no-ops if unchanged).

on:
  schedule:
    # 08:00 UTC nightly (~4 AM ET) — after grade-explode's 06:00 window
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      years:
        description: 'Comma-separated years to sweep (default: 1950-2014)'
        required: false
        default: ''

jobs:
  sweep:
    name: BCP Sweep
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install @azure/cosmos
        run: npm install @azure/cosmos --no-save

      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_1259D9D213E34AE29B2DD54B3E755C4D }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_5AB8B3DC612348FD9D37DBE28FF40802 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_A45CF8552AE94AF68A046FB846E21206 }}

      - name: Fetch Cosmos connection string
        id: cosmos
        run: |
          CS=$(az webapp config appsettings list \
            --name HobbyIQ3 --resource-group rg-hobbyiq-dev \
            --query "[?name=='COSMOS_CONNECTION_STRING'].value" -o tsv | tr -d '\r\n')
          if [ -z "$CS" ]; then echo "::error::COSMOS_CONNECTION_STRING empty"; exit 1; fi
          echo "::add-mask::$CS"
          echo "cs=$CS" >> "$GITHUB_OUTPUT"

      - name: Run BCP sweep
        env:
          COSMOS_CONNECTION_STRING: ${{ steps.cosmos.outputs.cs }}
        run: |
          if [ -n "${{ github.event.inputs.years }}" ]; then
            YEARS_ARG="--years=${{ github.event.inputs.years }}"
          else
            # Default: sweep 1950-2014 (older baseball). Newer years already
            # ingested. Sweep is idempotent so this is safe to re-run.
            YEARS_ARG="--years=1950,1951,1952,1953,1954,1955,1956,1957,1958,1959,1960,1961,1962,1963,1964,1965,1966,1967,1968,1969,1970,1971,1972,1973,1974,1975,1976,1977,1978,1979,1980,1981,1982,1983,1984,1985,1986,1987,1988,1989,1990,1991,1992,1993,1994,1995,1996,1997,1998,1999,2005,2006,2007,2008,2011,2012,2013,2014"
          fi
          echo "Running: node backend/scripts/baseballCardPediaSweep.cjs $YEARS_ARG --apply"
          node backend/scripts/baseballCardPediaSweep.cjs $YEARS_ARG --apply

      - name: Report post-run state
        env:
          COSMOS_CONNECTION_STRING: ${{ steps.cosmos.outputs.cs }}
        run: |
          node -e "
            const { CosmosClient } = require('@azure/cosmos');
            const c = new CosmosClient(process.env.COSMOS_CONNECTION_STRING);
            (async () => {
              const cat = c.database('hobbyiq').container('card_catalog');
              const q = await cat.items.query({ query: \"SELECT c.year, COUNT(1) AS n FROM c WHERE c.source = 'baseballcardpedia' GROUP BY c.year\" }).fetchAll();
              const total = await cat.items.query({ query: \"SELECT VALUE COUNT(1) FROM c WHERE c.source = 'baseballcardpedia'\" }).fetchAll();
              console.log('BCP total:', total.resources[0].toLocaleString());
              console.log('By year:');
              for (const r of q.resources.filter(r => r.year).sort((a,b) => a.year - b.year)) console.log('  ' + r.year + ':', r.n.toLocaleString());
            })();
          "
