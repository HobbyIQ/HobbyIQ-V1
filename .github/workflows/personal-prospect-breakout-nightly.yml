name: Personal Prospect Breakout (nightly)

# CF-PERSONAL-PROSPECT-BREAKOUT (Drew, 2026-07-20). Fires an APNS push
# to any user whose HOLDING matches a sub-raw inversion in the pool.
# Uses computeSubRawInversions for detection; intersects with user
# holdings before sending. Rate limits: 1 push per holding per 7d,
# 2 pushes per user per day.
#
# Sport matrix so all 3 sports fire on the nightly cron.

on:
  schedule:
    - cron: "0 12 * * *"   # 8:00AM ET = 12:00 UTC (after grade-arb + sub-raw-scan settle)
  workflow_dispatch:
    inputs:
      sport:
        description: 'Sport scope (default baseball)'
        required: false
        type: string
        default: 'baseball'
      dry_run:
        description: 'Dry-run (compute + report, no pushes sent)'
        required: false
        type: choice
        default: 'true'
        options: ['true', 'false']

jobs:
  fire:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        sport: ${{ github.event_name == 'workflow_dispatch' && fromJson(format('["{0}"]', inputs.sport)) || fromJson('["baseball", "football", "basketball"]') }}

    steps:
      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_1259D9D213E34AE29B2DD54B3E755C4D }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_5AB8B3DC612348FD9D37DBE28FF40802 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_A45CF8552AE94AF68A046FB846E21206 }}

      - name: Guard — ADMIN_API_TOKEN present
        env:
          ADMIN_API_TOKEN: ${{ secrets.ADMIN_API_TOKEN }}
        run: |
          if [ -z "$ADMIN_API_TOKEN" ]; then
            echo "::error::ADMIN_API_TOKEN secret missing"
            exit 1
          fi
          echo "::add-mask::$ADMIN_API_TOKEN"

      - name: Checkout (poller)
        uses: actions/checkout@v4

      # CF-LONG-CRONS-DIE-AT-THE-IDLE-CUT (2026-09-09). This call still
      # answered — 38 requests over 14 days, all 200 — but it was answering
      # late: p95 142.5s, max 211.6s, against an App Service idle cut at
      # 240s. One busier night and it joins the anomalies lane, and a run cut
      # at the platform boundary cannot be told apart from "no pushes were
      # owed" — the exact ambiguity D13's provider gate below exists to
      # remove. So it dispatches (202 + jobId) and polls for the summary.
      # The job, its rate limits and its pushes are unchanged.
      - name: POST personal-prospect-breakout/run
        env:
          ADMIN_API_TOKEN: ${{ secrets.ADMIN_API_TOKEN }}
          SPORT: ${{ matrix.sport }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          BODY=$(jq -nc \
            --arg sport "$SPORT" \
            --argjson dryRun "$DRY_RUN" \
            '{ sport: $sport, dryRun: $dryRun }')
          set +e
          node backend/scripts/poll-admin-job.cjs \
            --label "personal-prospect-breakout[$SPORT]" \
            --method POST \
            --body "$BODY" \
            --dispatch-url "https://hobbyiq3-e5a4dgfsdnb5fbha.centralus-01.azurewebsites.net/api/portfolio/admin/personal-prospect-breakout/run" \
            --status-url "https://hobbyiq3-e5a4dgfsdnb5fbha.centralus-01.azurewebsites.net/api/portfolio/admin/personal-prospect-breakout/status" \
            --status-query "sport=$SPORT" \
            --auth-header "Authorization: Bearer $ADMIN_API_TOKEN" \
            | tee poll.log
          POLL_RC=${PIPESTATUS[0]}
          set -e
          if [ "$POLL_RC" -eq 2 ]; then
            echo "::error::personal-prospect-breakout never reported settled — UNKNOWN, not a failure; the run may have finished on the other instance"
            exit 1
          fi
          if [ "$POLL_RC" -ne 0 ]; then
            echo "::error::personal-prospect-breakout failed"
            exit 1
          fi
          # The polled status body carries the same {summary:{…}} the inline
          # 200 used to, so every reader below is unchanged.
          sed -n 's/^RESULT_JSON //p' poll.log | tail -n1 > response.json
          echo "Summary:"
          jq '.summary' response.json
          # D13 (2026-08-29) — alert gates prove delivery. HTTP 200 with
          # pushesSent:0 was green even when the API had no APNs provider
          # and every push no-op'd. One summary line always; red on a
          # scheduled non-dry-run when the provider is missing. A zero
          # with a configured provider stays green. (jq's // treats false
          # as missing, so the boolean is read with has().)
          CANDIDATES=$(jq -r '.summary.matches // 0' response.json)
          PUSHES=$(jq -r '.summary.pushesSent // 0' response.json)
          CONFIGURED=$(jq -r 'if (.summary | has("pushProviderConfigured")) then (.summary.pushProviderConfigured | tostring) else "unknown" end' response.json)
          echo "notify summary: candidates=$CANDIDATES pushesSent=$PUSHES providerConfigured=$CONFIGURED"
          if [ "$EVENT_NAME" = "schedule" ] && [ "$DRY_RUN" != "true" ] && [ "$CONFIGURED" = "false" ]; then
            echo "::error::personal-prospect-breakout: push provider NOT configured on the API — candidates=$CANDIDATES were owed a push and every send no-op'd"
            exit 1
          fi

      - name: Upload response
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: personal-prospect-breakout-${{ matrix.sport }}-${{ github.run_id }}
          path: response.json
          retention-days: 14
