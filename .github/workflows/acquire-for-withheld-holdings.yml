name: Acquire For Withheld Holdings (queue -> ingest -> rederive -> reprice)

# CF-IF-KNOWN-WE-SHOULD-BE-ABLE-TO-FIGURE-IT-OUT (Drew, 2026-09-05).
#
#   "if known, we should be able to figure it out"
#
# A holding withheld for `no-checklist-match` whose card IS identifiable must
# resolve WITHOUT A HUMAN. Every piece already existed and nothing joined them:
#
#   #1784  prints an acquisition queue per (sport, year, setKey) -- and nobody
#          reads it. Top of it tonight: 2026 bowman-chrome, 4,084.
#   D38    `ingest-universe-driver` ingests a product when handed exact
#          manifest setNames in `titles`.
#   R2     `rederive-holding-identity` (MODE=rederive, ids in `titles`)
#          re-points the holdings onto the rows that ingest just landed.
#   -      `reprice-user-holdings` republishes the number.
#
# This workflow is the connection: one nightly pass that READS the withheld
# population, MATCHES each cell to a source, and then drives the four dispatches
# in order, gating each on the banner of the one before it.
#
# ── WHY A SEPARATE WORKFLOW AND NOT A LANE INSIDE backfill-runner.yml ───────
#
# The plan script IS a whitelisted runner lane (`acquire-for-withheld-holdings`)
# and can be dispatched there like any other. But the CHAIN cannot live there:
# backfill-runner.yml is `workflow_dispatch` only -- it has no `schedule:` block
# at all -- and the task's constraint is a scheduled lane with NO NEW
# workflow_dispatch input. A chain step also has to `gh workflow run` the runner
# and then `gh run watch` it, which a job cannot do to the workflow it is
# itself running under without deadlocking on its own concurrency.
#
# So: the LANE is whitelisted in the runner (report-only, budgeted, pinned by
# runnerBudgetMargin), and the SCHEDULE + the chain live here, the same shape as
# checklist-acquisition.yml (its own cron, its own dispatches).
#
# ── WHAT MAKES THIS SAFE TO RUN UNATTENDED ──────────────────────────────────
#
# REPORT-FIRST AND SELF-GATING. Every APPLY in the chain is preceded by the same
# dispatch in report mode, and the apply runs only if the report's OWN BANNER
# says the work is real:
#
#   GATE 1  no driver APPLY unless the driver REPORT verdicted `ingested` or
#           `partial` with rows > 0 AND printed its reconciliation line.
#           (CF-GREEN-WORKFLOW-IS-NOT-DATA-FLOW: a green run is not a write.)
#   GATE 2  no rederive at all unless the driver APPLY itself landed rows.
#   GATE 3  no rederive APPLY unless the rederive REPORT proposed re-points and
#           reported no UNVERIFIED destination.
#   GATE 4  no reprice unless the rederive APPLY reconciled.
#
# RUN CAPTURE IS BY MARKER, NEVER BY `latest`. `gh run list --limit 1` returns
# whatever run happens to be newest, which on this repo is routinely somebody
# else's fleet. Every dispatch here is captured by (a) created-after the moment
# we dispatched, (b) the workflow name, and then CONFIRMED by grepping the run's
# own log for "Script confirmed: backend/scripts/<the script>.cjs" AND the scope
# marker (the titles we passed). A run that does not confirm is not ours and the
# chain refuses rather than gating on a stranger's banner.
#
# BOUNDED AND IDEMPOTENT. NIGHTLY_CAP cells per night, ranked holdings-first. A
# cell whose ingest lands 0 new rows verdicts `ingested` with nothing to do and
# its holdings do not re-point, so tomorrow's ranking -- recomputed from the
# withheld population, which no longer contains them -- simply does not include
# it. The queue is self-limiting for the same reason checklist-acquisition's is.
#
# THE LEDGER. There is no audit/report container that fits a per-cell
# acquisition outcome (portfolio, sold_comps, card_catalog and crawl_state all
# hold something else, and inventing a container is a live prod config change
# this session may not make). So the ledger is: a JSON artifact, the step
# summary, and a comment on a standing tracking issue -- created once, by title.

on:
  schedule:
    # 03:20 ET nightly, chosen to sit AFTER the nightly ingest/rematch traffic
    # and BEFORE the 5AM ET refresh + deploy, so a cell acquired tonight is
    # priced by the morning. GitHub cron is UTC with no DST, pinned to EDT
    # (UTC-4) like every other scheduled job in this repo.
    - cron: "20 7 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write   # Azure OIDC for the App Service secret fetch
  actions: write    # dispatch the runner lanes
  issues: write     # the standing tracking issue + its per-night comment

concurrency:
  # One chain at a time. Two nights overlapping would dispatch the same cell
  # twice and gate each other's banners.
  group: acquire-for-withheld-holdings
  cancel-in-progress: false

env:
  # THE NIGHTLY CAP. Each cell is a real publisher fetch plus an ingest plus a
  # rederive plus a reprice; checklist-acquisition measured that pulling harder
  # than ~12 products/run raises the failure rate rather than the throughput,
  # and this chain does strictly more work per cell than that one does.
  NIGHTLY_CAP: "10"
  # How long to wait on any one dispatched run before calling it stuck. The
  # runner's own step ceiling is 150 minutes; a self-relaunching lane can exceed
  # that, and this chain deliberately does NOT follow a relaunch -- it gates on
  # the generation it dispatched and leaves the rest to tomorrow.
  WATCH_MINUTES: "170"

jobs:
  plan:
    name: Plan tonight's cells
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      cells: ${{ steps.plan.outputs.cells }}
      count: ${{ steps.plan.outputs.count }}
      issue: ${{ steps.issue.outputs.number }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Setup Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Install backend deps
        working-directory: backend
        run: npm ci

      # dist/ is what gives the matcher `normalizeSetKey`. Without it the lane
      # falls back to raw-key matching and says so in its own banner -- it does
      # not crash -- but a night that matched on raw keys only would quietly
      # under-match, so the build is part of the plan step, not optional.
      - name: Build backend dist
        working-directory: backend
        run: npm run build

      # CF-A-SECRET-NAME-IS-NOT-A-CONVENTION (run 33991711284, 2026-09-05).
      #
      # This block named AZURE_CLIENT_ID / AZURE_TENANT_ID /
      # AZURE_SUBSCRIPTION_ID -- the names the azure/login README uses. This
      # repo does not have secrets by those names. An undefined secret is not
      # an error in Actions: it renders as the EMPTY STRING, so the step ran
      # with a `with:` block carrying no client-id and no tenant-id at all,
      # and azure/login reported
      #
      #   Login failed with Error: Using auth-type: SERVICE_PRINCIPAL.
      #   Not all values are present. Ensure 'client-id' and 'tenant-id'
      #   are supplied.
      #
      # which reads like a permissions or OIDC-trust problem and is not one:
      # `permissions: id-token: write` was already correct. The names are the
      # whole defect. Every one of the 67 other workflow logins in this repo
      # uses the AZUREAPPSERVICE_*_<GUID> spellings below; this file was the
      # only one that invented its own, which is exactly why no other
      # scheduled job noticed. Copied verbatim from backfill-runner.yml so
      # the two cannot drift.
      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_1259D9D213E34AE29B2DD54B3E755C4D }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_5AB8B3DC612348FD9D37DBE28FF40802 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_A45CF8552AE94AF68A046FB846E21206 }}

      - name: Fetch COSMOS_CONNECTION_STRING from HobbyIQ3 App Service
        shell: bash
        run: |
          # Piped straight into the step env, never echoed and never on disk
          # (feedback_secrets_never_to_stdout: the transcript IS the leak).
          CONN=$(az webapp config appsettings list \
            --name HobbyIQ3 --resource-group rg-hobbyiq-dev \
            --query "[?name=='COSMOS_CONNECTION_STRING'].value" -o tsv)
          if [ -z "$CONN" ]; then echo "::error::could not fetch COSMOS_CONNECTION_STRING"; exit 1; fi
          echo "::add-mask::$CONN"
          echo "COSMOS_CONNECTION_STRING=$CONN" >> "$GITHUB_ENV"

      # ── (1) READ + (2) MATCH ────────────────────────────────────────────
      # READ ONLY. The lane refuses an apply dispatch outright (exit 3), so this
      # step cannot write however it is configured; BACKFILL_APPLY is left unset
      # rather than set false, so there is nothing here to flip by accident.
      - name: "Plan: read the withheld holdings and match each cell to a source"
        id: plan
        working-directory: backend
        env:
          MODE: json
          TOP: ${{ env.NIGHTLY_CAP }}
          OUT: /tmp/acquisition-plan.json
        shell: bash
        run: |
          set -o pipefail
          # THE JSON COMES FROM THE FILE THE LANE WROTE, NOT FROM STDOUT (#1846).
          #
          # This step used to `> /tmp/plan.json` and jq the capture. Run
          # 34019169292 died on `jq: parse error: Invalid literal at line 739,
          # column 11`: the plan ended clean on 738 and line 739 was
          # `finishLane: exiting code 0`, written to fd 1 by the shared budget
          # helper AFTER main() returned. The lane's own banner was already on
          # stderr and still the document was not parseable, because a lane
          # cannot suppress what the helper it must call writes on its way out.
          #
          # The helper now narrates to the fd the lane names, and the lane names
          # stderr in MODE=json. This reads OUT anyway: the plan is a FILE the
          # lane wrote and verified, so the parse no longer depends on nothing
          # else ever printing to stdout again. Belt and braces, one line each.
          node scripts/acquire-for-withheld-holdings.cjs | tee /tmp/plan-stdout.log
          # OUT is set in this step's env; a missing file means the lane did not
          # reach its write, and saying so beats a bare `cp: No such file`.
          if [ ! -s /tmp/acquisition-plan.json ]; then
            echo "::error::the lane wrote no plan to $OUT — it did not reach its write"
            exit 1
          fi
          cp /tmp/acquisition-plan.json /tmp/plan.json
          COUNT=$(jq '.tonight | length' /tmp/plan.json)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "cells=$(jq -c '.tonight' /tmp/plan.json)" >> "$GITHUB_OUTPUT"
          {
            echo "## Acquisition plan"
            echo
            echo "| holdings | sales | cell | source |"
            echo "|---:|---:|---|---|"
            jq -r '.tonight[] | "| \(.holdings) | \(.salesVolume) | \(.cell) | \(.source.lane): \(.source.setName) |"' /tmp/plan.json
            echo
            echo "**needs a source:** $(jq '.counts.needsSource' /tmp/plan.json) cells — "
            echo "these are the sets we own cards in and have no way to acquire."
            echo
            jq -r '.needsSourceCells[:20][] | "- `\(.cell)` — \(.holdings) holdings"' /tmp/plan.json
            echo
            echo "**unreadable:** $(jq '.counts.unreadable' /tmp/plan.json) cells — a catch-all"
            echo "key is not a product. These park until a maker is read; they are NOT an"
            echo "acquisition target and must never be minted."
            echo
            jq -r '.unreadableCells[:20][] | "- `\(.cell)` — \(.holdings) holdings — \(.why)"' /tmp/plan.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the plan
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: acquisition-plan-${{ github.run_id }}
          path: /tmp/plan.json
          if-no-files-found: warn

      # ── (4) LEDGER: the standing tracking issue, created once ────────────
      - name: Ensure the tracking issue exists
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TITLE="Acquisition queue: withheld holdings"
          N=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 \
                --search "$TITLE in:title" --json number,title \
                --jq "[.[] | select(.title == \"$TITLE\")] | .[0].number // empty")
          if [ -z "$N" ]; then
            # The body goes through a FILE, not an inline argument: a multi-line
            # --body inside a YAML block scalar needs every continuation line
            # indented under the block, and a body written flush-left silently
            # ends the scalar and makes the whole workflow unparseable.
            cat > /tmp/issue-body.md <<'BODY'
          Standing tracker for **CF-IF-KNOWN-WE-SHOULD-BE-ABLE-TO-FIGURE-IT-OUT** (Drew, 2026-09-05).

          A holding withheld for `no-checklist-match` whose card IS identifiable must resolve
          without a human. The nightly `Acquire For Withheld Holdings` chain comments here
          every night with:

          - the cells it acquired (queue -> ingest -> rederive -> reprice), and
          - the cells that **need a source** — the sets we own cards in and have no way to acquire.

          The second list is the input to the discovery program. Nothing here is auto-closed.
          BODY
            sed -i 's/^          //' /tmp/issue-body.md
            N=$(gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" \
              --body-file /tmp/issue-body.md | grep -oE '[0-9]+$')
          fi
          echo "number=$N" >> "$GITHUB_OUTPUT"
          echo "tracking issue #$N"

      - name: Comment the night's plan on the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo "### Plan — run [\`${GITHUB_RUN_ID}\`](https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
            echo
            jq -r '"- **\(.counts.withheld)** withheld holdings in **\(.counts.cells)** cells; **\(.counts.matched)** matched, **\(.counts.needsSource)** need a source, **\(.counts.unreadable)** unreadable (catch-all key), **\(.counts.unaddressable)** unaddressable."' /tmp/plan.json
            echo
            echo "Tonight (cap ${NIGHTLY_CAP}):"
            jq -r '.tonight[] | "- `\(.cell)` — \(.holdings) holdings — \(.source.lane): \(.source.setName)"' /tmp/plan.json
          } > /tmp/comment.md
          gh issue comment "${{ steps.issue.outputs.number }}" --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md

  # ── (3) DISPATCH ────────────────────────────────────────────────────────
  # One matrix leg per cell, run SERIALLY (max-parallel 1): each leg dispatches
  # the shared backfill runner, and two legs racing would contend for the same
  # runner concurrency and gate on each other's banners.
  acquire:
    name: ${{ matrix.cell.cell }}
    needs: plan
    if: ${{ needs.plan.outputs.count != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        cell: ${{ fromJson(needs.plan.outputs.cells) }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main

      # THE RUN-CAPTURE HELPER. Every dispatch in this job goes through it.
      #
      #   dispatch <marker> <script> <args...>
      #
      # It records the UTC instant BEFORE dispatching, dispatches, then polls
      # `gh run list --workflow=backfill-runner.yml --created ">=<that instant>"`
      # and, for each candidate, downloads the log and requires BOTH
      #   "Script confirmed: backend/scripts/<script>.cjs"
      # and the scope marker (the exact titles string we passed) to appear in it.
      # A run missing either is somebody else's and is skipped. Nothing here
      # ever takes `--limit 1` blind, and displayTitle is never consulted: it is
      # the same string for every dispatch of a given lane.
      - name: Install the run-capture helper
        shell: bash
        run: |
          mkdir -p /tmp/bin
          cat > /tmp/bin/dispatch <<'HELPER'
          #!/usr/bin/env bash
          # dispatch <marker> <script> [-f k=v ...]   -> prints RUN_ID, log at /tmp/run-<RUN_ID>.log
          set -uo pipefail
          MARKER="$1"; shift
          SCRIPT="$1"; shift
          SINCE=$(date -u -d '-1 minute' +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run backfill-runner.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f script="$SCRIPT" "$@" >&2 || { echo "::error::dispatch failed for $SCRIPT" >&2; exit 1; }
          RUN_ID=""
          for _ in $(seq 1 30); do
            sleep 10
            for ID in $(gh run list --repo "$GITHUB_REPOSITORY" \
                          --workflow=backfill-runner.yml --created ">=$SINCE" \
                          --limit 30 --json databaseId --jq '.[].databaseId'); do
              gh run view "$ID" --repo "$GITHUB_REPOSITORY" --log > "/tmp/probe-$ID.log" 2>/dev/null || true
              # The two proofs: the lane is the one we asked for, and the scope
              # is the one we passed. Either alone is satisfied by a stranger.
              if grep -aq "Script confirmed: backend/scripts/${SCRIPT}.cjs" "/tmp/probe-$ID.log" \
                 && grep -aqF "$MARKER" "/tmp/probe-$ID.log"; then
                RUN_ID="$ID"; break
              fi
            done
            [ -n "$RUN_ID" ] && break
          done
          if [ -z "$RUN_ID" ]; then
            echo "::error::could not identify our $SCRIPT run by marker — refusing to gate on a run we cannot name" >&2
            exit 1
          fi
          echo "watching run $RUN_ID for $SCRIPT ($MARKER)" >&2
          timeout "${WATCH_MINUTES:-170}m" gh run watch "$RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status >&2
          gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --log > "/tmp/run-$RUN_ID.log" 2>/dev/null || true
          echo "$RUN_ID"
          HELPER
          chmod +x /tmp/bin/dispatch
          echo "/tmp/bin" >> "$GITHUB_PATH"

      # ── STEP A: the ingest REPORT (apply=false) ─────────────────────────
      - name: Ingest report (apply=false) for this cell's titles
        id: ingest_report
        env:
          GH_TOKEN: ${{ github.token }}
          WATCH_MINUTES: ${{ env.WATCH_MINUTES }}
        shell: bash
        run: |
          set -uo pipefail
          SET_NAME='${{ matrix.cell.source.setName }}'
          LANE='${{ matrix.cell.source.lane }}'
          RUN_ID=$(dispatch "$SET_NAME" ingest-universe-driver \
            -f apply=false -f sources="$LANE" -f titles="$SET_NAME" \
            -f sports='${{ matrix.cell.sport }}' -f years='${{ matrix.cell.year }}' \
            -f scope=recheck) || exit 1
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          cp "/tmp/run-$RUN_ID.log" /tmp/ingest-report.log

      # ── GATE 1 ──────────────────────────────────────────────────────────
      # No APPLY without a RECONCILED report that verdicted ingested/partial
      # with rows > 0. Three independent conditions, each of which has been the
      # thing that was wrong on some past run:
      #   - "RECONCILED NO" means the driver could not verify its own claim
      #     (#1738: it counted a key the child never wrote).
      #   - a verdict of `unreachable`/`failed` means the source does not serve
      #     this set — acquiring nothing is the correct outcome, not an error.
      #   - rows == 0 means there is nothing to land, so an apply is a no-op
      #     that would still burn a publisher fetch.
      # ── GATE 1, THREE-WAY (run 33993803531) ─────────────────────────────
      #
      # THE ORIGINAL GATE COULD NEVER PASS. It required `rows > 0` from a
      # dispatch run with apply=false, and `rows created` counts only what an
      # APPLY wrote — a report creates nothing by construction. So every cell in
      # the first green run stopped at "0 rows — nothing to land", including
      # cells whose checklist is fully present. From the Bowman's Best report:
      #
      #   catalog now: 3,810 rows   seeded=missing   prior=partial
      #   rows created        0   (verified by catalog read, not claimed)
      #   RECONCILED          yes
      #
      # 3,810 rows ARE the checklist. "0 rows created" was the dry run being a
      # dry run. Reading it as "nothing to acquire" conflated two opposite
      # states, and the one it silently chose was the wrong one.
      #
      # THE SIGNAL IS `catalog now:`, not `rows created`. The driver prints it
      # for every report entry from a REAL catalog read (countCatalogRows), and
      # it resolves the setKey through the same union-of-spellings the ingest
      # child writes under (#1738/#1741) — so it is the one number that answers
      # "does this product already exist" without a second implementation of
      # that resolution here.
      #
      # THREE OUTCOMES, and the third is the one this fix adds:
      #
      #   acquire         catalog is EMPTY and the source serves the set.
      #                   Ingest it (apply), then rederive, then reprice.
      #   already-ingested catalog is NON-EMPTY. There is nothing to mint, and
      #                   the holdings are dark for a DIFFERENT reason: their
      #                   identity does not match rows that already exist
      #                   (self-derived slug, blank fields, wrong key). Skip
      #                   the apply entirely and go straight to the rederive.
      #   needs-a-source  catalog is empty AND no ingested/partial verdict.
      #                   Unchanged: reported, never guessed.
      #
      # A cell that is already ingested must NOT run the apply: it would re-fetch
      # a publisher page to mint nothing, and CF-RECHECK-IS-NOT-REFETCH is the
      # standing warning about re-running an entry whose work is done.
      - name: "Gate: acquire, already-ingested, or needs a source"
        id: gate_ingest
        shell: bash
        run: |
          set -uo pipefail
          LOG=/tmp/ingest-report.log
          RECONCILED=yes
          if grep -aqE "RECONCILED +NO" "$LOG"; then RECONCILED=no; fi

          # What the driver READ in the catalog for this entry. Anchored on its
          # own label so a stray number elsewhere in the log cannot be mistaken
          # for it, and "(setKey/year not derivable)" yields no digits at all --
          # which is correctly NOT treated as a zero.
          IN_CATALOG=$(grep -aoE "catalog now: *[0-9,]+ rows" "$LOG" \
                        | grep -oE "[0-9,]+" | tr -d ',' | sort -rn | head -1 || true)
          IN_CATALOG=${IN_CATALOG:-}
          SERVED=no
          if grep -aqE "\b(ingested|partial|would-attempt|would drive)\b" "$LOG"; then SERVED=yes; fi

          MODE=needs-a-source; PROCEED=no; WHY=""
          if [ "$RECONCILED" = "no" ]; then
            WHY="the report did not reconcile"
          elif [ -z "$IN_CATALOG" ]; then
            # The driver could not derive a key to count. That is an
            # unverifiable entry, never an assumed-empty one.
            WHY="the report did not state a catalog count — the key was not derivable"
          elif [ "$IN_CATALOG" -gt 0 ]; then
            MODE=already-ingested; PROCEED=yes
            WHY="$IN_CATALOG rows already in the catalog — nothing to mint; the identities are the problem"
          elif [ "$SERVED" = "yes" ]; then
            MODE=acquire; PROCEED=yes
            WHY="catalog is empty and the source serves this set"
          else
            WHY="catalog is empty and no source serves this set"
          fi

          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "proceed=$PROCEED" >> "$GITHUB_OUTPUT"
          echo "in_catalog=${IN_CATALOG:-unknown}" >> "$GITHUB_OUTPUT"
          echo "why=$WHY" >> "$GITHUB_OUTPUT"
          echo "GATE 1 mode=$MODE proceed=$PROCEED in_catalog=${IN_CATALOG:-unknown} ($WHY)"

      # ── STEP B: the ingest APPLY ────────────────────────────────────────
      # ONLY in `acquire` mode. An already-ingested cell skips this entirely:
      # re-fetching a publisher page to mint nothing is the exact waste
      # CF-RECHECK-IS-NOT-REFETCH warns about, and it would spend a real
      # external fetch to produce the same zero the report already proved.
      - name: Ingest apply (acquire mode only)
        id: ingest_apply
        if: ${{ steps.gate_ingest.outputs.mode == 'acquire' }}
        env:
          GH_TOKEN: ${{ github.token }}
          WATCH_MINUTES: ${{ env.WATCH_MINUTES }}
        shell: bash
        run: |
          set -uo pipefail
          SET_NAME='${{ matrix.cell.source.setName }}'
          RUN_ID=$(dispatch "$SET_NAME" ingest-universe-driver \
            -f apply=true -f sources='${{ matrix.cell.source.lane }}' -f titles="$SET_NAME" \
            -f sports='${{ matrix.cell.sport }}' -f years='${{ matrix.cell.year }}' \
            -f scope=recheck) || exit 1
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          cp "/tmp/run-$RUN_ID.log" /tmp/ingest-apply.log

      # ── GATE 2 ──────────────────────────────────────────────────────────
      # No rederive without rows to point AT.
      #
      #   acquire           the APPLY must have reconciled and verdicted
      #                     ingested/partial. The report proved the source
      #                     serves the set; only the apply proves rows LANDED,
      #                     and re-pointing a holding onto a row that does not
      #                     exist is how a withheld holding becomes a WRONG one.
      #   already-ingested  the rows were counted in the catalog by gate 1
      #                     itself, from the driver's own catalog read. There is
      #                     no apply to judge, and demanding one would re-create
      #                     the deadlock this fix removes.
      - name: "Gate: the ingest apply landed rows"
        id: gate_apply
        if: ${{ steps.gate_ingest.outputs.proceed == 'yes' }}
        shell: bash
        run: |
          set -uo pipefail
          if [ '${{ steps.gate_ingest.outputs.mode }}' = "already-ingested" ]; then
            echo "proceed=yes" >> "$GITHUB_OUTPUT"
            echo "why=${{ steps.gate_ingest.outputs.in_catalog }} rows already present — no apply was needed" >> "$GITHUB_OUTPUT"
            echo "GATE 2 proceed=yes (already ingested: ${{ steps.gate_ingest.outputs.in_catalog }} rows in the catalog)"
            exit 0
          fi
          LOG=/tmp/ingest-apply.log
          PROCEED=yes; WHY=""
          if grep -aqE "RECONCILED +NO" "$LOG"; then PROCEED=no; WHY="the apply did not reconcile"; fi
          if ! grep -aqE "\b(ingested|partial)\b" "$LOG"; then
            PROCEED=no; WHY="${WHY:-the apply recorded no ingested/partial verdict}"
          fi
          echo "proceed=$PROCEED" >> "$GITHUB_OUTPUT"
          echo "why=$WHY" >> "$GITHUB_OUTPUT"
          echo "GATE 2 proceed=$PROCEED ${WHY:+(}${WHY}${WHY:+)}"

      # ── STEP C: the rederive REPORT ─────────────────────────────────────
      # The holding ids travel in `titles` (the shim reads them as HOLDING_IDS);
      # the runner has no holding-ids input and is at its dispatch cap.
      - name: Rederive report (apply=false) for this cell's holdings
        id: rederive_report
        if: ${{ steps.gate_apply.outputs.proceed == 'yes' }}
        env:
          GH_TOKEN: ${{ github.token }}
          WATCH_MINUTES: ${{ env.WATCH_MINUTES }}
        shell: bash
        run: |
          set -uo pipefail
          IDS='${{ join(matrix.cell.holdingIds, ',') }}'
          if [ -z "$IDS" ]; then echo "::error::no holding ids for this cell — refusing an unscoped rederive"; exit 1; fi
          RUN_ID=$(dispatch "$IDS" rederive-holding-identity \
            -f apply=false -f titles="$IDS" -f mode=rederive) || exit 1
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          cp "/tmp/run-$RUN_ID.log" /tmp/rederive-report.log

      # ── GATE 3 ──────────────────────────────────────────────────────────
      # No rederive APPLY unless its own report proposed re-points AND reported
      # no UNVERIFIED destination. The shim's exit codes are the vocabulary:
      # 2 = refused scope, 4 = write conflict, 5 = read-back disagreed. A report
      # that names an UNVERIFIED destination is a slug no checklist backs --
      # exactly the thing this whole chain exists to avoid creating.
      - name: "Gate: the rederive report proposes only verified destinations"
        id: gate_rederive
        if: ${{ steps.gate_apply.outputs.proceed == 'yes' }}
        shell: bash
        run: |
          set -uo pipefail
          LOG=/tmp/rederive-report.log
          PROCEED=yes; WHY=""
          if grep -aq "UNVERIFIED" "$LOG"; then
            PROCEED=no; WHY="the report named an UNVERIFIED destination — a slug no checklist backs"
          fi
          # CF-A-BANNER-IS-NOT-A-VERDICT (run 33998562094). This was
          #
          #   grep -aqiE "would re-point|re-point|REDERIVE"
          #
          # and the case-insensitive REDERIVE matched the lane's OWN banner --
          # "MODE: rederive", "[mode] rederive — report only", even the script
          # filename in "Script confirmed: .../rederive-holding-identity.cjs".
          # So gate 3 said yes for all ten cells whose verdicts were AGREE or
          # NO-MATCH: it was reading the dispatch, not the outcome.
          #
          # The verdict vocabulary is anchored and CASE-SENSITIVE: the script
          # prints "  REDERIVE   <player>" at the head of a line, and its
          # machine-readable SUMMARY carries "REDERIVE": n. Nothing in a banner
          # matches either.
          if ! grep -aqE '^[[:space:]]*REDERIVE |"REDERIVE":[[:space:]]*[1-9]' "$LOG"; then
            # AGREE means the holding is ALREADY on the right identity, so
            # there is nothing for an apply to write. That is a legitimate
            # outcome, not a failure -- but running the apply anyway would be a
            # write path executed on the strength of no proposed change.
            PROCEED=no
            if grep -aqE '^[[:space:]]*AGREE ' "$LOG"; then
              WHY="${WHY:-every holding already carries the right identity (AGREE) — nothing to re-point}"
            else
              WHY="${WHY:-the report proposed no re-points}"
            fi
          fi
          echo "proceed=$PROCEED" >> "$GITHUB_OUTPUT"
          echo "why=$WHY" >> "$GITHUB_OUTPUT"
          echo "GATE 3 proceed=$PROCEED ${WHY:+(}${WHY}${WHY:+)}"

      # ── WHAT UNLOCKS EACH HOLDING THAT DID NOT RE-POINT ─────────────────
      #
      # A rederive against a checklist that IS present and still comes back
      # NO-MATCH or UNVERIFIED is the most informative outcome this chain
      # produces, and until now it was thrown away: the table said "gate 3: no"
      # and a reader learned nothing about which of several very different
      # problems they were looking at.
      #
      # The script already distinguishes them in its own prose, so this reads
      # that vocabulary rather than re-deriving anything, and maps each to THE
      # LANE THAT FIXES IT:
      #
      #   NO MATCH + blank fields   the holding has nothing to match ON.
      #                             -> field recovery (#1811)
      #   NO MATCH (fields present) the parser cannot place a populated row.
      #                             -> matcher work, report to Drew
      #   UNVERIFIED: no catalog row backs it
      #                             the destination slug is self-derived.
      #                             -> retire-self-derived-identities
      #   UNVERIFIED: player mismatch / destination does not carry
      #                             a collision or an over-claimed holding.
      #                             -> PARKED, needs a human ruling
      #   UNVERIFIED: ruled by a human
      #                             a user-authored identity. Never overwritten.
      #   UNVERIFIED: confidence below the floor
      #                             -> matcher confidence, report only
      #
      # It is REPORT-ONLY and never gates anything: naming why a holding is
      # stuck must not decide whether other holdings proceed.
      - name: "Classify the holdings that did not re-point"
        id: classify
        # FAIL-SAFE (run 33998562094). This step crashed on all ten cells and
        # took the CELL down with it — after gate 3 had already said yes — so
        # the rederive APPLY and the reprice were SKIPPED and nothing was
        # written. A step that only DESCRIBES an outcome must never be able to
        # prevent it: `continue-on-error` keeps a classify fault from failing
        # the job, and the step traps its own errors and reports
        # "classify: error" rather than dying.
        continue-on-error: true
        if: ${{ !cancelled() && steps.gate_apply.outputs.proceed == 'yes' }}
        shell: bash
        run: |
          # NOT `set -e`: a miscount must not abort the cell. `set -u` is also
          # dropped deliberately — an unset counter here is a reporting gap,
          # not a reason to lose an apply (run 33998562094 lost ten of them to
          # exactly that: "NM_FIELDS: unbound variable").
          set +eu
          LOG=/tmp/rederive-report.log
          if [ ! -f "$LOG" ]; then
            echo "reasons=classify: no rederive report" >> "$GITHUB_OUTPUT"
            echo "(no rederive report to classify)"
            exit 0
          fi

          # ── THE CLASSIFY LINE READS THE REPORT, NOT THE LINE SHAPE ──────
          #
          # CF-CLASSIFY-READS-THE-REPORT-NOT-THE-LINE-SHAPE (#1868). Run
          # 34021743427 went end-to-end on all ten cells -- bowman-draft
          # re-derived holding a2963cd5 and repriced user-67878bb5 -- and every
          # cell printed
          #
          #   CLASSIFY agree=0 rederive=0 ... unverified-total=0
          #
          # ALL ZEROS, including the cell whose report said `"verdict":
          # "REDERIVE"` and whose gate 3 proceeded ON that verdict. The night's
          # one real re-point was invisible in the line written to describe it.
          #
          # The counts were greps anchored to the SCRIPT's stdout shape
          # (`^[[:space:]]*REDERIVE `). The file is not the script's stdout: it
          # is `gh run view --log`, which prefixes every line with
          # `<job> TAB <step> TAB <timestamp>`, so the anchors could never match
          # and `grep -c` honestly returned 0. Gate 3 survived the same capture
          # only because its SECOND alternative -- `"REDERIVE":[[:space:]]*[1-9]`
          # -- is unanchored and matched the machine-readable SUMMARY through the
          # prefix. The gate read the report; the classifier read the line shape.
          #
          # So the counts now come from the SAME JSON the gates read -- the
          # lane's `holding_rederive_report` document, one entry per holding
          # with its verdict and reason -- parsed by a module with a fixture pin
          # (backend/tests/rederiveVerdictClasses.test.ts). Nine grep anchors in
          # YAML that nothing could test became one function that CI exercises.
          SUM=$(node "$GITHUB_WORKSPACE/backend/scripts/lib/rederive-verdict-classes.cjs" "$LOG")

          # UNREAD IS NOT ZERO. The module prints `unread`/`unreadable` when the
          # capture holds no report, precisely so a parsing failure can never
          # again be published as a row of zeros.
          case "$SUM" in
            unread|unreadable)
              echo "reasons=classify: the rederive report could not be read ($SUM)" >> "$GITHUB_OUTPUT"
              echo "CLASSIFY unread — the report was not parseable; this is NOT zero"
              exit 0
              ;;
          esac

          # One reader for the module's `k=v k=v` line. Kept to ONE sed
          # expression with no embedded newline, and `tr -cd` guarantees the
          # result is digits or empty -- never the two-line value that broke the
          # arithmetic in run 33998562094.
          val() { printf "%s" "$SUM" | sed -n "s/.*\\b$1=\\([0-9][0-9]*\\).*/\\1/p" | head -1 | tr -cd "0-9"; }
          AGREE=$(val agree);            [ -n "$AGREE" ]    || AGREE=0
          REDERIVE=$(val rederive);      [ -n "$REDERIVE" ] || REDERIVE=0
          NM_BLANK=$(val no-match-blank);[ -n "$NM_BLANK" ] || NM_BLANK=0
          NM_FIELDS=$(val no-match-fields);[ -n "$NM_FIELDS" ] || NM_FIELDS=0
          UV_NOROW=$(val self-derived);  [ -n "$UV_NOROW" ] || UV_NOROW=0
          UV_PLAYER=$(val collision);    [ -n "$UV_PLAYER" ]|| UV_PLAYER=0
          UV_CLAIM=$(val over-claim);    [ -n "$UV_CLAIM" ] || UV_CLAIM=0
          UV_HUMAN=$(val human);         [ -n "$UV_HUMAN" ] || UV_HUMAN=0
          UV_CONF=$(val low-conf);       [ -n "$UV_CONF" ]  || UV_CONF=0
          UV_ALL=$(val unverified-total);[ -n "$UV_ALL" ]   || UV_ALL=0

          {
            echo "### \`${{ matrix.cell.cell }}\` — the rederive verdicts"
            echo
            echo "| n | verdict | meaning | what unlocks it |"
            echo "|---:|---|---|---|"
            [ "$REDERIVE" -gt 0 ] && echo "| $REDERIVE | REDERIVE | the identity moves | applied this run |"
            [ "$AGREE"    -gt 0 ] && echo "| $AGREE | AGREE | already on the right identity | **nothing here** — the pool or the gate is the blocker |"
            [ "$NM_BLANK" -gt 0 ] && echo "| $NM_BLANK | NO-MATCH | the holding's fields are blank | **field recovery (#1811 lane)** |"
            [ "$NM_FIELDS" -gt 0 ] && echo "| $NM_FIELDS | NO-MATCH | fields present, matcher cannot place it | matcher work — report to Drew |"
            [ "$UV_NOROW" -gt 0 ] && echo "| $UV_NOROW | UNVERIFIED | destination is a self-derived twin | **retire-self-derived-identities** |"
            [ "$UV_PLAYER" -gt 0 ] && echo "| $UV_PLAYER | UNVERIFIED | player mismatch (collision) | **parked** — needs a ruling |"
            [ "$UV_CLAIM" -gt 0 ] && echo "| $UV_CLAIM | UNVERIFIED | holding claims a parallel/serial the row lacks | **parked** — needs a ruling |"
            [ "$UV_HUMAN" -gt 0 ] && echo "| $UV_HUMAN | UNVERIFIED | user-authored identity | left alone by design |"
            [ "$UV_CONF"  -gt 0 ] && echo "| $UV_CONF | UNVERIFIED | confidence below the floor | matcher confidence — report only |"
            true
          } > /tmp/reasons.md
          cat /tmp/reasons.md >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/reasons.md

          echo "reasons=$SUM" >> "$GITHUB_OUTPUT"
          echo "agree=$AGREE" >> "$GITHUB_OUTPUT"
          echo "rederive=$REDERIVE" >> "$GITHUB_OUTPUT"
          echo "CLASSIFY $SUM"

      # ── STEP D: the rederive APPLY ──────────────────────────────────────
      - name: Rederive apply (gated)
        id: rederive_apply
        if: ${{ steps.gate_rederive.outputs.proceed == 'yes' }}
        env:
          GH_TOKEN: ${{ github.token }}
          WATCH_MINUTES: ${{ env.WATCH_MINUTES }}
        shell: bash
        run: |
          set -uo pipefail
          IDS='${{ join(matrix.cell.holdingIds, ',') }}'
          RUN_ID=$(dispatch "$IDS" rederive-holding-identity \
            -f apply=true -f titles="$IDS" -f mode=rederive) || exit 1
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          cp "/tmp/run-$RUN_ID.log" /tmp/rederive-apply.log

      # ── GATE 4 + STEP E: reprice the affected users ─────────────────────
      # One dispatch per user in the cell. `reprice-user-holdings` is the
      # sanctioned reprice path (reference_reprice_user_holdings) -- never
      # price-and-persist locally.
      - name: Reprice the users whose holdings moved (gated)
        id: reprice
        if: ${{ steps.gate_rederive.outputs.proceed == 'yes' }}
        env:
          GH_TOKEN: ${{ github.token }}
          WATCH_MINUTES: ${{ env.WATCH_MINUTES }}
        shell: bash
        run: |
          set -uo pipefail
          if grep -aqE "RECONCILED +NO" /tmp/rederive-apply.log; then
            echo "::warning::the rederive apply did not reconcile — not repricing"
            echo "repriced=0" >> "$GITHUB_OUTPUT"; exit 0
          fi
          N=0
          for U in $(echo '${{ join(matrix.cell.users, ' ') }}'); do
            [ -z "$U" ] && continue
            dispatch "$U" reprice-user-holdings -f apply=true -f titles="$U" >/dev/null \
              && N=$((N+1)) || echo "::warning::reprice dispatch failed for $U"
          done
          echo "repriced=$N" >> "$GITHUB_OUTPUT"

      # ── LEDGER: the per-cell outcome ────────────────────────────────────
      - name: Write the cell's outcome to the ledger
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -uo pipefail
          OUTCOME=$(cat <<JSON
          {
            "cell": "${{ matrix.cell.cell }}",
            "holdings": ${{ matrix.cell.holdings }},
            "source": { "lane": "${{ matrix.cell.source.lane }}", "setName": "${{ matrix.cell.source.setName }}" },
            "ingestReportRun": "${{ steps.ingest_report.outputs.run_id }}",
            "gate1": { "mode": "${{ steps.gate_ingest.outputs.mode }}", "proceed": "${{ steps.gate_ingest.outputs.proceed }}", "inCatalog": "${{ steps.gate_ingest.outputs.in_catalog }}", "why": "${{ steps.gate_ingest.outputs.why }}" },
            "ingestApplyRun": "${{ steps.ingest_apply.outputs.run_id }}",
            "gate2": { "proceed": "${{ steps.gate_apply.outputs.proceed }}", "why": "${{ steps.gate_apply.outputs.why }}" },
            "rederiveReportRun": "${{ steps.rederive_report.outputs.run_id }}",
            "gate3": { "proceed": "${{ steps.gate_rederive.outputs.proceed }}", "why": "${{ steps.gate_rederive.outputs.why }}" },
            "rederiveApplyRun": "${{ steps.rederive_apply.outputs.run_id }}",
            "stuckReasons": "${{ steps.classify.outputs.reasons }}",
            "repricedUsers": "${{ steps.reprice.outputs.repriced }}"
          }
          JSON
          )
          echo "$OUTCOME" > "/tmp/outcome.json"
          { echo "### \`${{ matrix.cell.cell }}\`"; echo '```json'; echo "$OUTCOME"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the cell outcome
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: outcome-${{ github.run_id }}-${{ strategy.job-index }}
          path: /tmp/outcome.json
          if-no-files-found: warn

  report:
    name: Comment the night's outcomes
    needs: [plan, acquire]
    if: ${{ !cancelled() && needs.plan.outputs.count != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download the outcomes
        uses: actions/download-artifact@v4
        with:
          pattern: outcome-${{ github.run_id }}-*
          path: /tmp/outcomes
          merge-multiple: false

      - name: Comment on the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo "### Outcomes — run [\`${GITHUB_RUN_ID}\`](https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
            echo
            echo '| cell | mode | in catalog | gate 2 | gate 3 | repriced | what is still stuck |'
            echo '|---|---|---:|---|---|---:|---|'
            find /tmp/outcomes -name outcome.json -print0 2>/dev/null | while IFS= read -r -d '' F; do
              jq -r '"| `\(.cell)` | \(.gate1.mode // "-") | \(.gate1.inCatalog // "-") | \(.gate2.proceed // "-") | \(.gate3.proceed // "-") | \(.repricedUsers // "-") | \(if (.stuckReasons // "") == "" then "-" else .stuckReasons end) |"' "$F"
            done
          } > /tmp/outcomes.md
          N=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 \
                --search "Acquisition queue: withheld holdings in:title" --json number,title \
                --jq '[.[] | select(.title == "Acquisition queue: withheld holdings")] | .[0].number // empty')
          if [ -n "$N" ]; then
            gh issue comment "$N" --repo "$GITHUB_REPOSITORY" --body-file /tmp/outcomes.md
          fi
          cat /tmp/outcomes.md >> "$GITHUB_STEP_SUMMARY"
