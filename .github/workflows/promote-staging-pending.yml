name: Promote Staging Pending

# CF-STAGING-PROMOTER (Drew, 2026-08-03). Manual dispatch to re-process
# comps_staging rows with status='pending' through the current
# persistVendorSalesToPool cleaner. Recovers rows that were captured
# raw but never made it to sold_comps because the cleaner at ingest
# time couldn't resolve identity.
#
# TCA-ebay currently has 866K pending rows to re-process. Cardhedge
# ~5K. Run repeatedly (each run cycles through what's still pending
# after prior runs' successes).
#
# CF-STAGING-DRAIN-SCHEDULE (Drew, 2026-08-14). "Run repeatedly" was
# the whole design and there was nothing to run it — this workflow was
# dispatch-only, and its last run was 2026-08-03. Measured 2026-08-15,
# twelve days later:
#
#     comps_staging total      8,662,466
#     status=pending           2,102,167   (2,081,074 of them tca-ebay)
#     status=clean                94,803   cleaned, never promoted
#     never promoted           2,668,528   = 30.8% of the container
#
# The backlog grew from the 866K in the note above to 2.08M purely
# because nothing dispatched this.
#
# The every-5-minute staging-pipeline-cron does NOT cover this. It is
# green and it works, but it promotes ~87 rows per tick and GitHub
# throttles a */5 schedule to roughly one run per 45 minutes, so it
# clears ~2,800 rows/day. Against 2.1M that is ~750 days — it cannot
# catch up, and it is not failing, which is why nothing alarmed. A
# green cron that moves 0.1% of its backlog per day looks identical to
# a healthy one on the Actions page.
#
# APPLY defaults differ by trigger ON PURPOSE: a hand dispatch stays
# dry-run so nobody writes 2M rows by reflex, while a scheduled run
# applies. Without that split a schedule would dry-run forever and the
# backlog would keep growing behind a wall of green checkmarks.

on:
  schedule:
    # Hourly. The job caps itself at max_minutes (45) inside a 55-minute
    # timeout, so consecutive runs cannot overlap.
    - cron: '25 * * * *'
    # CF-DAILY-REDRIVE (Drew, 2026-08-16: "why is the sales index not moving").
    #
    # The hourly pass had drained status='pending' down to 107 rows — all of
    # them junk (no soldAt, or non-positive price) — so it scanned 107 and
    # inserted 0, while 909,175 rows sat in awaiting-catalog, a status it never
    # queried. The public index froze at exactly 10,775,249 with ingest
    # perfectly healthy. Nothing was broken; the promoter had simply run out of
    # things it was willing to look at.
    #
    # This pass re-drives the parked rows against a catalog that now grows
    # daily. 11:10 UTC sits after the 09:00 checklist-acquisition run, so each
    # re-drive sees that morning's new checklists. Measured on the first live
    # run: 1,687 inserts per 5,000 rows scanned (34%).
    #
    # A separate cron rather than widening the hourly filter: re-scanning ~900k
    # parked rows every hour would burn RUs to re-park most of them. Once a day,
    # after new checklists land, is when the answer can actually have changed.
    - cron: '10 11 * * *'
  workflow_dispatch:
    inputs:
      apply:
        description: 'Set true to write to sold_comps + flip status (else dry-run)'
        required: false
        type: choice
        options: ['false', 'true']
        default: 'false'
      statuses:
        description: 'comps_staging statuses to process. "pending" is the routine pass; add awaiting-catalog to re-drive rows parked before their checklist existed.'
        required: false
        type: string
        default: 'pending'
      vendor:
        description: 'Filter to a specific vendor (e.g. tca-ebay). Empty = all vendors.'
        required: false
        type: string
        default: 'tca-ebay'
      max_minutes:
        description: 'Wall-clock cap per run (default 45)'
        required: false
        type: string
        default: '45'
      concurrency:
        description: 'Parallel persist calls'
        required: false
        type: string
        default: '32'

jobs:
  promote:
    name: Re-process pending staging rows
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend deps
        working-directory: backend
        run: npm ci

      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_1259D9D213E34AE29B2DD54B3E755C4D }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_5AB8B3DC612348FD9D37DBE28FF40802 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_A45CF8552AE94AF68A046FB846E21206 }}

      - name: Run staging promoter
        working-directory: backend
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
        run: |
          # Pull all env we need from App Service (secrets never touch disk/log)
          COSMOS_CONNECTION_STRING=$(az webapp config appsettings list \
            --name HobbyIQ3 --resource-group rg-hobbyiq-dev \
            --query "[?name=='COSMOS_CONNECTION_STRING'].value" -o tsv | tr -d '\r\n')
          TCA_API_KEY=$(az webapp config appsettings list \
            --name HobbyIQ3 --resource-group rg-hobbyiq-dev \
            --query "[?name=='TCA_API_KEY'].value" -o tsv | tr -d '\r\n')
          AZURE_OPENAI_ENDPOINT=$(az webapp config appsettings list \
            --name HobbyIQ3 --resource-group rg-hobbyiq-dev \
            --query "[?name=='AZURE_OPENAI_ENDPOINT'].value" -o tsv | tr -d '\r\n')
          AZURE_OPENAI_API_KEY=$(az webapp config appsettings list \
            --name HobbyIQ3 --resource-group rg-hobbyiq-dev \
            --query "[?name=='AZURE_OPENAI_API_KEY'].value" -o tsv | tr -d '\r\n')
          AZURE_OPENAI_DEPLOYMENT=$(az webapp config appsettings list \
            --name HobbyIQ3 --resource-group rg-hobbyiq-dev \
            --query "[?name=='AZURE_OPENAI_DEPLOYMENT'].value" -o tsv | tr -d '\r\n')
          if [ -z "$COSMOS_CONNECTION_STRING" ]; then echo "COSMOS_CONNECTION_STRING empty"; exit 1; fi
          npm run build
          COSMOS_CONNECTION_STRING="$COSMOS_CONNECTION_STRING" \
          TCA_API_KEY="$TCA_API_KEY" \
          AZURE_OPENAI_ENDPOINT="$AZURE_OPENAI_ENDPOINT" \
          AZURE_OPENAI_API_KEY="$AZURE_OPENAI_API_KEY" \
          AZURE_OPENAI_DEPLOYMENT="$AZURE_OPENAI_DEPLOYMENT" \
          COSMOS_DATABASE=hobbyiq \
          PERSIST_VENDOR_LOOKUPS_ENABLED=true \
          PERSIST_LLM_ENRICH_ENABLED=true \
          LLM_VISION_ENABLED=false \
          TCA_CATALOG_FALLBACK_ENABLED=true \
          PLAYER_FALLBACK_CARDNUMBER_ENABLED=true \
          COMPS_STAGING_SHIM_ENABLED=true \
          LLM_MAX_INFLIGHT=20 \
          VENDOR="${{ inputs.vendor || 'tca-ebay' }}" \
          STATUSES="${{ inputs.statuses || (github.event.schedule == '10 11 * * *' && 'awaiting-catalog' || 'pending') }}" \
          MAX_MINUTES="${{ inputs.max_minutes || '45' }}" \
          CONCURRENCY="${{ inputs.concurrency || '32' }}" \
          APPLY="${{ inputs.apply || (github.event_name == 'schedule' && 'true' || 'false') }}" \
          node scripts/promote-staging-pending.cjs
