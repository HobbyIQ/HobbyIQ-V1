name: TCA Firehose Ingest

# CF-TCA-FIREHOSE (Drew, 2026-08-02). Continuous ingest of every eBay
# sports sale from thecardapi.com's /sales endpoint into sold_comps.
# See backend/docs/design/tca-firehose-ingest-architecture.md.
#
# Runs every 15 min (cursor-based, idempotent). Second job in the same
# workflow enriches identity for the ~82% of rows that land unmatched.
#
# Requires TCA_API_KEY in HobbyIQ3 App Service settings. Workflow will
# no-op with a clear error until that env var is populated.
#
# Manual dispatch supports:
#   mode=incremental|backfill  (default incremental)
#   sort=date_desc|date_asc    (default date_desc; use date_asc for
#                              historical backfill oldest-first)
#   apply=false|true           (default false; MUST set true to write)

on:
  # RETUNED 2026-08-03 — TCA webhook now handles fresh-data ingest.
  # The /sales PULL endpoint is capped at 200K rows/day per API key.
  # This cron runs once nightly at 00:05 UTC (5 min after quota reset)
  # and burns through the full 200K allocation walking date_desc from
  # the last cursor — closes the gap between webhook (which walks
  # date_asc from May 2026) and current. sort=date_desc + APPLY=true
  # by default. Job auto-halts on 429 after 3 retries so we never spin
  # over the daily cap.
  schedule:
    # CF-TCA-PLATFORM-LAG (Drew, 2026-08-13). Runs several times a day rather
    # than once at 00:05.
    #
    # The Full Daily Feed window is STRICTLY yesterday, and TCA's platforms
    # publish on different schedules — eBay lands a day behind TCGplayer. A
    # single 00:05 run therefore asks eBay for a day it has not published yet,
    # gets a legitimate 0 rows, and the free window closes before the data
    # appears; pulling eBay's newest day instead would leave the free window and
    # burn the 200K cap. Re-pulling yesterday costs nothing and contentHash
    # dedup makes the overlap a no-op, so spreading the runs picks each platform
    # up on the first pass after TCA publishes it.
    #
    # CF-TCA-RESET-WINDOW-BUDGET (Drew, 2026-09-04). The 00:05 run opens a
    # fresh 200K/day cap and is the only run all day that can walk the
    # backlog at full speed — but it was stopping on OUR wall clock, not
    # TCA's: max_minutes resolved to 12 for cron runs, so it halted with the
    # cursor preserved and the quota nowhere near exhausted. A budget is
    # supposed to bind on the scarce resource; ours bound on the abundant
    # one. The 00:05 run now gets 40 minutes (job ceiling 50); the
    # 06:05/12:05/18:05 platform-lag passes keep 12, because their job is to
    # re-pull yesterday once each platform publishes, not to drain the cap.
    - cron: '5 0 * * *'    # reset-window run — 40 min budget
    - cron: '5 6 * * *'    # platform-lag pass — 12 min
    - cron: '5 12 * * *'   # platform-lag pass — 12 min
    - cron: '5 18 * * *'   # platform-lag pass — 12 min
  workflow_dispatch:
    inputs:
      daily_feed:
        description: 'Scope the pull to sale_date = yesterday, which our Full Daily Feed add-on serves UNLIMITED. Scheduled runs default to true. Set false only for historical backfills, which draw on the 200K/day cap.'
        required: false
        type: choice
        options: ['true', 'false']
        default: 'true'
      feed_date:
        description: 'Override the daily-feed date (YYYY-MM-DD). Blank = yesterday. Only the yesterday window is unlimited.'
        required: false
        default: ''
      mode:
        description: 'incremental (walk from cursor) or backfill (ignore cursor)'
        required: false
        type: choice
        options: ['incremental', 'backfill']
        default: 'incremental'
      sort:
        description: 'date_desc (newest first) or date_asc (oldest first, for historical backfill)'
        required: false
        type: choice
        options: ['date_desc', 'date_asc']
        default: 'date_desc'
      apply:
        description: 'Set true to write to sold_comps (else dry-run)'
        required: false
        type: choice
        options: ['false', 'true']
        default: 'true'
      max_minutes:
        description: 'Wall-clock cap per run (default 15 — burns 200K quota fast). Blank on a schedule: the 00:05 reset-window run takes 40, the other three take 12.'
        required: false
        type: string
        default: '15'
      skip_matcher:
        description: 'Skip the match-enricher pass (only run the ingest)'
        required: false
        type: boolean
        default: false
      crawler_slot:
        description: 'Distinct crawler slot ID for parallel workers (a/b/c/...). Defaults to empty — cron uses that. Manual dispatches: set to a/b/c to run in parallel without cursor collision.'
        required: false
        type: string
        default: ''
      platforms:
        description: 'Comma-separated TCA platforms to ingest. Defaults to "eBay". Options: eBay, TCGplayer, REA, SCP Auctions, Hakes, Lelands, goldin. Multiple platforms split max_minutes evenly.'
        required: false
        type: string
        default: 'eBay'

jobs:
  ingest:
    name: TCA firehose → sold_comps
    runs-on: ubuntu-latest
    # 50 = the 40-min reset-window budget plus checkout/npm ci/build and the
    # script's own drain. Must stay strictly above the largest MAX_MINUTES
    # below, or the runner kills the job mid-page and the cursor advance is
    # the one thing we lose.
    timeout-minutes: 50
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend deps
        working-directory: backend
        run: npm ci

      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_1259D9D213E34AE29B2DD54B3E755C4D }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_5AB8B3DC612348FD9D37DBE28FF40802 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_A45CF8552AE94AF68A046FB846E21206 }}

      - name: Assert APPLY=true on scheduled runs
        # CF-INGEST-CRON-GUARD (Drew, 2026-08-07). Structural rule:
        # cron ingest MUST write. If a schedule-triggered run resolves
        # APPLY to anything but 'true', fail immediately — never
        # burn TCA quota on a dry-run cron. Backstop for the 2026-08-03
        # regression where the fallback was silently 'false'.
        if: github.event_name == 'schedule'
        run: |
          RESOLVED_APPLY="${{ inputs.apply || 'true' }}"
          if [ "$RESOLVED_APPLY" != "true" ]; then
            echo "::error::Scheduled TCA ingest resolved APPLY=$RESOLVED_APPLY (must be 'true')"
            echo "::error::A cron ingest MUST write; refusing to burn TCA quota on dry-run."
            exit 1
          fi
          echo "guard OK — scheduled run with APPLY=true"

      - name: Run TCA firehose ingest
        working-directory: backend
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
        run: |
          COSMOS_CONNECTION_STRING=$(az webapp config appsettings list \
            --name HobbyIQ3 --resource-group rg-hobbyiq-dev \
            --query "[?name=='COSMOS_CONNECTION_STRING'].value" -o tsv | tr -d '\r\n')
          TCA_API_KEY=$(az webapp config appsettings list \
            --name HobbyIQ3 --resource-group rg-hobbyiq-dev \
            --query "[?name=='TCA_API_KEY'].value" -o tsv | tr -d '\r\n')
          if [ -z "$COSMOS_CONNECTION_STRING" ]; then
            echo "COSMOS_CONNECTION_STRING empty from App Service"
            exit 1
          fi
          if [ -z "$TCA_API_KEY" ]; then
            echo "TCA_API_KEY not set in HobbyIQ3 App Service — halting."
            echo "Add it via: az webapp config appsettings set --name HobbyIQ3 --resource-group rg-hobbyiq-dev --settings TCA_API_KEY=<key>"
            exit 1
          fi
          # Build TS → dist/ for persistVendorSalesToPool import
          npm run build
          # CF-MULTI-PLATFORM (Drew, 2026-08-03). Iterate through every
          # TCA platform we care about — eBay (main firehose),
          # TCGplayer (fresh Pokemon data — we DO capture non-sports
          # for coverage even though cleaning skips them), REA / SCP /
          # Hakes / Lelands (auction house comps). Each platform has an
          # independent cursor (CRAWLER_ID varies), so runs are
          # idempotent and can be split across dispatches.
          #
          # 200K/day pull quota is SHARED — divide max_minutes across
          # platforms roughly by their expected fresh-row volume.
          # eBay: 60% (mainstream), TCGplayer 15%, auction houses 5% each.
          PLATFORMS="${{ inputs.platforms || 'eBay' }}"
          echo "Ingesting from platforms: $PLATFORMS"
          IFS=',' read -ra PLATFORM_ARR <<< "$PLATFORMS"
          PLATFORMS_OK=0
          # CF-TCA-RESET-WINDOW-BUDGET (Drew, 2026-09-04). Per-schedule budget.
          # `inputs.max_minutes` is empty on every scheduled run (it is only
          # populated by workflow_dispatch), which is why all four crons ran
          # to the same 12-minute fallback. github.event.schedule carries the
          # cron expression that fired, so the reset-window run can be told
          # apart from the platform-lag passes without a matrix — the same
          # mechanism promote-staging-pending.yml already uses.
          TOTAL_MIN="${{ inputs.max_minutes || (github.event.schedule == '5 0 * * *' && '40' || '12') }}"
          PER_PLATFORM_MIN=$(( TOTAL_MIN / ${#PLATFORM_ARR[@]} ))
          if [ $PER_PLATFORM_MIN -lt 2 ]; then PER_PLATFORM_MIN=2; fi
          for P in "${PLATFORM_ARR[@]}"; do
            P_CLEAN=$(echo "$P" | tr -d '[:space:]')
            # CF-INGEST-ALL-CATEGORIES (Drew, 2026-08-03). We want ALL
            # categories (sports + TCG + non-sport). Cleaning pipeline
            # already skips LLM enrichment for non-sports sport tags
            # (persistVendorSalesToPool NON_SPORTS_TAGS gate), so
            # non-sports land raw in comps_staging without burning LLM
            # budget. Pulling everything grows the raw archive; sports
            # get the full cleaning treatment.
            CAT_FILTER=""
            echo "=== $P_CLEAN (category=$CAT_FILTER, $PER_PLATFORM_MIN min) ==="
            COSMOS_CONNECTION_STRING="$COSMOS_CONNECTION_STRING" \
            TCA_API_KEY="$TCA_API_KEY" \
            COSMOS_DATABASE=hobbyiq \
            PERSIST_VENDOR_LOOKUPS_ENABLED=true \
            COMPS_STAGING_SHIM_ENABLED=true \
            COMPS_STAGING_MIRROR_ENABLED=true \
            DAILY_FEED="${{ inputs.daily_feed || 'true' }}" \
            FEED_DATE="${{ inputs.feed_date }}" \
            INGEST_MODE="${{ inputs.mode || 'incremental' }}" \
            SORT="${{ inputs.sort || 'date_desc' }}" \
            APPLY="${{ inputs.apply || (github.event_name == 'schedule' && 'true' || 'false') }}" \
            MAX_MINUTES="$PER_PLATFORM_MIN" \
            PLATFORM="$P_CLEAN" \
            CATEGORY="$CAT_FILTER" \
            CRAWLER_ID="tca-${P_CLEAN,,}-${CAT_FILTER:-all}-${{ inputs.sort || 'date_desc' }}${{ inputs.crawler_slot && format('-{0}', inputs.crawler_slot) || '' }}" \
            node scripts/tca-firehose-ingest.cjs && PLATFORMS_OK=$((PLATFORMS_OK+1)) || echo "  ($P_CLEAN failed or quota-capped — continuing)"
          done

          # CF-TCA-QUOTA-VISIBILITY (Drew, 2026-08-13: "It isn't moving.").
          #
          # `|| echo ... continuing` swallowed every failure, so a run that
          # fetched nothing at all still reported success. 2026-08-13 02:06 UTC:
          #   [tca] 429 throttled — waiting 60s then retry 1/3 .. 2/3 .. 3/3
          #   [tca-firehose] done — pages=0 fetched=0 written=0 errors=1
          # and the workflow went green. Nobody had a reason to look, and the
          # TCA half of the pool quietly stopped growing.
          #
          # Keep the per-platform continue — one bad platform should not abort
          # the others — but a scheduled run where EVERY platform failed is a
          # real outage and must go red. Same rule as the freshness canary:
          # verify the write, not the run.
          if [ "$PLATFORMS_OK" -eq 0 ]; then
            REMAIN=$(curl -s -o /dev/null -D - -H "x-market-api-key: $TCA_API_KEY" \
              "https://www.thecardapi.com/api/v1/market/sales?limit=1" 2>/dev/null \
              | tr -d '\r' | awk -F': ' 'tolower($1)=="x-ratelimit-remaining"{print $2}')
            echo "::error::TCA ingest wrote nothing on every platform. x-ratelimit-remaining=${REMAIN:-unknown}"
            if [ "${REMAIN:-1}" = "0" ]; then
              echo "::error::Daily TCA sales quota is exhausted. The firehose is the intended consumer but is arriving to an empty budget — something else is draining the 200K/day cap before this cron runs."
            fi
            exit 1
          fi
          echo "platforms with a successful pull: $PLATFORMS_OK"

  match-enricher:
    name: TCA match-enricher (title → identity)
    runs-on: ubuntu-latest
    needs: ingest
    if: ${{ github.event.inputs.skip_matcher != 'true' }}
    # Tracks the ingest budget: a 40-minute reset-window pull lands far more
    # unmatched rows than a 12-minute one, and an enricher that stops at 12
    # leaves them __pendingMatch for a full day.
    timeout-minutes: 50
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend deps
        working-directory: backend
        run: npm ci

      # CF-TCA-ENRICHER-DIST (2026-09-02). tca-match-enricher.cjs requires
      # dist/services/ops/writeReconciliation.js at load time, but this job
      # never built TS — so every scheduled run since 2026-08-30T00:57Z died
      # with MODULE_NOT_FOUND before enriching a single row. The ingest job
      # gets away with the same require only because it runs `npm run build`
      # inline. Build here too.
      - name: Build backend (dist/ for enricher requires)
        working-directory: backend
        run: npm run build

      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_1259D9D213E34AE29B2DD54B3E755C4D }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_5AB8B3DC612348FD9D37DBE28FF40802 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_A45CF8552AE94AF68A046FB846E21206 }}

      - name: Run TCA match-enricher
        working-directory: backend
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
        run: |
          COSMOS_CONNECTION_STRING=$(az webapp config appsettings list \
            --name HobbyIQ3 --resource-group rg-hobbyiq-dev \
            --query "[?name=='COSMOS_CONNECTION_STRING'].value" -o tsv | tr -d '\r\n')
          COSMOS_CONNECTION_STRING="$COSMOS_CONNECTION_STRING" \
          COSMOS_DATABASE=hobbyiq \
          APPLY="${{ inputs.apply || (github.event_name == 'schedule' && 'true' || 'false') }}" \
          MAX_MINUTES="${{ inputs.max_minutes || (github.event.schedule == '5 0 * * *' && '40' || '12') }}" \
          BATCH=2000 \
          node scripts/tca-match-enricher.cjs
