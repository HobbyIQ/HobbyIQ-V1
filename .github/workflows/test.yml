# Backend unit test suite (vitest, ~529 tests, excludes Tier 1 live-API harness).
# Complements regression.yml, which owns the compiq pricing harness.
#
# `Backend Unit Tests` (the JOB name below) is a REQUIRED status check on main,
# so this workflow has NO `paths:` filter and the job ALWAYS reports. The
# path check happens INSIDE the job instead. See the note on
# backendWebCheckContexts.test.ts for why this shape and not a skip-job pair:
#
#   `paths` matches when ANY changed file matches; `paths-ignore` skips only
#   when EVERY changed file matches. Those are not complements. A PR touching
#   one web file and one backend file satisfies both a workflow's `paths` and
#   its would-be twin's `paths-ignore`, so BOTH jobs run and the required
#   context is reported twice — observed on #1840. Under strict=false a
#   duplicated context is worse than a missing one, because the fast green
#   skip can satisfy the gate while the real suite is still pending or red.
#   Workflow-level filters cannot express "exactly once", so they are gone.
#
# The cheap path is preserved where it actually matters: the `changes` step
# decides, and the ~5-minute install-and-test steps are skipped when no
# backend file changed. A no-op run is a few seconds of runner time.
#
# The old `"!backend/harness/**"` exclusion is not carried over. It was wrong:
# `npm test` is `vitest run --exclude "**/harness/tier1/**"`, so it RUNS
# harness/** tests. Only Tier 1 is excluded, in the test script where it
# belongs, not in the trigger.
name: backend-tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# CF-CI-NEVER-CANCELS-A-MAIN-PUSH (2026-09-07).
#
# THE BUG. The group was `backend-tests-${{ github.ref }}` with
# `cancel-in-progress: true`. On a push to main `github.ref` is
# `refs/heads/main` for EVERY commit, so all main pushes shared ONE group and
# each merge cancelled the run still verifying the commit before it. Three
# merged trees went unverified inside four minutes on 2026-09-06 --
# c374b030, 84f71477, 916e7c7f -- each run killed seconds after the next
# merge landed. Nothing goes red when this happens: the tree is simply never
# tested, and a later push happens to cover it.
#
# THE FIX. Cancellation is a PULL REQUEST optimisation only. A PR's superseded
# runs are worth killing -- only the head commit is being merged. A main push
# run is the ONLY record that a merged tree passed, so it must always finish.
# Keying push runs by `github.sha` gives every main commit its own group, and
# the `cancel-in-progress` expression is false for anything that is not a
# pull_request. Pinned by ciNeverCancelsMainPushRuns.test.ts.
concurrency:
  group: backend-tests-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend-tests:
    # This string is the required-context name in branch protection.
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Need the base commit present to diff against it.
          fetch-depth: 0

      - name: Did any backend file change?
        id: changes
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          # workflow_dispatch, a first push, or an unresolvable base: run the
          # suite. Failing OPEN is the safe direction — a spurious full run
          # costs minutes, a wrongly-skipped one lets a regression through.
          NEEDS_FULL_RUN=no
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then NEEDS_FULL_RUN=yes; fi
          if [ -z "${BASE_SHA:-}" ]; then NEEDS_FULL_RUN=yes; fi
          if [ "${BASE_SHA:-}" = "0000000000000000000000000000000000000000" ]; then NEEDS_FULL_RUN=yes; fi
          if [ -n "${BASE_SHA:-}" ] && ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then NEEDS_FULL_RUN=yes; fi
          if [ "$NEEDS_FULL_RUN" = "yes" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "no usable base ref — running the full suite"
            exit 0
          fi
          CHANGED=$(git diff --name-only "$BASE_SHA" "${{ github.sha }}")
          echo "changed files:"; echo "$CHANGED"
          if echo "$CHANGED" | grep -Eq '^(backend/|\.github/workflows/test\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "no backend/ change — skipping the suite, still reporting green"
          fi

      - name: Setup Node 20
        if: steps.changes.outputs.run == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        if: steps.changes.outputs.run == 'true'
        working-directory: backend
        run: npm ci

      - name: Run unit tests
        if: steps.changes.outputs.run == 'true'
        working-directory: backend
        env:
          NODE_ENV: "test"
        run: npm test
