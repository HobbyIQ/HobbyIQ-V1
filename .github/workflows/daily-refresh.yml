name: Daily 5AM ET Refresh & Deploy

on:
  schedule:
    # GitHub cron uses UTC. Use both UTC windows and gate by America/New_York time.
    # 9:00 UTC maps to 5:00 AM during EDT.
    - cron: '0 9 * * *'
    # 10:00 UTC maps to 5:00 AM during EST.
    - cron: '0 10 * * *'
  workflow_dispatch: # allow manual trigger from GitHub UI

jobs:
  deploy-and-refresh:
    name: Build, Deploy & Warm DailyIQ Cache
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      id-token: write
      contents: read
    outputs:
      # The reprice job below gates on this: a UTC trigger the ET gate closed
      # deployed nothing and must reprice nothing.
      should_run: ${{ steps.gate-out.outputs.should_run }}
      # CF-A-WITHHELD-PRICE-IS-NOT-A-MISSING-ONE (2026-09-05). The smoke test's
      # OUTAGE signal, separate from its pass/fail. False only when a case
      # returned a null FMV with no reason, or failed to answer at all — the
      # shapes that mean the engine is broken rather than declining to price.
      # A stale fixture expectation must not switch off the nightly reprice,
      # which is exactly what happened for seven runs on 2026-09-05.
      engine_ok: ${{ steps.smoke.outputs.engine_ok }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Run only at 5:00 AM America/New_York
        id: et-gate
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ET_HOUR=$(TZ=America/New_York date +%H)
          # Widen the gate from equality to a 4-hour window to absorb GitHub
          # Actions schedule drift (cron jobs regularly fire 1-3+ hours late).
          # 10# strips leading zeros so bash treats "05" as decimal, not octal.
          if [ "$((10#$ET_HOUR))" -lt 5 ] || [ "$((10#$ET_HOUR))" -gt 9 ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Current ET hour is $ET_HOUR (outside 05-09 window); skipping this UTC trigger."
            exit 0
          fi

          # CF-ONE-DEPLOY-PER-DAY-NOT-TWO (Fable, 2026-09-18). Two cron entries
          # (09:00 and 10:00 UTC) exist so that exactly one of them is 5 AM ET
          # across DST. But the ET window above is 05-09 — deliberately wide, to
          # absorb the 1-3 h Actions schedule drift — and BOTH triggers fall
          # inside it. Measured: 09-16, 09-17 and 09-18 each ran twice, at
          # ~09:1xZ and ~10:1xZ, redeploying an identical sha the second time.
          #
          # The window cannot simply be narrowed without losing the drift
          # tolerance it was widened for. So the second run is stopped by what
          # actually distinguishes it: production is ALREADY SERVING this sha.
          # That is a stronger test than any clock arithmetic — it also skips a
          # manual re-run of a build that is already live, and it cannot
          # mis-fire on the genuine first run of a NEW sha.
          # The public hostname is used directly, NOT `az webapp show`: this gate
          # runs at step 1, before `azure/login`, so the CLI is not
          # authenticated here. Every other host reference in this workflow is
          # still resolved from Azure (#2202) — this one call cannot be, and a
          # health probe over the public URL needs no credentials anyway.
          LIVE=$(curl -s --max-time 20 \
            "https://hobbyiq3-e5a4dgfsdnb5fbha.centralus-01.azurewebsites.net/api/health" \
            | grep -o '"sha":"[^"]*"' | head -1 | cut -d'"' -f4)
          if [ -n "$LIVE" ] && [ "$LIVE" = "${{ github.sha }}" ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "already live: production is serving ${LIVE} — nothing to deploy, skipping."
            exit 0
          fi
          # An unreachable or unparsable health response must NOT block a
          # deploy — fall through and let the slot flow decide, exactly as
          # before this check existed.
          echo "production serves ${LIVE:-<unknown>}; this run builds ${{ github.sha }}"

          echo "should_run=true" >> "$GITHUB_OUTPUT"
          echo "Current ET hour is $ET_HOUR (within 05-09 window); continuing workflow."

      - name: Setup Node.js 24
        if: steps.et-gate.outputs.should_run == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      # Install all deps (including devDependencies for tsc)
      - name: Install backend dependencies
        if: steps.et-gate.outputs.should_run == 'true'
        working-directory: backend
        run: npm ci

      # Compile TypeScript → dist/
      - name: Build backend
        if: steps.et-gate.outputs.should_run == 'true'
        working-directory: backend
        run: npm run build

      # Save compiled dist before pruning devDeps
      - name: Save compiled dist
        if: steps.et-gate.outputs.should_run == 'true'
        run: cp -r backend/dist /tmp/backend-dist

      # Trim to production deps for the zip (no @types, no devDeps)
      - name: Prune to production dependencies
        if: steps.et-gate.outputs.should_run == 'true'
        working-directory: backend
        run: npm ci --omit=dev

      # Restore compiled dist (pruning deletes node_modules but not dist, this is a safety net)
      - name: Restore compiled dist
        if: steps.et-gate.outputs.should_run == 'true'
        run: cp -r /tmp/backend-dist backend/dist

      # Install archiver at root (needed by zip.js)
      - name: Install root zip dependencies
        if: steps.et-gate.outputs.should_run == 'true'
        run: npm install archiver --no-save

      # Build deploy.zip via project's own zip.js (packages dist/ + node_modules)
      - name: Create deploy.zip
        if: steps.et-gate.outputs.should_run == 'true'
        run: node zip.js

      # Login to Azure using OIDC service principal (more reliable than JSON creds parsing)
      - name: Login to Azure
        if: steps.et-gate.outputs.should_run == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_1259D9D213E34AE29B2DD54B3E755C4D }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_5AB8B3DC612348FD9D37DBE28FF40802 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_A45CF8552AE94AF68A046FB846E21206 }}

      # CF-A-STAGING-SLOT-MUST-NOT-ACT-LIKE-PRODUCTION (Fable, 2026-09-15, R56).
      # Deploy to the STAGING SLOT, not to production. The slot warms and is
      # smoked while production keeps serving the previous build; only a slot
      # that answered every smoke case is swapped in. No user ever meets a cold
      # process, which is the 14-22s window this replaces.
      #
      # The slot carries HIQ_SLOT_ROLE=staging as a SLOT SETTING (sticky), so
      # it runs no in-process jobs and no outbound side effects while it warms
      # — see services/ops/slotRole.ts for what would otherwise double-run, and
      # docs/runbooks/staging-slot-swap.md for the settings table.
      - name: Deploy to staging slot
        if: steps.et-gate.outputs.should_run == 'true'
        uses: azure/webapps-deploy@v3
        with:
          app-name: HobbyIQ3
          slot-name: staging
          resource-group-name: rg-hobbyiq-dev
          package: deploy.zip

      # CF-NEVER-HARDCODE-A-SLOT-HOST (Fable, 2026-09-15). The first slot deploy
      # polled `https://hobbyiq3-staging.azurewebsites.net` and got connection
      # failure (000) forty times, because that hostname does not exist: an App
      # Service slot carries the SAME unique suffix production does, so the real
      # host is `hobbyiq3-staging-aebjecgpd7bvbshq.centralus-01...`. The run
      # correctly refused to swap, but for the wrong reason — a workflow bug
      # that reads exactly like a failing build, which is the most expensive
      # kind of false negative a deploy gate can produce.
      #
      # Both hosts are now READ FROM AZURE rather than written down. A name
      # nobody types cannot be mistyped, and the suffix is not guessable, so
      # hardcoding it was always a latent break — one Azure hands us for free.
      - name: Resolve App Service hostnames
        id: hosts
        if: steps.et-gate.outputs.should_run == 'true'
        run: |
          SLOT_HOST=$(az webapp show --name HobbyIQ3 --resource-group rg-hobbyiq-dev --slot staging --query defaultHostName -o tsv | tr -d '\r\n')
          PROD_HOST=$(az webapp show --name HobbyIQ3 --resource-group rg-hobbyiq-dev --query defaultHostName -o tsv | tr -d '\r\n')
          if [ -z "$SLOT_HOST" ] || [ -z "$PROD_HOST" ]; then
            echo "::error::could not resolve hostnames (slot='$SLOT_HOST' prod='$PROD_HOST')"
            exit 1
          fi
          # A slot host equal to production means --slot was ignored. Warming and
          # smoking production while calling it "the slot" would then swap an
          # unverified build into production. Refuse instead.
          if [ "$SLOT_HOST" = "$PROD_HOST" ]; then
            echo "::error::slot host equals production host ($PROD_HOST) — refusing"
            exit 1
          fi
          echo "slot=https://$SLOT_HOST" >> "$GITHUB_OUTPUT"
          echo "prod=https://$PROD_HOST" >> "$GITHUB_OUTPUT"
          echo "slot host: $SLOT_HOST"
          echo "prod host: $PROD_HOST"

      # Warm the slot BEFORE it takes traffic. /api/health/warm builds the
      # expensive singletons (checklist corpora, parser tables, the ladder
      # module graph — ~2.5s measured) and returns per-step ms, so the deploy
      # BLOCKS on warm-up finishing rather than hoping it races the first user.
      - name: Warm the staging slot
        if: steps.et-gate.outputs.should_run == 'true'
        run: |
          SLOT="${{ steps.hosts.outputs.slot }}"
          EXPECTED="${{ github.sha }}"

          # CF-A-HEALTHY-SLOT-IS-NOT-THE-NEW-SLOT (Fable, 2026-09-15). This
          # polled for HTTP 200 and stopped there. Run 34989816447 showed why
          # that is not enough: `/api/health` answered 200 on the FIRST try,
          # 0.09 s into the step — because App Service had not yet recycled the
          # worker onto the package OneDeploy had just finished uploading. The
          # OUTGOING process answered.
          #
          # Everything downstream then measured the wrong process. The warm
          # call came back `{"ok":true,"totalMs":17}` — a cold process pays
          # ~2,555 ms there (measured, #2196), so 17 ms means it warmed a
          # process that was already warm, i.e. the one being replaced. The
          # smoke then hit the cold INCOMING process and case 4 answered after
          # 25,321 ms, which is the route deadline (25,000 ms) to the second.
          #
          # So the poll now proves IDENTITY, not just liveness: keep asking
          # until the slot reports the sha this run built. `build.sha` comes
          # from dist/build-info.json, which ships inside the package — it
          # cannot report a sha unless the dist carrying it is the dist that is
          # loaded, which is exactly the property needed here.
          echo "Waiting for the slot to serve ${EXPECTED} on EVERY instance ..."

          # CF-ONE-INSTANCE-IS-NOT-THE-SLOT (2026-09-18). The poll above
          # used to break on the FIRST answer carrying the expected sha.
          # With the plan running 2 instances and no ARR affinity on an
          # un-cookied curl, successive polls round-robin -- so a match
          # proves ONE worker recycled and says nothing about the other.
          #
          # Measured on the 2026-09-18 deploy: this poll matched and passed,
          # then warm calls 2 and 3 came back with NO instance field at all
          # -- the field only exists in the new code, so those answers came
          # from a worker still running the OLD build. The gate had already
          # declared the slot verified.
          #
          # So the gate now requires the expected sha from every DISTINCT
          # instance it has seen, and it must keep seeing the same set for
          # STREAK consecutive polls before it believes it has seen them all
          # (with round-robin, N polls is the only way to enumerate N
          # workers -- there is no endpoint that lists them).
          #
          # No new dispatch inputs: the instance count comes from the health
          # payload itself, which now reports the same 8-char tag the warm
          # step already used to prove it covered both workers.
          #
          # CF-NO-INSTANCE-IS-NOT-A-THIRD-INSTANCE (2026-09-19). Run
          # 35418597889 refused a good build: both real instances (d456bc97,
          # 6fd4f9ab) verified the new sha, but a handful of early polls
          # landed on a recycling worker that answered /api/health with NO
          # instance field -- exactly the "typically during the recycle" case
          # this gate already anticipated. `no-instance` was folded into
          # SEEN_IDS as if it were a third distinct worker, and since a
          # response with no instance id can never carry one, N_OK could
          # never reach N_SEEN again -- the gate was unwinnable once a single
          # no-instance answer arrived.
          #
          # A no-instance answer proves nothing about identity, so it must
          # never enter the set of instances that need verifying. But it also
          # must not be free cover for a stale worker: if a no-instance answer
          # carries the WRONG (or absent) sha, that is live evidence of an
          # unrecycled process, so it still blocks. NOINST_CLEAR_STREAK counts
          # polls since the last no-instance answer that did NOT carry
          # EXPECTED -- it advances on every poll (a verified real instance
          # counts as "not stale evidence" same as an on-sha no-instance
          # answer) and resets only when a no-instance answer misses. So a
          # single early no-instance blip clears itself out after
          # STREAK_NEEDED more polls of any kind, but a no-instance answer
          # that keeps recurring with the wrong sha keeps the gate blocked.
          STREAK_NEEDED=6           # 6 x 5s = 30s of an unchanging instance set
          MATCHED=""
          SEEN_IDS=""
          OK_IDS=""
          STREAK=0
          PREV_SIG=""
          NOINST_COUNT=0
          NOINST_CLEAR_STREAK=0
          for i in $(seq 1 72); do          # 72 x 5s = 6 minutes
            BODY=$(curl -s --max-time 20 "$SLOT/api/health")
            LIVE=$(echo "$BODY" | grep -o '"sha":"[^"]*"' | head -1 | cut -d'"' -f4)
            INST=$(echo "$BODY" | grep -o '"instance":"[^"]*"' | head -1 | cut -d'"' -f4)
            if [ -z "$INST" ]; then
              # No instance id: never a distinct worker to verify (it can
              # never earn a match), but its sha is still evidence. A wrong
              # or missing sha here resets the clear-streak so a
              # recycling-but-stale worker keeps blocking the swap.
              NOINST_COUNT=$((NOINST_COUNT + 1))
              TAG="no-instance"
              if [ -n "$LIVE" ] && [ "$LIVE" = "$EXPECTED" ]; then
                NOINST_CLEAR_STREAK=$((NOINST_CLEAR_STREAK + 1))
              else
                NOINST_CLEAR_STREAK=0
              fi
            else
              TAG="$INST"
              case " $SEEN_IDS " in *" $TAG "*) ;; *) SEEN_IDS="$SEEN_IDS $TAG" ;; esac
              if [ -n "$LIVE" ] && [ "$LIVE" = "$EXPECTED" ]; then
                case " $OK_IDS " in *" $TAG "*) ;; *) OK_IDS="$OK_IDS $TAG" ;; esac
              fi
              NOINST_CLEAR_STREAK=$((NOINST_CLEAR_STREAK + 1))
            fi
            SIG=$(echo "$SEEN_IDS" | tr " " "\n" | grep -v "^$" | sort -u | tr "\n" " ")
            N_SEEN=$(echo "$SIG" | wc -w)
            N_OK=$(echo "$OK_IDS" | wc -w)
            echo "poll ${i}: instance=${TAG} sha=${LIVE:-<no answer>} | verified ${N_OK}/${N_SEEN} distinct (real) | no-instance seen:${NOINST_COUNT} clear-streak:${NOINST_CLEAR_STREAK}"
            if [ "$SIG" = "$PREV_SIG" ]; then STREAK=$((STREAK + 1)); else STREAK=1; PREV_SIG="$SIG"; fi
            # Every REAL instance seen has served the expected sha, that set
            # has been stable long enough to trust it is complete, and any
            # no-instance answers seen are not a stale worker in disguise
            # (either none arrived, or it has been STREAK_NEEDED polls since
            # the last one that missed the expected sha).
            if [ "$N_OK" -ge "$N_SEEN" ] && [ "$N_OK" -gt 0 ] && [ "$STREAK" -ge "$STREAK_NEEDED" ] \
               && { [ "$NOINST_COUNT" -eq 0 ] || [ "$NOINST_CLEAR_STREAK" -ge "$STREAK_NEEDED" ]; }; then
              MATCHED=yes
              echo "every instance is serving the new build after ${i} polls:${SIG}"
              break
            fi
            sleep 5
          done
          if [ -z "$MATCHED" ]; then
            echo "::error::not every slot instance reported sha ${EXPECTED} within 6 minutes — not swapping."
            echo "verified instances:${OK_IDS:- none}  |  instances seen:${SEEN_IDS:- none}  |  no-instance answers:${NOINST_COUNT} (clear-streak:${NOINST_CLEAR_STREAK})"
            echo "The slot may still be recycling, or OneDeploy landed a package the"
            echo "worker never picked up. Either way the build is unverified, so"
            echo "production keeps the one it has."
            exit 1
          fi

          # CF-A-WARM-THAT-TIMED-OUT-IS-NOT-A-WARM (Fable, 2026-09-18).
          #
          # This called warm ONCE and grepped for `"ok":true`. Both halves were
          # wrong, and together they cost four refused swaps in three days:
          #
          #   1. `ok:true` was hardcoded in the route, so a warm whose two
          #      Cosmos steps had each sat 20,003 ms on the request ceiling —
          #      i.e. had TIMED OUT — still reported success. Fixed in
          #      warmStart/health.routes; the endpoint now reports the verdict.
          #   2. ONE call cannot warm TWO instances. The plan runs P2v3 x2 with
          #      no ARR affinity, so the warm call and the smoke round-robin
          #      independently: warming one worker proves nothing about the one
          #      the smoke lands on. Measured on prod telemetry, one worker had
          #      280 calls at the 20 s ceiling in 3 h while the other had zero.
          #
          # Eight calls, every one required ok, and at least two DISTINCT
          # instance ids required — so "both workers are warm" is proved rather
          # than hoped. With 2 instances and no affinity, 8 independent calls
          # miss a worker with probability 2^-7 (<1%).
          echo "Warming (8 calls, no affinity cookie) ..."
          WARM_OK=0
          WARM_IDS=""
          for i in $(seq 1 8); do
            WARM=$(curl -s --max-time 180 "$SLOT/api/health/warm")
            ID=$(echo "$WARM" | grep -o '"instance":"[^"]*"' | head -1 | cut -d'"' -f4)
            MS=$(echo "$WARM" | grep -o '"totalMs":[0-9]*' | head -1 | cut -d: -f2)
            echo "  warm $i: instance=${ID:-<none>} totalMs=${MS:-?}"
            echo "    $WARM"
            if echo "$WARM" | grep -q '"ok":true'; then
              WARM_OK=$((WARM_OK + 1))
            else
              FAILED=$(echo "$WARM" | grep -o '"failedSteps":\[[^]]*\]' | head -1)
              echo "::error::warm call $i reported ok:false — ${FAILED:-no failedSteps in response}"
            fi
            [ -n "$ID" ] && WARM_IDS="$WARM_IDS $ID"
          done

          if [ "$WARM_OK" -ne 8 ]; then
            echo "::error::only ${WARM_OK}/8 warm calls succeeded — not swapping."
            echo "A warm that timed out means this slot instance cannot reach Cosmos."
            echo "The smoke would hit the same instance and fail, so the swap is refused here"
            echo "with a message that names the cause instead of a 25 s smoke timeout."
            exit 1
          fi

          DISTINCT=$(echo "$WARM_IDS" | tr ' ' '\n' | grep -v '^$' | sort -u | wc -l)
          echo "warm covered ${DISTINCT} distinct instance(s):$(echo "$WARM_IDS" | tr ' ' '\n' | grep -v '^$' | sort -u | tr '\n' ' ')"
          INSTANCES=$(az appservice plan show --name HobbyIqPLan2 --resource-group rg-hobbyiq-dev --query sku.capacity -o tsv 2>/dev/null || echo 1)
          if [ "${INSTANCES:-1}" -gt 1 ] && [ "$DISTINCT" -lt 2 ]; then
            # Not fatal: the ids come from WEBSITE_INSTANCE_ID, and a platform
            # that stops setting it must not block every deploy. But an
            # un-proved second worker is exactly the gap that produced the four
            # failures, so it is a loud warning rather than a silent pass.
            echo "::warning::plan has ${INSTANCES} instances but warm only proved ${DISTINCT} — the smoke may land on an unwarmed worker"
          fi
          # Recorded because it is the tell: on a genuinely cold process this is
          # seconds, and a value near zero means the warm hit a process that was
          # already warm — the symptom that hid the sequencing bug above.
          WARM_MS=$(echo "$WARM" | grep -o '"totalMs":[0-9]*' | head -1 | cut -d: -f2)
          echo "warm totalMs=${WARM_MS:-unknown}"

      # Fetched BEFORE the slot smoke, which authenticates with it. It was
      # previously fetched further down, next to the DailyIQ warms that were its
      # only consumer — leaving it there would have handed the slot smoke an
      # empty token and turned every case into a 401, i.e. a green-looking
      # refusal to swap.
      - name: Fetch TIER1_HARNESS_TOKEN for warm auth
        if: steps.et-gate.outputs.should_run == 'true'
        id: harness-token
        run: |
          TOKEN=$(az webapp config appsettings list \
            --name HobbyIQ3 --resource-group rg-hobbyiq-dev \
            --query "[?name=='TIER1_HARNESS_TOKEN'].value" -o tsv | tr -d '\r\n')
          if [ -z "$TOKEN" ]; then
            echo "::warning::TIER1_HARNESS_TOKEN empty from App Service — DailyIQ warms will 401"
          fi
          # Mask so the value never lands in any subsequent step's log.
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      # Smoke the SLOT. This is the gate: a slot that cannot price is never
      # swapped into production, so a bad build is caught while the previous
      # one is still serving users.
      - name: Smoke the staging slot
        id: slot-smoke
        if: steps.et-gate.outputs.should_run == 'true'
        continue-on-error: true
        working-directory: backend
        env:
          # An env: block, not inline assignments. The previous form relied on
          # backslash continuations that were flattened into a single line when
          # this file was written — it happened to still work, and would not
          # have the next time someone edited it.
          SMOKE_BASE_URL: ${{ steps.hosts.outputs.slot }}
          TIER1_HARNESS_TOKEN: ${{ steps.harness-token.outputs.token }}
        run: node scripts/smoke-test-pricing-tiers.cjs

      - name: Refuse the swap if the slot smoke failed
        if: steps.et-gate.outputs.should_run == 'true'
        run: |
          if [ "${{ steps.slot-smoke.outcome }}" != "success" ]; then
            echo "The staging slot failed its smoke (engine_ok=${{ steps.slot-smoke.outputs.engine_ok }})."
            echo "NOT swapping. Production keeps serving the previous build, which is the"
            echo "entire point of deploying to a slot — a bad build costs a red run, not an outage."
            exit 1
          fi
          echo "Slot smoke green — proceeding to swap."

      # The swap itself. Azure routes production traffic to the warmed slot and
      # moves the old production instance into the slot, where HIQ_SLOT_ROLE
      # (sticky to the slot, NOT to the code) makes it go quiet.
      - name: Swap staging into production
        if: steps.et-gate.outputs.should_run == 'true'
        run: |
          az webapp deployment slot swap             --name HobbyIQ3             --resource-group rg-hobbyiq-dev             --slot staging             --target-slot production
          echo "Swap complete."

      # Verify the SHA that is actually serving production is the one we built.
      # build-info.json ships inside the package, so this cannot report a SHA
      # unless the dist carrying it is the dist that is loaded.
      - name: Verify production is serving the new build
        if: steps.et-gate.outputs.should_run == 'true'
        run: |
          # Production's host is resolved from Azure too, so the pattern is
          # symmetrical with the slot and neither name lives in this file.
          PROD="${{ steps.hosts.outputs.prod }}"
          EXPECTED=$(git rev-parse --short=7 HEAD)
          for i in $(seq 1 30); do
            LIVE=$(curl -s --max-time 20 "$PROD/api/health" | grep -o '"shaShort":"[^"]*"' | head -1 | cut -d'"' -f4)
            echo "try ${i}: production sha=${LIVE} expected=${EXPECTED}"
            case "$EXPECTED" in "$LIVE"*) echo "production is serving the new build"; exit 0;; esac
            case "$LIVE" in "$EXPECTED"*) echo "production is serving the new build"; exit 0;; esac
            sleep 10
          done
          echo "::error::production never reported the expected sha after the swap"
          exit 1

      # CF-DEPLOY-RESTARTS-ONCE (2026-09-07). There used to be an "Update build
      # metadata App Settings" step here, writing GIT_SHA/GIT_SHA_SHORT/
      # GIT_BRANCH/DEPLOYED_AT so /api/health could report the deployed build.
      #
      # It has been removed, because it was the SECOND restart of every deploy.
      # An `az webapp config appsettings set` is a config/write: App Service
      # recycles every worker to pick the new settings up, ~45s after
      # azure/webapps-deploy@v3 had already recycled them once. The 2026-09-07
      # investigation (#1977, backend/docs/reports/2026-09-07-app-service-
      # recycles-and-telemetry-loss.md) traced both workers' 8-19 minute
      # lockstep reboots to exactly this pair, at ~23 dispatches/day: mean
      # process lifetime near ten minutes, and no setInterval longer than that
      # has ever fired in production from the interval path.
      #
      # Nothing is lost. The SHA already ships INSIDE the package:
      # scripts/write-build-info.cjs writes dist/build-info.json at build time,
      # and src/routes/health.routes.ts now serves build.sha/shaShort/branch
      # from that file (env vars remain the fallback). That is also strictly
      # more truthful than the env vars were — build-info.json cannot report a
      # SHA unless the dist carrying it is the dist actually loaded, which is
      # the exact failure the env-var quad could not see (the 3-for-3 silent
      # old-dist deploys). The deploy is now ONE restart-causing step: the
      # azure/webapps-deploy@v3 above.

      # Wait for the app to finish restarting before warming cache
      - name: Wait for app restart
        if: steps.et-gate.outputs.should_run == 'true'
        run: sleep 30

      # Hit health check first
      - name: Health check
        if: steps.et-gate.outputs.should_run == 'true'
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            https://hobbyiq3-e5a4dgfsdnb5fbha.centralus-01.azurewebsites.net/api/health)
          echo "Health status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Health check failed ($STATUS) — aborting cache warm"
            exit 1
          fi

      # CF-DAILY-REFRESH-WARM-AUTH (2026-07-11, Drew): CF-FINALIZE
      # (2026-06-03) hard-gated /players/top/* + /brief behind
      # requireSession + requireEntitlement("dailyIQBriefs"), so the
      # pre-existing unauthenticated curl warms started returning 401
      # and silently no-op'd. Cache stayed cold until the first live
      # investor+ user hit the endpoint. Fix: reuse the TIER1_HARNESS_
      # TOKEN bypass in requireSession (auth as synthetic pro_seller
      # harness user) — same pattern as the Tier 1 Production Harness
      # workflow. Token pulled from App Service settings so it never
      # lives in the workflow file. Fail-closed: if the token is empty,
      # the curls still 401 and we log a workflow warning.
      # Force a fresh DailyIQ pull from MLB Stats API — pre-warms cache for users
      - name: Warm DailyIQ cache (MLB)
        if: steps.et-gate.outputs.should_run == 'true'
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "x-session-id: ${{ steps.harness-token.outputs.token }}" \
            "https://hobbyiq3-e5a4dgfsdnb5fbha.centralus-01.azurewebsites.net/api/dailyiq/players/top/mlb?limit=25&fresh=true")
          echo "MLB warm status: $STATUS"

      - name: Warm DailyIQ cache (MiLB)
        if: steps.et-gate.outputs.should_run == 'true'
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "x-session-id: ${{ steps.harness-token.outputs.token }}" \
            "https://hobbyiq3-e5a4dgfsdnb5fbha.centralus-01.azurewebsites.net/api/dailyiq/players/top/milb?limit=25&fresh=true")
          echo "MiLB warm status: $STATUS"

      # CF-LONG-CRONS-DIE-AT-THE-IDLE-CUT (2026-09-09). This warm was the
      # single largest source of 240s aborts on the API. App Insights over 14
      # days separates the two shapes of this request cleanly:
      #
      #   ?fresh=true   183 × 200 (p50 6.1s, p95 182.9s, max 220s)
      #                  17 × ResultCode 0, every one at exactly 240.0s
      #   no fresh       41 × 200 (p50 1.9s, p95 21.1s, max 61.1s), 63 × 204
      #                   and ZERO aborts
      #
      # Every abort belongs to THIS step; no real client request has ever hit
      # the cut. So only ?fresh=true became a dispatch (202 + jobId) — the
      # user-facing read path is untouched and still answers inline, which is
      # what keeps the app from regressing into a spinner. This step polls
      # the rebuild to completion instead of holding one long connection.
      - name: Warm DailyIQ brief
        if: steps.et-gate.outputs.should_run == 'true'
        run: |
          # ?fresh=true forces buildAndPersistBriefPayload to run and write to
          # Cosmos; without it the route returns the in-memory _briefCache and
          # skips persistence entirely (root cause of issue #80).
          # CF-THE-LOG-IS-BOTH-STREAMS (#1963/#1975). `2>&1` so the poller's
          # console.error refusals land in the log this step parses;
          # `pipefail` so the status is the poller's, not tee's constant 0 —
          # without it a warm that never settled would report SUCCESS.
          set -o pipefail
          set +e
          node backend/scripts/poll-admin-job.cjs \
            --label dailyiq-brief \
            --method GET \
            --dispatch-url "https://hobbyiq3-e5a4dgfsdnb5fbha.centralus-01.azurewebsites.net/api/dailyiq/brief?fresh=true" \
            --status-url "https://hobbyiq3-e5a4dgfsdnb5fbha.centralus-01.azurewebsites.net/api/dailyiq/brief/status" \
            --auth-header "x-session-id: ${{ steps.harness-token.outputs.token }}" \
            2>&1 | tee /tmp/brief-poll.log
          POLL_RC=$?
          set -e
          if [ "$POLL_RC" -ne 0 ]; then
            echo "::error::DailyIQ brief warm did not settle (rc=$POLL_RC) — today's brief may not have been persisted"
            exit 1
          fi
          RESULT=$(sed -n 's/^RESULT_JSON //p' /tmp/brief-poll.log | tail -n1)
          MLB_COUNT=$(echo "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('built',{}).get('mlb','?'))" 2>/dev/null || echo "?")
          MILB_COUNT=$(echo "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('built',{}).get('milb','?'))" 2>/dev/null || echo "?")
          echo "Daily brief warmed — MLB: $MLB_COUNT performers, MiLB: $MILB_COUNT performers"

      # CF-ERA-BASELINES-WORKFLOW-SPLIT (2026-07-16): the era-baselines
      # refresh ran here in-line and reliably hit the 20-minute workflow
      # cap (1630 buckets, ~1s each for CH lookups + Cosmos writes). The
      # deploy itself finished at ~14 minutes but the workflow flagged
      # red because the cache-warm step got canceled by the timeout.
      # Split into .github/workflows/era-baselines-refresh.yml so deploys
      # go clean-green and the era-baselines cadence is independent.

      # CF-SMOKE-TEST-CI-GATE (2026-07-11, Drew): post-deploy tier-
      # classification smoke test. Hits /api/compiq/price with 8 cases
      # (1 per tier) and asserts non-null FMV on tiers 1-7. If ANY of
      # the 7 mustNotNull cases returns null, the workflow fails —
      # catches parser gaps + null-FMV regressions (like the 2026-07-11
      # Padparadscha + Panini Origins smoke findings) before the next
      # day. Uses TIER1_HARNESS_TOKEN for auth. Non-blocking on the
      # deploy itself (deploy + warms + era-baselines already ran); this
      # is the post-deploy validation.
      # CF-A-WITHHELD-PRICE-IS-NOT-A-MISSING-ONE (2026-09-05). The step still
      # FAILS the job on any violation — the red is how a stale expectation
      # gets noticed — but it publishes `engine_ok` FIRST, so the reprice job
      # can tell "a fixture disagrees with the engine" from "the engine is
      # down". `continue-on-error` lets the outputs survive the non-zero exit;
      # the "Smoke test verdict" step below re-raises it so the job is still
      # red, and it runs AFTER the outputs are readable.
      - name: Smoke test pricing tiers
        id: smoke
        if: steps.et-gate.outputs.should_run == 'true'
        continue-on-error: true
        working-directory: backend
        run: |
          TIER1_HARNESS_TOKEN="${{ steps.harness-token.outputs.token }}" \
          node scripts/smoke-test-pricing-tiers.cjs

      - name: Smoke test verdict
        if: steps.et-gate.outputs.should_run == 'true'
        shell: bash
        run: |
          if [ "${{ steps.smoke.outcome }}" = "success" ]; then
            echo "smoke test green"
            exit 0
          fi
          echo "smoke test FAILED (engine_ok=${{ steps.smoke.outputs.engine_ok }})"
          if [ "${{ steps.smoke.outputs.engine_ok }}" = "true" ]; then
            echo "Every null the smoke saw carried a reason, so the pricing engine is"
            echo "answering and the nightly reprice will still run. What failed is the"
            echo "agreement between a fixture and the engine — re-rule the case."
          else
            echo "The engine returned a null with no reason, or failed to answer."
            echo "The nightly reprice is held back."
          fi
          exit 1

      # Tell the reprice job below whether the ET gate actually opened. A
      # skipped UTC trigger must not reprice: the whole point of the gate is
      # that only ONE of the two cron entries is the real 5AM ET run.
      - name: Publish gate decision
        id: gate-out
        if: always()
        shell: bash
        run: echo "should_run=${{ steps.et-gate.outputs.should_run }}" >> "$GITHUB_OUTPUT"

  # ── NIGHTLY REPRICE (C-2, 2026-09-03) ─────────────────────────────────────
  #
  # THE ASSUMPTION THIS JOB MAKES, STATED OUT LOUD:
  #   Drew's standing intent is that pricing "needs to be fresh each time."
  #   This job takes that to mean EVERY user's holdings, once a day,
  #   immediately after the deploy, with no per-user opt-in.
  #
  #   "Fresh" is read as CORRECT, not as RECOMPUTED: the sweep skips a holding
  #   priced within the last 20h WHOSE EXACT POOL HAS NOT GROWN, and reprices
  #   everything else. A card somebody traded is always repriced; a card
  #   nobody traded is not re-derived nightly to produce the same number. That
  #   keeps the bill proportional to change instead of to corpus size, which
  #   is the difference between ~1 kRU today and ~100 kRU at 100x with no
  #   corresponding gain. If the intent was narrower still -- only Drew, or a
  #   multi-day cadence -- REPRICE_MAX_HOLDINGS and the script's
  #   NIGHTLY_MIN_HOLDING_AGE_MS are the knobs.
  #
  # WHY IT EXISTS: nothing repriced holdings on a schedule. The audit found 20
  # of 118 live holdings more than 7 days stale (max 18.2 days) and 28 sitting
  # on pools that had GROWN since the value was written. Worse,
  # pricing-invariant-audit.yml:36-39 says in its own cron comment that it runs
  # "after the 5AM ET daily refresh has repriced" -- the refresh did not
  # reprice, so the detector was judging numbers nobody had refreshed. This
  # closes that loop: the refresh reprices, THEN the 06:20 UTC audit judges it.
  #
  # WHY HERE AND NOT A NEW WORKFLOW: the sanctioned lane already exists
  # (reprice-user-holdings via the backfill runner) and the ordering matters --
  # the reprice must run against the code that was just deployed, not the
  # previous day's. `needs:` gives that ordering for free.
  #
  # WHY IT CALLS THE SCRIPT DIRECTLY rather than dispatching backfill-runner:
  # a `gh workflow run` would be fire-and-forget -- this job would go green
  # while the reprice was still queued, and a failure would land in a workflow
  # nobody was watching. The runner's reprice lane is four steps (checkout,
  # build, az login, run) and they are reproduced here so the result is part of
  # THIS run's red/green. The manual runner lane is unchanged and still works.
  reprice-holdings:
    name: Reprice All Holdings (post-refresh)
    needs: deploy-and-refresh
    # CF-A-WITHHELD-PRICE-IS-NOT-A-MISSING-ONE (2026-09-05). This was
    # `if: needs.deploy-and-refresh.outputs.should_run == 'true'`, which reads
    # as a gate on the ET window but silently carried a SECOND condition: a
    # `needs:` dependency skips when the upstream job fails, so ANY red in the
    # deploy job — including a smoke expectation that had merely gone stale —
    # cancelled the nightly all-users reprice. On 2026-09-05 that took the
    # reprice out for seven consecutive runs while the deploy itself landed
    # cleanly every time, and nothing announced it: a skipped job is quiet.
    #
    # The dependency is now explicit about which upstream failures matter.
    # `always()` re-enables the job after an upstream red, and the three
    # conditions state the real requirements:
    #
    #   should_run    the ET gate opened — a closed UTC trigger deployed
    #                 nothing and must reprice nothing (unchanged)
    #   engine_ok     the smoke found no unreasoned null and no HTTP failure,
    #                 i.e. the engine is answering. A withheld price with a
    #                 named reason is the product working, not an outage.
    #   deploy landed the upstream job did not fail BEFORE the smoke ran — a
    #                 build or deploy failure leaves engine_ok empty, which
    #                 fails this condition and correctly holds the reprice.
    #
    # `!cancelled()` rather than `always()`: a run somebody cancelled, or one
    # the workflow-level timeout killed, must not go on to reprice every
    # user's holdings in the background.
    if: ${{ !cancelled() && needs.deploy-and-refresh.outputs.should_run == 'true' && needs.deploy-and-refresh.outputs.engine_ok == 'true' }}
    runs-on: ubuntu-latest
    # The measured full pass is minutes, not hours (see the RU budget below).
    # 60 is generous headroom for pool growth, and well under the point where
    # a hung reprice would collide with the next day's run.
    timeout-minutes: 60
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Install backend deps
        working-directory: backend
        run: npm ci

      - name: Build backend dist
        # The reprice script requires compiled JS from backend/dist.
        working-directory: backend
        run: npm run build

      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_1259D9D213E34AE29B2DD54B3E755C4D }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_5AB8B3DC612348FD9D37DBE28FF40802 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_A45CF8552AE94AF68A046FB846E21206 }}

      # Same fetch-and-mask pattern the runner and the warm steps use: the
      # value goes straight from App Service into the job env, never to disk
      # and never to stdout.
      - name: Fetch Cosmos + auth secrets from HobbyIQ3 App Service
        shell: bash
        run: |
          for NAME in COSMOS_CONNECTION_STRING AUTH_SESSION_SECRET; do
            V=$(az webapp config appsettings list \
              --name HobbyIQ3 --resource-group rg-hobbyiq-dev \
              --query "[?name=='$NAME'].value | [0]" -o tsv)
            if [ -z "$V" ] || [ "$V" = "None" ]; then
              echo "::error::FAILED to fetch $NAME from App Service"
              exit 1
            fi
            echo "::add-mask::$V"
            echo "$NAME=$V" >> "$GITHUB_ENV"
            echo "$NAME fetched (length: ${#V})"
          done

      - name: Reprice every user's holdings
        working-directory: backend
        env:
          # MODE=all sweeps every user in the portfolio container.
          #
          # PRECEDENCE (verified against the script, 2026-09-03): MODE=all
          # WINS -- reprice-user-holdings.cjs tests ALL_USERS first and returns
          # from that branch, so a REPRICE_USER_ID set alongside it is ignored.
          # REPRICE_USER_ID is still deliberately UNSET here: relying on the
          # script's internal ordering to protect a corpus sweep is not a
          # guarantee, it is a coincidence that survives until someone
          # reorders two ifs.
          MODE: all
          BACKFILL_APPLY: "true"
          HOBBYIQFMV_COMPOSITE_ENABLED: "true"
          # ── THE RU / CONCURRENCY BUDGET ──────────────────────────────────
          #
          # Measured read-only against prod 2026-09-03, 12 users / 130 holdings:
          #   portfolio doc reads   194.55 RU for all 12 docs (145.9 of it is
          #                         user-199fcbc9's 1.96 MB doc alone)
          #   pool query per card   3.42 RU average (partition-keyed, TOP 60)
          #
          # One full pass ~= 12 doc reads + 130 pool queries + 12 doc writes:
          #   reads   194.55 RU
          #   pools   130 x 3.42  = 444.6 RU
          #   writes  ~= 2x reads = 389.1 RU  (Cosmos writes cost ~2x a read)
          #   TOTAL   ~1,028 RU per full pass -- about 1.0 kRU.
          #
          # sold_comps sits at a 10,000 RU/s floor, so a full pass is roughly
          # ONE TENTH OF ONE SECOND of provisioned throughput. The bill is
          # noise; the reason to bound it at all is blast radius, not cost.
          #
          # Growth is linear in holdings: at 100x today's corpus (13,000
          # holdings) a pass is ~100 kRU, still ~10 seconds of the floor.
          # Revisit the budget, not the cadence, if the corpus outgrows that.
          #
          # THAT IS THE CEILING, NOT THE BILL. The nightly lane skips holdings
          # priced within the last 20h whose exact pool has NOT grown, so the
          # steady-state cost is proportional to CHANGE rather than to corpus:
          # one cheap partition-keyed COUNT (3.42 RU) per fresh holding, and a
          # full reprice only where a sale actually landed. A holding whose
          # pool grew is repriced regardless of age -- freshness never hides a
          # market move. Manual dispatches keep the full bypass.
          #
          # Concurrency: the script walks users SERIALLY and repriceHoldingsForUser
          # walks holdings serially inside each. That is the budget -- one
          # in-flight query at a time -- and it is deliberate: the reprice
          # shares the sold_comps floor with live user traffic at 5AM ET, and
          # a parallel sweep is the shape that produces 429s on the read path
          # a collector is using. It is fast enough serially (a full pass is
          # ~130 queries) that parallelism buys nothing worth that risk.
          #
          # This variable is now READ AND VALIDATED by the script (it was
          # decorative -- set here, read nowhere). Only "1" is accepted; any
          # other value exits 1 rather than being silently ignored, so nobody
          # can believe they have bounded a sweep they have not.
          REPRICE_CONCURRENCY: "1"
          # Per-user cap. 200 is the script's own default and comfortably
          # exceeds the largest live portfolio (43 holdings). It is a runaway
          # guard, not a throttle.
          REPRICE_MAX_HOLDINGS: "200"
        run: node scripts/reprice-user-holdings.cjs

  # ── DEPLOY FAILURE ALERT (P1-5, 2026-09-07) ───────────────────────────────
  #
  # WHAT WAS SILENT. A failed "Daily 5AM ET Refresh & Deploy" announced itself
  # to nobody. Since this workflow is the ONLY mechanism by which a backend fix
  # reaches prod (merging does not deploy), a red run during launch week means
  # shipping a fix and never learning it did not land — the "green workflow is
  # not data flow" trap, pointed the other way.
  #
  # WHY A GITHUB ISSUE AND NOT THE EMAIL PATH. The repo's one existing mail
  # lane (catalog-gap-digest) sends through ACS, and to do that it must first
  # `azure/login` and read ACS_EMAIL_CONNECTION_STRING off the HobbyIQ3 App
  # Service. Every one of those steps is a thing that can be the reason THIS
  # workflow just failed: an Azure outage or an expired OIDC credential would
  # take out the deploy and the alert about the deploy together. The Azure
  # Monitor action group has the same coupling plus a live-config change to
  # point it here. An issue needs only `github.token`, so the alert survives
  # exactly the failures it exists to report, and GitHub mails the watchers.
  #
  # WHY IT GATES ON CONCLUSIONS, NOT ON A SHA. Per the 2026-09-04 incident
  # (smoke case #4 null since 04:21Z, reprice-all skipped ~2 days, /api/health
  # still serving a fresh-looking sha): a sha proves a deploy ran, never that
  # it worked. Every condition below reads a step or job CONCLUSION.
  #
  # WHY `!cancelled()` IS SPELLED OUT AND NOT FOLDED. A `>-` block folds its
  # newlines into spaces and, when the expression is written across lines,
  # yields a string GitHub evaluates as truthy REGARDLESS of the run's state —
  # the alert would then fire on every green nightly. The condition is one
  # line, in `${{ }}`, and the test in backend/tests/workflowAlertGates.test.ts
  # pins that shape.
  deploy-failure-alert:
    name: Open/update the deploy-failed issue
    needs: [deploy-and-refresh, reprice-holdings]
    # Fires when the ET gate OPENED (a closed UTC trigger deployed nothing and
    # has nothing to report) and either job did not succeed. `!cancelled()`
    # keeps a hand-cancelled or timed-out run from paging anybody.
    if: ${{ !cancelled() && needs.deploy-and-refresh.outputs.should_run == 'true' && (needs.deploy-and-refresh.result == 'failure' || needs.reprice-holdings.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Only to file the alert. Nothing in this job reads code or touches prod.
      issues: write
      contents: read
      actions: read

    steps:
      - name: Identify the failed step and open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_RESULT: ${{ needs.deploy-and-refresh.result }}
          REPRICE_RESULT: ${{ needs.reprice-holdings.result }}
          ENGINE_OK: ${{ needs.deploy-and-refresh.outputs.engine_ok }}
        run: |
          set -euo pipefail

          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          SHA_SHORT="${GITHUB_SHA:0:7}"
          TODAY="$(date -u +%Y-%m-%d)"
          TITLE="DEPLOY FAILED $TODAY $SHA_SHORT"

          # Name the failed steps from the run's own step conclusions rather
          # than guessing from the job result: "the deploy job is red" is not
          # actionable, "Deploy to Azure App Service failed" is.
          FAILED_STEPS="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" \
            --jq '.jobs[] | .name as $j | .steps[]? | select(.conclusion == "failure") | "- **\($j)** → `\(.name)`"' \
            2>/dev/null || true)"
          if [ -z "$FAILED_STEPS" ]; then
            FAILED_STEPS="- (no individual step reported failure — see the run log)"
          fi

          # engine_ok separates "a fixture disagrees with the engine" from "the
          # engine is down"; the reprice gate already reads it, so the alert
          # says which one happened instead of making the reader open the log.
          case "$ENGINE_OK" in
            true)  ENGINE_LINE="\`engine_ok=true\` — the pricing engine answered every smoke case. A red here is a stale fixture expectation, not an outage; the nightly reprice still ran." ;;
            false) ENGINE_LINE="\`engine_ok=false\` — **the smoke saw an unreasoned null or no answer at all.** The nightly reprice was held back. Treat as an engine outage." ;;
            *)     ENGINE_LINE="\`engine_ok\` is empty — the job failed BEFORE the smoke test ran (build, deploy, or health check). Nothing was validated and the reprice was held back." ;;
          esac

          {
            echo "The 5AM ET refresh + deploy did not complete cleanly. **Merging does not deploy** —"
            echo "until this run is green, the code on \`main\` is not the code in prod."
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Run | [$GITHUB_RUN_ID]($RUN_URL) |"
            echo "| Commit | \`$GITHUB_SHA\` |"
            echo "| Deploy job | \`$DEPLOY_RESULT\` |"
            echo "| Reprice job | \`$REPRICE_RESULT\` |"
            echo "| Triggered by | \`$GITHUB_EVENT_NAME\` |"
            echo ""
            echo "**Failed steps**"
            echo ""
            echo "$FAILED_STEPS"
            echo ""
            echo "**Smoke verdict.** $ENGINE_LINE"
            echo ""
            echo "**Verify prod separately from this run** — a sha alone proves a deploy ran, never that it worked (2026-09-04):"
            echo ""
            echo '```bash'
            echo "curl -s https://hobbyiq3-e5a4dgfsdnb5fbha.centralus-01.azurewebsites.net/api/health | jq '.build'"
            echo "gh run view $GITHUB_RUN_ID --log-failed"
            echo '```'
            echo ""
            echo "Re-run with \`gh workflow run \"Daily 5AM ET Refresh & Deploy\"\` once the cause is fixed."
            echo ""
            echo "<sub>Filed automatically by the \`deploy-failure-alert\` job. Close it when the deploy is green.</sub>"
          } > /tmp/deploy-failed-body.md

          # One issue per (date, sha): a workflow retried three times on the
          # same broken commit should thread, not file three tickets. An
          # already-open issue gets a comment; anything else opens a new one.
          EXISTING="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label deploy \
            --search "$TITLE in:title" --json number,title \
            --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty" 2>/dev/null || true)"

          if [ -n "$EXISTING" ]; then
            echo "::notice::deploy-failure issue #$EXISTING already open for $TITLE — commenting"
            gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" --body-file /tmp/deploy-failed-body.md \
              || echo "::warning::could not comment on #$EXISTING — the run log still carries the failure"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" \
              --body-file /tmp/deploy-failed-body.md \
              --label ops --label deploy \
              || echo "::warning::could not open the deploy-failure issue — the run log still carries the failure"
          fi

          # The alert must not be the reason the run is red, and must not make
          # a red run look green. The deploy job's own conclusion is the verdict.
          echo "::error::Daily 5AM ET Refresh & Deploy FAILED — see $RUN_URL"
