name: Nightly pHash centroid refresh + auto-reslug

# Phase B of the image-verification pipeline (Drew, 2026-07-26).
# Runs after the Phase A pHash compute completed (2.34M pHashes now
# persisted across sold_comps). Two steps in sequence:
#
#   1. compute-slug-phash-centroids.cjs — rebuilds per-slug centroids
#      from the full pHash pool. Overwrites slug_phash_centroids.
#   2. phash-verify-and-reslug.cjs (APPLY mode) — walks pHashed rows,
#      compares to their slug centroid, reslugs mismatches to the best
#      sibling centroid or flags image-verification-inconclusive when
#      no sibling matches.
#
# Runs at 02:15 ET so it completes before the promote-aliases job
# (02:30 ET) and well before the 5AM deploy. Two UTC crons + ET gate
# per the standard nightly pattern.

# CF-PHASH-RESLUG-CHUNKED-CRON (Drew, 2026-07-26). Schedule RE-ENABLED
# at 6h cadence with chunked apply so the ~1.14M-patch backlog drains
# over ~4-6 runs (24-36h wall) instead of dying at GH Actions' 6h
# per-job cap.
#
# Per-run cap: RESLUG_LIMIT=400000 at RESLUG_CONCURRENCY=16 fits in
# ~5h (extrapolated from the truncated 43.5K/60min baseline at
# concurrency=8 → ~24K/min at concurrency=16 → 400K in ~17min IF
# Cosmos RU keeps up). Timeout raised to 330min for safety margin.
# ET-gate widened to accept any hour on the 6h cadence.
#
# When the backlog drains to 0 the script no-ops fast — remaining
# scheduled runs are effectively cheap health-checks.
on:
  schedule:
    - cron: '15 */6 * * *'   # every 6h at :15 UTC (04:15/10:15/16:15/22:15 UTC)
  workflow_dispatch:

jobs:
  reslug:
    name: Recompute pHash centroids and auto-reslug mismatches
    runs-on: ubuntu-latest
    # CF-PHASH-RESLUG-CHUNKED-CRON: 330min gives ~5.5h to drain a 400K
    # chunk at concurrency=16, leaving 30min safety margin under GH's 6h
    # cap. If a chunk finishes fast (backlog cleared), the job exits
    # early and the rest of the timeout is unused.
    timeout-minutes: 330
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Always-run gate (6h cadence with chunked drain)
        id: et-gate
        shell: bash
        # CF-PHASH-RESLUG-CHUNKED-CRON: schedule fires every 6h. No
        # ET-hour filtering — each run drains a chunk of the backlog.
        # Manual dispatch also always runs.
        run: |
          echo "should_run=true" >> "$GITHUB_OUTPUT"
          echo "Running (event=${{ github.event_name }})"

      - name: Setup Node.js 24
        if: steps.et-gate.outputs.should_run == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        if: steps.et-gate.outputs.should_run == 'true'
        working-directory: backend
        run: npm ci

      # Build the TS services since compute-slug-phash-centroids.cjs and
      # phash-verify-and-reslug.cjs both require compiled dist paths
      # (hobbyIqCardId.service.js) for slug parsing.
      - name: Build backend
        if: steps.et-gate.outputs.should_run == 'true'
        working-directory: backend
        run: npm run build

      - name: Login to Azure
        if: steps.et-gate.outputs.should_run == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_1259D9D213E34AE29B2DD54B3E755C4D }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_5AB8B3DC612348FD9D37DBE28FF40802 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_A45CF8552AE94AF68A046FB846E21206 }}

      - name: Fetch Cosmos connection string
        if: steps.et-gate.outputs.should_run == 'true'
        shell: bash
        run: |
          CONN=$(az webapp config appsettings list \
            --name HobbyIQ3 --resource-group rg-hobbyiq-dev \
            --query "[?name=='COSMOS_CONNECTION_STRING'].value | [0]" \
            -o tsv | tr -d '\r\n')
          if [ -z "$CONN" ]; then
            echo "FAILED to fetch COSMOS_CONNECTION_STRING from App Service" >&2
            exit 1
          fi
          echo "::add-mask::$CONN"
          echo "COSMOS_CONNECTION_STRING=$CONN" >> "$GITHUB_ENV"
          echo "Cosmos connection string fetched (length: ${#CONN})"

      # Step 1: recompute slug centroids from the full pHash pool.
      - name: Recompute slug pHash centroids
        if: steps.et-gate.outputs.should_run == 'true'
        working-directory: backend
        env:
          CENTROID_APPLY: 'true'
          CENTROID_CONCURRENCY: '8'
        run: node scripts/comp-quality/compute-slug-phash-centroids.cjs

      # Step 2: verify + reslug in APPLY mode. Uses conservative thresholds
      # (MISMATCH >= 20, MATCH <= 12) — same as the dry-run defaults that
      # produced 348 clean reslugs on the earlier 5,916-centroid pool.
      #
      # CF-PHASH-RESLUG-CHUNKED-CRON (Drew, 2026-07-26): apply a per-run
      # cap so a nightly-cron chunk fits in the 6h GH Actions job cap.
      # RESLUG_LIMIT=400000 at concurrency=16 fits comfortably; backlog
      # ~1.14M drains over ~3 runs. When backlog reaches 0 the script
      # no-ops fast.
      - name: Verify + auto-reslug
        if: steps.et-gate.outputs.should_run == 'true'
        working-directory: backend
        env:
          RESLUG_APPLY: 'true'
          RESLUG_CONCURRENCY: '16'
          RESLUG_LIMIT: '400000'
          RESLUG_DISTANCE_MISMATCH: '20'
          RESLUG_DISTANCE_MATCH: '12'
        run: node scripts/comp-quality/phash-verify-and-reslug.cjs
