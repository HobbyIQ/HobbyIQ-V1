name: Nightly Cleanliness Maintenance

# CF-NIGHTLY-CLEANLINESS-CRON (Drew, 2026-08-01). Runs every night at
# 3:00 UTC (10 PM Central prev day). Autonomously maintains data
# cleanliness by re-running the incremental backfills that benefit
# from newly-arrived data + newly-labeled catalog entries:
#
#   1. Catalog-driven Stage 1 re-run (picks up newly-covered
#      cardNumber+year keys added by the catalog expansion loop).
#      Idempotent — marker field prevents re-touching already-fixed rows.
#   2. Trust-tier promotion (mature rows without flags → verifyStatus=confirmed).
#   3. Baseline pool snapshot (freezes today's state — enables next-day drift comparison).
#   4. Train confidence weights (reads last 30d of learning_events,
#      adjusts scorer weights based on human decisions), then anomaly
#      detection (drift vs the baseline from step 3 above).
#
# Manual trigger via workflow_dispatch also supported for one-off runs.
#
# D13 (2026-08-29) — alert gates prove delivery. This workflow was
# structurally incapable of going red: a missing ADMIN_API_TOKEN and an
# empty anomalies response both warned and exited 0. Both are exit 1
# now. The four dispatches stay; each prints the backfill-runner run URL
# it produced so a green here can be traced to the run that did the work.
#
# CF-CLEANLINESS-ANOMALY-BUDGET (2026-09-11). The anomaly-detection leg of
# step 4 is now a FIFTH dispatch (anomaly-force-scan, a backfill-runner
# lane) rather than a direct HTTP call: the old ?force=true call was an
# unbounded full sold_comps walk that never once finished inside
# poll-admin-job.cjs's ceiling. See the "Dispatch anomaly-force-scan" step
# below for the full history.

on:
  schedule:
    - cron: "0 3 * * *"   # 03:00 UTC daily
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  actions: write

jobs:
  stage1-catalog-driven:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Stage 1 (catalog-driven canonicalization) apply
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run backfill-runner.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f script=backfill-catalog-driven-canonicalize \
            -f apply=true
          # D13: print the run this dispatch produced (newest backfill-runner run).
          sleep 20
          gh run list --repo "$GITHUB_REPOSITORY" --workflow=backfill-runner.yml --limit 1 \
            --json url,displayTitle,status --jq '"dispatched backfill-catalog-driven-canonicalize → " + .[0].url + " (" + .[0].status + ")"' \
            || echo "::warning::could not list the backfill-runner run for backfill-catalog-driven-canonicalize"

  trust-tier-promotion:
    runs-on: ubuntu-latest
    needs: stage1-catalog-driven
    steps:
      - name: Dispatch trust-tier promotion apply
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run backfill-runner.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f script=promote-sold-comps-trust-tier \
            -f apply=true
          # D13: print the run this dispatch produced (newest backfill-runner run).
          sleep 20
          gh run list --repo "$GITHUB_REPOSITORY" --workflow=backfill-runner.yml --limit 1 \
            --json url,displayTitle,status --jq '"dispatched promote-sold-comps-trust-tier → " + .[0].url + " (" + .[0].status + ")"' \
            || echo "::warning::could not list the backfill-runner run for promote-sold-comps-trust-tier"

  baseline-snapshot:
    runs-on: ubuntu-latest
    needs: trust-tier-promotion
    steps:
      - name: Dispatch baseline pool snapshot apply
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run backfill-runner.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f script=baseline-pool-snapshot \
            -f apply=true
          # D13: print the run this dispatch produced (newest backfill-runner run).
          sleep 20
          gh run list --repo "$GITHUB_REPOSITORY" --workflow=backfill-runner.yml --limit 1 \
            --json url,displayTitle,status --jq '"dispatched baseline-pool-snapshot → " + .[0].url + " (" + .[0].status + ")"' \
            || echo "::warning::could not list the backfill-runner run for baseline-pool-snapshot"

  auto-quarantine-pools:
    runs-on: ubuntu-latest
    needs: baseline-snapshot
    steps:
      - name: Dispatch auto-quarantine of contaminated pools apply
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run backfill-runner.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f script=auto-quarantine-contaminated-pools \
            -f apply=true
          # D13: print the run this dispatch produced (newest backfill-runner run).
          sleep 20
          gh run list --repo "$GITHUB_REPOSITORY" --workflow=backfill-runner.yml --limit 1 \
            --json url,displayTitle,status --jq '"dispatched auto-quarantine-contaminated-pools → " + .[0].url + " (" + .[0].status + ")"' \
            || echo "::warning::could not list the backfill-runner run for auto-quarantine-contaminated-pools"

  train-confidence-weights:
    runs-on: ubuntu-latest
    needs: auto-quarantine-pools
    # CF-CLEANLINESS-SETTLE-ON-REPORT-DOC (2026-09-27, review). The doc-poll
    # wait below is bounded to 4h (WAIT_FOR_DOC_MAX_MS) on its own clock, but
    # that bound only has teeth if the JOB can't be killed by GitHub's
    # unconfigured default (360 minutes) with no margin for the steps around
    # it. 330 gives the 4h wait a designed ceiling with margin either side,
    # rather than relying on the platform default.
    timeout-minutes: 330
    steps:
      # The anomaly steps below run backend/scripts/check-anomaly-scan-report
      # .cjs from the checkout. First step so it cannot clobber anything a
      # later step has put in the workspace.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_1259D9D213E34AE29B2DD54B3E755C4D }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_5AB8B3DC612348FD9D37DBE28FF40802 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_A45CF8552AE94AF68A046FB846E21206 }}

      - name: Fetch ADMIN_API_TOKEN from HobbyIQ3 App Service
        shell: bash
        run: |
          TOK=$(az webapp config appsettings list \
            --name HobbyIQ3 \
            --resource-group rg-hobbyiq-dev \
            --query "[?name=='ADMIN_API_TOKEN'].value | [0]" \
            -o tsv)
          if [ -z "$TOK" ]; then
            # D13: a missing token used to warn and exit 0 — green with nothing trained.
            echo "::error::ADMIN_API_TOKEN not found in HobbyIQ3 App Service settings — train-weights and anomaly detection cannot run"
            exit 1
          fi
          echo "::add-mask::$TOK"
          echo "ADMIN_API_TOKEN=$TOK" >> "$GITHUB_ENV"

      - name: Trigger confidence weight training (last 30 days)
        if: env.ADMIN_API_TOKEN != ''
        shell: bash
        run: |
          curl -sX POST \
            -H "Authorization: Bearer $ADMIN_API_TOKEN" \
            "https://hobbyiq3-e5a4dgfsdnb5fbha.centralus-01.azurewebsites.net/api/cleanliness/train-weights?days=30" \
            | head -c 500
          echo ""

      # CF-LONG-CRONS-DIE-AT-THE-IDLE-CUT (2026-09-09) + CF-CLEANLINESS-
      # ANOMALY-BUDGET (2026-09-11). This step never once received a drift
      # comparison: App Insights, 14 days, 11 requests to
      # /cleanliness/anomalies, ALL ResultCode 0, every one cut at 89.9s.
      # #1985 read that as an impatient client and raised the curl ceiling
      # from 90s to 900s; the App Service front end cuts an IDLE connection
      # at 240s regardless of what the client is willing to wait, so the
      # lane would have gone on dying, just later. Moving to a dispatch +
      # poll-admin-job.cjs poller (202 + jobId) fixed the IDLE cut but not
      # the underlying job: detectAnomalies({force:true}) is an UNBUDGETED
      # full sold_comps walk, and the poller's own 1,501s ceiling was hit two
      # nights straight (09-10, 09-11) with no terminal answer either way.
      #
      # The scan is now the "anomaly-force-scan" backfill-runner lane (its
      # script lives in backend scripts/, dispatched below -- not run
      # directly by this workflow, so it builds its own dist/ the same way
      # every other backfill-runner lane does) on the SAME runner_minutes/
      # reserve/verify clock as baseline-pool-snapshot.cjs: it scans
      # sold_comps by (cardYear, sportClass) unit, persists a crawl_state
      # cursor so a budget stop resumes the next dispatch rather than
      # restarting, and writes its finished report to the
      # `anomaly_scan_reports` container -- see that lane's own header for
      # the full contract, including why a scan-phase stop refuses to
      # publish a partial report.
      - name: Dispatch anomaly-force-scan (drift vs baseline)
        if: env.ADMIN_API_TOKEN != ''
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # CF-CLEANLINESS-SETTLE-ON-REPORT-DOC (2026-09-27, review): stamped
          # BEFORE the dispatch so the wait/read steps below can reject a
          # report doc older than this run's own dispatch -- the report id
          # is date-only, so a same-day workflow_dispatch re-run could
          # otherwise find an EARLIER run's doc under the same id and read
          # its stale numbers as fresh.
          DISPATCHED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "DISPATCHED_AT=$DISPATCHED_AT" >> "$GITHUB_ENV"
          gh workflow run backfill-runner.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f script=anomaly-force-scan \
            -f apply=true
          sleep 20
          RUN_ID=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow=backfill-runner.yml --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ -z "$RUN_ID" ]; then
            echo "::error::could not find the backfill-runner run dispatched for anomaly-force-scan"
            exit 1
          fi
          echo "anomaly-force-scan dispatched → run $RUN_ID"
          echo "ANOMALY_SCAN_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"

      # CF-CLEANLINESS-SETTLE-ON-REPORT-DOC (2026-09-27). This step used to
      # poll `gh run list --workflow=backfill-runner.yml --limit 1` for 30
      # cycles, on the theory that a run id STABLE across one 60s window
      # meant the chain (including any budget-stop relaunches) had settled.
      # That reasoning had a hole: backfill-runner.yml is a SHARED dispatcher
      # with one static workflow name used by every lane -- catalog-driven
      # canonicalization, trust-tier promotion, baseline-pool-snapshot,
      # auto-quarantine, anomaly-force-scan, and unrelated hourly lanes like
      # run-ebay-order-poll all show up as "the backfill-runner run". "The
      # newest one" is whichever lane fired most recently, not necessarily
      # this dispatch's own chain.
      #
      # On 2026-09-26 the loop sampled run-ebay-order-poll (run 36215231471,
      # @ 03:36Z) — already completed, so it read as "settled" on the very
      # first cycle — while the actual anomaly-force-scan chain (805 units,
      # 110-minute budget, relaunched by relaunch-on-marker at 03:51Z) was
      # still mid-sweep. The next step then read a report doc that could not
      # exist yet: "no anomaly scan report for 2026-09-26
      # (id=2026-09-26::anomaly-scan-report) -- the sweep did not finish
      # tonight." Runs 36213879571 / 36089169537 / 35950221396 show the same
      # shape; last green was 35682083053 on 09-22, before this race started
      # firing on a night where an hourly lane's timing happened to overlap.
      #
      # FIX: stop sampling gh run list for ANY lane's identity and wait for
      # the OUTCOME instead. anomaly-force-scan.cjs writes its report doc
      # (`<scanDate>::anomaly-scan-report`, container anomaly_scan_reports,
      # pk /id -- see check-anomaly-scan-report.cjs below, which reads the
      # same id) ONLY once the full sweep completes: a scan-phase budget stop
      # persists a crawl_state cursor and deliberately writes NO report (a
      # partial report would compare a different, smaller pool against the
      # baseline and report drift that never happened -- see that lane's own
      # header). So the doc's existence is race-free by construction: there
      # is no shared-dispatcher identity to disambiguate, because nothing but
      # the finished chain ever writes this id. This is exactly the settle
      # signal wanted, and it is the same doc the next step already reads.
      #
      # backend/scripts/wait-for-doc.cjs polls that doc with a plain point
      # read every 5 minutes for up to 4 hours (bounded, never unbounded —
      # CF-A-KILLED-JOB-CANNOT-REPORT-PROGRESS) and exits 2 naming the
      # missing doc on timeout. No gh calls at all in this step now, so the
      # ">= 15s between gh calls" concern doesn't apply here.
      #
      # STALE-DOC HAZARD (review, 2026-09-27): the doc id is date-only, and
      # this workflow keeps workflow_dispatch, so a same-day re-run could
      # find an EARLIER run's doc under the same id before THIS chain ever
      # writes its own. WAIT_FOR_DOC_NOT_BEFORE (stamped as DISPATCHED_AT in
      # the dispatch step above, before that step ever calls `gh workflow
      # run`) rejects a doc whose own `computedAt` predates this dispatch —
      # treated exactly like "not present yet" — and check-anomaly-scan-
      # report.cjs below gets the same bound via ANOMALY_NOT_BEFORE so the
      # same hazard can't slip through if this step's guard is ever bypassed
      # (e.g. a manual re-run of just the read step).
      - name: Install backend deps (wait-for-doc.cjs + check-anomaly-scan-report.cjs need @azure/cosmos)
        if: env.ADMIN_API_TOKEN != ''
        working-directory: backend
        run: npm ci --omit=dev

      - name: Wait for anomaly-force-scan (and any budget-stop relaunches) to settle
        if: env.ADMIN_API_TOKEN != '' && env.ANOMALY_SCAN_RUN_ID != ''
        shell: bash
        run: |
          COSMOS_CONNECTION_STRING=$(az webapp config appsettings list \
            --name HobbyIQ3 --resource-group rg-hobbyiq-dev \
            --query "[?name=='COSMOS_CONNECTION_STRING'].value" -o tsv | tr -d '\r\n')
          if [ -z "$COSMOS_CONNECTION_STRING" ]; then
            echo "::error::COSMOS_CONNECTION_STRING empty from App Service"
            exit 1
          fi
          SCAN_DATE=$(date -u +%Y-%m-%d)
          COSMOS_CONNECTION_STRING="$COSMOS_CONNECTION_STRING" \
          COSMOS_DATABASE=hobbyiq \
          WAIT_FOR_DOC_ID="${SCAN_DATE}::anomaly-scan-report" \
          WAIT_FOR_DOC_NOT_BEFORE="$DISPATCHED_AT" \
          WAIT_FOR_DOC_MAX_MS=14400000 \
          WAIT_FOR_DOC_POLL_MS=300000 \
          node backend/scripts/wait-for-doc.cjs

      - name: Read anomaly scan report
        if: env.ADMIN_API_TOKEN != ''
        shell: bash
        run: |
          COSMOS_CONNECTION_STRING=$(az webapp config appsettings list \
            --name HobbyIQ3 --resource-group rg-hobbyiq-dev \
            --query "[?name=='COSMOS_CONNECTION_STRING'].value" -o tsv | tr -d '\r\n')
          if [ -z "$COSMOS_CONNECTION_STRING" ]; then
            echo "::error::COSMOS_CONNECTION_STRING empty from App Service"
            exit 1
          fi
          COSMOS_CONNECTION_STRING="$COSMOS_CONNECTION_STRING" \
          COSMOS_DATABASE=hobbyiq \
          ANOMALY_NOT_BEFORE="$DISPATCHED_AT" \
          node backend/scripts/check-anomaly-scan-report.cjs
