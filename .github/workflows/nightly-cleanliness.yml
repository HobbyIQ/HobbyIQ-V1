name: Nightly Cleanliness Maintenance

# CF-NIGHTLY-CLEANLINESS-CRON (Drew, 2026-08-01). Runs every night at
# 3:00 UTC (10 PM Central prev day). Autonomously maintains data
# cleanliness by re-running the incremental backfills that benefit
# from newly-arrived data + newly-labeled catalog entries:
#
#   1. Catalog-driven Stage 1 re-run (picks up newly-covered
#      cardNumber+year keys added by the catalog expansion loop).
#      Idempotent — marker field prevents re-touching already-fixed rows.
#   2. Trust-tier promotion (mature rows without flags → verifyStatus=confirmed).
#   3. Baseline pool snapshot (freezes today's state — enables next-day drift comparison).
#   4. Train confidence weights (reads last 30d of learning_events,
#      adjusts scorer weights based on human decisions).
#
# Manual trigger via workflow_dispatch also supported for one-off runs.
#
# D13 (2026-08-29) — alert gates prove delivery. This workflow was
# structurally incapable of going red: a missing ADMIN_API_TOKEN and an
# empty anomalies response both warned and exited 0. Both are exit 1
# now. The four dispatches stay; each prints the backfill-runner run URL
# it produced so a green here can be traced to the run that did the work.

on:
  schedule:
    - cron: "0 3 * * *"   # 03:00 UTC daily
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  actions: write

jobs:
  stage1-catalog-driven:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Stage 1 (catalog-driven canonicalization) apply
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run backfill-runner.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f script=backfill-catalog-driven-canonicalize \
            -f apply=true
          # D13: print the run this dispatch produced (newest backfill-runner run).
          sleep 20
          gh run list --repo "$GITHUB_REPOSITORY" --workflow=backfill-runner.yml --limit 1 \
            --json url,displayTitle,status --jq '"dispatched backfill-catalog-driven-canonicalize → " + .[0].url + " (" + .[0].status + ")"' \
            || echo "::warning::could not list the backfill-runner run for backfill-catalog-driven-canonicalize"

  trust-tier-promotion:
    runs-on: ubuntu-latest
    needs: stage1-catalog-driven
    steps:
      - name: Dispatch trust-tier promotion apply
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run backfill-runner.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f script=promote-sold-comps-trust-tier \
            -f apply=true
          # D13: print the run this dispatch produced (newest backfill-runner run).
          sleep 20
          gh run list --repo "$GITHUB_REPOSITORY" --workflow=backfill-runner.yml --limit 1 \
            --json url,displayTitle,status --jq '"dispatched promote-sold-comps-trust-tier → " + .[0].url + " (" + .[0].status + ")"' \
            || echo "::warning::could not list the backfill-runner run for promote-sold-comps-trust-tier"

  baseline-snapshot:
    runs-on: ubuntu-latest
    needs: trust-tier-promotion
    steps:
      - name: Dispatch baseline pool snapshot apply
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run backfill-runner.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f script=baseline-pool-snapshot \
            -f apply=true
          # D13: print the run this dispatch produced (newest backfill-runner run).
          sleep 20
          gh run list --repo "$GITHUB_REPOSITORY" --workflow=backfill-runner.yml --limit 1 \
            --json url,displayTitle,status --jq '"dispatched baseline-pool-snapshot → " + .[0].url + " (" + .[0].status + ")"' \
            || echo "::warning::could not list the backfill-runner run for baseline-pool-snapshot"

  auto-quarantine-pools:
    runs-on: ubuntu-latest
    needs: baseline-snapshot
    steps:
      - name: Dispatch auto-quarantine of contaminated pools apply
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run backfill-runner.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f script=auto-quarantine-contaminated-pools \
            -f apply=true
          # D13: print the run this dispatch produced (newest backfill-runner run).
          sleep 20
          gh run list --repo "$GITHUB_REPOSITORY" --workflow=backfill-runner.yml --limit 1 \
            --json url,displayTitle,status --jq '"dispatched auto-quarantine-contaminated-pools → " + .[0].url + " (" + .[0].status + ")"' \
            || echo "::warning::could not list the backfill-runner run for auto-quarantine-contaminated-pools"

  train-confidence-weights:
    runs-on: ubuntu-latest
    needs: auto-quarantine-pools
    steps:
      # The anomaly step below runs backend/scripts/poll-admin-job.cjs from
      # the checkout. First step so it cannot clobber anything a later step
      # has put in the workspace.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_1259D9D213E34AE29B2DD54B3E755C4D }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_5AB8B3DC612348FD9D37DBE28FF40802 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_A45CF8552AE94AF68A046FB846E21206 }}

      - name: Fetch ADMIN_API_TOKEN from HobbyIQ3 App Service
        shell: bash
        run: |
          TOK=$(az webapp config appsettings list \
            --name HobbyIQ3 \
            --resource-group rg-hobbyiq-dev \
            --query "[?name=='ADMIN_API_TOKEN'].value | [0]" \
            -o tsv)
          if [ -z "$TOK" ]; then
            # D13: a missing token used to warn and exit 0 — green with nothing trained.
            echo "::error::ADMIN_API_TOKEN not found in HobbyIQ3 App Service settings — train-weights and anomaly detection cannot run"
            exit 1
          fi
          echo "::add-mask::$TOK"
          echo "ADMIN_API_TOKEN=$TOK" >> "$GITHUB_ENV"

      - name: Trigger confidence weight training (last 30 days)
        if: env.ADMIN_API_TOKEN != ''
        shell: bash
        run: |
          curl -sX POST \
            -H "Authorization: Bearer $ADMIN_API_TOKEN" \
            "https://hobbyiq3-e5a4dgfsdnb5fbha.centralus-01.azurewebsites.net/api/cleanliness/train-weights?days=30" \
            | head -c 500
          echo ""

      # CF-LONG-CRONS-DIE-AT-THE-IDLE-CUT (2026-09-09). This step has never
      # once received a drift comparison. App Insights, 14 days: 11 requests
      # to /cleanliness/anomalies, ALL ResultCode 0, every one cut at 89.9s.
      # CF-CLEANLINESS-ANOMALY-BUDGET read that as an impatient client and
      # raised the curl ceiling from 90s to 900s — but the App Service front
      # end cuts an IDLE connection at 240s regardless of what the client is
      # willing to wait, so the lane would have gone on dying, just later.
      # The scan completes server-side every night; nobody was holding the
      # socket to receive it.
      #
      # ?force=true is now a dispatch (202 + jobId) and this step polls the
      # status route to completion. Each poll is a short request, so nothing
      # is ever idle and the platform cut cannot apply. No timeout anywhere
      # was widened to fix this.
      - name: Anomaly detection (drift vs baseline)
        if: env.ADMIN_API_TOKEN != ''
        shell: bash
        run: |
          echo "Running anomaly detection (dispatch + poll)..."
          # CF-THE-LOG-IS-BOTH-STREAMS (#1963/#1975). `2>&1` because the
          # poller writes its refusals — including the UNKNOWN verdict — with
          # console.error, and a stdout-only tee would drop precisely the
          # lines that explain a failure. `pipefail` because a pipeline's
          # status is tee's, always 0, which would report SUCCESS for a lane
          # that never settled.
          set -o pipefail
          set +e
          node backend/scripts/poll-admin-job.cjs \
            --label anomalies \
            --method GET \
            --dispatch-url "https://hobbyiq3-e5a4dgfsdnb5fbha.centralus-01.azurewebsites.net/api/cleanliness/anomalies?force=true" \
            --status-url "https://hobbyiq3-e5a4dgfsdnb5fbha.centralus-01.azurewebsites.net/api/cleanliness/anomalies/status" \
            --auth-header "Authorization: Bearer $ADMIN_API_TOKEN" \
            2>&1 | tee /tmp/anomalies-poll.log
          POLL_RC=$?
          set -e
          if [ "$POLL_RC" -eq 2 ]; then
            echo "::error::anomaly detection never reported settled — UNKNOWN, not a failure; the scan may have finished on the other instance"
            exit 1
          fi
          if [ "$POLL_RC" -ne 0 ]; then
            echo "::error::anomaly detection failed — no drift comparison landed"
            exit 1
          fi
          RESULT=$(sed -n 's/^RESULT_JSON //p' /tmp/anomalies-poll.log | tail -n1)
          if [ -z "$RESULT" ]; then
            # D13: an empty response used to warn and exit 0 — green with no detection.
            echo "::error::anomaly detection settled without a report body — no drift comparison ran"
            exit 1
          fi
          # A settled scan that found NO BASELINE is a different fact from a
          # scan that found no drift, and the parser below cannot tell them
          # apart (both read as zero anomalies). Name it here.
          if echo "$RESULT" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{process.exit(JSON.parse(d).report===null?0:1)}catch{process.exit(1)}})"; then
            echo "::error::anomaly detection settled with report=null — no baseline snapshot exists yet, so no drift comparison was possible (run baseline-pool-snapshot)"
            exit 1
          fi
          HIGH_COUNT=$(echo "$RESULT" | node -e "let d=''; process.stdin.on('data',c=>d+=c); process.stdin.on('end',()=>{ try { const r=JSON.parse(d); const highs=(r.report?.anomalies||[]).filter(a=>a.suspiciousness==='high'); console.log(highs.length); } catch { console.log('0'); } })")
          TOTAL=$(echo "$RESULT" | node -e "let d=''; process.stdin.on('data',c=>d+=c); process.stdin.on('end',()=>{ try { const r=JSON.parse(d); console.log((r.report?.anomalies||[]).length); } catch { console.log('0'); } })")
          echo "Anomalies detected: $TOTAL total, $HIGH_COUNT high-suspiciousness"
          if [ "$HIGH_COUNT" -gt "10" ]; then
            echo "::warning::${HIGH_COUNT} slugs with high-suspiciousness drift — review /app/admin/cleanliness"
          fi
